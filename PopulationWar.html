<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>世界人口カラフルドットマップ - 全世界対応版</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #000b14; }
        .loading { position: fixed; top: 10px; left: 10px; color: white; z-index: 1000; background: rgba(0,0,0,0.85); padding: 8px 15px; border-radius: 4px; font-family: sans-serif; border: 1px solid #444; }
    </style>

    <!-- GoatCounter (file:///環境での警告回避策設定済み) -->
    <script>
        if (location.protocol !== 'file:') {
            var s = document.createElement('script');
            s.async = true;
            s.dataset.goatcounter = "https://senzaiichiguunochance.goatcounter.com/count";
            s.src = "https://gc.zgo.at/count.js";
            document.head.appendChild(s);
        }
    </script>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

<div id="loading" class="loading">全世界の国データ（約180カ国）を読み込み中...</div>
<div id="map"></div>

<script>
let map, dots = [], geoDataStore = [];

function getHighlyDivergentColor(index) {
    const goldenRatioConjugate = 0.618033988749895;
    let h = (index * goldenRatioConjugate) % 1;
    return `hsl(${h * 360}, 85%, 60%)`;
}

function isInside(pt, poly) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        if (((poly[i].lat <= pt.lat && pt.lat < poly[j].lat) || (poly[j].lat <= pt.lat && pt.lat < poly[i].lat)) &&
            (pt.lng < (poly[j].lng - poly[i].lng) * (pt.lat - poly[i].lat) / (poly[j].lat - poly[i].lat) + poly[i].lng)) c = !c;
    }
    return c;
}

function checkLandStrict(lat, lng) {
    const pt = {lat, lng};
    for (let i = 0; i < geoDataStore.length; i++) {
        const c = geoDataStore[i];
        if (lat >= c.b[0] && lat <= c.b[1] && lng >= c.b[2] && lng <= c.b[3]) {
            for (let ring of c.polys) if (isInside(pt, ring)) return true;
        }
    }
    return false;
}

async function init() {
    map = L.map('map', { worldCopyJump: true }).setView([20, 0], 2);

    // ダークテーママップタイル
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16,
        attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    // オンラインから全200カ国相当のGeoJSONを自動ロード
    try {
        const res = await fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json");
        const worldGeo = await res.json();
        processGeoData(worldGeo);
        document.getElementById('loading').style.display = 'none';
        animate();
    } catch (e) {
        document.getElementById('loading').innerText = "データ取得失敗。インターネット接続を確認してください。";
    }
}

function processGeoData(worldGeo) {
    worldGeo.features.forEach((feature, index) => {
        const countryName = feature.properties?.name || feature.id;
        const color = getHighlyDivergentColor(index);

        let polys = [];
        if (feature.geometry.type === "Polygon") polys.push(feature.geometry.coordinates[0].map(c => ({lng: c[0], lat: c[1]})));
        else if (feature.geometry.type === "MultiPolygon") feature.geometry.coordinates.forEach(p => polys.push(p[0].map(c => ({lng: c[0], lat: c[1]}))));

        // 国境界ポリゴンのレイヤー追加
        const layer = L.geoJson(feature, {
            style: {
                fillColor: color,
                fillOpacity: 0.15,
                color: color,
                weight: 1,
                opacity: 0.5
            }
        }).addTo(map);

        const b = layer.getBounds();
        const entry = { name: countryName, polys: polys, b: [b.getSouth(), b.getNorth(), b.getWest(), b.getEast()], center: b.getCenter(), color: color };
        geoDataStore.push(entry);

        // 各国領域内にドットをランダム生成（1国あたり12個）
        const numDots = 12;
        for (let i = 0; i < numDots; i++) {
            let lat = entry.center.lat, lng = entry.center.lng;
            for(let a = 0; a < 20; a++){
                let tlat = entry.b[0] + Math.random() * (entry.b[1] - entry.b[0]);
                let tlng = entry.b[2] + Math.random() * (entry.b[3] - entry.b[2]);
                if(checkLandStrict(tlat, tlng)){ lat = tlat; lng = tlng; break; }
            }

            const latlng = L.latLng(lat, lng);
            const circle = L.circleMarker(latlng, {
                radius: 2.5,
                fillColor: color,
                color: '#fff',
                weight: 0.4,
                fillOpacity: 0.9,
                interactive: true
            }).addTo(map);

            circle.bindPopup(`<b>${countryName}</b>`);

            dots.push({
                el: circle,
                baseLatLng: latlng,
                angle: Math.random() * Math.PI * 2,
                speed: 0.015 + Math.random() * 0.02,
                range: 0.08 + Math.random() * 0.1
            });
        }
    });
}

function animate() {
    dots.forEach(dot => {
        dot.angle += dot.speed;
        dot.el.setLatLng([
            dot.baseLatLng.lat + Math.sin(dot.angle) * dot.range,
            dot.baseLatLng.lng + Math.cos(dot.angle) * dot.range
        ]);
    });
    requestAnimationFrame(animate);
}

window.onload = init;
</script>
</body>
</html>
