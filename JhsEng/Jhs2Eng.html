<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中学2年生　英単語クイズ</title>
    <style>
        :root {
            --primary-color: #00d4ff;
            --secondary-color: #0056b3;
            --bg-color: #0a0e14;
            --bg-gradient: radial-gradient(circle at 50% 50%, #1a2332 0%, #0a0e14 100%);
            --card-bg: #161b22;
            --text-color: #e6edf3;
            --correct-color: #00ff88;
            --wrong-color: #ff4d4d;
            --neon-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            --btn-text: #fff;
        }

        .theme-cute {
            --primary-color: #ff6b8b;
            --secondary-color: #ffafbd;
            --bg-color: #fff0f3;
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffc1cc 100%);
            --card-bg: #ffffff;
            --text-color: #5c4044;
            --correct-color: #ff4757;
            --wrong-color: #ffa502;
            --neon-shadow: 0 0 10px rgba(255, 107, 139, 0.3);
            --btn-text: #fff;
        }

        .theme-beautiful {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --bg-color: #f8f9fa;
            --bg-gradient: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --correct-color: #00b894;
            --wrong-color: #d63031;
            --neon-shadow: 0 0 10px rgba(108, 92, 231, 0.2);
            --btn-text: #fff;
        }

        .theme-stylish {
            --primary-color: #e1b12c;
            --secondary-color: #fbc531;
            --bg-color: #1e272e;
            --bg-gradient: radial-gradient(circle at 50% 50%, #2f3640 0%, #1e272e 100%);
            --card-bg: #2f3542;
            --text-color: #f5f6fa;
            --correct-color: #4cd137;
            --wrong-color: #e84118;
            --neon-shadow: 0 0 10px rgba(225, 177, 44, 0.5);
            --btn-text: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        .back-link {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.9rem;
            color: var(--text-color);
            text-decoration: none;
            background: rgba(128, 128, 128, 0.1);
            border: 1px solid var(--primary-color);
            padding: 6px 12px;
            border-radius: 4px;
            z-index: 1000;
            font-weight: bold;
            transition: background 0.3s;
        }

        .back-link:hover {
            background: rgba(128, 128, 128, 0.2);
        }

        header {
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
            color: var(--btn-text);
            width: 100%;
            padding: 0.8rem 0;
            text-align: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
            border-bottom: 2px solid var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        main {
            width: 98%;
            max-width: 1000px;
            margin: 0.5rem auto;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid var(--primary-color);
            position: relative;
        }

        .menu-screen, .game-screen, .result-screen, .stats-screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .active {
            display: flex;
        }

        h2 {
            color: var(--primary-color);
            text-shadow: 0 0 5px var(--neon-shadow);
            margin-bottom: 0.8rem;
            text-align: center;
            font-size: 1.4rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: var(--btn-text);
            border: 1px solid var(--primary-color);
            padding: 0.8rem 1.2rem;
            margin: 0.3rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--primary-color);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            border-radius: 8px;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4d4d, #c0392b);
            border-color: #ff4d4d;
        }

        #question-text {
            font-size: 2.8rem;
            margin: 0.5rem 0;
            font-weight: 900;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--neon-shadow);
            animation: pulse 2s infinite;
            text-align: center;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .choices-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            margin-top: 0.8rem;
        }

        .feedback {
            margin-top: 1.5rem;
            font-weight: 900;
            font-size: 1.8rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .correct-anim {
            color: var(--correct-color);
            text-shadow: 0 0 15px var(--correct-color);
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .wrong-anim {
            color: var(--wrong-color);
            text-shadow: 0 0 15px var(--wrong-color);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .stat-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid var(--primary-color);
            padding-bottom: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .timer-display {
            font-family: 'Segoe UI', Roboto, sans-serif;
            font-size: 1.5rem;
            padding: 6px 16px;
            border: 3px solid var(--primary-color);
            border-radius: 50px;
            color: #fff;
            background: var(--primary-color);
            font-weight: 900;
            box-shadow: 0 4px 15px var(--neon-shadow);
            min-width: 120px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .timer-warning {
            background: var(--wrong-color) !important;
            border-color: #fff !important;
            box-shadow: 0 0 20px var(--wrong-color) !important;
            animation: timer-pulse 0.5s infinite alternate !important;
        }

        @keyframes timer-pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 100%;
            margin-bottom: 1.5rem;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .setting-label {
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .setting-select {
            width: 100%;
            padding: 0.6rem;
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--primary-color);
            text-align-last: center;
            font-weight: bold;
        }

        .result-table-container {
            width: 100%;
            overflow-x: auto;
            margin: 1.5rem 0;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .result-table th, .result-table td {
            border: 1px solid var(--primary-color);
            padding: 8px 4px;
            text-align: center;
        }

        .result-table th {
            background: rgba(128, 128, 128, 0.1);
            color: var(--primary-color);
        }

        .row-correct { color: var(--correct-color); }
        .row-wrong { color: var(--wrong-color); }

        /* スマートフォン向け調整 */
        @media (max-width: 600px) {
            header h1 { font-size: 1.4rem; }
            main { padding: 1.2rem; margin: 1rem auto; width: 98%; }
            #question-text { font-size: 2.2rem; }
            .choices-container { grid-template-columns: 1fr; gap: 8px; }
            .btn { padding: 0.8rem 1rem; font-size: 1rem; margin: 0.3rem; }
            .stat-bar { font-size: 0.9rem; justify-content: center; }
            .back-link { top: 10px; right: 10px; padding: 4px 8px; font-size: 0.8rem; }
            h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body class="theme-cool">
    <a href="../menu.html" class="back-link">メニューに戻る</a>

<header>
    <h1>中学2年生　英単語クイズ</h1>
</header>

<main>
    <!-- メニュー画面 -->
    <div id="menu-screen" class="menu-screen active">
        <h2>学習設定</h2>
        
        <div class="settings-grid">
            <div class="setting-item">
                <label class="setting-label" for="time-limit-select">制限時間:</label>
                <select id="time-limit-select" class="setting-select" onchange="saveSettings()">
                    <option value="3">3秒</option>
                    <option value="5">5秒</option>
                    <option value="10">10秒</option>
                    <option value="20">20秒</option>
                    <option value="30" selected>30秒</option>
                    <option value="0">無制限</option>
                </select>
            </div>
            <div class="setting-item">
                <label class="setting-label" for="question-count-select">問題数:</label>
                <select id="question-count-select" class="setting-select" onchange="saveSettings()">
                    <!-- 動的に生成 -->
                </select>
            </div>
            <div class="setting-item">
                <label class="setting-label" for="theme-select">カラーテーマ:</label>
                <select id="theme-select" class="setting-select" onchange="applyTheme(); saveSettings();">
                    <option value="cool">クール</option>
                    <option value="cute">かわいい</option>
                    <option value="beautiful">キレイ</option>
                    <option value="stylish">かっこいい</option>
                </select>
            </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; justify-content: center; width: 100%;">
            <button class="btn" onclick="startGame(1)">日本語 → 英語</button>
            <button class="btn" onclick="startGame(2)">英語 → 日本語</button>
        </div>

        <div style="margin-top: 1rem; display: flex; gap: 10px;">
            <button class="btn btn-small" onclick="showStats()">過去の成績を表示</button>
            <button class="btn btn-small btn-danger" onclick="clearStats()">成績クリア</button>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="game-screen">
        <div class="stat-bar">
            <button class="btn btn-small" style="margin: 0;" onclick="showMenu()">中断して戻る</button>
            <div id="progress">問題 1 / 10</div>
            <div id="timer-display" class="timer-display">残り: --</div>
            <div id="score-display">正解: 0</div>
        </div>
        <div id="question-area" style="width: 100%; text-align: center;">
            <div id="question-label" style="color: var(--primary-color); font-weight: bold;"></div>
            <div id="question-text"></div>
        </div>
        <div class="choices-container" id="choices"></div>
        <div id="feedback" class="feedback"></div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="result-screen">
        <h2>結果発表</h2>
        <div id="final-score" style="font-size: 1.5rem; margin: 1rem 0; color: var(--primary-color); font-weight: bold;"></div>
        <div id="result-detail" class="result-table-container"></div>
        <button class="btn" onclick="showMenu()">トップに戻る</button>
    </div>

    <!-- 成績画面 -->
    <div id="stats-screen" class="stats-screen">
        <h2>過去の成績</h2>
        <div id="stats-detail" class="result-table-container"></div>
        <button class="btn" onclick="showMenu()">トップに戻る</button>
    </div>
</main>

<script src="jhs2_words.js"></script>
<script>
    // word_list は jhs2_words.js で定義されている
    // [English, Japanese]

    let currentMode = 0;
    let currentQuestionIndex = 0;
    let score = 0;
    let correctPair = null;
    let isAnswering = false;
    let quizHistory = [];
    let usedIndices = [];
    let questionLimit = 10;
    let timeLimit = 30;
    let timeLeft = 0;
    let timerInterval = null;
    let stats = {};

    // 初期化
    window.onload = () => {
        initQuestionCountSelect();
        loadSettings();
        applyTheme();
        loadStats();
    };

    function initQuestionCountSelect() {
        const select = document.getElementById('question-count-select');
        const max = word_list.length;
        for (let i = 5; i <= max; i += 5) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `${i}問`;
            if (i === 10) opt.selected = true;
            select.appendChild(opt);
        }
        // 445の次が全部(448)
        if (max % 5 !== 0) {
            const opt = document.createElement('option');
            opt.value = max;
            opt.innerText = "全部";
            select.appendChild(opt);
        } else {
            // ちょうど5の倍数の場合、最後の選択肢を「全部」に書き換え
            select.lastChild.innerText = "全部";
        }
    }

    // 設定読み込み
    function loadSettings() {
        const savedTime = localStorage.getItem('jhs2-eng-time-limit');
        if (savedTime) document.getElementById('time-limit-select').value = savedTime;
        
        const savedCount = localStorage.getItem('jhs2-eng-question-count');
        if (savedCount && document.querySelector(`#question-count-select option[value="${savedCount}"]`)) {
            document.getElementById('question-count-select').value = savedCount;
        }
        
        const savedTheme = localStorage.getItem('jhs2-eng-theme');
        if (savedTheme) document.getElementById('theme-select').value = savedTheme;
    }

    // 設定保存
    function saveSettings() {
        localStorage.setItem('jhs2-eng-time-limit', document.getElementById('time-limit-select').value);
        localStorage.setItem('jhs2-eng-question-count', document.getElementById('question-count-select').value);
        localStorage.setItem('jhs2-eng-theme', document.getElementById('theme-select').value);
    }

    // テーマ適用
    function applyTheme() {
        const theme = document.getElementById('theme-select').value;
        document.body.className = `theme-${theme}`;
    }

    // 成績読み込み
    function loadStats() {
        const savedStats = localStorage.getItem('jhs2-eng-stats');
        stats = savedStats ? JSON.parse(savedStats) : {};
    }

    // 成績保存
    function saveStats() {
        localStorage.setItem('jhs2-eng-stats', JSON.stringify(stats));
    }

    // 成績クリア
    function clearStats() {
        if (confirm("全ての学習成績をクリアしますか？")) {
            stats = {};
            saveStats();
            alert("成績をクリアしました。");
        }
    }

    // メニュー表示
    function showMenu() {
        stopTimer();
        document.getElementById('menu-screen').classList.add('active');
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('stats-screen').classList.remove('active');
    }

    // ゲーム開始
    function startGame(mode) {
        currentMode = mode;
        currentQuestionIndex = 0;
        score = 0;
        quizHistory = [];
        usedIndices = [];
        
        timeLimit = parseInt(document.getElementById('time-limit-select').value);
        questionLimit = parseInt(document.getElementById('question-count-select').value);
        
        if (questionLimit > word_list.length) questionLimit = word_list.length;

        saveSettings();

        document.getElementById('menu-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        nextQuestion();
    }

    // 次の問題へ
    function nextQuestion() {
        stopTimer();
        if (currentQuestionIndex >= questionLimit) {
            showResult();
            return;
        }

        isAnswering = true;
        document.getElementById('feedback').innerText = "";
        document.getElementById('feedback').className = "feedback";
        document.getElementById('progress').innerText = `問題 ${currentQuestionIndex + 1} / ${questionLimit}`;
        document.getElementById('score-display').innerText = `正解: ${score}`;

        // 未使用の単語を選択
        let availableIndices = [];
        for (let i = 0; i < word_list.length; i++) {
            if (!usedIndices.includes(i)) availableIndices.push(i);
        }
        
        if (availableIndices.length === 0) {
            usedIndices = [];
            for (let i = 0; i < word_list.length; i++) availableIndices.push(i);
        }
        
        const targetIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
        correctPair = word_list[targetIndex];
        usedIndices.push(targetIndex);
        
        // 選択肢の生成
        let choices = [correctPair];
        while (choices.length < 4) {
            let rand = word_list[Math.floor(Math.random() * word_list.length)];
            if (!choices.includes(rand)) choices.push(rand);
        }
        choices.sort(() => Math.random() - 0.5);

        // UI更新
        const qText = document.getElementById('question-text');
        const qLabel = document.getElementById('question-label');
        const choicesContainer = document.getElementById('choices');

        choicesContainer.innerHTML = "";

        if (currentMode === 1) { // 日本語 -> 英語
            qLabel.innerText = "この意味の英単語は？";
            qText.innerText = correctPair[1];
            choices.forEach(pair => createChoiceButton(pair[0], pair === correctPair));
        } else if (currentMode === 2) { // 英語 -> 日本語
            qLabel.innerText = "この単語の意味は？";
            qText.innerText = correctPair[0];
            choices.forEach(pair => createChoiceButton(pair[1], pair === correctPair));
        }

        if (timeLimit > 0) {
            startTimer();
        } else {
            document.getElementById('timer-display').innerText = "残り: 無制限";
        }
    }

    // タイマー開始
    function startTimer() {
        timeLeft = timeLimit;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                stopTimer();
                handleAnswer(false, null, "時間切れ");
            }
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
    }

    function updateTimerDisplay() {
        const timerDisplay = document.getElementById('timer-display');
        timerDisplay.innerText = `残り: ${timeLeft}秒`;
        
        if (timeLeft <= 5) {
            timerDisplay.classList.add('timer-warning');
        } else {
            timerDisplay.classList.remove('timer-warning');
        }
    }

    // 選択肢ボタン作成
    function createChoiceButton(text, isCorrect) {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = text;
        btn.onclick = () => handleAnswer(isCorrect, btn, text);
        document.getElementById('choices').appendChild(btn);
    }

    // 回答処理
    function handleAnswer(isCorrect, btn, userText) {
        if (!isAnswering) return;
        isAnswering = false;
        stopTimer();

        const feedback = document.getElementById('feedback');
        const correctAnswerText = currentMode === 1 ? correctPair[0] : correctPair[1];
        
        quizHistory.push({
            question: currentMode === 1 ? correctPair[1] : correctPair[0],
            answer: userText,
            correct: correctAnswerText,
            isCorrect: isCorrect
        });

        // 成績更新
        updateStats(correctPair[0], isCorrect);

        if (isCorrect) {
            score++;
            feedback.innerText = "正解！";
            feedback.className = "feedback correct-anim";
            if (btn) btn.style.boxShadow = "0 0 20px var(--correct-color)";
        } else {
            feedback.innerText = userText === "時間切れ" ? "時間切れ！" : `不正解... 正解は「${correctAnswerText}」`;
            feedback.className = "feedback wrong-anim";
            if (btn) btn.style.boxShadow = "0 0 20px var(--wrong-color)";
        }

        setTimeout(() => {
            currentQuestionIndex++;
            nextQuestion();
        }, 1800);
    }

    // 成績更新
    function updateStats(word, isCorrect) {
        if (!stats[currentMode]) stats[currentMode] = {};
        if (!stats[currentMode][word]) stats[currentMode][word] = { correct: 0, wrong: 0 };
        
        if (isCorrect) stats[currentMode][word].correct++;
        else stats[currentMode][word].wrong++;
        
        saveStats();
    }

    // 結果表示
    function showResult() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('final-score').innerText = `正解数: ${score} / ${questionLimit}`;

        const detailArea = document.getElementById('result-detail');
        detailArea.innerHTML = "";

        let tableHtml = `<table class="result-table">
            <thead>
                <tr>
                    <th>問題</th>
                    <th>回答</th>
                    <th>正解</th>
                    <th>判定</th>
                </tr>
            </thead>
            <tbody>`;
        
        quizHistory.forEach(item => {
            tableHtml += `
                <tr class="${item.isCorrect ? 'row-correct' : 'row-wrong'}">
                    <td>${item.question}</td>
                    <td>${item.answer}</td>
                    <td>${item.correct}</td>
                    <td>${item.isCorrect ? '〇' : '×'}</td>
                </tr>`;
        });
        tableHtml += `</tbody></table>`;
        detailArea.innerHTML = tableHtml;
    }

    // 成績表示
    function showStats() {
        document.getElementById('menu-screen').classList.remove('active');
        document.getElementById('stats-screen').classList.add('active');
        
        const detailArea = document.getElementById('stats-detail');
        detailArea.innerHTML = "";

        const modeNames = {
            1: "日本語 → 英語",
            2: "英語 → 日本語"
        };

        let hasAnyData = false;
        let finalHtml = "";

        [1, 2].forEach(modeId => {
            const modeStats = stats[modeId];
            if (!modeStats) return;

            let flatStats = [];
            for (let word in modeStats) {
                const pair = word_list.find(p => p[0] === word);
                if (!pair) continue;
                const s = modeStats[word];
                const total = s.correct + s.wrong;
                const errorRate = total > 0 ? (s.wrong / total) : 0;
                flatStats.push({
                    word: pair[0],
                    meaning: pair[1],
                    correct: s.correct,
                    wrong: s.wrong,
                    total: total,
                    errorRate: errorRate
                });
            }

            if (flatStats.length === 0) return;
            hasAnyData = true;

            // ソート: 誤り率 降順 -> 単語 昇順
            flatStats.sort((a, b) => {
                if (b.errorRate !== a.errorRate) return b.errorRate - a.errorRate;
                return a.word.localeCompare(b.word);
            });

            finalHtml += `<h3 style="color: var(--primary-color); margin-top: 1.5rem; border-left: 4px solid var(--primary-color); padding-left: 10px; width: 100%; text-align: left;">${modeNames[modeId]}</h3>`;
            finalHtml += `<table class="result-table">
                <thead>
                    <tr>
                        <th style="width: 40%;">単語</th>
                        <th>正解</th>
                        <th>誤り</th>
                        <th>率</th>
                    </tr>
                </thead>
                <tbody>`;
            
            flatStats.forEach(item => {
                const accuracy = item.total > 0 ? Math.round((item.correct / item.total) * 100) : 0;
                finalHtml += `
                    <tr>
                        <td style="text-align:left; padding-left: 8px;">${item.word}<br><small>${item.meaning}</small></td>
                        <td>${item.correct}</td>
                        <td>${item.wrong}</td>
                        <td>${accuracy}%</td>
                    </tr>`;
            });
            finalHtml += `</tbody></table>`;
        });

        if (!hasAnyData) {
            detailArea.innerHTML = "<p style='text-align:center;'>データがありません。問題を解くとここに表示されます。</p>";
        } else {
            detailArea.innerHTML = finalHtml;
        }
    }
</script>

</html>
