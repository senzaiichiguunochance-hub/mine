<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>キャラクタ・グリッド - 設定保存版</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #e5e7eb; touch-action: none; 
            -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
        }
        canvas { display: block; }
        #ui-container {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85); padding: 10px 20px; border-radius: 30px;
            font-family: sans-serif; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px); z-index: 100; display: flex; align-items: center; gap: 10px;
        }
        #ui-container label { font-size: 14px; color: #ff77bb; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .instruction {
            position: absolute; bottom: 10px; width: 100%; text-align: center;
            font-family: sans-serif; color: #ff77bb; font-weight: bold; pointer-events: none; opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <input type="checkbox" id="sync-actions">
        <label for="sync-actions">アクションを全員統一する</label>
    </div>
    <div class="instruction">キャラをクリック！</div>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 設定保存・読み込み処理 ---
        const syncCheckbox = document.getElementById('sync-actions');
        
        // 保存された設定を読み込む
        const savedSyncSetting = localStorage.getItem('syncActionsEnabled');
        if (savedSyncSetting !== null) {
            syncCheckbox.checked = (savedSyncSetting === 'true');
        }

        // 変更時に保存する
        syncCheckbox.addEventListener('change', () => {
            localStorage.setItem('syncActionsEnabled', syncCheckbox.checked);
        });

        // --- 定数・変数 ---
        const ROWS = 4;
        const COLS = 3;
        const DEFAULT_SCALE = 0.75;
        const ALL_ACTIONS = [
            'ninjutsu','afterimageDash','jump','frontFlip','backFlip','spin','bye','bow','angry','shy','dance','sleepy',
            'kiss','heart','pose','wink','fanservice','noNo','sad','surprise','superShy','proud',
            'hide','stomp','squat','tilt','superSpin','giant','ghost','rainbow','vibrate','backStep'
        ];

        let unifiedActionQueue = [];
        let ghosts = [];
        let lastMouseMoveTime = Date.now();

        // --- Three.js 基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe5e7eb);
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 15);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 10, 7.5); 
        light.castShadow = true;
        scene.add(light, new THREE.AmbientLight(0xffffff, 0.6));

        // --- キャラクタークラス ---
        class Chara {
            constructor(x, y, color) {
                this.initialPos = new THREE.Vector3(x, y, 0);
                this.root = new THREE.Group();
                this.root.position.copy(this.initialPos);
                this.root.scale.set(DEFAULT_SCALE, DEFAULT_SCALE, DEFAULT_SCALE);
                
                this.actionPivot = new THREE.Group(); this.root.add(this.actionPivot);
                this.animGroup = new THREE.Group(); this.actionPivot.add(this.animGroup);
                
                this.activeAction = null;
                this.actionTime = 0;
                this.mainColorHex = color;
                this.personalQueue = [];
                this.initModel();
                scene.add(this.root);
            }

            initModel() {
                this.mMain = new THREE.MeshStandardMaterial({ color: this.mainColorHex });
                const mWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
                const mLimb = new THREE.MeshStandardMaterial({ color: 0xf3f4f6 });
                const mPink = new THREE.MeshStandardMaterial({ color: 0xff77bb });
                const mEye = new THREE.MeshBasicMaterial({ color: 0x222222 });
                const setup = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };

                this.head = new THREE.Group(); this.animGroup.add(this.head);
                const hood = setup(new THREE.Mesh(new THREE.SphereGeometry(1, 24, 24), this.mMain));
                hood.scale.set(1.5, 1.3, 1.1); this.head.add(hood);
                const face = setup(new THREE.Mesh(new THREE.SphereGeometry(0.8, 24, 24), mWhite));
                face.scale.set(1.4, 1.1, 0.65); face.position.set(0, -0.1, 0.6); this.head.add(face);
                
                this.skull = setup(new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), mPink));
                this.skull.scale.set(1, 0.8, 0.2); this.skull.position.set(0, 0.65, 1.0); this.head.add(this.skull);

                const makeEar = (x, rz) => {
                    const g = new THREE.Group();
                    const e = setup(new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), this.mMain));
                    e.scale.set(0.5, 1.1, 0.3); e.position.y = 0.4;
                    g.add(e); g.position.set(x, 0.65, 0); g.rotation.z = rz; return g;
                };
                this.head.add(makeEar(-0.85, 0.55), makeEar(0.85, -0.55));

                const makeEye = (x) => {
                    const e = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), mEye);
                    e.scale.set(0.7, 1.3, 0.1); e.position.set(x, -0.05, 1.12); return e;
                };
                this.head.add(makeEye(-0.5), makeEye(0.5));
                this.nose = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), mPink);
                this.nose.position.set(0, -0.32, 1.18); this.head.add(this.nose);

                this.body = new THREE.Group(); this.body.position.y = -1.2; this.animGroup.add(this.body);
                this.torso = setup(new THREE.Mesh(new THREE.SphereGeometry(0.8, 24, 24), mWhite));
                this.torso.scale.set(1, 1.2, 0.8); this.body.add(this.torso);
                this.armL = setup(new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), mLimb)); this.armL.position.set(-0.8, 0, 0.2);
                this.armR = setup(new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), mLimb)); this.armR.position.set(0.8, 0, 0.2);
                this.legL = setup(new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), mLimb)); this.legL.position.set(-0.35, -0.85, 0.1);
                this.legR = setup(new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), mLimb)); this.legR.position.set(0.35, -0.85, 0.1);
                this.body.add(this.armL, this.armR, this.legL, this.legR);
            }

            trigger(actionName) {
                if (this.activeAction) return;
                this.activeAction = actionName;
                this.actionTime = 0;
            }

            update(time, targetPos) {
                if (Date.now() - lastMouseMoveTime > 3000) {
                    this.root.rotation.y += (0 - this.root.rotation.y) * 0.05;
                } else {
                    this.root.lookAt(targetPos.x, targetPos.y, targetPos.z + 10);
                }

                if (!this.activeAction) {
                    const walkSpeed = time * 0.8;
                    this.animGroup.position.y = Math.abs(Math.sin(walkSpeed)) * 0.2;
                    this.legL.position.z = 0.1 + Math.sin(walkSpeed) * 0.3;
                    this.legR.position.z = 0.1 - Math.sin(walkSpeed) * 0.3;
                }

                if (this.activeAction) {
                    this.actionTime += 0.05;
                    const p = this.actionTime;
                    switch(this.activeAction) {
                        case 'ninjutsu': 
                            if(Math.floor(p*10)%3===0) this.createGhost(0.1);
                            this.actionPivot.position.y = Math.abs(Math.sin(p*5))*0.5;
                            break;
                        case 'afterimageDash':
                            this.root.position.x = this.initialPos.x + Math.sin(p*2)*2;
                            if(Math.floor(p*20)%2===0) this.createGhost(0.05);
                            break;
                        case 'jump': this.actionPivot.position.y = Math.sin(p)*4; break;
                        case 'frontFlip': this.actionPivot.position.y = Math.sin(p)*4; this.actionPivot.rotation.x = -p*2; break;
                        case 'backFlip': this.actionPivot.position.y = Math.sin(p)*4; this.actionPivot.rotation.x = p*2; break;
                        case 'spin': this.actionPivot.position.y = Math.sin(p)*1.5; this.actionPivot.rotation.y = p*6; break;
                        case 'bye': this.armR.position.y = 0.5; this.armR.rotation.z = Math.sin(p*10)*0.5; break;
                        case 'bow': this.animGroup.rotation.x = Math.sin(p)*0.8; break;
                        case 'angry': this.animGroup.position.x = Math.sin(p*20)*0.1; this.armL.position.y = this.armR.position.y = Math.sin(p*15)*0.3; break;
                        case 'shy': this.animGroup.rotation.z = Math.sin(p*4)*0.2; this.legL.rotation.z = 0.3; this.legR.rotation.z = -0.3; break;
                        case 'dance': this.root.position.x = this.initialPos.x + Math.sin(p*4)*0.5; this.animGroup.position.y = Math.abs(Math.sin(p*4))*0.8; break;
                        case 'sleepy': this.head.rotation.x = Math.max(0, Math.sin(p*2)*0.6); break;
                        case 'kiss': this.armR.position.set(0, 0.2, 0.8); this.armR.rotation.x = Math.sin(p*5); break;
                        case 'heart': this.armL.position.set(-0.3, 0.2, 0.8); this.armR.position.set(0.3, 0.2, 0.8); this.skull.scale.set(1.5,1.5,1); break;
                        case 'pose': this.head.rotation.z = Math.sin(p*4)*0.4; this.armL.position.y = 0.5; break;
                        case 'wink': this.head.rotation.z = 0.3; this.skull.scale.y = Math.abs(Math.sin(p*5))*0.4; break;
                        case 'fanservice': this.armL.position.y = this.armR.position.y = 0.6; this.armL.rotation.z = Math.sin(p*10); this.armR.rotation.z = -Math.sin(p*10); break;
                        case 'noNo': this.head.rotation.y = Math.sin(p*15)*0.5; this.armL.position.x = -1.2; this.armR.position.x = 1.2; break;
                        case 'sad': this.animGroup.position.y = -0.5; this.head.rotation.x = 0.5; break;
                        case 'surprise': this.actionPivot.position.y = Math.abs(Math.sin(p*10))*2; this.head.scale.set(1.2,1.2,1.2); break;
                        case 'superShy': this.animGroup.rotation.z = Math.sin(p*10)*0.1; this.armL.position.x = -0.4; this.armR.position.x = 0.4; break;
                        case 'proud': this.torso.scale.z = 1.2; this.head.rotation.x = -0.3; break;
                        case 'hide': this.armL.position.set(-0.2, 0.4, 0.9); this.armR.position.set(0.2, 0.4, 0.9); break;
                        case 'stomp': this.legL.position.y = Math.sin(p*15)*0.5 - 0.85; this.legR.position.y = Math.cos(p*15)*0.5 - 0.85; break;
                        case 'squat': this.animGroup.position.y = -Math.abs(Math.sin(p*5))*1.5; break;
                        case 'tilt': this.head.rotation.z = Math.sin(p*2)*0.8; break;
                        case 'superSpin': this.actionPivot.rotation.y = p*20; break;
                        case 'giant': const gS = DEFAULT_SCALE * (1 + Math.sin(p)*0.8); this.root.scale.set(gS, gS, gS); break;
                        case 'ghost': this.mMain.opacity = Math.abs(Math.sin(p*5)); this.mMain.transparent = true; break;
                        case 'rainbow': this.mMain.color.setHSL((p*0.5)%1, 0.8, 0.5); break;
                        case 'vibrate': this.animGroup.position.x = Math.random()*0.2; this.animGroup.position.z = Math.random()*0.2; break;
                        case 'backStep': this.root.position.z = -Math.sin(p)*2; break;
                    }

                    if (this.actionTime >= Math.PI) {
                        this.activeAction = null;
                        this.reset();
                    }
                }
            }

            createGhost(decay) {
                const g = this.root.clone();
                scene.add(g);
                ghosts.push({ obj: g, life: 1.0, decay: decay });
            }

            reset() {
                this.actionPivot.position.set(0,0,0); this.actionPivot.rotation.set(0,0,0);
                this.animGroup.position.set(0,0,0); this.animGroup.rotation.set(0,0,0);
                this.head.rotation.set(0,0,0); this.head.scale.set(1,1,1);
                this.skull.scale.set(1, 0.8, 0.2); this.skull.position.set(0, 0.65, 1.0);
                this.armL.position.set(-0.8, 0, 0.2); this.armR.position.set(0.8, 0, 0.2);
                this.legL.position.set(-0.35, -0.85, 0.1); this.legR.position.set(0.35, -0.85, 0.1);
                this.armL.rotation.set(0,0,0); this.armR.rotation.set(0,0,0);
                this.legL.rotation.set(0,0,0); this.legR.rotation.set(0,0,0);
                this.torso.scale.set(1, 1.2, 0.8);
                this.root.scale.set(DEFAULT_SCALE, DEFAULT_SCALE, DEFAULT_SCALE);
                this.root.position.copy(this.initialPos);
                this.mMain.opacity = 1.0; this.mMain.transparent = false;
                this.mMain.color.set(this.mainColorHex);
            }
        }

        const charas = [];
        const mouse = new THREE.Vector2();
        const targetWorldPos = new THREE.Vector3();

        function setupGrid() {
            const spacingX = 4.5;
            const spacingY = 5;
            const offsetX = ((COLS - 1) * spacingX) / 2;
            const offsetY = ((ROWS - 1) * spacingY) / 2;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const color = "#" + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                    charas.push(new Chara(c * spacingX - offsetX, -(r * spacingY - offsetY), color));
                }
            }
        }
        setupGrid();

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#ui-container')) return;
            if (charas.some(c => c.activeAction)) return;

            if (syncCheckbox.checked) {
                if (unifiedActionQueue.length === 0) unifiedActionQueue = [...ALL_ACTIONS].sort(() => Math.random() - 0.5);
                const act = unifiedActionQueue.shift();
                charas.forEach(c => c.trigger(act));
            } else {
                charas.forEach(c => {
                    if (c.personalQueue.length === 0) c.personalQueue = [...ALL_ACTIONS].sort(() => Math.random() - 0.5);
                    c.trigger(c.personalQueue.shift());
                });
            }
        });

        window.addEventListener('mousemove', (e) => {
            lastMouseMoveTime = Date.now();
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5).unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const dist = -camera.position.z / dir.z;
            targetWorldPos.copy(camera.position).add(dir.multiplyScalar(dist));
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.01;
            charas.forEach(c => c.update(time, targetWorldPos));

            for (let i = ghosts.length - 1; i >= 0; i--) {
                ghosts[i].life -= ghosts[i].decay;
                if (ghosts[i].life <= 0) {
                    scene.remove(ghosts[i].obj);
                    ghosts.splice(i, 1);
                } else {
                    ghosts[i].obj.traverse(child => {
                        if (child.isMesh) {
                            child.material = child.material.clone();
                            child.material.transparent = true;
                            child.material.opacity = ghosts[i].life * 0.5;
                        }
                    });
                }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
