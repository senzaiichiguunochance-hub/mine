<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frontend Engineer Portfolio</title>

<!-- React CDN -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
  }

  .container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    margin-bottom: 16px;
    line-height: 1.2;
  }

  .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(20px);
    animation: rise 0.6s forwards;
  }

  @keyframes rise {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  p {
    max-width: 720px;
    font-size: 1.05rem;
    line-height: 1.8;
    color: #cbd5f5;
    animation: fadeIn 1.2s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .cta {
    margin-top: 32px;
    padding: 14px 32px;
    border-radius: 999px;
    border: 1px solid #6366f1;
    color: #e0e7ff;
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .cta:hover {
    background: #6366f1;
    color: white;
    transform: translateY(-2px);
  }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const SplitText = ({ text }) => {
  return (
    <h1>
      {text.split("").map((char, i) => (
        <span
          key={i}
          className="char"
          style={{ animationDelay: `${i * 0.04}s` }}
        >
          {char === " " ? "\u00A0" : char}
        </span>
      ))}
    </h1>
  );
};

const App = () => (
  <div className="container">
    <SplitText text="I Build Interfaces That Speak for Themselves." />

    <p>
      技術は目的ではなく手段。  
    </p>

    <p>
      コードの可読性、構造の美しさ、そしてユーザー体験を
      同時に成立させることを大切にしています。
    </p>

    <p>
      小さな違和感を見逃さず、  
      “なんとなく” を “意図された体験” に変えるのが得意です。
    </p>

    <a className="cta" href="menu.html">
      Let’s talk
    </a>
  </div>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
