<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フラッシュ暗算</title>
  <style>
    /* === 共通カラー変数・基本設定 === */
    :root {
      --bg-gradient: linear-gradient(135deg, #fff7ed, #ffedd5, #fef08a);
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: #fed7aa;
      --primary: #f97316;
      --primary-dark: #c2410c;
      --primary-border: #ea580c;
      --sub-bg: rgba(255, 247, 237, 0.7);
      --sub-border: #ffedd5;
      --text: #44403c;
      --text-muted: #78716c;
      --success: #16a34a;
      --success-dark: #166534;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 20px 24px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* === 右上：メニューに戻るボタン === */
    .menu-btn {
      position: fixed;
      top: 14px;
      right: 16px;
      font-size: 15px;
      color: #71716a;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.9);
      padding: 9px 16px;
      border-radius: 999px;
      border: 1.5px solid #e4e4e7;
      font-weight: bold;
      z-index: 1000;
    }

    /* === メインコンテナ・見出し === */
    .container {
      background: var(--card-bg);
      border-radius: 24px;
      border: 2px solid var(--card-border);
      box-shadow: 0 10px 25px rgba(180, 150, 120, 0.15);
      padding: clamp(22px, 3vw, 34px);
      width: min(100%, 760px);
      min-height: 480px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      font-size: clamp(1.7rem, 3vw, 2.1rem);
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 22px;
    }

    /* === 汎用UIパーツ === */
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px 18px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--primary-dark);
      width: 100%;
      min-height: 52px;
    }
    .btn-primary:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--primary-dark);
    }

    .btn-success {
      background: var(--success);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px 18px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--success-dark);
      width: 100%;
      min-height: 52px;
    }
    .btn-success:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--success-dark);
    }

    .btn-secondary {
      background: white;
      border: 1px solid #e7e5e4;
      color: var(--text);
      font-size: 15px;
      font-weight: bold;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 0 #d6d3d1;
    }
    .btn-secondary:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 #d6d3d1;
    }

    .box-sub {
      background: var(--sub-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--sub-border);
      margin-bottom: 16px;
    }
    .box-title {
      font-size: 15px;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 12px;
    }

    /* === 画面切り替え === */
    .screen {
      display: none;
      flex-direction: column;
      flex-grow: 1;
    }
    .screen.active { display: flex; }

    /* === 設定フォーム === */
    .field-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(150px, 220px);
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }
    .label {
      font-size: 16px;
      font-weight: bold;
      color: var(--text);
    }
    .label small {
      display: block;
      font-size: 13px;
      font-weight: normal;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .input-field {
      width: 100%;
      font-size: 18px;
      font-weight: bold;
      color: var(--text);
      background: #ffffff;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 11px 13px;
      min-height: 48px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }
    .input-field:focus { border-color: var(--primary); }

    /* === ゲーム表示 === */
    #gameDisplay {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      line-height: 1;
      min-height: clamp(320px, 48vh, 520px);
      overflow: hidden;
    }

    /* === 入力・結果 === */
    .center { text-align: center; }
    .answer-input {
      width: 100%;
      max-width: 360px;
      font-size: clamp(2.2rem, 6vw, 3rem);
      text-align: center;
      margin: 22px 0;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .result-msg {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 14px;
      text-align: center;
    }
    .result-msg.correct   { color: var(--success); }
    .result-msg.incorrect { color: var(--danger); }

    .answer-display {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 6px;
      text-align: center;
    }
    .hint {
      text-align: center;
      margin: 12px 0 4px;
      font-size: 15px;
      color: var(--text-muted);
      word-break: break-all;
    }

    /* === PC・スマートフォン向けレイアウト調整 === */
    .stats-panel {
      flex-wrap: wrap;
    }

    .stat-item {
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      body {
        justify-content: flex-start;
        padding: 68px 12px 16px;
      }

      .menu-btn {
        top: 10px;
        right: 12px;
        font-size: 14px;
        padding: 8px 13px;
      }

      .container {
        width: 100%;
        min-height: 0;
        padding: 18px 14px;
        border-radius: 18px;
      }

      h1 {
        font-size: 1.65rem;
        margin-bottom: 18px;
      }

      .field-row {
        grid-template-columns: minmax(0, 1fr) minmax(112px, 42%);
        gap: 10px;
        margin-bottom: 14px;
      }

      .label {
        font-size: 14px;
        line-height: 1.4;
      }

      .label small {
        font-size: 11px;
      }

      .input-field {
        font-size: 17px;
        min-height: 46px;
        padding: 9px 10px;
      }

      .box-sub {
        padding: 14px 12px;
      }

      .box-title {
        font-size: 14px;
      }

      .btn-primary,
      .btn-success {
        min-height: 50px;
        font-size: 16px;
      }

      .stats-panel {
        align-items: stretch;
        gap: 10px;
      }

      .stat-item {
        width: 100%;
        font-size: 13px;
      }

      .stats-panel .btn-secondary {
        width: 100%;
        min-height: 42px;
        font-size: 13px !important;
      }

      #gameDisplay {
        min-height: 42vh;
      }

      .answer-input {
        max-width: 100%;
        font-size: 2.4rem;
      }

      .result-msg {
        font-size: 1.7rem;
      }

      .answer-display {
        font-size: 1rem;
        line-height: 1.6;
      }

      .hint {
        font-size: 13px;
        line-height: 1.6;
      }

      .btn-row {
        gap: 10px;
      }

      .btn-row .btn-secondary {
        font-size: 14px;
      }
    }

    @media (max-width: 360px) {
      .field-row {
        grid-template-columns: minmax(0, 1fr) 108px;
        gap: 7px;
      }

      .label {
        font-size: 13px;
      }

      .input-field {
        font-size: 16px;
      }
    }

    /* === 成績 === */
    .stats-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 12px 0 0;
    }
    .stat-item {
      font-size: 14px;
      font-weight: bold;
      color: var(--text);
    }
  </style>
  <!-- GoatCounter アクセス解析 -->
  <script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

  <!-- 右上固定リンク -->
  <a href="menu.html" class="menu-btn">メニューに戻る</a>

  <!-- メインコンテンツ枠 -->
  <div class="container">
    <h1>フラッシュ暗算</h1>

    <!-- 設定画面 -->
    <div id="settingsScreen" class="screen active">
      <div class="box-sub">
        <div class="box-title">★ 設定</div>
        <div class="field-row">
          <div class="label">表示間隔 (ms)<small>※1秒=1000ms</small></div>
          <input type="number" id="intervalInput" class="input-field" value="1000" min="100" step="100">
        </div>
        <div class="field-row">
          <div class="label">最小桁数</div>
          <input type="number" id="minDigitsInput" class="input-field" value="1" min="1" max="10">
        </div>
        <div class="field-row">
          <div class="label">最大桁数</div>
          <input type="number" id="maxDigitsInput" class="input-field" value="2" min="1" max="10">
        </div>
        <div class="field-row">
          <div class="label">問題数<small>※足す数字の個数（口数）</small></div>
          <input type="number" id="problemCountInput" class="input-field" value="3" min="1" max="50">
        </div>
        <div class="field-row">
          <div class="label">フォントサイズ (rem)</div>
          <input type="number" id="fontSizeInput" class="input-field" value="8" min="1" max="30">
        </div>
        <div class="field-row">
          <div class="label">フォントカラー</div>
          <select id="fontColorSelect" class="input-field">
            <option value="#ea580c" selected>オレンジ</option>
            <option value="#dc2626">赤</option>
            <option value="#16a34a">緑</option>
            <option value="#2563eb">青</option>
            <option value="#44403c">ブラウン</option>
          </select>
        </div>
      </div>

      <button id="startBtn" class="btn-primary">開始</button>

      <div class="box-sub stats-panel" style="margin-top: 12px; margin-bottom: 0;">
        <div class="stat-item">正誤率: <span id="accuracyText">0%</span> (正解: <span id="correctCount">0</span> / 全体: <span id="totalCount">0</span>)</div>
        <button id="clearStatsBtn" class="btn-secondary" style="font-size: 13px; padding: 10px 14px;">成績クリア</button>
      </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="gameScreen" class="screen">
      <div id="gameDisplay"></div>
    </div>

    <!-- 入力画面 -->
    <div id="inputScreen" class="screen">
      <div class="box-sub center">
        <div class="box-title">★ 答えを入力してください</div>
        <input type="number" id="answerInput" class="input-field answer-input">
        <button id="submitBtn" class="btn-success">答え合わせ</button>
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="resultScreen" class="screen">
      <div class="box-sub">
        <div id="resultMessage" class="result-msg"></div>
        <div class="answer-display">あなたの答え: <span id="userAnswerText"></span></div>
        <div class="answer-display">正解: <span id="correctAnswerText"></span></div>
        <div id="problemNumbersDisplay" class="hint"></div>
      </div>
      <div class="btn-row">
        <button id="retryBtn" class="btn-primary">リトライ</button>
        <button id="changeSettingsBtn" class="btn-secondary" style="white-space: nowrap;">設定変更</button>
      </div>
    </div>
  </div>

  <script>
    const statsKey = "flashArithmeticStats";

    const screens = {
      settings: document.getElementById("settingsScreen"),
      game: document.getElementById("gameScreen"),
      input: document.getElementById("inputScreen"),
      result: document.getElementById("resultScreen")
    };

    const inputs = {
      interval: document.getElementById("intervalInput"),
      minDigits: document.getElementById("minDigitsInput"),
      maxDigits: document.getElementById("maxDigitsInput"),
      problemCount: document.getElementById("problemCountInput"),
      fontSize: document.getElementById("fontSizeInput"),
      fontColor: document.getElementById("fontColorSelect")
    };

    const gameDisplay = document.getElementById("gameDisplay");
    const answerInput = document.getElementById("answerInput");
    const accuracyText = document.getElementById("accuracyText");
    const correctCountText = document.getElementById("correctCount");
    const totalCountText = document.getElementById("totalCount");

    let currentSum = 0;
    let problemNumbers = [];
    let stats = { correct: 0, total: 0 };

    // Stats Logic
    function loadStats() {
      try {
        const saved = localStorage.getItem(statsKey);
        if (saved) stats = JSON.parse(saved);
      } catch (e) {}
      updateStatsUI();
    }

    function updateStatsUI() {
      correctCountText.textContent = stats.correct;
      totalCountText.textContent = stats.total;
      const rate = stats.total === 0 ? 0 : Math.round((stats.correct / stats.total) * 100);
      accuracyText.textContent = rate + "%";
    }

    function saveStats() {
      try { localStorage.setItem(statsKey, JSON.stringify(stats)); } catch (e) {}
    }

    document.getElementById("clearStatsBtn").addEventListener("click", () => {
      stats = { correct: 0, total: 0 };
      saveStats();
      updateStatsUI();
    });

    // Screen Navigation
    function showScreen(screenId) {
      Object.values(screens).forEach(s => s.classList.remove("active"));
      screens[screenId].classList.add("active");
    }

    // Game Logic
    function getRandomNumber(minDigits, maxDigits) {
      const min = Math.pow(10, minDigits - 1);
      const max = Math.pow(10, maxDigits) - 1;
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    async function startGame() {
      const interval = parseInt(inputs.interval.value) || 1000;
      const minDigits = parseInt(inputs.minDigits.value) || 1;
      const maxDigits = parseInt(inputs.maxDigits.value) || 2;
      const count = parseInt(inputs.problemCount.value) || 3;
      const fontSize = (inputs.fontSize.value || 8) + "rem";
      const fontColor = inputs.fontColor.value;

      problemNumbers = [];
      currentSum = 0;
      for (let i = 0; i < count; i++) {
        const num = getRandomNumber(minDigits, maxDigits);
        problemNumbers.push(num);
        currentSum += num;
      }

      showScreen("game");
      gameDisplay.textContent = "";

      // Countdown（問題の文字色と被らない色にする）
      const countdownColor = fontColor === "#ea580c" ? "#78716c" : "#f97316";
      gameDisplay.style.fontSize = "8rem";
      gameDisplay.style.color = countdownColor;

      for (let i = 3; i > 0; i--) {
        gameDisplay.textContent = i;
        await new Promise(r => setTimeout(r, 1000));
      }

      gameDisplay.textContent = "";
      await new Promise(r => setTimeout(r, 500));

      // Flashing Numbers
      gameDisplay.style.fontSize = fontSize;
      gameDisplay.style.color = fontColor;

      for (const num of problemNumbers) {
        gameDisplay.textContent = num;
        await new Promise(r => setTimeout(r, interval));
        gameDisplay.textContent = "";
        // Short gap between numbers
        await new Promise(r => setTimeout(r, 100));
      }

      showScreen("input");
      answerInput.value = "";
      setTimeout(() => answerInput.focus(), 50);
    }

    function checkAnswer() {
      const userAnswer = parseInt(answerInput.value);
      const isCorrect = userAnswer === currentSum;

      stats.total++;
      if (isCorrect) stats.correct++;
      saveStats();
      updateStatsUI();

      const msg = document.getElementById("resultMessage");
      msg.textContent = isCorrect ? "正解！" : "不正解...";
      msg.className = "result-msg " + (isCorrect ? "correct" : "incorrect");

      document.getElementById("userAnswerText").textContent = isNaN(userAnswer) ? "未入力" : userAnswer;
      document.getElementById("correctAnswerText").textContent = currentSum;
      document.getElementById("problemNumbersDisplay").textContent = "問題: " + problemNumbers.join(" + ") + " = " + currentSum;

      showScreen("result");
    }

    // Event Listeners
    document.getElementById("startBtn").addEventListener("click", startGame);
    document.getElementById("submitBtn").addEventListener("click", checkAnswer);
    document.getElementById("retryBtn").addEventListener("click", startGame);
    document.getElementById("changeSettingsBtn").addEventListener("click", () => showScreen("settings"));

    answerInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") checkAnswer();
    });

    // Initialize
    window.onload = loadStats;
  </script>

</body>
</html>
