<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>フラッシュ暗算</title>
	<style>
		:root {
			--bg-start: #07111f;
			--bg-end: #101c33;
			--card-bg: rgba(13, 20, 35, 0.88);
			--card-border: rgba(90, 220, 255, 0.35);
			--primary: #5be7ff;
			--primary-strong: #20c4ff;
			--secondary: #ffb347;
			--text: #edf7ff;
			--muted: #a7bed3;
			--danger: #ff6b6b;
			--success: #2ee59d;
			--shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
			--radius: 22px;
		}

		body.theme-cute {
			--bg-start: #2a1020;
			--bg-end: #4c1d3d;
			--card-bg: rgba(255, 245, 248, 0.92);
			--card-border: rgba(255, 123, 171, 0.35);
			--primary: #ff6b8b;
			--primary-strong: #ff4d7d;
			--secondary: #ffb86b;
			--text: #4a2733;
			--muted: #7d5a66;
			--danger: #ff6b6b;
			--success: #2ea66d;
		}

		body.theme-beautiful {
			--bg-start: #10172c;
			--bg-end: #25345e;
			--card-bg: rgba(255, 255, 255, 0.9);
			--card-border: rgba(108, 92, 231, 0.22);
			--primary: #6c5ce7;
			--primary-strong: #5b4bd1;
			--secondary: #9b89ff;
			--text: #24304a;
			--muted: #60708c;
			--danger: #e05664;
			--success: #24a37a;
		}

		body.theme-stylish {
			--bg-start: #14110f;
			--bg-end: #2a211a;
			--card-bg: rgba(33, 29, 24, 0.92);
			--card-border: rgba(225, 177, 44, 0.3);
			--primary: #e1b12c;
			--primary-strong: #fbc531;
			--secondary: #ffcf70;
			--text: #f7efe2;
			--muted: #b8aa93;
			--danger: #ff7a59;
			--success: #4cd137;
		}

		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			min-height: 100%;
		}

		body {
			font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
			color: var(--text);
			background:
				radial-gradient(circle at top left, rgba(91, 231, 255, 0.16), transparent 32%),
				radial-gradient(circle at bottom right, rgba(255, 179, 71, 0.18), transparent 28%),
				linear-gradient(145deg, var(--bg-start), var(--bg-end));
			display: flex;
			flex-direction: column;
			align-items: center;
			overflow-x: hidden;
		}

		header {
			width: 100%;
			padding: 26px 16px 18px;
			text-align: center;
		}

		.eyebrow {
			display: inline-block;
			padding: 6px 12px;
			border-radius: 999px;
			background: rgba(91, 231, 255, 0.12);
			color: var(--primary);
			border: 1px solid rgba(91, 231, 255, 0.22);
			font-size: 0.85rem;
			letter-spacing: 0.08em;
		}

		h1 {
			margin: 12px 0 8px;
			font-size: clamp(1.7rem, 4vw, 2.7rem);
			letter-spacing: 0.06em;
			display: inline-block;
			padding: 0.22em 0.8em;
			border-radius: 999px;
			background: linear-gradient(135deg, rgba(8, 14, 26, 0.72), rgba(8, 14, 26, 0.28));
			color: #ffffff;
			border: 1px solid rgba(255, 255, 255, 0.14);
			box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.08);
			text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7), 0 0 22px rgba(91, 231, 255, 0.35);
		}

		.theme-controls {
			width: min(980px, calc(100% - 24px));
			margin: 0 0 12px;
			display: flex;
			justify-content: flex-end;
		}

		.theme-select-wrap {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 10px 14px;
			border-radius: 999px;
			background: rgba(10, 16, 28, 0.45);
			border: 1px solid rgba(255, 255, 255, 0.12);
			backdrop-filter: blur(12px);
		}

		.theme-select-label {
			font-size: 0.88rem;
			color: var(--muted);
			font-weight: 700;
		}

		.theme-select {
			border: 1px solid rgba(91, 231, 255, 0.25);
			background: rgba(255, 255, 255, 0.08);
			color: #ffffff;
			border-radius: 999px;
			padding: 8px 12px;
			font-weight: 700;
			outline: none;
		}

		.theme-select option {
			color: #111111;
			background: #ffffff;
		}

		main {
			width: min(980px, calc(100% - 24px));
			margin: 0 0 28px;
			padding: clamp(16px, 3vw, 28px);
			background: var(--card-bg);
			border: 1px solid var(--card-border);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			backdrop-filter: blur(16px);
			min-height: 400px;
			display: flex;
			flex-direction: column;
		}

		.screen {
			display: none;
			flex-direction: column;
			gap: 20px;
			height: 100%;
			flex-grow: 1;
		}

		.screen.active {
			display: flex;
		}

		.panel {
			border-radius: 18px;
			background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
			border: 1px solid rgba(255, 255, 255, 0.08);
			padding: 18px;
		}

		.panel h2 {
			margin: 0 0 14px;
			font-size: 1.15rem;
			color: var(--primary);
			letter-spacing: 0.04em;
		}

		.field-row {
			display: grid;
			grid-template-columns: 200px 1fr;
			gap: 14px;
			align-items: center;
			margin-bottom: 12px;
		}

		.label {
			font-weight: 700;
			color: var(--text);
		}

		.input-field {
			width: 100%;
			max-width: 150px;
			font-size: 1.2rem;
			font-weight: 700;
			color: var(--text);
			background: rgba(255, 255, 255, 0.06);
			border: 1px solid rgba(91, 231, 255, 0.35);
			border-radius: 12px;
			padding: 8px 12px;
			outline: none;
			transition: border-color 0.2s ease;
		}

		.input-field:focus {
			border-color: var(--primary);
		}

		.input-field option {
			color: #111111;
			background-color: #ffffff;
		}

		select.input-field {
			max-width: 200px;
		}

		.btn-container {
			display: flex;
			gap: 12px;
			margin-top: 20px;
		}

		.btn {
			border: 0;
			border-radius: 999px;
			padding: 14px 28px;
			font-size: 1rem;
			font-weight: 800;
			letter-spacing: 0.04em;
			color: #072031;
			cursor: pointer;
			transition: transform 0.18s ease, box-shadow 0.18s ease;
			box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
		}

		.btn:hover {
			transform: translateY(-2px);
		}

		.btn-primary { background: linear-gradient(135deg, var(--primary), #b9fbff); }
		.btn-secondary { background: linear-gradient(135deg, #ffd27f, var(--secondary)); }
		.btn-danger { background: linear-gradient(135deg, #ff9b9b, var(--danger)); color: #320909; }
		.btn-success { background: linear-gradient(135deg, #2ee59d, #b9ffde); }

		/* Game Display */
		#gameDisplay {
			flex-grow: 1;
			display: flex;
			justify-content: center;
			align-items: center;
			font-weight: 900;
			line-height: 1;
			min-height: 250px;
		}

		.flash-number {
			transition: transform 0.1s ease;
		}

		/* Stats Panel */
		.stats-panel {
			margin-top: 20px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.stat-item {
			font-size: 1rem;
			font-weight: 700;
		}

		.result-msg {
			font-size: 2rem;
			font-weight: 900;
			margin-bottom: 20px;
			text-align: center;
		}

		.result-msg.correct { color: var(--success); }
		.result-msg.incorrect { color: var(--danger); }

		.answer-display {
			font-size: 1.5rem;
			margin-bottom: 10px;
			text-align: center;
		}

		@media (max-width: 600px) {
			.field-row { grid-template-columns: 1fr; }
			.btn-container { flex-direction: column; }
		}
	</style>
</head>
<body>
	<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #ffffff; text-decoration: none; background: #222222; border: 1px solid #555555; padding: 6px 12px; z-index: 1000; font-weight: bold;">メニューに戻る</a>

	<header>
		<h1>フラッシュ暗算</h1>
	</header>

	<div class="theme-controls">
		<div class="theme-select-wrap">
			<label class="theme-select-label" for="themeSelect">カラーテーマ</label>
			<select id="themeSelect" class="theme-select">
				<option value="cool">クール</option>
				<option value="cute">かわいい</option>
				<option value="beautiful">キレイ</option>
				<option value="stylish">かっこいい</option>
			</select>
		</div>
	</div>

	<main>
		<!-- Settings Screen -->
		<div id="settingsScreen" class="screen active">
			<div class="panel">
				<h2>設定</h2>
				<div class="field-row">
					<div class="label">表示間隔 (ms)</div>
					<input type="number" id="intervalInput" class="input-field" value="1000" min="100" step="100">
				</div>
				<div class="field-row">
					<div class="label">最小桁数</div>
					<input type="number" id="minDigitsInput" class="input-field" value="1" min="1" max="10">
				</div>
				<div class="field-row">
					<div class="label">最大桁数</div>
					<input type="number" id="maxDigitsInput" class="input-field" value="2" min="1" max="10">
				</div>
				<div class="field-row">
					<div class="label">問題数</div>
					<input type="number" id="problemCountInput" class="input-field" value="3" min="1" max="50">
				</div>
				<div class="field-row">
					<div class="label">フォントサイズ (rem)</div>
					<input type="number" id="fontSizeInput" class="input-field" value="12" min="1" max="30">
				</div>
				<div class="field-row">
					<div class="label">フォントカラー</div>
					<select id="fontColorSelect" class="input-field">
						<option value="#2ee59d" selected>緑</option>
						<option value="#5be7ff">シアン</option>
						<option value="#ffb347">黄</option>
						<option value="#edf7ff">白</option>
						<option value="#ff6b8b">マゼンタ</option>
					</select>
				</div>
			</div>
			<div class="btn-container">
				<button id="startBtn" class="btn btn-primary">開始</button>
			</div>
			<div class="stats-panel panel">
				<div class="stat-item">正誤率: <span id="accuracyText">0%</span> (正解: <span id="correctCount">0</span> / 全体: <span id="totalCount">0</span>)</div>
				<button id="clearStatsBtn" class="btn btn-secondary" style="padding: 8px 16px; font-size: 0.8rem;">過去の成績をクリア</button>
			</div>
		</div>

		<!-- Game Screen -->
		<div id="gameScreen" class="screen">
			<div id="gameDisplay"></div>
		</div>

		<!-- Input Screen -->
		<div id="inputScreen" class="screen">
			<div class="panel" style="text-align: center;">
				<h2>答えを入力してください</h2>
				<input type="number" id="answerInput" class="input-field" style="max-width: 300px; font-size: 2rem; margin: 20px 0;">
				<div class="btn-container" style="justify-content: center;">
					<button id="submitBtn" class="btn btn-success">答え合わせ</button>
				</div>
			</div>
		</div>

		<!-- Result Screen -->
		<div id="resultScreen" class="screen">
			<div class="panel">
				<div id="resultMessage" class="result-msg"></div>
				<div class="answer-display">あなたの答え: <span id="userAnswerText"></span></div>
				<div class="answer-display">正解: <span id="correctAnswerText"></span></div>
				<div id="problemNumbersDisplay" class="hint" style="text-align: center; margin-top: 20px; font-size: 1.1rem;"></div>
				<div class="btn-container" style="justify-content: center;">
					<button id="retryBtn" class="btn btn-primary">リトライ</button>
					<button id="changeSettingsBtn" class="btn btn-secondary">設定変更</button>
				</div>
			</div>
		</div>
	</main>

	<script>
		const themeKey = "flashArithmeticTheme";
		const statsKey = "flashArithmeticStats";

		const screens = {
			settings: document.getElementById("settingsScreen"),
			game: document.getElementById("gameScreen"),
			input: document.getElementById("inputScreen"),
			result: document.getElementById("resultScreen")
		};

		const inputs = {
			interval: document.getElementById("intervalInput"),
			minDigits: document.getElementById("minDigitsInput"),
			maxDigits: document.getElementById("maxDigitsInput"),
			problemCount: document.getElementById("problemCountInput"),
			fontSize: document.getElementById("fontSizeInput"),
			fontColor: document.getElementById("fontColorSelect")
		};

		const gameDisplay = document.getElementById("gameDisplay");
		const answerInput = document.getElementById("answerInput");
		const accuracyText = document.getElementById("accuracyText");
		const correctCountText = document.getElementById("correctCount");
		const totalCountText = document.getElementById("totalCount");

		let currentSum = 0;
		let problemNumbers = [];
		let stats = { correct: 0, total: 0 };

		// Theme Logic
		function applyTheme(theme) {
			document.body.classList.remove("theme-cute", "theme-beautiful", "theme-stylish");
			if (theme !== "cool") {
				document.body.classList.add("theme-" + theme);
			}
			localStorage.setItem(themeKey, theme);
		}

		document.getElementById("themeSelect").addEventListener("change", (e) => applyTheme(e.target.value));

		// Stats Logic
		function loadStats() {
			const saved = localStorage.getItem(statsKey);
			if (saved) {
				try {
					stats = JSON.parse(saved);
				} catch(e) {}
			}
			updateStatsUI();
		}

		function updateStatsUI() {
			correctCountText.textContent = stats.correct;
			totalCountText.textContent = stats.total;
			const rate = stats.total === 0 ? 0 : Math.round((stats.correct / stats.total) * 100);
			accuracyText.textContent = rate + "%";
		}

		function saveStats() {
			localStorage.setItem(statsKey, JSON.stringify(stats));
		}

		document.getElementById("clearStatsBtn").addEventListener("click", () => {
			stats = { correct: 0, total: 0 };
			saveStats();
			updateStatsUI();
		});

		// Screen Navigation
		function showScreen(screenId) {
			Object.values(screens).forEach(s => s.classList.remove("active"));
			screens[screenId].classList.add("active");
		}

		// Game Logic
		function getRandomNumber(minDigits, maxDigits) {
			const min = Math.pow(10, minDigits - 1);
			const max = Math.pow(10, maxDigits) - 1;
			return Math.floor(Math.random() * (max - min + 1)) + min;
		}

		async function startGame() {
			const interval = parseInt(inputs.interval.value) || 1000;
			const minDigits = parseInt(inputs.minDigits.value) || 1;
			const maxDigits = parseInt(inputs.maxDigits.value) || 2;
			const count = parseInt(inputs.problemCount.value) || 3;
			const fontSize = (inputs.fontSize.value || 12) + "rem";
			const fontColor = inputs.fontColor.value;

			problemNumbers = [];
			currentSum = 0;
			for (let i = 0; i < count; i++) {
				const num = getRandomNumber(minDigits, maxDigits);
				problemNumbers.push(num);
				currentSum += num;
			}

			showScreen("game");
			gameDisplay.textContent = "";

			// Countdown
			const countdownColor = fontColor === "#ffb347" ? "#5be7ff" : "#ffb347";
			gameDisplay.style.fontSize = "10rem";
			gameDisplay.style.color = countdownColor;

			for (let i = 3; i > 0; i--) {
				gameDisplay.textContent = i;
				await new Promise(r => setTimeout(r, 1000));
			}

			gameDisplay.textContent = "";
			await new Promise(r => setTimeout(r, 500));

			// Flashing Numbers
			gameDisplay.style.fontSize = fontSize;
			gameDisplay.style.color = fontColor;

			for (const num of problemNumbers) {
				gameDisplay.textContent = num;
				await new Promise(r => setTimeout(r, interval));
				gameDisplay.textContent = "";
				// Short gap between numbers
				await new Promise(r => setTimeout(r, 100));
			}

			showScreen("input");
			answerInput.value = "";
			setTimeout(() => answerInput.focus(), 50);
		}

		function checkAnswer() {
			const userAnswer = parseInt(answerInput.value);
			const isCorrect = userAnswer === currentSum;

			stats.total++;
			if (isCorrect) stats.correct++;
			saveStats();
			updateStatsUI();

			const msg = document.getElementById("resultMessage");
			msg.textContent = isCorrect ? "正解！" : "不正解...";
			msg.className = "result-msg " + (isCorrect ? "correct" : "incorrect");

			document.getElementById("userAnswerText").textContent = isNaN(userAnswer) ? "未入力" : userAnswer;
			document.getElementById("correctAnswerText").textContent = currentSum;
			document.getElementById("problemNumbersDisplay").textContent = "問題: " + problemNumbers.join(" + ") + " = " + currentSum;

			showScreen("result");
		}

		// Event Listeners
		document.getElementById("startBtn").addEventListener("click", startGame);
		document.getElementById("submitBtn").addEventListener("click", checkAnswer);
		document.getElementById("retryBtn").addEventListener("click", startGame);
		document.getElementById("changeSettingsBtn").addEventListener("click", () => showScreen("settings"));

		answerInput.addEventListener("keypress", (e) => {
			if (e.key === "Enter") checkAnswer();
		});

		// Initialize
		window.onload = () => {
			const savedTheme = localStorage.getItem(themeKey) || "cool";
			document.getElementById("themeSelect").value = savedTheme;
			applyTheme(savedTheme);
			loadStats();
		};
	</script>
</body>
</html>
