<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>スロットカウンター</title>
<style>
  /* === 共通カラー変数・基本設定（base.html 準拠） === */
  :root {
    --bg-gradient: linear-gradient(135deg, #fff7ed, #ffedd5, #fef08a);
    --card-bg: rgba(255, 255, 255, 0.95);
    --card-border: #fed7aa;
    --primary: #f97316;
    --primary-dark: #c2410c;
    --primary-border: #ea580c;
    --sub-bg: rgba(255, 247, 237, 0.7);
    --sub-border: #ffedd5;
    --text: #44403c;
    --text-muted: #78716c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: sans-serif;
    background: var(--bg-gradient);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    user-select: none;
    -webkit-user-select: none;
  }

  /* === 右上：メニューに戻るボタン === */
  .menu-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 11px;
    color: #71716a;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.9);
    padding: 4px 10px;
    border-radius: 999px;
    border: 1.5px solid #e4e4e7;
    font-weight: bold;
    z-index: 1000;
  }

  /* === メインコンテナ・見出し === */
  .container {
    background: var(--card-bg);
    border-radius: 24px;
    border: 2px solid var(--card-border);
    box-shadow: 0 10px 25px rgba(180, 150, 120, 0.15);
    padding: 16px;
    width: 100%;
    max-width: 500px;
  }

  h1 {
    text-align: center;
    font-size: 1.25rem;
    font-weight: 900;
    color: var(--primary);
    margin-bottom: 12px;
  }

  /* === 汎用UIパーツ === */
  .btn-primary {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--primary-dark);
  }
  .btn-primary:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--primary-dark);
  }

  .btn-secondary {
    background: white;
    border: 1px solid #e7e5e4;
    color: var(--text);
    font-size: 12px;
    font-weight: bold;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 2px 0 #d6d3d1;
  }
  .btn-secondary:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 #d6d3d1;
  }

  /* === スロットカウンター固有スタイル === */
  .box {
    background: var(--sub-bg);
    padding: 12px;
    border-radius: 16px;
    border: 1px solid var(--sub-border);
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .control-group {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  label {
    font-size: 12px;
    font-weight: bold;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  input[type="number"] {
    width: 72px;
    padding: 6px 8px;
    border: 1.5px solid var(--card-border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    font-size: 13px;
    font-weight: bold;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--primary);
  }

  .dial {
    display: flex;
    gap: 6px;
    margin: 12px 0 8px;
    justify-content: center;
  }

  .digit {
    width: 50px;
    height: 60px;
    border: 2px solid var(--primary-border);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    font-size: 44px;
    font-weight: 900;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text);
    box-shadow: inset 0 2px 5px rgba(249, 115, 22, 0.12);
  }

  .digit-inner {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    transition: transform 0.05s linear;
  }

  .digit-inner div {
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .elapsed {
    font-size: 13px;
    font-weight: bold;
    color: var(--text-muted);
    text-align: center;
    margin-top: 10px;
  }
</style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<a href="menu.html" class="menu-btn">メニューに戻る</a>

<div class="container">
  <h1>スロットカウンター</h1>

  <div class="box">
    <div class="controls">
      <div class="control-group">
        <label>From <input id="fromNum" type="number" value="2000" min="0" max="9999"></label>
        <label>To <input id="toNum" type="number" value="2025" min="0" max="9999"></label>
      </div>
      <div class="control-group">
        <label>実行秒数 <input id="duration" type="number" value="10" min="1" max="60"></label>
      </div>
      <div class="control-group">
        <button id="runBtn" class="btn-primary">実行</button>
        <button id="swapBtn" class="btn-secondary">入れ替え</button>
      </div>
    </div>

    <div class="dial" id="dialContainer"></div>
    <div class="elapsed" id="elapsedTime">経過時間: 0s</div>
  </div>
</div>

<script>
const fromNum = document.getElementById('fromNum');
const toNum = document.getElementById('toNum');
const duration = document.getElementById('duration');

function clamp(val, min, max, def) {
  if (val === '' || isNaN(val)) return def;
  val = Number(val);
  if (val < min || val > max) return def;
  return val;
}

function splitDigits(num, length) {
  return num.toString().padStart(length, '0').split('');
}

document.getElementById('runBtn').addEventListener('click', () => {
  let fromVal = clamp(fromNum.value, 0, 9999, 2000);
  let toVal = clamp(toNum.value, 0, 9999, 2025);
  let dur = clamp(duration.value, 1, 60, 10);

  fromNum.value = fromVal;
  toNum.value = toVal;
  duration.value = dur;

  const dialContainer = document.getElementById('dialContainer');
  const elapsed = document.getElementById('elapsedTime');
  dialContainer.innerHTML = '';
  elapsed.textContent = '経過時間: 0s';

  const maxLen = Math.max(fromVal.toString().length, toVal.toString().length, 1);
  const startDigits = splitDigits(fromVal, maxLen);

  const digitDivs = [];
  for (let i = 0; i < maxLen; i++) {
    const digitContainer = document.createElement('div');
    digitContainer.className = 'digit';
    const inner = document.createElement('div');
    inner.className = 'digit-inner';
    for (let d = 0; d <= 9; d++) {
      const numDiv = document.createElement('div');
      numDiv.textContent = d;
      inner.appendChild(numDiv);
    }
    inner.style.transform = `translateY(${-startDigits[i]*60}px)`;
    digitContainer.appendChild(inner);
    dialContainer.appendChild(digitContainer);
    digitDivs.push(inner);
  }

  const stepCount = Math.abs(toVal - fromVal);
  if (dialContainer.interval) clearInterval(dialContainer.interval);
  let current = fromVal;
  const stepDuration = (dur*1000)/Math.max(stepCount,1);
  let elapsedTime = 0;

  const endTime = Date.now() + dur * 1000;

  function update() {
    const now = Date.now();
    if (now >= endTime) {
      const finalDigits = splitDigits(toVal, maxLen);
      finalDigits.forEach((val, idx) => {
        digitDivs[idx].style.transform = `translateY(${-val*60}px)`;
      });
      elapsed.textContent = `経過時間: ${dur.toFixed(1)}s`;
      if(dialContainer.interval) clearInterval(dialContainer.interval);
      return;
    }

    const progress = (now - (endTime - dur * 1000)) / (dur * 1000);
    current = Math.round(fromVal + (toVal - fromVal) * progress);

    const digits = splitDigits(current, maxLen);
    digits.forEach((val, idx) => {
      digitDivs[idx].style.transform = `translateY(${-val*60}px)`;
    });

    elapsedTime = (now - (endTime - dur * 1000)) / 1000;
    elapsed.textContent = `経過時間: ${elapsedTime.toFixed(1)}s`;
  }

  if (dialContainer.interval) clearInterval(dialContainer.interval);
  dialContainer.interval = setInterval(update, 1000/60); // 60fps
});

document.getElementById('swapBtn').addEventListener('click', () => {
  const temp = fromNum.value;
  fromNum.value = toNum.value;
  toNum.value = temp;
});
</script>
</body>
</html>
