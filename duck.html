<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>アヒルの滑り台</title>
    <style>body { margin: 0; overflow: hidden; background: linear-gradient(#bde6f5, #e0f7fa); }</style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbde6f5, 45, 95);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// --- ライト ---
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const dirLight = new THREE.DirectionalLight(0xfff3d6, 0.7);
dirLight.position.set(20, 50, 20);
scene.add(dirLight);

// --- 太陽 ---
const sun = new THREE.Mesh(
    new THREE.SphereGeometry(3, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0xFFF59D, emissive: 0xFFEB3B, emissiveIntensity: 0.7 })
);
sun.position.set(-35, 42, -25);
scene.add(sun);

// --- 地面（芝生） ---
const ground = new THREE.Mesh(
    new THREE.CircleGeometry(28, 48),
    new THREE.MeshStandardMaterial({ color: 0x9CCC65, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// --- お花畑 ---
function createFlower(x, z, color) {
    const flower = new THREE.Group();
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.6, 6), new THREE.MeshStandardMaterial({ color: 0x4CAF50 }));
    stem.position.y = 0.3;
    flower.add(stem);
    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), new THREE.MeshStandardMaterial({ color: color }));
    petal.position.y = 0.62;
    petal.scale.set(1, 0.7, 1);
    flower.add(petal);
    flower.position.set(x, 0, z);
    return flower;
}
const flowerColors = [0xFF80AB, 0xFFD54F, 0xBA68C8, 0x4FC3F7, 0xFFFFFF];
for (let i = 0; i < 45; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 7 + Math.random() * 19;
    scene.add(createFlower(Math.cos(angle) * radius, Math.sin(angle) * radius, flowerColors[Math.floor(Math.random() * flowerColors.length)]));
}

// --- 雲 ---
function createCloud() {
    const cloud = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.95 });
    const puffs = [[0, 0, 0, 1], [0.9, 0.1, 0, 0.7], [-0.8, 0.05, 0.2, 0.75], [0.3, 0.35, 0.3, 0.6], [-0.3, 0.3, -0.2, 0.6]];
    puffs.forEach(([x, y, z, s]) => {
        const m = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 10), mat);
        m.position.set(x, y, z);
        m.scale.setScalar(s);
        cloud.add(m);
    });
    return cloud;
}
const clouds = [];
for (let i = 0; i < 6; i++) {
    const cloud = createCloud();
    const angle = Math.random() * Math.PI * 2;
    const radius = 18 + Math.random() * 14;
    cloud.position.set(Math.cos(angle) * radius, 26 + Math.random() * 10, Math.sin(angle) * radius);
    cloud.scale.setScalar(2 + Math.random() * 1.5);
    scene.add(cloud);
    clouds.push(cloud);
}

// --- 装置 ---
const stairHeight = 30;
const stairMat = new THREE.MeshStandardMaterial({ 
    color: 0xBBDEFB, transparent: true, opacity: 0.5, roughness: 0.1, metalness: 0.5 
});
const stair = new THREE.Mesh(new THREE.BoxGeometry(4, stairHeight, 2), stairMat);
stair.position.set(0, stairHeight/2, 0);
scene.add(stair);

// 階段ステップ
const stepCount = 60;
const stepMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.8 });
for (let i = 0; i < stepCount; i++) {
    const step = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.2, 0.8), stepMat);
    step.position.set(0, (i * (stairHeight/stepCount)) - stairHeight/2 + 0.1, 0.6);
    stair.add(step);
}

// 滑り台 (少しランダム)
const slidePoints = [new THREE.Vector3(0, stairHeight, 0)];
for (let i = 1; i <= 5; i++) {
    const angle = i * Math.PI * 0.7 + (Math.random() * 0.5);
    const radius = 8 + (Math.random() * 7);
    const y = stairHeight - (i * 5.5);
    slidePoints.push(new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius));
}
slidePoints.push(new THREE.Vector3(0, 1.5, 8));
const slideCurve = new THREE.CatmullRomCurve3(slidePoints);
const slideMesh = new THREE.Mesh(
    new THREE.TubeGeometry(slideCurve, 150, 0.6, 12, false),
    new THREE.MeshStandardMaterial({ color: 0xffa500, transparent: true, opacity: 0.6 })
);
scene.add(slideMesh);

const trackCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 1.5, 8), new THREE.Vector3(0, 1.5, 1.5)]);
scene.add(new THREE.Mesh(new THREE.TubeGeometry(trackCurve, 20, 0.4, 8, false), new THREE.MeshStandardMaterial({ color: 0x5D4037 })));

// --- 池（着水ポイント） ---
const pond = new THREE.Mesh(
    new THREE.CircleGeometry(3.2, 40),
    new THREE.MeshStandardMaterial({ color: 0x4FC3F7, transparent: true, opacity: 0.65, roughness: 0.2, metalness: 0.3 })
);
pond.rotation.x = -Math.PI / 2;
pond.position.set(0, 1.32, 8);
scene.add(pond);

// 波紋
const rippleRings = [];
for (let i = 0; i < 4; i++) {
    const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.22, 32),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(0, 1.34, 8);
    scene.add(ring);
    rippleRings.push(ring);
}

// --- アヒル作成 (20羽：1番目ピンク, 10番目青, 他黄色) ---
const ducks = [];
const totalDucks = 20;

function createDuck(color) {
    const duck = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.25 });

    const body = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), mat);
    body.scale.set(1.2, 1, 1);
    duck.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), mat);
    head.position.set(0.6, 0.8, 0);
    duck.add(head);

    const beak = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.3), new THREE.MeshStandardMaterial({ color: 0xFF5722 }));
    beak.position.set(1.2, 0.8, 0);
    duck.add(beak);

    // 目
    const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(0.85, 0.95, 0.28);
    duck.add(eyeL);
    const eyeR = eyeL.clone();
    eyeR.position.z = -0.28;
    duck.add(eyeR);

    // ほっぺ
    const cheekGeo = new THREE.CircleGeometry(0.13, 12);
    const cheekMat = new THREE.MeshStandardMaterial({ color: 0xffb6c1, transparent: true, opacity: 0.7 });
    const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
    cheekL.position.set(0.75, 0.65, 0.42);
    cheekL.rotation.y = 0.6;
    duck.add(cheekL);
    const cheekR = cheekL.clone();
    cheekR.position.z = -0.42;
    cheekR.rotation.y = -0.6;
    duck.add(cheekR);

    // 翼（羽ばたき用にpivotで包む）
    const wingGeo = new THREE.SphereGeometry(0.35, 12, 12);
    const wingMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });

    const wingLPivot = new THREE.Group();
    wingLPivot.position.set(-0.1, 0.15, 0.55);
    const wingL = new THREE.Mesh(wingGeo, wingMat);
    wingL.scale.set(1, 0.6, 0.35);
    wingL.position.set(0, 0, 0.3);
    wingLPivot.add(wingL);
    duck.add(wingLPivot);

    const wingRPivot = new THREE.Group();
    wingRPivot.position.set(-0.1, 0.15, -0.55);
    const wingR = new THREE.Mesh(wingGeo, wingMat);
    wingR.scale.set(1, 0.6, 0.35);
    wingR.position.set(0, 0, -0.3);
    wingRPivot.add(wingR);
    duck.add(wingRPivot);

    // しっぽ
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 8), mat);
    tail.rotation.z = Math.PI / 2;
    tail.position.set(-1.0, 0.3, 0);
    duck.add(tail);

    duck.userData.wings = [wingLPivot, wingRPivot];
    return duck;
}

// 着水スプラッシュ用パーティクル
function createSplash() {
    const group = new THREE.Group();
    const particles = [];
    for (let j = 0; j < 6; j++) {
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), mat);
        group.add(p);
        particles.push(p);
    }
    scene.add(group);
    return { group, particles };
}

for (let i = 0; i < totalDucks; i++) {
    let color = 0xFFD700; 
    if (i === 0) color = 0xFF69B4;      // ピンク
    else if (i === 9) color = 0x1E90FF; // 青（10番目）
    const duck = createDuck(color);
    duck.userData.splash = createSplash();
    scene.add(duck);
    ducks.push(duck);
}

// --- アニメーション & 自動カメラ ---
const clock = new THREE.Clock();
const LAP_SEC = 20;           // 1周の秒数
const PHASE_STAIRS = 0.35;    // 階段の割合
const PHASE_SLIDE = 0.9;      // 滑り台終了の割合
let isUserInteracting = false;
controls.addEventListener('start', () => isUserInteracting = true);
controls.addEventListener('end', () => isUserInteracting = false);

function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();
    controls.update();

    // 雲がゆっくり漂う
    clouds.forEach((cloud, i) => {
        cloud.rotation.y = elapsed * 0.015;
        cloud.position.y += Math.sin(elapsed * 0.15 + i) * 0.002;
    });

    // 波紋アニメーション
    rippleRings.forEach((ring, i) => {
        const t = (elapsed * 0.4 + i / rippleRings.length) % 1;
        const s = 0.3 + t * 3.2;
        ring.scale.set(s, s, s);
        ring.material.opacity = 0.55 * (1 - t);
    });

    ducks.forEach((duck, i) => {
        const time = (elapsed + i * (LAP_SEC / totalDucks)) % LAP_SEC;
        const p = time / LAP_SEC;
        const splash = duck.userData.splash;

        if (p < PHASE_STAIRS) {
            const sp = p / PHASE_STAIRS;
            duck.position.set(0, Math.floor(sp * stepCount) * (stairHeight / stepCount) + 0.8, 1.2);
            duck.rotation.set(0, Math.PI/2, 0);
            duck.rotation.z = Math.sin(elapsed * 9 + i) * 0.18; // よちよち歩き
            splash.group.visible = false;
        } else if (p < PHASE_SLIDE) {
            const slideP = (p - PHASE_STAIRS) / (PHASE_SLIDE - PHASE_STAIRS);
            duck.position.copy(slideCurve.getPointAt(slideP));
            duck.lookAt(slideCurve.getPointAt(Math.min(slideP + 0.005, 1)));
            duck.rotation.y += Math.PI;  // 進行方向に合わせて向きを反転
            duck.rotation.z = Math.sin(elapsed * 12 + i) * 0.12; // スリル感の揺れ
            splash.group.visible = false;
        } else {
            const trackP = (p - PHASE_SLIDE) / (1 - PHASE_SLIDE);
            duck.position.copy(trackCurve.getPointAt(trackP));
            duck.rotation.set(0, -Math.PI/2, 0);

            // 着水直後のジャンプとスプラッシュ
            if (trackP < 0.15) {
                const sp = trackP / 0.15;
                duck.position.y += Math.sin(sp * Math.PI) * 0.4;

                splash.group.visible = true;
                splash.group.position.set(0, 1.5, 8);
                splash.particles.forEach((pt, j) => {
                    const ang = (j / splash.particles.length) * Math.PI * 2 + i;
                    const r = sp * 1.3;
                    pt.position.set(Math.cos(ang) * r, sp * 0.9 * (1 - sp) + 0.1, Math.sin(ang) * r);
                    pt.material.opacity = 0.85 * (1 - sp);
                    pt.scale.setScalar(1 - sp * 0.5);
                });
            } else {
                splash.group.visible = false;
            }
        }

        // 羽ばたき
        const flap = Math.sin(elapsed * 7 + i) * 0.35;
        duck.userData.wings[0].rotation.x = flap;
        duck.userData.wings[1].rotation.x = -flap;
    });

    if (!isUserInteracting) {
        // 回転速度と周期
        const rotSpeed = elapsed * 0.2;
        const zoomSpeed = elapsed * 0.35;
        const pitchSpeed = elapsed * 0.5; // 上下角度の周期
        
        // ズーム範囲: 最大値を近づけた (7 ～ 45)
        const currentRadius = 26 + Math.sin(zoomSpeed) * 19; 
        
        // カメラ座標
        camera.position.x = Math.cos(rotSpeed) * currentRadius;
        camera.position.z = Math.sin(rotSpeed) * currentRadius;
        
        // 高さ(y)をよりランダムに振る
        // ズームイン/アウトと周期をずらすことで「常に上から」「常に下から」を防ぐ
        camera.position.y = 15 + Math.sin(pitchSpeed) * 12 + Math.cos(zoomSpeed * 0.7) * 5; 
        
        // 注視点も少し上下に動かしてダイナミックに
        camera.lookAt(0, 15 + Math.sin(elapsed * 0.2) * 5, 0);
    }

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
