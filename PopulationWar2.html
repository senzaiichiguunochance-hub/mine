<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>世界人口サバイバル - 陸地優先・追走版</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; background: #000b14; }
        .panel { position: fixed; color: white; background: rgba(0,0,0,0.85); padding: 10px; border-radius: 8px; z-index: 1000; border: 1px solid #444; pointer-events: auto; }
        .top-left { top: 100px; left: 10px; width: 240px; font-size: 11px; }
        .bottom-right { bottom: 10px; right: 10px; width: 160px; height: 30vh; display: flex; flex-direction: column; border: 1px solid #555; }
        #announcer { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff4444; text-align: center; z-index: 2000; pointer-events: none; width: 90%; }
        .msg-pop { font-size: 1.8rem; font-weight: bold; opacity: 0; animation: fadeOutMsg 2.5s forwards; text-shadow: 0 0 15px rgba(255,0,0,0.8); margin-bottom: 10px; }
        .sd-pop { color: #ffcc00; font-size: 2.5rem; text-shadow: 0 0 20px #ff0000; }
        .win-pop { font-size: 4rem; color: #fff; font-weight: 900; background: rgba(0,0,0,0.9); padding: 40px; border: 10px double gold; animation: winAnim 1s ease-out; }
        @keyframes fadeOutMsg { 0% { opacity: 0; transform: scale(0.5); } 15% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: translateY(-100px); } }
        @keyframes winAnim { 0% { transform: scale(0); rotate: 720deg; } 100% { transform: scale(1); rotate: 0deg; } }
        .ranking-list { flex-grow: 1; overflow-y: auto; font-size: 10px; border-top: 1px solid #555; }
        .ranking-item { display: flex; justify-content: space-between; padding: 2px 5px; white-space: nowrap; }
        input[type="range"] { width: 100%; margin: 4px 0; }
    </style>

    <!-- GoatCounter (file:/// 環境での警告・通信エラー回避策) -->
    <script>
        if (location.protocol !== 'file:') {
            var s = document.createElement('script');
            s.async = true;
            s.dataset.goatcounter = "https://senzaiichiguunochance.goatcounter.com/count";
            s.src = "https://gc.zgo.at/count.js";
            document.head.appendChild(s);
        }
    </script>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

<div id="announcer"></div>
<div class="panel top-left">
    <label>速度: <span id="speed-val">1.0</span>x</label>
    <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1">
    <label>サドンデス開始残数: <span id="sd-threshold-val">500</span></label>
    <input type="range" id="sd-slider" min="10" max="10000" step="10" value="500">
    <label>遠征頻度: <span id="ex-val">0.50</span>%</label>
    <input type="range" id="ex-slider" min="0" max="100" step="0.01" value="0.5">
    <div style="margin-top:8px; border-top: 1px solid #444; padding-top: 5px;">生存ドット数: <b id="total-count">-</b></div>
</div>
<div class="panel bottom-right"><div class="ranking-list" id="ranking-list"></div></div>
<div id="map"></div>

<script>
let map, dots = [], geoDataStore = [];
let currentSpeed = 1.0, sdThreshold = 500, exRate = 0.005;
let isSuddenDeath = false, isGameOver = false;
let activeNames = new Set();
const COLLISION_DIST = 1.0;

// 通信エラー（fetch拒否）を防ぐための内蔵国データ（名前・人口・バウンディングボックス）
const PRESET_COUNTRIES = [
    { name: "中国", pop: 1411000000, bounds: [18, 53, 73, 135] },
    { name: "インド", pop: 1380000000, bounds: [8, 35, 68, 97] },
    { name: "アメリカ", pop: 331000000, bounds: [25, 49, -124, -66] },
    { name: "インドネシア", pop: 273000000, bounds: [-10, 6, 95, 141] },
    { name: "パキスタン", pop: 220000000, bounds: [24, 37, 61, 75] },
    { name: "ブラジル", pop: 212000000, bounds: [-33, 5, -73, -34] },
    { name: "ナイジェリア", pop: 206000000, bounds: [4, 14, 2, 14] },
    { name: "バングラデシュ", pop: 165000000, bounds: [20, 27, 88, 92] },
    { name: "ロシア", pop: 144000000, bounds: [50, 70, 30, 170] },
    { name: "メキシコ", pop: 128000000, bounds: [14, 32, -118, -86] },
    { name: "日本", pop: 125000000, bounds: [30, 45, 130, 145] },
    { name: "ドイツ", pop: 83000000, bounds: [47, 55, 5, 15] },
    { name: "イギリス", pop: 67000000, bounds: [50, 59, -8, 2] },
    { name: "フランス", pop: 65000000, bounds: [42, 51, -5, 8] },
    { name: "オーストラリア", pop: 25000000, bounds: [-43, -10, 113, 153] }
];

function isInside(pt, poly) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        if (((poly[i].lat <= pt.lat && pt.lat < poly[j].lat) || (poly[j].lat <= pt.lat && pt.lat < poly[i].lat)) &&
            (pt.lng < (poly[j].lng - poly[i].lng) * (pt.lat - poly[i].lat) / (poly[j].lat - poly[i].lat) + poly[i].lng)) c = !c;
    }
    return c;
}

function checkLandStrict(lat, lng) {
    for (let i = 0; i < geoDataStore.length; i++) {
        const c = geoDataStore[i];
        if (lat >= c.b[0] && lat <= c.b[1] && lng >= c.b[2] && lng <= c.b[3]) {
            return true;
        }
    }
    return false;
}

function showMsg(text, className = "") {
    const m = document.createElement('div');
    m.className = 'msg-pop ' + className;
    m.innerText = text;
    document.getElementById('announcer').appendChild(m);
    setTimeout(() => m.remove(), 3000);
}

function init() {
    map = L.map('map', { worldCopyJump: true, preferCanvas: true }).setView([20, 0], 2);

    // API KEY不要な Esri Dark タイルに置き換え
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16,
        attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    PRESET_COUNTRIES.forEach((info, index) => {
        const minLat = info.bounds[0], maxLat = info.bounds[1], minLng = info.bounds[2], maxLng = info.bounds[3];
        const center = { lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2 };
        const color = `hsl(${(index * 137.5) % 360}, 80%, 60%)`;

        const entry = {
            name: info.name,
            b: [minLat, maxLat, minLng, maxLng],
            center: center,
            color: color
        };
        geoDataStore.push(entry);

        // 枠線を描画
        L.rectangle([[minLat, minLng], [maxLat, maxLng]], {
            fillColor: color,
            fillOpacity: 0.08,
            color: color,
            weight: 1,
            opacity: 0.3
        }).addTo(map);

        const num = Math.floor(info.pop / 10000000); // 各国 1000万人 = 1ドット
        const now = Date.now();

        for (let i = 0; i < num; i++) {
            let lat = minLat + Math.random() * (maxLat - minLat);
            let lng = minLng + Math.random() * (maxLng - minLng);

            const circle = L.circleMarker([lat, lng], {
                radius: 2.2,
                fillColor: entry.color,
                color: '#fff',
                weight: 0.3,
                fillOpacity: 0.9,
                interactive: false
            }).addTo(map);

            dots.push({
                el: circle, lat, lng, color: entry.color, name: info.name,
                vx: 0, vy: 0, active: true, ex: false, lastLandTime: now, lastCheckPos: {lat:0, lng:0}
            });
        }
        activeNames.add(info.name);
    });

    document.getElementById('speed-slider').oninput = (e) => { currentSpeed = parseFloat(e.target.value); document.getElementById('speed-val').innerText = currentSpeed.toFixed(1); };
    document.getElementById('sd-slider').oninput = (e) => { sdThreshold = parseInt(e.target.value); document.getElementById('sd-threshold-val').innerText = sdThreshold; };
    document.getElementById('ex-slider').oninput = (e) => { exRate = parseFloat(e.target.value) * 0.005; document.getElementById('ex-val').innerText = parseFloat(e.target.value).toFixed(2); };

    requestAnimationFrame(update);
}

function update() {
    if (isGameOver) return;
    const now = Date.now(), alive = dots.filter(d => d.active);
    const stats = {}; alive.forEach(d => stats[d.name] = (stats[d.name] || 0) + 1);
    const ranking = Object.entries(stats).sort((a,b) => b[1] - a[1]);
    const maxPop = ranking.length > 0 ? ranking[0][1] : 0;
    const topTierNames = new Set(ranking.filter(r => r[1] === maxPop).map(r => r[0]));

    if (ranking.length === 1 && alive.length > 0) {
        isGameOver = true;
        document.getElementById('announcer').innerHTML = `<div class="win-pop">👑 覇者 👑<br>${ranking[0][0]}</div>`;
        return;
    }

    if (alive.length < sdThreshold && !isSuddenDeath) { 
        isSuddenDeath = true; 
        showMsg("🔥 SUDDEN DEATH 🔥", "sd-pop"); 
    }

    const grid = {}; alive.forEach(d => { const k = `${Math.floor(d.lng/5)},${Math.floor(d.lat/5)}`; if(!grid[k]) grid[k]=[]; grid[k].push(d); });

    alive.forEach(dot => {
        if (!dot.active) return;
        
        if (!dot.nextCheck || now > dot.nextCheck) {
            if (checkLandStrict(dot.lat, dot.lng)) { dot.lastLandTime = now; }
            else if (now - dot.lastLandTime > 5000) { dot.active = false; map.removeLayer(dot.el); return; }
            if (Math.abs(dot.lat - dot.lastCheckPos.lat) < 0.01 && Math.abs(dot.lng - dot.lastCheckPos.lng) < 0.01) {
                dot.active = false; map.removeLayer(dot.el); return; 
            }
            dot.lastCheckPos = {lat: dot.lat, lng: dot.lng};
            dot.nextCheck = now + 1000;
        }

        let nvx = dot.vx, nvy = dot.vy;
        let isSeeking = false;

        if (isSuddenDeath) {
            let minDist = 999, target = null;
            for(let x=-2; x<=2; x++) {
                for(let y=-2; y<=2; y++) {
                    const k = `${Math.floor(dot.lng/5)+x},${Math.floor(dot.lat/5)+y}`;
                    (grid[k]||[]).forEach(other => {
                        if (other.name !== dot.name) {
                            const d = Math.abs(dot.lat - other.lat) + Math.abs(dot.lng - other.lng);
                            if (d < minDist) { minDist = d; target = other; }
                        }
                    });
                }
            }
            if (target) {
                nvx = (target.lng > dot.lng ? 4.5 : -4.5);
                nvy = (target.lat > dot.lat ? 4.5 : -4.5);
                isSeeking = true;
            }
        }

        if (!isSeeking) {
            if (!dot.ex && Math.random() < exRate * 0.1) {
                dot.ex = true; const t = geoDataStore[Math.floor(Math.random()*geoDataStore.length)];
                dot.tx = t.center.lng; dot.ty = t.center.lat;
            }
            if (dot.ex) {
                nvx = (dot.tx > dot.lng ? 4 : -4); nvy = (dot.ty > dot.lat ? 4 : -4);
                if (checkLandStrict(dot.lat, dot.lng) && Math.random() < 0.05) dot.ex = false;
            } else {
                nvx = (nvx * 0.9) + (Math.random() - 0.5) * 2.5;
                nvy = (nvy * 0.9) + (Math.random() - 0.5) * 2.5;
            }
        }

        if (dot.lat > 75) nvy -= 2.5; if (dot.lat < -75) nvy += 2.5;

        const moveMult = currentSpeed * 0.08 * (isSuddenDeath ? 2.5 : 1.0);
        let moveX = nvx * moveMult, moveY = nvy * moveMult;

        if (!dot.ex) {
            if (checkLandStrict(dot.lat + moveY, dot.lng + moveX)) {
                dot.lat += moveY; dot.lng += moveX; dot.vx = nvx; dot.vy = nvy;
            } else {
                dot.vx = -nvx * 1.5; dot.vy = -nvy * 1.5;
                if (isSuddenDeath && Math.random() < 0.02) { 
                    dot.lat += moveY; dot.lng += moveX; 
                }
            }
        } else {
            dot.lat += moveY; dot.lng += moveX;
        }

        if (dot.lng > 180) dot.lng = -180; else if (dot.lng < -180) dot.lng = 180;
        if (dot.lat > 85) dot.lat = 85; if (dot.lat < -85) dot.lat = -85;
        dot.el.setLatLng([dot.lat, dot.lng]);
    });

    alive.forEach(dot => {
        if(!dot.active) return;
        const k = `${Math.floor(dot.lng/5)},${Math.floor(dot.lat/5)}`;
        (grid[k]||[]).forEach(other => {
            if (dot === other || !other.active || dot.name === other.name) return;
            if (Math.abs(dot.lat - other.lat) < COLLISION_DIST && Math.abs(dot.lng - other.lng) < COLLISION_DIST) {
                const isDotTop = topTierNames.has(dot.name);
                const isOtherTop = topTierNames.has(other.name);
                let winProb = 0.5;
                if (isOtherTop && !isDotTop) winProb = 0.98;
                else if (isDotTop && !isOtherTop) winProb = 0.02;
                if (Math.random() < winProb) { other.active = false; map.removeLayer(other.el); }
                else { dot.active = false; map.removeLayer(dot.el); }
            }
        });
    });

    const currentNames = new Set(ranking.map(e => e[0]));
    activeNames.forEach(name => { if (!currentNames.has(name)) { showMsg(`${name} 消滅`); activeNames.delete(name); } });
    document.getElementById('total-count').innerText = alive.length.toLocaleString();
    document.getElementById('ranking-list').innerHTML = ranking.map(([n, c], i) => `<div class="ranking-item" style="${topTierNames.has(n)?'color:red;font-weight:bold;':''}"><span>${i+1}.${n.slice(0,8)}</span><b>${c}</b></div>`).join('');
    requestAnimationFrame(update);
}

window.onload = init;
</script>
</body>
</html>
