<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素記号学習マスター</title>
    <style>
        :root {
            --primary-color: #00d4ff;
            --secondary-color: #0056b3;
            --bg-color: #0a0e14;
            --bg-gradient: radial-gradient(circle at 50% 50%, #1a2332 0%, #0a0e14 100%);
            --card-bg: #161b22;
            --text-color: #e6edf3;
            --correct-color: #00ff88;
            --wrong-color: #ff4d4d;
            --neon-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            --btn-text: #fff;
        }

        .theme-cute {
            --primary-color: #ff6b8b;
            --secondary-color: #ffafbd;
            --bg-color: #fff0f3;
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffc1cc 100%);
            --card-bg: #ffffff;
            --text-color: #5c4044;
            --correct-color: #ff4757;
            --wrong-color: #ffa502;
            --neon-shadow: 0 0 10px rgba(255, 107, 139, 0.3);
            --btn-text: #fff;
        }

        .theme-beautiful {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --bg-color: #f8f9fa;
            --bg-gradient: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --correct-color: #00b894;
            --wrong-color: #d63031;
            --neon-shadow: 0 0 10px rgba(108, 92, 231, 0.2);
            --btn-text: #fff;
        }

        .theme-stylish {
            --primary-color: #e1b12c;
            --secondary-color: #fbc531;
            --bg-color: #1e272e;
            --bg-gradient: radial-gradient(circle at 50% 50%, #2f3640 0%, #1e272e 100%);
            --card-bg: #2f3542;
            --text-color: #f5f6fa;
            --correct-color: #4cd137;
            --wrong-color: #e84118;
            --neon-shadow: 0 0 10px rgba(225, 177, 44, 0.5);
            --btn-text: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        .back-link {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.9rem;
            color: var(--text-color);
            text-decoration: none;
            background: rgba(128, 128, 128, 0.1);
            border: 1px solid var(--primary-color);
            padding: 6px 12px;
            border-radius: 4px;
            z-index: 1000;
            font-weight: bold;
            transition: background 0.3s;
        }

        .back-link:hover {
            background: rgba(128, 128, 128, 0.2);
        }

        header {
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
            color: var(--btn-text);
            width: 100%;
            padding: 0.8rem 0;
            text-align: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
            border-bottom: 2px solid var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        main {
            width: 98%;
            max-width: 1000px;
            margin: 0.5rem auto;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid var(--primary-color);
            position: relative;
        }

        .menu-screen, .game-screen, .result-screen, .stats-screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .active {
            display: flex;
        }

        h2 {
            color: var(--primary-color);
            text-shadow: 0 0 5px var(--neon-shadow);
            margin-bottom: 0.8rem;
            text-align: center;
            font-size: 1.4rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: var(--btn-text);
            border: 1px solid var(--primary-color);
            padding: 0.8rem 1.2rem;
            margin: 0.3rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--primary-color);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            border-radius: 8px;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4d4d, #c0392b);
            border-color: #ff4d4d;
        }

        #question-text {
            font-size: 2.8rem;
            margin: 0.5rem 0;
            font-weight: 900;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--neon-shadow);
            animation: pulse 2s infinite;
            text-align: center;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .choices-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 0.8rem;
        }

        .periodic-table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0.2rem 0;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            background: rgba(128, 128, 128, 0.05);
            position: relative; /* 前面判定表示の基準位置 */
        }

        /* 周期表前面オーバーレイ */
        .periodic-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-weight: 900;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .overlay-correct {
            color: var(--correct-color);
            text-shadow: 0 0 20px var(--correct-color), 0 0 40px var(--correct-color);
        }
        .overlay-wrong {
            color: var(--wrong-color);
            text-shadow: 0 0 20px var(--wrong-color), 0 0 40px var(--wrong-color);
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 1px;
            padding: 2px;
            min-width: 500px;
        }

        /* 周期表モードでスクロールなしにするためのクラス */
        .periodic-table-noflow {
            min-width: unset !important;
            width: 100% !important;
        }
        .periodic-table-noflow .element-cell {
            font-size: calc(0.4rem + 0.5vw) !important;
            padding: 0 !important;
        }
        .periodic-table-noflow .element-cell.target {
            font-size: calc(0.5rem + 0.7vw) !important;
        }

        .element-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.95rem;
            background: rgba(128, 128, 128, 0.1);
            border: 1px solid rgba(128, 128, 128, 0.1);
            color: var(--text-color);
            padding: 1px;
            font-weight: bold;
        }

        .element-cell.target {
            background: var(--primary-color);
            border: 1px solid #fff;
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 0 8px var(--primary-color);
            animation: flash 1s infinite alternate;
        }

        @keyframes flash {
            from { opacity: 1; }
            to { opacity: 0.7; }
        }

        .element-cell.empty {
            background: transparent;
            border: none;
        }

        .feedback {
            margin-top: 1.5rem;
            font-weight: 900;
            font-size: 1.8rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .correct-anim {
            color: var(--correct-color);
            text-shadow: 0 0 15px var(--correct-color);
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .wrong-anim {
            color: var(--wrong-color);
            text-shadow: 0 0 15px var(--wrong-color);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .stat-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid var(--primary-color);
            padding-bottom: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .timer-display {
            font-family: 'Segoe UI', Roboto, sans-serif;
            font-size: 1.5rem;
            padding: 6px 16px;
            border: 3px solid var(--primary-color);
            border-radius: 50px;
            color: #fff;
            background: var(--primary-color);
            font-weight: 900;
            box-shadow: 0 4px 15px var(--neon-shadow);
            min-width: 120px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .timer-warning {
            background: var(--wrong-color) !important;
            border-color: #fff !important;
            box-shadow: 0 0 20px var(--wrong-color) !important;
            animation: timer-pulse 0.5s infinite alternate !important;
        }

        @keyframes timer-pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 100%;
            margin-bottom: 1.5rem;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .setting-label {
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .setting-select {
            width: 100%;
            padding: 0.6rem;
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--primary-color);
            text-align-last: center;
            font-weight: bold;
        }

        .result-table-container {
            width: 100%;
            overflow-x: auto;
            margin: 1.5rem 0;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .result-table th, .result-table td {
            border: 1px solid var(--primary-color);
            padding: 8px 4px;
            text-align: center;
        }

        .result-table th {
            background: rgba(128, 128, 128, 0.1);
            color: var(--primary-color);
        }

        .row-correct { color: var(--correct-color); }
        .row-wrong { color: var(--wrong-color); }

        /* スマートフォン向け調整 */
        @media (max-width: 600px) {
            header h1 { font-size: 1.4rem; }
            main { padding: 1.2rem; margin: 1rem auto; width: 98%; }
            #question-text { font-size: 2.2rem; }
            .choices-container { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .btn { padding: 0.8rem 1rem; font-size: 1rem; margin: 0.3rem; }
            .stat-bar { font-size: 0.9rem; justify-content: center; }
            .back-link { top: 10px; right: 10px; padding: 4px 8px; font-size: 0.8rem; }
            h2 { font-size: 1.2rem; }
        }
    </style>
</head>

<header>
    <h1>元素記号学習マスター</h1>
</header>

<main>
    <div id="menu-screen" class="menu-screen active">
        <h2>学習設定</h2>
        
        <div class="settings-grid">
            <div class="setting-item">
                <label class="setting-label" for="range-select">学習範囲:</label>
                <select id="range-select" class="setting-select" onchange="saveSettings()">
                    <option value="1-20">中学生向け（HからCaまで）</option>
                    <option value="1-36">高校向け（HからKrまで）</option>
                    <option value="1-118">全部（HからOgまで）</option>
                    <option value="21-36">高校生向けのみ（ScからKrまで）</option>
                    <option value="37-118">高校生向けより後のみ（RbからOgまで）</option>
                </select>
            </div>
            <div class="setting-item">
                <label class="setting-label" for="time-limit-select">制限時間:</label>
                <select id="time-limit-select" class="setting-select" onchange="saveSettings()">
                    <option value="3">3秒</option>
                    <option value="5">5秒</option>
                    <option value="10">10秒</option>
                    <option value="20">20秒</option>
                    <option value="30" selected>30秒</option>
                    <option value="0">無制限</option>
                </select>
            </div>
            <div class="setting-item">
                <label class="setting-label" for="question-count-select">問題数:</label>
                <select id="question-count-select" class="setting-select" onchange="saveSettings()">
                    <option value="3">3問</option>
                    <option value="5">5問</option>
                    <option value="10" selected>10問</option>
                    <option value="20">20問</option>
                    <option value="999">全部</option>
                </select>
            </div>
            <div class="setting-item">
                <label class="setting-label" for="theme-select">カラーテーマ:</label>
                <select id="theme-select" class="setting-select" onchange="applyTheme(); saveSettings();">
                    <option value="cool">クール</option>
                    <option value="cute">かわいい</option>
                    <option value="beautiful">キレイ</option>
                    <option value="stylish">かっこいい</option>
                </select>
            </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; justify-content: center; width: 100%;">
            <button class="btn" onclick="startGame(1)">日本語 → 元素記号</button>
            <button class="btn" onclick="startGame(2)">元素記号 → 日本語</button>
            <button class="btn" onclick="startGame(3)">周期表 穴埋め</button>
        </div>

        <div style="margin-top: 1rem; display: flex; gap: 10px;">
            <button class="btn btn-small" onclick="showStats()">過去の成績を表示</button>
            <button class="btn btn-small btn-danger" onclick="clearStats()">成績クリア</button>
        </div>
    </div>

    <div id="game-screen" class="game-screen">
        <div class="stat-bar">
            <button class="btn btn-small" style="margin: 0;" onclick="showMenu()">中断して戻る</button>
            <div id="progress">問題 1 / 10</div>
            <div id="timer-display" class="timer-display">残り: --</div>
            <div id="score-display">正解: 0</div>
        </div>
        <div id="question-area" style="width: 100%; text-align: center;">
            <div id="question-label" style="color: var(--primary-color); font-weight: bold;"></div>
            <div id="question-text"></div>
            <div id="periodic-display" style="display: none;">
                <div class="periodic-table-wrapper" id="periodic-wrapper">
                    <div class="periodic-table" id="table-grid"></div>
                </div>
            </div>
        </div>
        <div class="choices-container" id="choices"></div>
        <div id="feedback" class="feedback"></div>
    </div>

    <div id="result-screen" class="result-screen">
        <h2>結果発表</h2>
        <div id="final-score" style="font-size: 1.5rem; margin: 1rem 0; color: var(--primary-color); font-weight: bold;"></div>
        <div id="result-detail" class="result-table-container"></div>
        <button class="btn" onclick="showMenu()">トップに戻る</button>
    </div>

    <div id="stats-screen" class="stats-screen">
        <h2>過去の成績</h2>
        <div id="stats-detail" class="result-table-container"></div>
        <button class="btn" onclick="showMenu()">トップに戻る</button>
    </div>
</main>

        {n: 86, s: "Rn", name: "ラドン", r: 6, c: 18}, {n: 87, s: "Fr", name: "フランシウム", r: 6, c: 1},
        {n: 88, s: "Ra", name: "ラジウム", r: 7, c: 2}, {n: 104, s: "Rf", name: "ラザホージウム", r: 7, c: 4},
        {n: 105, s: "Db", name: "ドブニウム", r: 7, c: 5}, {n: 106, s: "Sg", name: "シーボーギウム", r: 7, c: 6},
        {n: 107, s: "Bh", name: "ボーリウム", r: 7, c: 7}, {n: 108, s: "Hs", name: "ハッシウム", r: 7, c: 8},
        {n: 109, s: "Mt", name: "マイトネリウム", r: 7, c: 9}, {n: 110, s: "Ds", name: "ダームスタチウム", r: 7, c: 10},
        {n: 111, s: "Rg", name: "レントゲニウム", r: 7, c: 11}, {n: 112, s: "Cn", name: "コペルニシウム", r: 7, c: 12},
        {n: 113, s: "Nh", name: "ニホニウム", r: 7, c: 13}, {n: 114, s: "Fl", name: "フレロビウム", r: 7, c: 14},
        {n: 115, s: "Mc", name: "モスコビウム", r: 7, c: 15}, {n: 116, s: "Lv", name: "リバモリウム", r: 7, c: 16},
        {n: 117, s: "Ts", name: "テネシン", r: 7, c: 17}, {n: 118, s: "Og", name: "オガネソン", r: 7, c: 18}
    ];

    let currentMode = 0;
    let currentQuestionIndex = 0;
    let score = 0;
    let correctElement = null;
    let isAnswering = false;
    let quizHistory = [];
    let usedElementIndices = [];
    let questionLimit = 10;
    let timeLimit = 30;
    let timeLeft = 0;
    let timerInterval = null;
    let stats = {};

    // 初期化
    window.onload = () => {
        loadSettings();
        applyTheme();
        loadStats();
    };

    // 設定読み込み (古い互換性のためにフォーマットチェックを入れる)
    function loadSettings() {
        const savedRange = localStorage.getItem('genso-range');
        if (savedRange) {
            // 旧バージョンのセレクト値(20, 36, 118)が入っている場合の互換処理
            if (savedRange === "20") document.getElementById('range-select').value = "1-20";
            else if (savedRange === "36") document.getElementById('range-select').value = "1-36";
            else if (savedRange === "118") document.getElementById('range-select').value = "1-118";
            else document.getElementById('range-select').value = savedRange;
        }
        
        const savedTime = localStorage.getItem('genso-time-limit');
        if (savedTime) document.getElementById('time-limit-select').value = savedTime;
        
        const savedCount = localStorage.getItem('genso-question-count');
        if (savedCount) document.getElementById('question-count-select').value = savedCount;
        
        const savedTheme = localStorage.getItem('genso-theme');
        if (savedTheme) document.getElementById('theme-select').value = savedTheme;
    }

    // 設定保存
    function saveSettings() {
        localStorage.setItem('genso-range', document.getElementById('range-select').value);
        localStorage.setItem('genso-time-limit', document.getElementById('time-limit-select').value);
        localStorage.setItem('genso-question-count', document.getElementById('question-count-select').value);
        localStorage.setItem('genso-theme', document.getElementById('theme-select').value);
    }

    // テーマ適用
    function applyTheme() {
        const theme = document.getElementById('theme-select').value;
        document.body.className = `theme-${theme}`;
    }

    // 成績読み込み
    function loadStats() {
        const savedStats = localStorage.getItem('genso-stats');
        stats = savedStats ? JSON.parse(savedStats) : {};
    }

    // 成績保存
    function saveStats() {
        localStorage.setItem('genso-stats', JSON.stringify(stats));
    }

    // 成績クリア
    function clearStats() {
        if (confirm("全ての学習成績をクリアしますか？")) {
            stats = {};
            saveStats();
            alert("成績をクリアしました。");
        }
    }

    // メニュー表示
    function showMenu() {
        stopTimer();
        removePeriodicOverlay();
        document.getElementById('menu-screen').classList.add('active');
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('stats-screen').classList.remove('active');
    }

    // パース関数：範囲文字列(例 "21-36")から最小と最大を取得
    function getRangeMinMax() {
        const rangeVal = document.getElementById('range-select').value;
        const parts = rangeVal.split('-');
        return {
            min: parseInt(parts[0], 10),
            max: parseInt(parts[1], 10)
        };
    }

    // ゲーム開始
    function startGame(mode) {
        currentMode = mode;
        currentQuestionIndex = 0;
        score = 0;
        quizHistory = [];
        usedElementIndices = [];
        
        const bounds = getRangeMinMax();
        timeLimit = parseInt(document.getElementById('time-limit-select').value);
        questionLimit = parseInt(document.getElementById('question-count-select').value);
        
        const filteredElements = elements.filter(e => e.n >= bounds.min && e.n <= bounds.max);
        if (questionLimit > filteredElements.length) questionLimit = filteredElements.length;

        saveSettings();

        document.getElementById('menu-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        nextQuestion();
    }

    // 次の問題へ
    function nextQuestion() {
        stopTimer();
        removePeriodicOverlay();
        if (currentQuestionIndex >= questionLimit) {
            showResult();
            return;
        }

        isAnswering = true;
        document.getElementById('feedback').innerText = "";
        document.getElementById('feedback').className = "feedback";
        document.getElementById('progress').innerText = `問題 ${currentQuestionIndex + 1} / ${questionLimit}`;
        document.getElementById('score-display').innerText = `正解: ${score}`;

        const bounds = getRangeMinMax();
        const filteredElements = elements.filter(e => e.n >= bounds.min && e.n <= bounds.max);

        // 未使用の元素を選択
        let availableElements = filteredElements.filter((_, index) => !usedElementIndices.includes(index));
        if (availableElements.length === 0) {
            availableElements = filteredElements;
            usedElementIndices = [];
        }
        
        const targetElement = availableElements[Math.floor(Math.random() * availableElements.length)];
        correctElement = targetElement;
        usedElementIndices.push(filteredElements.indexOf(targetElement));
        
        // 選択肢の生成
        let choices = [correctElement];
        while (choices.length < 10 && choices.length < filteredElements.length) {
            let rand = filteredElements[Math.floor(Math.random() * filteredElements.length)];
            if (!choices.includes(rand)) choices.push(rand);
        }
        while (choices.length < 10) {
            let rand = elements[Math.floor(Math.random() * elements.length)];
            if (!choices.includes(rand)) choices.push(rand);
        }
        choices.sort(() => Math.random() - 0.5);

        // UI更新
        const qText = document.getElementById('question-text');
        const qLabel = document.getElementById('question-label');
        const periodicDisplay = document.getElementById('periodic-display');
        const choicesContainer = document.getElementById('choices');
        const tableGrid = document.getElementById('table-grid');

        periodicDisplay.style.display = "none";
        tableGrid.classList.remove('periodic-table-noflow'); // 初期化
        qText.style.display = "block";
        choicesContainer.innerHTML = "";

        if (currentMode === 1) { // 日本語 -> 記号
            qLabel.innerText = "この元素の記号は？";
            qText.innerText = correctElement.name;
            choices.forEach(el => createChoiceButton(el.s, el === correctElement));
        } else if (currentMode === 2) { // 記号 -> 日本語
            qLabel.innerText = "この元素の名前は？";
            qText.innerText = correctElement.s;
            choices.forEach(el => createChoiceButton(el.name, el === correctElement));
        } else if (currentMode === 3) { // 周期表
            qLabel.innerText = "";
            qText.style.display = "none";
            periodicDisplay.style.display = "block";
            tableGrid.classList.add('periodic-table-noflow'); // 横幅スクロールなしにするクラスを追加
            renderPeriodicTable(correctElement, bounds.min, bounds.max);
            choices.forEach(el => createChoiceButton(`${el.s} (${el.name})`, el === correctElement));
        }

        if (timeLimit > 0) {
            startTimer();
        } else {
            document.getElementById('timer-display').innerText = "残り: 無制限";
        }
    }

    // タイマー開始
    function startTimer() {
        timeLeft = timeLimit;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                stopTimer();
                handleAnswer(false, null, "時間切れ");
            }
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
    }

    function updateTimerDisplay() {
        const timerDisplay = document.getElementById('timer-display');
        timerDisplay.innerText = `残り: ${timeLeft}秒`;
        
        if (timeLeft <= 5) {
            timerDisplay.classList.add('timer-warning');
        } else {
            timerDisplay.classList.remove('timer-warning');
        }
    }

    // 選択肢ボタン作成
    function createChoiceButton(text, isCorrect) {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = text;
        btn.onclick = () => handleAnswer(isCorrect, btn, text);
        document.getElementById('choices').appendChild(btn);
    }

    // 前面のオーバーレイを削除する
    function removePeriodicOverlay() {
        const existingOverlay = document.getElementById('periodic-overlay');
        if (existingOverlay) {
            existingOverlay.remove();
        }
    }

    // 回答処理
    function handleAnswer(isCorrect, btn, userText) {
        if (!isAnswering) return;
        isAnswering = false;
        stopTimer();

        const feedback = document.getElementById('feedback');
        const correctAnswerText = currentMode === 1 ? correctElement.s : 
                                (currentMode === 2 ? correctElement.name : `${correctElement.s} (${correctElement.name})`);
        
        quizHistory.push({
            question: currentMode === 1 ? correctElement.name : (currentMode === 2 ? correctElement.s : "周期表穴埋め"),
            answer: userText,
            correct: correctAnswerText,
            isCorrect: isCorrect
        });

        // 成績更新
        updateStats(correctElement.n, isCorrect);

        // 「周期表 穴埋め」の場合のみ前面に結果表示を追加
        if (currentMode === 3) {
            const wrapper = document.getElementById('periodic-wrapper');
            removePeriodicOverlay(); // 安全のため既存のを削除

            const overlay = document.createElement('div');
            overlay.id = 'periodic-overlay';
            overlay.className = 'periodic-overlay ' + (isCorrect ? 'overlay-correct' : 'overlay-wrong');
            overlay.innerText = isCorrect ? '〇' : '×';
            wrapper.appendChild(overlay);

            // 1秒後にフェードアウトさせて消す
            setTimeout(() => {
                if (overlay) overlay.style.opacity = '0';
            }, 1000);
        }

        if (isCorrect) {
            score++;
            feedback.innerText = "正解！";
            feedback.className = "feedback correct-anim";
            if (btn) btn.style.boxShadow = "0 0 20px var(--correct-color)";
        } else {
            feedback.innerText = userText === "時間切れ" ? "時間切れ！" : `不正解... 正解は「${correctAnswerText}」`;
            feedback.className = "feedback wrong-anim";
            if (btn) btn.style.boxShadow = "0 0 20px var(--wrong-color)";
        }

        setTimeout(() => {
            currentQuestionIndex++;
            nextQuestion();
        }, 1800);
    }

    // 成績更新
    function updateStats(elementN, isCorrect) {
        if (!stats[currentMode]) stats[currentMode] = {};
        if (!stats[currentMode][elementN]) stats[currentMode][elementN] = { correct: 0, wrong: 0 };
        
        if (isCorrect) stats[currentMode][elementN].correct++;
        else stats[currentMode][elementN].wrong++;
        
        saveStats();
    }

    // 周期表の描画
    function renderPeriodicTable(target, rangeMin, rangeMax) {
        const grid = document.getElementById('table-grid');
        grid.innerHTML = "";
        
        for (let r = 1; r <= 7; r++) {
            for (let c = 1; c <= 18; c++) {
                const el = elements.find(e => e.r === r && e.c === c);
                const cell = document.createElement('div');
                
                if (el) {
                    cell.className = 'element-cell';
                    if (el === target) {
                        cell.innerText = "?";
                        cell.className += ' target';
                    } else {
                        cell.innerText = el.s;
                        // 選択された範囲外の元素は不透明度を下げる
                        if (el.n < rangeMin || el.n > rangeMax) cell.style.opacity = "0.2";
                    }
                } else {
                    cell.className = 'element-cell empty';
                }
                grid.appendChild(cell);
            }
        }
    }

    // 結果表示
    function showResult() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('final-score').innerText = `正解数: ${score} / ${questionLimit}`;

        const detailArea = document.getElementById('result-detail');
        detailArea.innerHTML = "";

        let tableHtml = `<table class="result-table">
            <thead>
                <tr>
                    <th>問題</th>
                    <th>回答</th>
                    <th>正解</th>
                    <th>判定</th>
                </tr>
            </thead>
            <tbody>`;
        
        quizHistory.forEach(item => {
            tableHtml += `
                <tr class="${item.isCorrect ? 'row-correct' : 'row-wrong'}">
                    <td>${item.question}</td>
                    <td>${item.answer}</td>
                    <td>${item.correct}</td>
                    <td>${item.isCorrect ? '〇' : '×'}</td>
                </tr>`;
        });
        tableHtml += `</tbody></table>`;
        detailArea.innerHTML = tableHtml;
    }

    // 成績表示
    function showStats() {
        document.getElementById('menu-screen').classList.remove('active');
        document.getElementById('stats-screen').classList.add('active');
        
        const detailArea = document.getElementById('stats-detail');
        detailArea.innerHTML = "";

        const modeNames = {
            1: "日本語 → 元素記号",
            2: "元素記号 → 日本語",
            3: "周期表 穴埋め"
        };

        let hasAnyData = false;
        let finalHtml = "";

        [1, 2, 3].forEach(modeId => {
            const modeStats = stats[modeId];
            if (!modeStats) return;

            let flatStats = [];
            for (let n in modeStats) {
                const el = elements.find(e => e.n == n);
                if (!el) continue;
                const s = modeStats[n];
                const total = s.correct + s.wrong;
                const errorRate = total > 0 ? (s.wrong / total) : 0;
                flatStats.push({
                    symbol: el.s,
                    name: el.name,
                    correct: s.correct,
                    wrong: s.wrong,
                    total: total,
                    errorRate: errorRate
                });
            }

            if (flatStats.length === 0) return;
            hasAnyData = true;

            // ソート: 誤り率 降順 -> 元素記号 昇順
            flatStats.sort((a, b) => {
                if (b.errorRate !== a.errorRate) return b.errorRate - a.errorRate;
                return a.symbol.localeCompare(b.symbol);
            });

            finalHtml += `<h3 style="color: var(--primary-color); margin-top: 1.5rem; border-left: 4px solid var(--primary-color); padding-left: 10px; width: 100%; text-align: left;">${modeNames[modeId]}</h3>`;
            finalHtml += `<table class="result-table">
                <thead>
                    <tr>
                        <th style="width: 40%;">元素</th>
                        <th>正解</th>
                        <th>誤り</th>
                        <th>率</th>
                    </tr>
                </thead>
                <tbody>`;
            
            flatStats.forEach(item => {
                const accuracy = item.total > 0 ? Math.round((item.correct / item.total) * 100) : 0;
                finalHtml += `
                    <tr>
                        <td style="text-align:left; padding-left: 8px;">${item.symbol} (${item.name})</td>
                        <td>${item.correct}</td>
                        <td>${item.wrong}</td>
                        <td>${accuracy}%</td>
                    </tr>`;
            });
            finalHtml += `</tbody></table>`;
        });

        if (!hasAnyData) {
            detailArea.innerHTML = "<p style='text-align:center;'>データがありません。問題を解くとここに表示されます。</p>";
        } else {
            detailArea.innerHTML = finalHtml;
        }
    }
</script>

</body>
</html>
