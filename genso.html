<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素記号学習マスター</title>
    <style>
        :root {
            --primary-color: #00d4ff;
            --secondary-color: #0056b3;
            --bg-color: #0a0e14;
            --card-bg: #161b22;
            --text-color: #e6edf3;
            --correct-color: #00ff88;
            --wrong-color: #ff4d4d;
            --neon-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a2332 0%, #0a0e14 100%);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(90deg, #001529, #003366);
            color: var(--primary-color);
            width: 100%;
            padding: 1.5rem 0;
            text-align: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.5);
            border-bottom: 2px solid var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--primary-color);
        }

        main {
            width: 95%;
            max-width: 1000px;
            margin: 2rem auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            border: 1px solid rgba(0, 212, 255, 0.2);
            position: relative;
        }

        .menu-screen, .game-screen, .result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .active {
            display: flex;
        }

        h2 {
            color: var(--primary-color);
            text-shadow: 0 0 5px var(--primary-color);
            margin-bottom: 2rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--secondary-color), #001a33);
            color: white;
            border: 1px solid var(--primary-color);
            padding: 1rem 2rem;
            margin: 0.8rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 20px var(--primary-color);
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #000;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #question-text {
            font-size: 3rem;
            margin: 1.5rem 0;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px var(--primary-color), 0 0 30px var(--primary-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .choices-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 100%;
            margin-top: 2rem;
        }

        @media (max-width: 800px) {
            .choices-container { grid-template-columns: repeat(2, 1fr); }
            #question-text { font-size: 2rem; }
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 3px;
            margin: 20px 0;
            background: rgba(0, 212, 255, 0.1);
            padding: 5px;
            border-radius: 8px;
            overflow-x: auto;
            width: 100%;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .element-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            background: #1c252e;
            border: 1px solid #2d3b48;
            color: #8b9eb0;
            transition: all 0.2s;
        }

        .element-cell.target {
            background: var(--primary-color);
            border: 2px solid #fff;
            font-weight: bold;
            font-size: 1.5rem;
            color: #000;
            box-shadow: 0 0 15px var(--primary-color);
            animation: flash 1s infinite alternate;
        }

        @keyframes flash {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.6; transform: scale(1.1); }
        }

        .element-cell.empty {
            background: transparent;
            border: none;
        }

        .feedback {
            margin-top: 2rem;
            font-weight: 900;
            font-size: 2rem;
            height: 3rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .correct-anim {
            color: var(--correct-color);
            text-shadow: 0 0 20px var(--correct-color);
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .wrong-anim {
            color: var(--wrong-color);
            text-shadow: 0 0 20px var(--wrong-color);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .stat-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
            padding-bottom: 0.5rem;
            align-items: center;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .result-table th, .result-table td {
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 8px;
            text-align: center;
        }

        .result-table th {
            background: rgba(0, 212, 255, 0.1);
            color: var(--primary-color);
        }

        .row-correct { color: var(--correct-color); }
        .row-wrong { color: var(--wrong-color); }
    </style>
</head>
<body>
    <a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #ffffff; text-decoration: none; background: #222222; border: 1px solid #555555; padding: 6px 12px; z-index: 1000; font-weight: bold;">メニューに戻る</a>


<header>
    <h1>元素記号学習マスター</h1>
</header>

<main>
    <!-- メニュー画面 -->
    <div id="menu-screen" class="menu-screen active">
        <h2>学習モードを選んでください</h2>
        
        <div style="margin-bottom: 2rem; display: flex; flex-direction: column; align-items: center;">
            <label for="range-select" style="margin-bottom: 0.5rem; color: var(--primary-color); font-weight: bold;">学習範囲:</label>
            <select id="range-select" class="btn" style="border-radius: 8px; padding: 0.5rem 1rem; width: 250px; background: #161b22; text-align-last: center;">
                <option value="20">中学生向け (Caまで)</option>
                <option value="36">高校生向け (Krまで)</option>
                <option value="118">全部 (最後まで)</option>
            </select>
        </div>

        <button class="btn" onclick="startGame(1)">日本語 → 元素記号</button>
        <button class="btn" onclick="startGame(2)">元素記号 → 日本語</button>
        <button class="btn" onclick="startGame(3)">周期表 穴埋め</button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="game-screen">
        <div class="stat-bar">
            <button class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; margin: 0;" onclick="showMenu()">中止して戻る</button>
            <div id="progress">問題 1 / 10</div>
            <div id="score-display">正解数: 0</div>
        </div>
        <div id="question-area">
            <div id="question-label">これの元素記号は何？</div>
            <div id="question-text">水素</div>
            <div id="periodic-display" style="display: none;">
                <div class="periodic-table" id="table-grid"></div>
            </div>
        </div>
        <div class="choices-container" id="choices"></div>
        <div id="feedback" class="feedback"></div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="result-screen">
        <h2>結果発表</h2>
        <div id="final-score" style="font-size: 1.5rem; margin: 1rem 0;"></div>
        <div id="result-detail" style="width: 100%; overflow-x: auto;"></div>
        <button class="btn" onclick="showMenu()">トップに戻る</button>
    </div>
</main>

<script>
    const elements = [
        {n: 1, s: "H", name: "水素", r: 1, c: 1}, {n: 2, s: "He", name: "ヘリウム", r: 1, c: 18},
        {n: 3, s: "Li", name: "リチウム", r: 2, c: 1}, {n: 4, s: "Be", name: "ベリリウム", r: 2, c: 2},
        {n: 5, s: "B", name: "ホウ素", r: 2, c: 13}, {n: 6, s: "C", name: "炭素", r: 2, c: 14},
        {n: 7, s: "N", name: "窒素", r: 2, c: 15}, {n: 8, s: "O", name: "酸素", r: 2, c: 16},
        {n: 9, s: "F", name: "フッ素", r: 2, c: 17}, {n: 10, s: "Ne", name: "ネオン", r: 2, c: 18},

        {n: 13, s: "Al", name: "アルミニウム", r: 3, c: 13}, {n: 14, s: "Si", name: "ケイ素", r: 3, c: 14},
        {n: 15, s: "P", name: "リン", r: 3, c: 15}, {n: 16, s: "S", name: "硫黄", r: 3, c: 16},
        {n: 17, s: "Cl", name: "塩素", r: 3, c: 17}, {n: 18, s: "Ar", name: "アルゴン", r: 3, c: 18},
        {n: 19, s: "K", name: "カリウム", r: 4, c: 1}, {n: 20, s: "Ca", name: "カルシウム", r: 4, c: 2},
        {n: 21, s: "Sc", name: "スカンジウム", r: 4, c: 3}, {n: 22, s: "Ti", name: "チタン", r: 4, c: 4},
        {n: 23, s: "V", name: "バナジウム", r: 4, c: 5}, {n: 24, s: "Cr", name: "クロム", r: 4, c: 6},
        {n: 25, s: "Mn", name: "マンガン", r: 4, c: 7}, {n: 26, s: "Fe", name: "鉄", r: 4, c: 8},
        {n: 27, s: "Co", name: "コバルト", r: 4, c: 9}, {n: 28, s: "Ni", name: "ニッケル", r: 4, c: 10},
        {n: 29, s: "Cu", name: "銅", r: 4, c: 11}, {n: 30, s: "Zn", name: "亜鉛", r: 4, c: 12},
        {n: 31, s: "Ga", name: "ガリウム", r: 4, c: 13}, {n: 32, s: "Ge", name: "ゲルマニウム", r: 4, c: 14},
        {n: 33, s: "As", name: "ヒ素", r: 4, c: 15}, {n: 34, s: "Se", name: "セレン", r: 4, c: 16},
        {n: 35, s: "Br", name: "臭素", r: 4, c: 17}, {n: 36, s: "Kr", name: "クリプトン", r: 4, c: 18},
        {n: 37, s: "Rb", name: "ルビジウム", r: 5, c: 1}, {n: 38, s: "Sr", name: "ストロンチウム", r: 5, c: 2},
        {n: 39, s: "Y", name: "イットリウム", r: 5, c: 3}, {n: 40, s: "Zr", name: "ジルコニウム", r: 5, c: 4},
        {n: 41, s: "Nb", name: "ニオブ", r: 5, c: 5}, {n: 42, s: "Mo", name: "モリブデン", r: 5, c: 6},
        {n: 43, s: "Tc", name: "テクネチウム", r: 5, c: 7}, {n: 44, s: "Ru", name: "ルテニウム", r: 5, c: 8},
        {n: 45, s: "Rh", name: "ロジウム", r: 5, c: 9}, {n: 46, s: "Pd", name: "パラジウム", r: 5, c: 10},
        {n: 47, s: "Ag", name: "銀", r: 5, c: 11}, {n: 48, s: "Cd", name: "カドミウム", r: 5, c: 12},
        {n: 49, s: "In", name: "インジウム", r: 5, c: 13}, {n: 50, s: "Sn", name: "スズ", r: 5, c: 14},
        {n: 51, s: "Sb", name: "アンチモン", r: 5, c: 15}, {n: 52, s: "Te", name: "テルル", r: 5, c: 16},
        {n: 53, s: "I", name: "ヨウ素", r: 5, c: 17}, {n: 54, s: "Xe", name: "キセノン", r: 5, c: 18},
        {n: 55, s: "Cs", name: "セシウム", r: 6, c: 1}, {n: 56, s: "Ba", name: "バリウム", r: 6, c: 2},
        {n: 72, s: "Hf", name: "ハフニウム", r: 6, c: 4}, {n: 73, s: "Ta", name: "タンタル", r: 6, c: 5},
        {n: 74, s: "W", name: "タングステン", r: 6, c: 6}, {n: 75, s: "Re", name: "レニウム", r: 6, c: 7},
        {n: 76, s: "Os", name: "オスミウム", r: 6, c: 8}, {n: 77, s: "Ir", name: "イリジウム", r: 6, c: 9},
        {n: 78, s: "Pt", name: "白金", r: 6, c: 10}, {n: 79, s: "Au", name: "金", r: 6, c: 11},
        {n: 80, s: "Hg", name: "水銀", r: 6, c: 12}, {n: 81, s: "Tl", name: "タリウム", r: 6, c: 13},
        {n: 82, s: "Pb", name: "鉛", r: 6, c: 14}, {n: 83, s: "Bi", name: "ビスマス", r: 6, c: 15},
        {n: 84, s: "Po", name: "ポロニウム", r: 6, c: 16}, {n: 85, s: "At", name: "アスタチン", r: 6, c: 17},
        {n: 86, s: "Rn", name: "ラドン", r: 6, c: 18}, {n: 87, s: "Fr", name: "フランシウム", r: 6, c: 1},
        {n: 88, s: "Ra", name: "ラジウム", r: 7, c: 2}, {n: 104, s: "Rf", name: "ラザホージウム", r: 7, c: 4},
        {n: 105, s: "Db", name: "ドブニウム", r: 7, c: 5}, {n: 106, s: "Sg", name: "シーボーギウム", r: 7, c: 6},
        {n: 107, s: "Bh", name: "ボーリウム", r: 7, c: 7}, {n: 108, s: "Hs", name: "ハッシウム", r: 7, c: 8},
        {n: 109, s: "Mt", name: "マイトネリウム", r: 7, c: 9}, {n: 110, s: "Ds", name: "ダームスタチウム", r: 7, c: 10},
        {n: 111, s: "Rg", name: "レントゲニウム", r: 7, c: 11}, {n: 112, s: "Cn", name: "コペルニシウム", r: 7, c: 12},
        {n: 113, s: "Nh", name: "ニホニウム", r: 7, c: 13}, {n: 114, s: "Fl", name: "フレロビウム", r: 7, c: 14},
        {n: 115, s: "Mc", name: "モスコビウム", r: 7, c: 15}, {n: 116, s: "Lv", name: "リバモリウム", r: 7, c: 16},
        {n: 117, s: "Ts", name: "テネシン", r: 7, c: 17}, {n: 118, s: "Og", name: "オガネソン", r: 7, c: 18}
    ];

    let currentMode = 0;
    let currentQuestionIndex = 0;
    let score = 0;
    let correctElement = null;
    let isAnswering = false;
    let quizHistory = [];
    let usedElementIndices = [];

    // 設定の読み込み
    window.onload = () => {
        const savedRange = localStorage.getItem('genso-range');
        if (savedRange) {
            document.getElementById('range-select').value = savedRange;
        }
    };

    function showMenu() {
        document.getElementById('menu-screen').classList.add('active');
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-screen').classList.remove('active');
    }

    function startGame(mode) {
        currentMode = mode;
        currentQuestionIndex = 0;
        score = 0;
        quizHistory = [];
        usedElementIndices = [];
        
        // 範囲の設定保存
        const rangeLimit = parseInt(document.getElementById('range-select').value);
        localStorage.setItem('genso-range', rangeLimit);

        document.getElementById('menu-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        nextQuestion();
    }

    function nextQuestion() {
        if (currentQuestionIndex >= 10) {
            showResult();
            return;
        }

        isAnswering = true;
        document.getElementById('feedback').innerText = "";
        document.getElementById('feedback').className = "feedback";
        document.getElementById('progress').innerText = `問題 ${currentQuestionIndex + 1} / 10`;
        document.getElementById('score-display').innerText = `正解数: ${score}`;

        const rangeLimit = parseInt(document.getElementById('range-select').value);
        const filteredElements = elements.filter(e => e.n <= rangeLimit);

        // 重複しないように元素を選択
        let availableElements = filteredElements.filter((_, index) => !usedElementIndices.includes(index));
        if (availableElements.length === 0) {
            availableElements = filteredElements; // 範囲内の全元素を使い切った場合はリセット
            usedElementIndices = [];
        }
        
        const targetElement = availableElements[Math.floor(Math.random() * availableElements.length)];
        correctElement = targetElement;
        usedElementIndices.push(filteredElements.indexOf(targetElement));
        
        // 選択肢の生成
        let choices = [correctElement];
        while (choices.length < 10 && choices.length < filteredElements.length) {
            let rand = filteredElements[Math.floor(Math.random() * filteredElements.length)];
            if (!choices.includes(rand)) {
                choices.push(rand);
            }
        }
        // 選択肢が足りない場合は全元素から補充
        while (choices.length < 10) {
            let rand = elements[Math.floor(Math.random() * elements.length)];
            if (!choices.includes(rand)) {
                choices.push(rand);
            }
        }
        choices.sort(() => Math.random() - 0.5);

        // UI表示の切り替え
        const qText = document.getElementById('question-text');
        const qLabel = document.getElementById('question-label');
        const periodicDisplay = document.getElementById('periodic-display');
        const choicesContainer = document.getElementById('choices');

        periodicDisplay.style.display = "none";
        qText.style.display = "block";
        choicesContainer.innerHTML = "";

        if (currentMode === 1) { // 日本語 -> 記号
            qLabel.innerText = "この元素の記号は何？";
            qText.innerText = correctElement.name;
            choices.forEach(el => createChoiceButton(el.s, el === correctElement));
        } else if (currentMode === 2) { // 記号 -> 日本語
            qLabel.innerText = "この元素の名前は何？";
            qText.innerText = correctElement.s;
            choices.forEach(el => createChoiceButton(el.name, el === correctElement));
        } else if (currentMode === 3) { // 周期表
            qLabel.innerText = "「？」に入る元素は何？";
            qText.style.display = "none";
            periodicDisplay.style.display = "block";
            renderPeriodicTable(correctElement, rangeLimit);
            choices.forEach(el => createChoiceButton(`${el.s} (${el.name})`, el === correctElement));
        }
    }

    function createChoiceButton(text, isCorrect) {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = text;
        btn.onclick = () => handleAnswer(isCorrect, btn, text);
        document.getElementById('choices').appendChild(btn);
    }

    function handleAnswer(isCorrect, btn, userText) {
        if (!isAnswering) return;
        isAnswering = false;

        const feedback = document.getElementById('feedback');
        const correctAnswerText = currentMode === 1 ? correctElement.s : 
                                (currentMode === 2 ? correctElement.name : `${correctElement.s} (${correctElement.name})`);
        
        quizHistory.push({
            question: currentMode === 1 ? correctElement.name : (currentMode === 2 ? correctElement.s : "周期表「？」"),
            answer: userText,
            correct: correctAnswerText,
            isCorrect: isCorrect
        });

        if (isCorrect) {
            score++;
            feedback.innerText = "MISSION CLEAR!";
            feedback.className = "feedback correct-anim";
            btn.style.boxShadow = "0 0 30px var(--correct-color)";
            btn.style.borderColor = "var(--correct-color)";
        } else {
            feedback.innerText = `FAILED! 正解は「${correctAnswerText}」`;
            feedback.className = "feedback wrong-anim";
            btn.style.boxShadow = "0 0 30px var(--wrong-color)";
            btn.style.borderColor = "var(--wrong-color)";
        }

        setTimeout(() => {
            currentQuestionIndex++;
            nextQuestion();
        }, 2000);
    }

    function renderPeriodicTable(target, rangeLimit) {
        const grid = document.getElementById('table-grid');
        grid.innerHTML = "";
        
        // 簡易的な周期表描画（7周期18族）
        for (let r = 1; r <= 7; r++) {
            for (let c = 1; c <= 18; c++) {
                const el = elements.find(e => e.r === r && e.c === c);
                const cell = document.createElement('div');
                
                if (el) {
                    cell.className = 'element-cell';
                    if (el === target) {
                        cell.innerText = "?";
                        cell.className += ' target';
                    } else {
                        cell.innerText = el.s;
                        if (el.n > rangeLimit) {
                            cell.style.opacity = "0.2";
                        }
                    }
                } else {
                    cell.className = 'element-cell empty';
                }
                grid.appendChild(cell);
            }
        }
    }

    function showResult() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('final-score').innerText = `TOTAL SCORE: ${score} / 10`;

        const detailArea = document.getElementById('result-detail');
        detailArea.innerHTML = "";

        // モード1と2の場合のみ詳細一覧を表示
        if (currentMode === 1 || currentMode === 2) {
            let tableHtml = `<table class="result-table">
                <thead>
                    <tr>
                        <th>問題</th>
                        <th>あなたの回答</th>
                        <th>正解</th>
                        <th>判定</th>
                    </tr>
                </thead>
                <tbody>`;
            
            quizHistory.forEach(item => {
                tableHtml += `
                    <tr class="${item.isCorrect ? 'row-correct' : 'row-wrong'}">
                        <td>${item.question}</td>
                        <td>${item.answer}</td>
                        <td>${item.correct}</td>
                        <td>${item.isCorrect ? '〇' : '×'}</td>
                    </tr>`;
            });
            tableHtml += `</tbody></table>`;
            detailArea.innerHTML = tableHtml;
        }
    }

</script>

</body>
</html>
