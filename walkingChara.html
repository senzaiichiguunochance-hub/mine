<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歩くキャラクター</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fdf2f8; touch-action: none; }
        canvas { display: block; }
    </style>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>


    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfdf2f8);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(5, 10, 7.5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        const kuromiRoot = new THREE.Group();
        const animGroup = new THREE.Group();
        scene.add(kuromiRoot);
        kuromiRoot.add(animGroup);

        // マテリアル設定（PolygonOffsetで重なりを制御）
        const mBlack = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const mWhite = new THREE.MeshStandardMaterial({ 
            color: 0xffffff,
            polygonOffset: true,
            polygonOffsetFactor: -1, // 黒より手前に描画
            polygonOffsetUnits: -1
        });
        const mPink = new THREE.MeshStandardMaterial({ color: 0xff77bb });
        const mEye = new THREE.MeshBasicMaterial({ color: 0x222222 });

        const hood = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), mBlack);
        hood.scale.set(1.5, 1.35, 1.1);
        animGroup.add(hood);

        const faceGeo = new THREE.SphereGeometry(0.98, 32, 32, 0, Math.PI * 2, 0, Math.PI / 1.8);
        const face = new THREE.Mesh(faceGeo, mWhite);
        face.rotation.x = Math.PI / 2; // 正面に向ける
        face.scale.set(1.2, 0.8, 1.1); // おむすび型に調整
        face.position.set(0, -0.15, 0.2); 
        animGroup.add(face);

        // 3. 耳
        const earConeGeo = new THREE.ConeGeometry(0.35, 1.5, 16);
        const earTipGeo = new THREE.SphereGeometry(0.28, 16, 16);
        const makeEar = (x, rotZ) => {
            const eGroup = new THREE.Group();
            const cone = new THREE.Mesh(earConeGeo, mBlack);
            cone.position.y = 0.8;
            const tip = new THREE.Mesh(earTipGeo, mBlack);
            tip.position.y = 1.5;
            eGroup.add(cone); eGroup.add(tip);
            eGroup.position.set(x, 1.0, 0);
            eGroup.rotation.z = rotZ;
            return eGroup;
        };
        animGroup.add(makeEar(-0.85, 0.5));
        animGroup.add(makeEar(0.85, -0.5));

        // 4. 瞳
        const eyeGeo = new THREE.SphereGeometry(0.25, 32, 32);
        const makeEye = (x) => {
            const eye = new THREE.Mesh(eyeGeo, mEye);
            eye.scale.set(0.8, 1.4, 0.1);
            eye.position.set(x, -0.05, 1.15);
            eye.rotation.z = (x > 0 ? -0.1 : 0.1);
            return eye;
        };
        animGroup.add(makeEye(-0.55));
        animGroup.add(makeEye(0.55));

        // 5. 鼻・口・おでこ
        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), mPink);
        nose.position.set(0, -0.32, 1.18);
        animGroup.add(nose);

        const mouthGeo = new THREE.TorusGeometry(0.08, 0.02, 8, 16, Math.PI);
        const mouth = new THREE.Mesh(mouthGeo, mEye);
        mouth.rotation.set(Math.PI, 0, 0);
        mouth.position.set(0.1, -0.48, 1.15);
        animGroup.add(mouth);

        const skull = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), mPink);
        skull.scale.set(1, 0.8, 0.2);
        skull.position.set(0, 0.65, 1.1);
        animGroup.add(skull);

        // --- ロジック ---
        const targetPos = new THREE.Vector3();
        function handleInput(clientX, clientY) {
            const x = (clientX / window.innerWidth) * 2 - 1;
            const y = -(clientY / window.innerHeight) * 2 + 1;
            const vector = new THREE.Vector3(x, y, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            targetPos.copy(camera.position).add(dir.multiplyScalar(9));
        }

        window.addEventListener('mousemove', (e) => handleInput(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => handleInput(e.touches[0].clientX, e.touches[0].clientY), {passive:false});
        window.addEventListener('touchmove', (e) => handleInput(e.touches[0].clientX, e.touches[0].clientY), {passive:false});

        function animate() {
            requestAnimationFrame(animate);
            const dist = kuromiRoot.position.distanceTo(targetPos);
            
            if (dist > 0.4) {
                kuromiRoot.lookAt(targetPos);
                kuromiRoot.translateZ(0.13);
                animGroup.position.y = Math.abs(Math.sin(Date.now() * 0.012)) * 0.7;
                animGroup.rotation.z = Math.sin(Date.now() * 0.012) * 0.1;
            } else {
                const targetRot = new THREE.Quaternion();
                const curRot = kuromiRoot.quaternion.clone();
                kuromiRoot.lookAt(camera.position.x, camera.position.y, camera.position.z + 10);
                targetRot.copy(kuromiRoot.quaternion);
                curRot.slerp(targetRot, 0.1);
                kuromiRoot.quaternion.copy(curRot);
                animGroup.position.y *= 0.8;
                animGroup.rotation.z *= 0.8;
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
