<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUROMI - SIZE CONTROL EDITION</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fdf2f8; touch-action: none; }
        canvas { display: block; }
        /* 左上のUIスタイル */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 12px;
            font-family: sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        #ui-container label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ff77bb;
            font-weight: bold;
        }
        input[type=range] { width: 150px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="ui-container">
        <label>SIZE: <span id="size-val">75</span>%</label>
        <input type="range" id="size-slider" min="20" max="200" value="75">
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfdf2f8);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(5, 10, 7.5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        const kuromiRoot = new THREE.Group();
        // ★初期サイズを75%に設定
        kuromiRoot.scale.set(0.75, 0.75, 0.75);
        
        const animGroup = new THREE.Group(); 
        scene.add(kuromiRoot);
        kuromiRoot.add(animGroup);

        const mBlack = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
        const mWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const mPink = new THREE.MeshStandardMaterial({ color: 0xff77bb });
        const mEye = new THREE.MeshBasicMaterial({ color: 0x222222 });

        // --- 頭部 ---
        const headGroup = new THREE.Group();
        animGroup.add(headGroup);
        const hood = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), mBlack);
        hood.scale.set(1.5, 1.3, 1.1);
        headGroup.add(hood);
        const face = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), mWhite);
        face.scale.set(1.4, 1.1, 0.65);
        face.position.set(0, -0.1, 0.6);
        headGroup.add(face);

        const makeSharpEar = (x, rotZ) => {
            const eGroup = new THREE.Group();
            const earMesh = new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), mBlack);
            earMesh.scale.set(0.5, 1.1, 0.3); 
            earMesh.position.y = 0.4; 
            const tip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), mBlack);
            tip.position.y = 1.5;
            eGroup.add(earMesh); eGroup.add(tip);
            eGroup.position.set(x, 0.65, 0);
            eGroup.rotation.z = rotZ;
            return eGroup;
        };
        headGroup.add(makeSharpEar(-0.85, 0.55));
        headGroup.add(makeSharpEar(0.85, -0.55));

        const makeEye = (x) => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), mEye);
            eye.scale.set(0.7, 1.3, 0.1);
            eye.position.set(x, -0.05, 1.12);
            eye.rotation.z = (x > 0 ? -0.1 : 0.1);
            return eye;
        };
        headGroup.add(makeEye(-0.5));
        headGroup.add(makeEye(0.5));

        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), mPink);
        nose.position.set(0, -0.32, 1.18);
        headGroup.add(nose);

        const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.02, 8, 16, Math.PI), mEye);
        mouth.rotation.set(Math.PI, 0, 0);
        mouth.position.set(0.1, -0.48, 1.15);
        headGroup.add(mouth);

        const skull = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), mPink);
        skull.scale.set(1, 0.8, 0.2);
        skull.position.set(0, 0.65, 1.0);
        headGroup.add(skull);

        // --- 身体 ---
        const bodyGroup = new THREE.Group();
        bodyGroup.position.y = -1.2;
        animGroup.add(bodyGroup);
        const torso = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), mWhite);
        torso.scale.set(1, 1.2, 0.8);
        bodyGroup.add(torso);

        const armGeo = new THREE.SphereGeometry(0.22, 16, 16);
        const armL = new THREE.Mesh(armGeo, mWhite);
        armL.position.set(-0.8, 0, 0.2);
        bodyGroup.add(armL);
        const armR = new THREE.Mesh(armGeo, mWhite);
        armR.position.set(0.8, 0, 0.2);
        bodyGroup.add(armR);

        const legGeo = new THREE.SphereGeometry(0.25, 16, 16);
        const legL = new THREE.Mesh(legGeo, mWhite);
        legL.position.set(-0.35, -0.85, 0.1);
        bodyGroup.add(legL);
        const legR = new THREE.Mesh(legGeo, mWhite);
        legR.position.set(0.35, -0.85, 0.1);
        bodyGroup.add(legR);

        const collarGroup = new THREE.Group();
        collarGroup.position.y = 0.6;
        bodyGroup.add(collarGroup);
        for(let i=0; i<6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const collarPart = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.6, 4), mBlack);
            collarPart.position.set(Math.cos(angle)*0.8, 0, Math.sin(angle)*0.5);
            collarPart.rotation.x = Math.PI;
            collarPart.rotation.y = angle;
            collarGroup.add(collarPart);
            const pinkBall = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), mPink);
            pinkBall.position.set(Math.cos(angle)*0.95, -0.2, Math.sin(angle)*0.6);
            collarGroup.add(pinkBall);
        }

        const tailGroup = new THREE.Group();
        tailGroup.position.set(0, -0.3, -0.5);
        bodyGroup.add(tailGroup);
        const tailCurve = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.07, 8, 20, Math.PI), mBlack);
        tailCurve.rotation.y = Math.PI / 2;
        tailCurve.rotation.z = -Math.PI / 6;
        tailGroup.add(tailCurve);
        const tailTip = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 4), mBlack);
        tailTip.position.set(0, 0.4, -0.4); 
        tailTip.rotation.x = Math.PI / 4; 
        tailGroup.add(tailTip);

        // --- UI ロジック ---
        const slider = document.getElementById('size-slider');
        const sizeDisp = document.getElementById('size-val');
        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            sizeDisp.textContent = val;
            const s = val / 100;
            kuromiRoot.scale.set(s, s, s);
        });

        // --- 移動・アニメーション制御 ---
        const targetPos = new THREE.Vector3();
        function handleInput(clientX, clientY) {
            const x = (clientX / window.innerWidth) * 2 - 1;
            const y = -(clientY / window.innerHeight) * 2 + 1;
            const vector = new THREE.Vector3(x, y, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            targetPos.copy(camera.position).add(dir.multiplyScalar(10));
        }

        window.addEventListener('mousemove', (e) => handleInput(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => handleInput(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchmove', (e) => handleInput(e.touches[0].clientX, e.touches[0].clientY));

        function animate() {
            requestAnimationFrame(animate);
            const dist = kuromiRoot.position.distanceTo(targetPos);
            
            if (dist > 0.5) {
                kuromiRoot.lookAt(targetPos);
                kuromiRoot.translateZ(0.12);
                
                const time = Date.now() * 0.012;
                animGroup.position.y = Math.abs(Math.sin(time)) * 0.5;
                animGroup.rotation.z = Math.sin(time) * 0.05;

                const swing = Math.sin(time) * 0.5;
                armL.position.z = 0.2 + swing;
                armR.position.z = 0.2 - swing;
                legL.position.z = 0.1 - swing;
                legR.position.z = 0.1 + swing;
                tailGroup.rotation.y = Math.sin(time) * 0.8;
            } else {
                const targetRot = new THREE.Quaternion();
                const curRot = kuromiRoot.quaternion.clone();
                kuromiRoot.lookAt(camera.position.x, 0, camera.position.z + 10);
                targetRot.copy(kuromiRoot.quaternion);
                curRot.slerp(targetRot, 0.1);
                kuromiRoot.quaternion.copy(curRot);
                
                animGroup.position.y *= 0.8;
                [armL, armR, legL, legR].forEach(m => m.position.z += (0.15 - m.position.z) * 0.1);
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
