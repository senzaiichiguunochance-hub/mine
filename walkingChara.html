<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>動くキャラクター</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #e5e7eb; touch-action: none; 
            -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
        }
        canvas { display: block; }
        #ui-container {
            position: absolute; top: 20px; left: 20px; background: rgba(255, 255, 255, 0.7);
            padding: 15px; border-radius: 12px; font-family: sans-serif; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px); z-index: 100;
        }
        .ui-group { margin-bottom: 15px; }
        #ui-container label { display: block; margin-bottom: 5px; font-size: 14px; color: #ff77bb; font-weight: bold; }
        input[type=range] { width: 150px; cursor: pointer; }
        input[type=color] { width: 100%; height: 30px; border: none; cursor: pointer; background: none; }
        .instruction {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            font-family: sans-serif; color: #ff77bb; font-weight: bold; pointer-events: none;
        }
    </style>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>


    <div id="ui-container">
        <div class="ui-group">
            <label>SIZE: <span id="size-val">75</span>%</label>
            <input type="range" id="size-slider" min="20" max="200" value="75">
        </div>
        <div class="ui-group">
            <label>MAIN COLOR</label>
            <input type="color" id="color-picker">
        </div>
    </div>
    <div class="instruction">キャラをクリック！</div>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 初期設定 ---
        const randomColorHex = "#" + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
        const colorPicker = document.getElementById('color-picker');
        colorPicker.value = randomColorHex;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe5e7eb);
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 12);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 10, 7.5); 
        light.castShadow = true;
        light.shadow.mapSize.width = 1024;
        light.shadow.mapSize.height = 1024;
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        const CharaRoot = new THREE.Group();
        CharaRoot.scale.set(0.75, 0.75, 0.75);
        const actionPivot = new THREE.Group(); CharaRoot.add(actionPivot);
        const animGroup = new THREE.Group(); actionPivot.add(animGroup);
        scene.add(CharaRoot);

        // マテリアル作成
        const mMainColor = new THREE.MeshStandardMaterial({ color: randomColorHex });
        const mWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const mLimb = new THREE.MeshStandardMaterial({ color: 0xf3f4f6 });
        const mPink = new THREE.MeshStandardMaterial({ color: 0xff77bb });
        const mEye = new THREE.MeshBasicMaterial({ color: 0x222222 });

        // 補助関数
        const setupMesh = (mesh, cast = true, receive = true) => {
            mesh.castShadow = cast;
            mesh.receiveShadow = receive;
            return mesh;
        };

        // --- モデル構築 ---
        const head = new THREE.Group(); animGroup.add(head);
        const hood = setupMesh(new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), mMainColor));
        hood.scale.set(1.5, 1.3, 1.1); head.add(hood);
        const face = setupMesh(new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), mWhite));
        face.scale.set(1.4, 1.1, 0.65); face.position.set(0, -0.1, 0.6); head.add(face);
        const skull = setupMesh(new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), mPink));
        skull.scale.set(1, 0.8, 0.2); skull.position.set(0, 0.65, 1.0); head.add(skull);
        
        const makeEar = (x, rz) => {
            const g = new THREE.Group();
            const e = setupMesh(new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), mMainColor));
            e.scale.set(0.5, 1.1, 0.3); e.position.y = 0.4;
            const t = setupMesh(new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), mMainColor));
            t.position.y = 1.5; g.add(e, t); g.position.set(x, 0.65, 0); g.rotation.z = rz;
            return g;
        };
        head.add(makeEar(-0.85, 0.55), makeEar(0.85, -0.55));
        
        // 案：目と鼻だけ影の設定をオフにする (setupMeshの第2,3引数をfalseに)
        const makeEye = (x) => {
            const e = setupMesh(new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), mEye), false, false);
            e.scale.set(0.7, 1.3, 0.1); e.position.set(x, -0.05, 1.12);
            e.rotation.z = (x > 0 ? -0.1 : 0.1); return e;
        };
        head.add(makeEye(-0.5), makeEye(0.5));
        const nose = setupMesh(new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), mPink), false, false);
        nose.position.set(0, -0.32, 1.18); head.add(nose);

        const body = new THREE.Group(); body.position.y = -1.2; animGroup.add(body);
        const torso = setupMesh(new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), mWhite));
        torso.scale.set(1, 1.2, 0.8); body.add(torso);
        
        const armL = setupMesh(new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), mLimb)); armL.position.set(-0.8, 0, 0.2);
        const armR = setupMesh(new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), mLimb)); armR.position.set(0.8, 0, 0.2);
        body.add(armL, armR);
        const legL = setupMesh(new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), mLimb)); legL.position.set(-0.35, -0.85, 0.1);
        const legR = setupMesh(new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), mLimb)); legR.position.set(0.35, -0.85, 0.1);
        body.add(legL, legR);
        
        const collar = new THREE.Group(); collar.position.y = 0.6; body.add(collar);
        for(let i=0; i<6; i++){
            const a = (i/6)*Math.PI*2;
            const cp = setupMesh(new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.6, 4), mMainColor));
            cp.position.set(Math.cos(a)*0.8, 0, Math.sin(a)*0.5); cp.rotation.set(Math.PI, a, 0); collar.add(cp);
            const pb = setupMesh(new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), mPink));
            pb.position.set(Math.cos(a)*0.95, -0.2, Math.sin(a)*0.6); collar.add(pb);
        }
        const tail = setupMesh(new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.07, 8, 20, Math.PI), mMainColor));
        tail.rotation.y = Math.PI/2; tail.position.set(0,-0.3,-0.5); body.add(tail);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.ShadowMaterial({ opacity: 0.1 }));
        floor.rotation.x = -Math.PI / 2; floor.position.y = -2.5; floor.receiveShadow = true;
        scene.add(floor);

        // --- システム変数 ---
        const ghosts = []; 
        const clones = []; 
        let activeAction = null, actionTime = 0, spinDir = 1;
        const allActions = [
            'ninjutsu','afterimageDash','jump','frontFlip','backFlip','spin','bye','bow','angry','shy','dance','sleepy',
            'kiss','heart','pose','wink','fanservice','noNo','sad','surprise','superShy','proud',
            'hide','stomp','squat','tilt','superSpin','giant','ghost','rainbow','vibrate','backStep'
        ];
        let actionQueue = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const targetPos = new THREE.Vector3(0, 0, 0);
        let isMovingManually = false;

        function createGhost() {
            const ghost = CharaRoot.clone(true);
            ghost.traverse(child => { if (child.isMesh) { child.material = child.material.clone(); child.material.transparent = true; child.material.opacity = 0.3; }});
            scene.add(ghost); ghosts.push({ obj: ghost, life: 1.0 });
        }

        const triggerAction = () => {
            if (activeAction) return;
            if (actionQueue.length === 0) actionQueue = [...allActions].sort(() => Math.random() - 0.5);
            activeAction = actionQueue.shift();
            actionTime = 0; spinDir = Math.random() > 0.5 ? 1 : -1;
            isMovingManually = false;

            if (activeAction === 'ninjutsu') {
                for(let i = 0; i < 2; i++) {
                    const clone = CharaRoot.clone(true);
                    clone.traverse(child => { if (child.isMesh) { child.material = child.material.clone(); child.material.transparent = true; child.material.opacity = 0.5; }});
                    scene.add(clone); clones.push({ obj: clone, dir: i === 0 ? -1 : 1 });
                }
            }
        };

        function updateTarget(clientX, clientY) {
            mouse.x = (clientX/window.innerWidth)*2-1; mouse.y = -(clientY/window.innerHeight)*2+1;
            const v = new THREE.Vector3(mouse.x, mouse.y, 0.5).unproject(camera);
            const dir = v.sub(camera.position).normalize();
            targetPos.copy(camera.position).add(dir.multiplyScalar(12));
            isMovingManually = true;
        }

        window.addEventListener('mousemove', (e) => updateTarget(e.clientX, e.clientY));
        window.addEventListener('mousedown', (e) => {
            if(document.getElementById('ui-container').contains(e.target)) return;
            raycaster.setFromCamera(mouse, camera);
            if(raycaster.intersectObjects(CharaRoot.children, true).length > 0) triggerAction();
        });

        const slider = document.getElementById('size-slider');
        slider.addEventListener('input', (e) => {
            const s = e.target.value/100; document.getElementById('size-val').textContent = e.target.value;
            if (!activeAction) CharaRoot.scale.set(s,s,s);
        });
        colorPicker.addEventListener('input', (e) => mMainColor.color.set(e.target.value));

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.012;
            const dist = CharaRoot.position.distanceTo(targetPos);
            const baseScale = slider.value / 100;

            if (!activeAction && isMovingManually && dist > 0.5) {
                CharaRoot.lookAt(targetPos); CharaRoot.translateZ(0.12);
                animGroup.position.y = Math.abs(Math.sin(time)) * 0.5;
                armL.position.z = 0.2 + Math.sin(time)*0.8; armR.position.z = 0.2 - Math.sin(time)*0.8;
                legL.position.z = 0.1 - Math.sin(time)*0.8; legR.position.z = 0.1 + Math.sin(time)*0.8;
            } else if (!activeAction) {
                isMovingManually = false;
                CharaRoot.lookAt(camera.position.x, 0, camera.position.z + 10);
                animGroup.position.y *= 0.8;
                [armL, armR, legL, legR].forEach(m => m.position.z *= 0.8);
            }

            if (activeAction) {
                actionTime += 0.05; const p = actionTime;
                switch(activeAction) {
                    case 'ninjutsu':
                        clones.forEach(c => {
                            const offset = Math.min(p * 8, 4);
                            c.obj.position.set(CharaRoot.position.x + (c.dir * offset), CharaRoot.position.y, CharaRoot.position.z - offset*0.5);
                            c.obj.rotation.copy(CharaRoot.rotation);
                        });
                        break;
                    case 'afterimageDash':
                        CharaRoot.position.x += Math.cos(p * 4) * 0.2;
                        CharaRoot.position.z += Math.sin(p * 4) * 0.2;
                        if (Math.floor(p*20)%2===0) createGhost();
                        break;
                    case 'jump': actionPivot.position.y = Math.sin(p)*4; break;
                    case 'frontFlip': actionPivot.position.y = Math.sin(p)*4; actionPivot.rotation.x = -p*2; break;
                    case 'backFlip': actionPivot.position.y = Math.sin(p)*4; actionPivot.rotation.x = p*2; break;
                    case 'spin': actionPivot.position.y = Math.sin(p)*1.5; actionPivot.rotation.y = p*6*spinDir; break;
                    case 'bye': armR.position.y = 0.5; armR.rotation.z = Math.sin(p*10)*0.5; break;
                    case 'bow': animGroup.rotation.x = Math.sin(p)*0.8; break;
                    case 'angry': animGroup.position.x = Math.sin(p*20)*0.1; armL.position.y = armR.position.y = Math.sin(p*15)*0.3; break;
                    case 'shy': animGroup.rotation.z = Math.sin(p*4)*0.2; legL.rotation.z = 0.3; legR.rotation.z = -0.3; break;
                    case 'dance': CharaRoot.position.x += Math.sin(p*4)*0.1; animGroup.position.y = Math.abs(Math.sin(p*4))*0.8; break;
                    case 'sleepy': head.rotation.x = Math.max(0, Math.sin(p*2)*0.6); break;
                    case 'kiss': armR.position.set(0, 0.2, 0.8); armR.rotation.x = Math.sin(p*5); break;
                    case 'heart': armL.position.set(-0.3, 0.2, 0.8); armR.position.set(0.3, 0.2, 0.8); break;
                    case 'pose': head.rotation.z = Math.sin(p*4)*0.4; armL.position.y = 0.5; break;
                    case 'wink': head.rotation.z = 0.3; skull.scale.y = Math.abs(Math.sin(p*5))*0.4; break;
                    case 'fanservice': armL.position.y = armR.position.y = 0.6; armL.rotation.z = Math.sin(p*10); armR.rotation.z = -Math.sin(p*10); break;
                    case 'noNo': head.rotation.y = Math.sin(p*15)*0.5; armL.position.x = -1.2; armR.position.x = 1.2; break;
                    case 'sad': animGroup.position.y = -0.5; head.rotation.x = 0.5; break;
                    case 'surprise': actionPivot.position.y = Math.abs(Math.sin(p*10))*2; head.scale.set(1.2,1.2,1.2); break;
                    case 'superShy': animGroup.rotation.z = Math.sin(p*10)*0.1; armL.position.x = -0.4; armR.position.x = 0.4; break;
                    case 'proud': torso.scale.z = 1.2; head.rotation.x = -0.3; break;
                    case 'hide': armL.position.set(-0.2, 0.4, 0.9); armR.position.set(0.2, 0.4, 0.9); break;
                    case 'stomp': legL.position.y = Math.sin(p*15)*0.5 - 0.85; legR.position.y = Math.cos(p*15)*0.5 - 0.85; break;
                    case 'squat': animGroup.position.y = -Math.abs(Math.sin(p*5))*1.5; break;
                    case 'tilt': head.rotation.z = Math.sin(p*2)*0.8; break;
                    case 'superSpin': actionPivot.rotation.y = p*20; break;
                    case 'giant': 
                        const gS = baseScale * (1 + Math.sin(p)*0.8);
                        CharaRoot.scale.set(gS, gS, gS); 
                        break;
                    case 'ghost': mMainColor.opacity = Math.abs(Math.sin(p*5)); mMainColor.transparent = true; break;
                    case 'rainbow': mMainColor.color.setHSL((p*0.5)%1, 0.8, 0.5); break;
                    case 'vibrate': animGroup.position.x = Math.random()*0.2; animGroup.position.z = Math.random()*0.2; break;
                    case 'backStep': 
                        CharaRoot.translateZ(-0.2); 
                        const bS = baseScale * (1 - Math.sin(p)*0.3);
                        CharaRoot.scale.set(bS, bS, bS);
                        break;
                }

                if (actionTime >= Math.PI) {
                    if (clones.length > 0) { clones.forEach(c => scene.remove(c.obj)); clones.length = 0; }
                    activeAction = null; isMovingManually = false;
                    actionPivot.position.set(0,0,0); actionPivot.rotation.set(0,0,0);
                    animGroup.rotation.set(0,0,0); animGroup.position.set(0,0,0);
                    head.rotation.set(0,0,0); head.scale.set(1,1,1);
                    skull.scale.set(1, 0.8, 0.2); skull.position.set(0, 0.65, 1.0);
                    mMainColor.opacity = 1.0; mMainColor.transparent = false; mMainColor.color.set(colorPicker.value);
                    [armL, armR, legL, legR].forEach(m => { m.position.y = 0; m.rotation.set(0,0,0); m.position.z = 0.2; });
                    armL.position.x = -0.8; armR.position.x = 0.8; torso.scale.set(1, 1.2, 0.8);
                    legL.position.set(-0.35, -0.85, 0.1); legR.position.set(0.35, -0.85, 0.1);
                    CharaRoot.scale.set(baseScale, baseScale, baseScale);
                }
            }

            for (let i = ghosts.length - 1; i >= 0; i--) {
                ghosts[i].life -= 0.05;
                ghosts[i].obj.traverse(child => { if (child.isMesh) child.material.opacity = ghosts[i].life * 0.3; });
                if (ghosts[i].life <= 0) { scene.remove(ghosts[i].obj); ghosts.splice(i, 1); }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
