<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動くキャラクター</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fdf2f8; touch-action: none; cursor: pointer; }
        canvas { display: block; }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 12px;
            font-family: sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        .ui-group { margin-bottom: 15px; }
        #ui-container label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ff77bb;
            font-weight: bold;
        }
        input[type=range] { width: 150px; cursor: pointer; }
        input[type=color] { width: 100%; height: 30px; border: none; cursor: pointer; background: none; }
        .instruction {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-family: sans-serif;
            color: #ff77bb;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <div class="ui-group">
            <label>SIZE: <span id="size-val">75</span>%</label>
            <input type="range" id="size-slider" min="20" max="200" value="75">
        </div>
        <div class="ui-group">
            <label>MAIN COLOR</label>
            <input type="color" id="color-picker" value="#1a1a1a">
        </div>
    </div>
    <div class="instruction">クリックで順番にアクション！</div>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfdf2f8);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(5, 10, 7.5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        const kuromiRoot = new THREE.Group();
        kuromiRoot.scale.set(0.75, 0.75, 0.75);
        const actionPivot = new THREE.Group();
        kuromiRoot.add(actionPivot);
        const animGroup = new THREE.Group(); 
        actionPivot.add(animGroup);
        scene.add(kuromiRoot);

        // --- マテリアル設定 ---
        const mMainColor = new THREE.MeshStandardMaterial({ color: 0x1a1a1a }); // これを後で変更可能に
        const mWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const mPink = new THREE.MeshStandardMaterial({ color: 0xff77bb });
        const mEye = new THREE.MeshBasicMaterial({ color: 0x222222 });

        // --- 頭部 ---
        const headGroup = new THREE.Group();
        animGroup.add(headGroup);
        const hood = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), mMainColor);
        hood.scale.set(1.5, 1.3, 1.1);
        headGroup.add(hood);
        
        const face = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), mWhite);
        face.scale.set(1.4, 1.1, 0.65);
        face.position.set(0, -0.1, 0.6);
        headGroup.add(face);

        const makeEar = (x, rotZ) => {
            const eGroup = new THREE.Group();
            const earMesh = new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), mMainColor);
            earMesh.scale.set(0.5, 1.1, 0.3); 
            earMesh.position.y = 0.4; 
            const tip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), mMainColor);
            tip.position.y = 1.5;
            eGroup.add(earMesh); eGroup.add(tip);
            eGroup.position.set(x, 0.65, 0);
            eGroup.rotation.z = rotZ;
            return eGroup;
        };
        const earL = makeEar(-0.85, 0.55);
        const earR = makeEar(0.85, -0.55);
        headGroup.add(earL, earR);

        headGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), mPink));
        headGroup.children[headGroup.children.length-1].scale.set(1, 0.8, 0.2);
        headGroup.children[headGroup.children.length-1].position.set(0, 0.65, 1.0);

        const makeEye = (x) => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), mEye);
            eye.scale.set(0.7, 1.3, 0.1);
            eye.position.set(x, -0.05, 1.12);
            eye.rotation.z = (x > 0 ? -0.1 : 0.1);
            return eye;
        };
        headGroup.add(makeEye(-0.5), makeEye(0.5));

        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), mPink);
        nose.position.set(0, -0.32, 1.18);
        headGroup.add(nose);

        // --- 身体 ---
        const bodyGroup = new THREE.Group();
        bodyGroup.position.y = -1.2;
        animGroup.add(bodyGroup);
        const torso = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), mWhite);
        torso.scale.set(1, 1.2, 0.8);
        bodyGroup.add(torso);

        const armGeo = new THREE.SphereGeometry(0.22, 16, 16);
        const armL = new THREE.Mesh(armGeo, mWhite); armL.position.set(-0.8, 0, 0.2);
        const armR = new THREE.Mesh(armGeo, mWhite); armR.position.set(0.8, 0, 0.2);
        bodyGroup.add(armL, armR);

        const legGeo = new THREE.SphereGeometry(0.25, 16, 16);
        const legL = new THREE.Mesh(legGeo, mWhite); legL.position.set(-0.35, -0.85, 0.1);
        const legR = new THREE.Mesh(legGeo, mWhite); legR.position.set(0.35, -0.85, 0.1);
        bodyGroup.add(legL, legR);

        const collarGroup = new THREE.Group();
        collarGroup.position.y = 0.6;
        bodyGroup.add(collarGroup);
        for(let i=0; i<6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const cp = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.6, 4), mMainColor);
            cp.position.set(Math.cos(angle)*0.8, 0, Math.sin(angle)*0.5);
            cp.rotation.set(Math.PI, angle, 0);
            collarGroup.add(cp);
            const pb = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), mPink);
            pb.position.set(Math.cos(angle)*0.95, -0.2, Math.sin(angle)*0.6);
            collarGroup.add(pb);
        }

        const tailGroup = new THREE.Group();
        tailGroup.position.set(0, -0.3, -0.5);
        bodyGroup.add(tailGroup);
        const tc = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.07, 8, 20, Math.PI), mMainColor);
        tc.rotation.y = Math.PI / 2;
        tailGroup.add(tc);

        // --- UIイベント制御 ---
        const slider = document.getElementById('size-slider');
        const sizeDisp = document.getElementById('size-val');
        slider.addEventListener('input', (e) => {
            const s = e.target.value / 100;
            sizeDisp.textContent = e.target.value;
            kuromiRoot.scale.set(s, s, s);
        });

        const colorPicker = document.getElementById('color-picker');
        colorPicker.addEventListener('input', (e) => {
            mMainColor.color.set(e.target.value);
        });

        // --- アクション・キュー制御 ---
        let activeAction = null;
        let actionTime = 0;
        let spinDir = 1;
        const allActions = ['jump', 'frontFlip', 'backFlip', 'spin', 'bye', 'bow', 'angry', 'shy', 'dance', 'sleepy'];
        let actionQueue = [];

        const triggerAction = () => {
            if (activeAction) return;
            if (actionQueue.length === 0) {
                actionQueue = [...allActions].sort(() => Math.random() - 0.5);
            }
            activeAction = actionQueue.shift();
            actionTime = 0;
            spinDir = Math.random() > 0.5 ? 1 : -1;
        };

        window.addEventListener('mousedown', (e) => { if(!e.target.closest('#ui-container')) triggerAction(); });
        window.addEventListener('touchstart', (e) => { if(!e.target.closest('#ui-container')) triggerAction(); });

        const targetPos = new THREE.Vector3();
        function handleInput(clientX, clientY) {
            const x = (clientX / window.innerWidth) * 2 - 1;
            const y = -(clientY / window.innerHeight) * 2 + 1;
            const v = new THREE.Vector3(x, y, 0.5).unproject(camera);
            const dir = v.sub(camera.position).normalize();
            targetPos.copy(camera.position).add(dir.multiplyScalar(10));
        }
        window.addEventListener('mousemove', (e) => handleInput(e.clientX, e.clientY));

        function animate() {
            requestAnimationFrame(animate);
            const dist = kuromiRoot.position.distanceTo(targetPos);
            const isMoving = dist > 0.5;
            const time = Date.now() * 0.012;

            if (isMoving) {
                kuromiRoot.lookAt(targetPos);
                kuromiRoot.translateZ(0.12);
                if (!activeAction) {
                    animGroup.position.y = Math.abs(Math.sin(time)) * 0.5;
                    const swing = Math.sin(time) * 0.5;
                    armL.position.z = 0.2 + swing; armR.position.z = 0.2 - swing;
                    legL.position.z = 0.1 - swing; legR.position.z = 0.1 + swing;
                }
            } else {
                kuromiRoot.lookAt(camera.position.x, 0, camera.position.z + 10);
                if (!activeAction) {
                    animGroup.position.y *= 0.8;
                    [armL, armR, legL, legR].forEach(m => m.position.z += (0.15 - m.position.z) * 0.1);
                }
            }

            if (activeAction) {
                actionTime += 0.05;
                const p = actionTime;
                switch(activeAction) {
                    case 'jump': actionPivot.position.y = Math.sin(p) * 4; break;
                    case 'frontFlip': actionPivot.position.y = Math.sin(p) * 4; actionPivot.rotation.x = -p * 2; break;
                    case 'backFlip': actionPivot.position.y = Math.sin(p) * 4; actionPivot.rotation.x = p * 2; break;
                    case 'spin': actionPivot.position.y = Math.sin(p) * 1.5; actionPivot.rotation.y = p * 6 * spinDir; break;
                    case 'bye': armR.position.y = 0.5; armR.position.x = 1.0; armR.rotation.z = Math.sin(p * 10) * 0.5; break;
                    case 'bow': animGroup.rotation.x = Math.sin(p) * 0.8; break;
                    case 'angry': animGroup.position.x = Math.sin(p * 20) * 0.1; armL.position.y = armR.position.y = Math.sin(p * 15) * 0.3; break;
                    case 'shy': animGroup.rotation.z = Math.sin(p * 4) * 0.2; legL.rotation.z = 0.3; legR.rotation.z = -0.3; break;
                    case 'dance': kuromiRoot.position.x += Math.sin(p * 4) * 0.1; animGroup.position.y = Math.abs(Math.sin(p * 4)) * 0.8; break;
                    case 'sleepy': headGroup.rotation.x = Math.max(0, Math.sin(p * 2) * 0.6); break;
                }
                if (actionTime >= Math.PI) {
                    activeAction = null;
                    actionPivot.position.set(0,0,0); actionPivot.rotation.set(0,0,0);
                    animGroup.rotation.set(0,0,0); headGroup.rotation.set(0,0,0);
                    [armL, armR, legL, legR].forEach(m => { m.position.y = 0; m.rotation.set(0,0,0); });
                    armL.position.set(-0.8, 0, 0.2); armR.position.set(0.8, 0, 0.2);
                    legL.position.set(-0.35, -0.85, 0.1); legR.position.set(0.35, -0.85, 0.1);
                }
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
