<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Fixed Glow 50% - Cyber Cube</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Share Tech Mono', monospace; }
        #ui { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 30px; box-sizing: border-box; color: #00ffff; pointer-events: none; z-index: 10;
        }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,255,255,0.2); }
        .status-main { font-size: 28px; letter-spacing: 8px; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
        .hud-data { font-size: 11px; line-height: 1.6; color: rgba(0,255,255,0.6); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div id="ui">
        <div class="header">
            <div class="status-main">SYSTEM: <span id="status-text">GLOW_ADJUSTED</span></div>
            <div id="timer">00:00:00</div>
        </div>
        <div class="hud-data" id="op-log">
            STABILIZING PHOTON_LEVEL: 50%<br>
            ALL_VIEW_BLOOM: ACTIVE
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, renderer, composer, bloomPass, renderPass, pieces = [], moveHistory = [];
        const COLORS = { right: 0x00aaff, left: 0x00ff44, top: 0xffffff, bottom: 0xffea00, front: 0xff0055, back: 0xff6600, inner: 0x0a0a0a };
        
        const views = [
            { l: 0.25, b: 0.25, w: 0.5,  h: 0.5,  eye: [6, 6, 9], wire: false },
            { l: 0,    b: 0.7,  w: 0.25, h: 0.25, eye: [0, 10, 0], wire: true },
            { l: 0.75, b: 0.7,  w: 0.25, h: 0.25, eye: [8, 2, -8], wire: false },
            { l: 0,    b: 0,    w: 0.25, h: 0.25, eye: [-8, -4, 8], wire: true },
            { l: 0.75, b: 0,    w: 0.25, h: 0.25, eye: [0, 0, 12], wire: false }
        ];

        init();
        animate();
        run();

        function init() {
            scene = new THREE.Scene();
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.autoClear = false;
            document.body.appendChild(renderer.domElement);

            views.forEach(v => {
                v.camera = new THREE.PerspectiveCamera(40, (window.innerWidth*v.w)/(window.innerHeight*v.h), 0.1, 100);
                v.camera.position.set(...v.eye);
                v.camera.lookAt(0,0,0);
            });

            // コンポーザー初期化
            composer = new EffectComposer(renderer);
            renderPass = new RenderPass(scene, views[0].camera);
            composer.addPass(renderPass);

            // 輝きを50%に設定 (strength: 0.6)
            bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.4, 0.85);
            bloomPass.threshold = 0.1;
            composer.addPass(bloomPass);

            scene.add(new THREE.AmbientLight(0xffffff, 0.15));
            const p1 = new THREE.PointLight(0xffffff, 60); p1.position.set(10, 10, 10); scene.add(p1);

            createCube();
        }

        function createCube() {
            const geom = new RoundedBoxGeometry(0.92, 0.92, 0.92, 4, 0.1);
            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const mats = Array(6).fill().map(() => new THREE.MeshStandardMaterial({ 
                            color: COLORS.inner, metalness: 0.8, roughness: 0.2, emissive: 0x000000 
                        }));
                        if (x === 1) apply(mats[0], COLORS.right);
                        if (x === -1) apply(mats[1], COLORS.left);
                        if (y === 1) apply(mats[2], COLORS.top);
                        if (y === -1) apply(mats[3], COLORS.bottom);
                        if (z === 1) apply(mats[4], COLORS.front);
                        if (z === -1) apply(mats[5], COLORS.back);
                        const mesh = new THREE.Mesh(geom, mats);
                        mesh.position.set(x, y, z);
                        mesh.userData.origPos = new THREE.Vector3(x, y, z);
                        scene.add(mesh);
                        pieces.push(mesh);
                    }
                }
            }
        }

        function apply(m, c) { 
            m.color.setHex(c); 
            m.emissive.setHex(c); 
            m.emissiveIntensity = 1.2; // 少し輝きを戻して存在感アップ
        }

        async function rotateLayer(axis, layer, angle) {
            return new Promise(resolve => {
                const group = new THREE.Group();
                scene.add(group);
                const targets = [];
                const worldPos = new THREE.Vector3();
                pieces.forEach(p => {
                    p.getWorldPosition(worldPos);
                    if (Math.round(worldPos[axis]) === layer) targets.push(p);
                });
                targets.forEach(p => group.attach(p));
                let progress = 0;
                function step() {
                    progress += 0.08;
                    const t = Math.min(progress, 1);
                    const ease = t * t * (3 - 2 * t);
                    group.rotation[axis] = (angle * Math.PI / 2) * ease;
                    if (progress < 1) requestAnimationFrame(step);
                    else {
                        targets.forEach(p => {
                            scene.attach(p);
                            p.position.set(Math.round(p.position.x), Math.round(p.position.y), Math.round(p.position.z));
                            p.rotation.set(Math.round(p.rotation.x/(Math.PI/2))*(Math.PI/2), Math.round(p.rotation.y/(Math.PI/2))*(Math.PI/2), Math.round(p.rotation.z/(Math.PI/2))*(Math.PI/2));
                        });
                        scene.remove(group);
                        resolve();
                    }
                }
                step();
            });
        }

        async function run() {
            const txt = document.getElementById('status-text');
            while(true) {
                txt.innerText = "SCRAMBLING";
                for(let i=0; i<10; i++) {
                    const m = { axis: ['x','y','z'][Math.floor(Math.random()*3)], layer: [-1,0,1][Math.floor(Math.random()*3)], angle: Math.random()>0.5?1:-1 };
                    moveHistory.push(m);
                    await rotateLayer(m.axis, m.layer, m.angle);
                }
                txt.innerText = "SOLVING";
                await new Promise(r => setTimeout(r, 1000));
                while(moveHistory.length > 0) {
                    const m = moveHistory.pop();
                    await rotateLayer(m.axis, m.layer, -m.angle);
                }
                txt.innerText = "STABLE";
                await new Promise(r => setTimeout(r, 4000));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.clear();
            const w = window.innerWidth, h = window.innerHeight;

            views.forEach(v => {
                // ビューポート設定
                renderer.setViewport(v.l*w, v.b*h, v.w*w, v.h*h);
                renderer.setScissor(v.l*w, v.b*h, v.w*w, v.h*h);
                renderer.setScissorTest(true);

                // ワイヤーフレーム切り替え
                pieces.forEach(p => {
                    p.material.forEach(m => m.wireframe = v.wire);
                });

                // カメラ回転
                v.camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.005);
                v.camera.lookAt(0, 0, 0);

                // **ここが修正ポイント**: RenderPassのカメラを現在の視点に切り替えてからComposerを実行
                renderPass.camera = v.camera;
                composer.render();
            });
            document.getElementById('timer').innerText = new Date().toLocaleTimeString('en-GB');
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            views.forEach(v => {
                v.camera.aspect = (window.innerWidth*v.w)/(window.innerHeight*v.h);
                v.camera.updateProjectionMatrix();
            });
        });
    </script>
</body>
</html>
