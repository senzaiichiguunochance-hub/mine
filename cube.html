<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Advanced Cyber Cube System</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Share Tech Mono', monospace; }
        #ui { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 30px; box-sizing: border-box; color: #00ffff; pointer-events: none; z-index: 10;
        }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,255,255,0.3); }
        .status-main { font-size: 32px; letter-spacing: 10px; text-shadow: 0 0 10px #00ffff; }
        .hud-data { font-size: 12px; line-height: 1.5; color: rgba(0,255,255,0.7); }
        .footer { font-size: 10px; display: flex; justify-content: space-between; }
        #glitch-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 255, 255, 0.05); opacity: 0; pointer-events: none; z-index: 5;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div id="glitch-overlay"></div>
    <div id="ui">
        <div class="header">
            <div>SYSTEM: <span id="status-text">INIT_SEQUENCE</span></div>
            <div id="timer">00:00:00</div>
        </div>
        <div class="hud-data" id="op-log">
            READY TO COMPUTE...<br>
            AWAITING INPUT...
        </div>
        <div class="footer">
            <div>CORE_TEMP: 32°C</div>
            <div>SECTOR_ALPHA: ACTIVE</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        let scene, renderer, pieces = [], moveHistory = [];
        const COLORS = { right: 0x0077ff, left: 0x00ff66, top: 0xffffff, bottom: 0xffdd00, front: 0xff0044, back: 0xff8800, inner: 0x050505 };
        
        const views = [
            { l: 0.25, b: 0.25, w: 0.5,  h: 0.5,  eye: [6, 6, 9], wire: false },
            { l: 0,    b: 0.7,  w: 0.25, h: 0.25, eye: [0, 10, 0], wire: true }, // 左上: ワイヤー
            { l: 0.75, b: 0.7,  w: 0.25, h: 0.25, eye: [8, 2, -8], wire: false },
            { l: 0,    b: 0,    w: 0.25, h: 0.25, eye: [-8, -4, 8], wire: true }, // 左下: ワイヤー
            { l: 0.75, b: 0,    w: 0.25, h: 0.25, eye: [0, 0, 12], wire: false }
        ];

        init();
        animate();
        run();

        function init() {
            scene = new THREE.Scene();
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.autoClear = false;
            document.body.appendChild(renderer.domElement);

            views.forEach(v => {
                v.camera = new THREE.PerspectiveCamera(40, (window.innerWidth*v.w)/(window.innerHeight*v.h), 0.1, 100);
                v.camera.position.set(...v.eye);
                v.camera.lookAt(0,0,0);
            });

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const p = new THREE.PointLight(0xffffff, 60); p.position.set(5, 10, 5); scene.add(p);

            createCube();
        }

        function createCube() {
            const geom = new RoundedBoxGeometry(0.92, 0.92, 0.92, 3, 0.08);
            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const mats = Array(6).fill().map(() => new THREE.MeshStandardMaterial({ color: COLORS.inner, metalness: 0.8, roughness: 0.2 }));
                        if (x === 1) apply(mats[0], COLORS.right);
                        if (x === -1) apply(mats[1], COLORS.left);
                        if (y === 1) apply(mats[2], COLORS.top);
                        if (y === -1) apply(mats[3], COLORS.bottom);
                        if (z === 1) apply(mats[4], COLORS.front);
                        if (z === -1) apply(mats[5], COLORS.back);
                        const mesh = new THREE.Mesh(geom, mats);
                        mesh.position.set(x, y, z);
                        mesh.userData.origPos = new THREE.Vector3(x, y, z); // 初期位置保存
                        scene.add(mesh);
                        pieces.push(mesh);
                    }
                }
            }
        }

        function apply(m, c) { m.color.setHex(c); m.emissive.setHex(c); m.emissiveIntensity = 0.4; }

        async function explodeEffect(expand = true) {
            const duration = 40;
            for(let i=0; i<=duration; i++) {
                const factor = expand ? i/duration : (duration-i)/duration;
                pieces.forEach(p => {
                    const dir = p.userData.origPos.clone().normalize();
                    p.position.copy(p.userData.origPos).add(dir.multiplyScalar(factor * 2));
                    p.scale.setScalar(1 - factor * 0.3);
                });
                await new Promise(r => requestAnimationFrame(r));
            }
        }

        function triggerGlitch() {
            const overlay = document.getElementById('glitch-overlay');
            overlay.style.opacity = "0.5";
            setTimeout(() => overlay.style.opacity = "0", 50);
        }

        async function rotateLayer(axis, layer, angle, isSolving = false) {
            const log = document.getElementById('op-log');
            log.innerHTML = `EXEC: ROTATE_${axis.toUpperCase()}(L:${layer}, A:${angle})<br>` + log.innerHTML.split('<br>').slice(0, 5).join('<br>');
            
            if (isSolving && Math.random() > 0.9) triggerGlitch();

            return new Promise(resolve => {
                const group = new THREE.Group();
                scene.add(group);
                const targets = [];
                const worldPos = new THREE.Vector3();
                pieces.forEach(p => {
                    p.getWorldPosition(worldPos);
                    if (Math.round(worldPos[axis]) === layer) targets.push(p);
                });
                targets.forEach(p => group.attach(p));

                let progress = 0;
                function step() {
                    progress += 0.1;
                    const t = Math.min(progress, 1);
                    const ease = t * t * (3 - 2 * t);
                    group.rotation[axis] = (angle * Math.PI / 2) * ease;
                    if (progress < 1) requestAnimationFrame(step);
                    else {
                        targets.forEach(p => {
                            scene.attach(p);
                            p.position.set(Math.round(p.position.x), Math.round(p.position.y), Math.round(p.position.z));
                            p.rotation.set(Math.round(p.rotation.x/(Math.PI/2))*(Math.PI/2), Math.round(p.rotation.y/(Math.PI/2))*(Math.PI/2), Math.round(p.rotation.z/(Math.PI/2))*(Math.PI/2));
                        });
                        scene.remove(group);
                        resolve();
                    }
                }
                step();
            });
        }

        async function run() {
            const txt = document.getElementById('status-text');
            while(true) {
                await new Promise(r => setTimeout(r, 2000));
                
                txt.innerText = "DECONSTRUCTING";
                await explodeEffect(true);
                await explodeEffect(false);

                txt.innerText = "SCRAMBLING";
                const axes = ['x', 'y', 'z'], layers = [-1, 0, 1];
                for(let i=0; i<12; i++) {
                    const m = { axis: axes[Math.floor(Math.random()*3)], layer: layers[Math.floor(Math.random()*3)], angle: Math.random() > 0.5 ? 1 : -1 };
                    moveHistory.push(m);
                    await rotateLayer(m.axis, m.layer, m.angle);
                }

                txt.innerText = "SOLVING";
                await new Promise(r => setTimeout(r, 1000));
                while(moveHistory.length > 0) {
                    const m = moveHistory.pop();
                    await rotateLayer(m.axis, m.layer, -m.angle, true);
                }
                txt.innerText = "SYNCHRONIZED";
                await new Promise(r => setTimeout(r, 3000));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.clear();
            const w = window.innerWidth, h = window.innerHeight;

            views.forEach(v => {
                renderer.setViewport(v.l*w, v.b*h, v.w*w, v.h*h);
                renderer.setScissor(v.l*w, v.b*h, v.w*w, v.h*h);
                renderer.setScissorTest(true);

                // ワイヤーフレーム演出の切り替え
                pieces.forEach(p => {
                    p.material.forEach(m => m.wireframe = v.wire);
                });

                v.camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.005);
                v.camera.lookAt(0, 0, 0);
                renderer.render(scene, v.camera);
            });
            document.getElementById('timer').innerText = new Date().toLocaleTimeString('en-GB');
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            views.forEach(v => {
                v.camera.aspect = (window.innerWidth*v.w)/(window.innerHeight*v.h);
                v.camera.updateProjectionMatrix();
            });
        });
    </script>
</body>
</html>
