<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Perfect Specs & Vivid Colors</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; pointer-events: none; }
        .status { font-size: 22px; font-weight: bold; letter-spacing: 1px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="ui"><div class="status" id="status-text">Ready</div></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script id="main-script" type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let pieces = [];
        let moveHistory = [];
        
        // --- 修正：仕様を守った鮮やかな配色 (Vivid BOY Scheme) ---
        const COLORS = {
            right:  0x0045ad, // 鮮やかな青
            left:   0x009b48, // 鮮やかな緑
            top:    0xffffff, // 純白
            bottom: 0xffd500, // 鮮やかな黄
            front:  0xb71234, // 深みのある赤
            back:   0xff5800, // 鮮やかなオレンジ
            inner:  0x1a1a1a  // 内部のプラスチック黒
        };

        init();
        animate();
        runSimulation();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(5, 5, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // 色を綺麗に見せるためのレンダラー設定
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // ライティング：多方向から光を当てて角の光沢を出す
            const amb = new THREE.AmbientLight(0xffffff, 0.8); scene.add(amb);
            const sun1 = new THREE.DirectionalLight(0xffffff, 1.2); sun1.position.set(5, 10, 7); scene.add(sun1);
            const sun2 = new THREE.DirectionalLight(0xffffff, 0.5); sun2.position.set(-5, -5, -2); scene.add(sun2);

            createCube();
        }

        function createCube() {
            // 角を少し丸く見せるための細工（隙間を僅かに空ける）
            const geom = new THREE.BoxGeometry(0.96, 0.96, 0.96);
            
            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const materials = [];
                        for(let i=0; i<6; i++) {
                            materials.push(new THREE.MeshStandardMaterial({
                                color: COLORS.inner,
                                roughness: 0.1, // 少し光沢を出す
                                metalness: 0.2
                            }));
                        }

                        // 仕様通りの配色割り当て
                        if (x === 1)  applyColor(materials[0], COLORS.right);
                        if (x === -1) applyColor(materials[1], COLORS.left);
                        if (y === 1)  applyColor(materials[2], COLORS.top);
                        if (y === -1) applyColor(materials[3], COLORS.bottom);
                        if (z === 1)  applyColor(materials[4], COLORS.front);
                        if (z === -1) applyColor(materials[5], COLORS.back);

                        const mesh = new THREE.Mesh(geom, materials);
                        mesh.position.set(x, y, z);
                        scene.add(mesh);
                        pieces.push(mesh);
                    }
                }
            }
        }

        function applyColor(mat, colorHex) {
            mat.color.setHex(colorHex);
            // 表面に微かな反射光を足して高級感を出す
            mat.emissive.setHex(colorHex);
            mat.emissiveIntensity = 0.05;
        }

        async function rotateLayer(axis, layer, angle) {
            return new Promise(resolve => {
                const group = new THREE.Group();
                scene.add(group);
                
                const targets = pieces.filter(p => {
                    const pos = new THREE.Vector3();
                    p.getWorldPosition(pos);
                    return Math.round(pos[axis]) === layer;
                });

                targets.forEach(p => group.attach(p));

                let progress = 0;
                const targetRad = angle * (Math.PI / 2);
                
                function move() {
                    progress += 0.08;
                    if (progress < 1) {
                        // 滑らかな回転曲線
                        const ease = 1 - Math.pow(1 - progress, 3);
                        group.rotation[axis] = targetRad * ease;
                        requestAnimationFrame(move);
                    } else {
                        group.rotation[axis] = targetRad;
                        targets.forEach(p => {
                            scene.attach(p);
                            p.position.set(Math.round(p.position.x), Math.round(p.position.y), Math.round(p.position.z));
                            p.updateMatrixWorld();
                        });
                        scene.remove(group);
                        resolve();
                    }
                }
                move();
            });
        }

        async function runSimulation() {
            const status = document.getElementById('status-text');
            await new Promise(r => setTimeout(r, 1500));

            // 1. スクランブル
            status.innerText = "Scrambling...";
            const axes = ['x', 'y', 'z'], layers = [-1, 0, 1];
            for(let i=0; i<20; i++) {
                const m = { axis: axes[Math.floor(Math.random()*3)], layer: layers[Math.floor(Math.random()*3)], angle: Math.random() > 0.5 ? 1 : -1 };
                moveHistory.push(m);
                await rotateLayer(m.axis, m.layer, m.angle);
            }

            await new Promise(r => setTimeout(r, 1000));

            // 2. 解決（論理的な逆再生）
            status.innerText = "Solving...";
            while(moveHistory.length > 0) {
                const m = moveHistory.pop();
                await rotateLayer(m.axis, m.layer, -m.angle);
            }

            status.innerText = "Solved!";
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
