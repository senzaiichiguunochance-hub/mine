<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Energy Core Protocol - Cyber Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Share Tech Mono', monospace; }
        #ui { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 30px; box-sizing: border-box; color: #00ffff; pointer-events: none; z-index: 10;
        }
        .header { border-left: 5px solid #00ffff; padding-left: 15px; }
        .status-main { font-size: 24px; letter-spacing: 5px; color: #fff; text-shadow: 0 0 10px #00ffff; }
        .hud-left { position: absolute; left: 30px; top: 150px; font-size: 10px; color: rgba(0,255,255,0.4); transform: rotate(-90deg); transform-origin: left; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
    <a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

    <div id="ui">
        <div class="header">
            <div class="status-main">PROTOCOL: <span id="status-text">IDLE</span></div>
            <div style="font-size: 10px;">CORE_STABILITY: <span id="stability">98.4</span>%</div>
        </div>
        <div class="hud-left">ESTABLISHED_LINK // 0xFA42-99B</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, renderer, composer, grid, pulse, pieces = [], moveHistory = [];
        
        // --- cube.html 本来のサイバーパンク配色 ---
        const COLORS = { 
            right: 0x00aaff, // ネオンブルー
            left: 0x00ff44,  // ネオングリーン
            top: 0xffffff,   // ホワイト
            bottom: 0xffea00,// イエロー
            front: 0xff0055, // ネオンピンク
            back: 0xff6600,  // オレンジ
            inner: 0x0a0a0a  // 黒
        };
        
        const views = [
            { l: 0, b: 0, w: 1, h: 1, eye: [6, 6, 9], wire: false },
            { l: 0.02, b: 0.75, w: 0.2, h: 0.2, eye: [0, 12, 0], wire: true },
            { l: 0.78, b: 0.05, w: 0.2, h: 0.2, eye: [10, 0, 0], wire: false }
        ];

        init();
        animate();
        run();

        function init() {
            scene = new THREE.Scene();
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.autoClear = false;
            document.body.appendChild(renderer.domElement);

            views.forEach(v => {
                v.camera = new THREE.PerspectiveCamera(35, (window.innerWidth*v.w)/(window.innerHeight*v.h), 0.1, 100);
                v.camera.position.set(...v.eye);
                v.camera.lookAt(0,0,0);
            });

            composer = new EffectComposer(renderer);
            // cube.html の強い発光(Bloom)設定
            const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.85);
            composer.addPass(new RenderPass(scene, views[0].camera));
            composer.addPass(bloom);

            grid = new THREE.GridHelper(30, 60, 0x00ffff, 0x002222);
            grid.position.y = -6;
            scene.add(grid);

            // 網目パルス（クリア時に放出）
            const pulseGeo = new THREE.SphereGeometry(1, 32, 32);
            const pulseMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0 });
            pulse = new THREE.Mesh(pulseGeo, pulseMat);
            scene.add(pulse);

            scene.add(new THREE.AmbientLight(0xffffff, 0.1));
            const p = new THREE.PointLight(0xffffff, 100); p.position.set(5, 10, 5); scene.add(p);

            createCube();
        }

        function createCube() {
            const geom = new RoundedBoxGeometry(0.92, 0.92, 0.92, 4, 0.1);
            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const mats = Array(6).fill().map(() => new THREE.MeshStandardMaterial({ 
                            color: COLORS.inner, 
                            metalness: 0.8, 
                            roughness: 0.1 
                        }));
                        if (x === 1) apply(mats[0], COLORS.right);
                        if (x === -1) apply(mats[1], COLORS.left);
                        if (y === 1) apply(mats[2], COLORS.top);
                        if (y === -1) apply(mats[3], COLORS.bottom);
                        if (z === 1) apply(mats[4], COLORS.front);
                        if (z === -1) apply(mats[5], COLORS.back);
                        const mesh = new THREE.Mesh(geom, mats);
                        mesh.position.set(x, y, z);
                        scene.add(mesh);
                        pieces.push(mesh);
                    }
                }
            }
        }

        function apply(m, c) { 
            m.color.setHex(c); 
            m.emissive.setHex(c); 
            m.emissiveIntensity = 0.8; // 発光を強く
        }

        async function triggerPulse() {
            pulse.scale.setScalar(0.5);
            pulse.material.opacity = 1.0;
            const duration = 40;
            for(let i=0; i<duration; i++) {
                pulse.scale.addScalar(0.25);
                pulse.material.opacity -= 1.0/duration;
                await new Promise(r => requestAnimationFrame(r));
            }
            pulse.material.opacity = 0;
        }

        async function rotateLayer(axis, layer, angle) {
            return new Promise(resolve => {
                const group = new THREE.Group();
                scene.add(group);
                const targets = [];
                const tempPos = new THREE.Vector3();
                pieces.forEach(p => {
                    p.getWorldPosition(tempPos);
                    if (Math.round(tempPos[axis]) === layer) targets.push(p);
                });
                targets.forEach(p => group.attach(p));
                let progress = 0;
                function step() {
                    progress += 0.1;
                    group.rotation[axis] = (angle * Math.PI / 2) * Math.min(progress, 1);
                    if (progress < 1) requestAnimationFrame(step);
                    else {
                        targets.forEach(p => {
                            scene.attach(p);
                            p.position.set(Math.round(p.position.x), Math.round(p.position.y), Math.round(p.position.z));
                            p.rotation.set(
                                Math.round(p.rotation.x/(Math.PI/2))*(Math.PI/2),
                                Math.round(p.rotation.y/(Math.PI/2))*(Math.PI/2),
                                Math.round(p.rotation.z/(Math.PI/2))*(Math.PI/2)
                            );
                        });
                        scene.remove(group);
                        resolve();
                    }
                }
                step();
            });
        }

        async function run() {
            const txt = document.getElementById('status-text');
            const stab = document.getElementById('stability');
            while(true) {
                await new Promise(r => setTimeout(r, 2000));
                txt.innerText = "SCRAMBLING";
                moveHistory = [];
                for(let i=0; i<10; i++) {
                    const move = {
                        axis: ['x','y','z'][Math.floor(Math.random()*3)],
                        layer: [-1,0,1][Math.floor(Math.random()*3)],
                        angle: Math.random()>0.5 ? 1 : -1
                    };
                    moveHistory.push(move);
                    await rotateLayer(move.axis, move.layer, move.angle);
                }
                await new Promise(r => setTimeout(r, 1000));
                txt.innerText = "RESTORING";
                while(moveHistory.length > 0) {
                    const move = moveHistory.pop();
                    await rotateLayer(move.axis, move.layer, -move.angle);
                }
                txt.innerText = "SYNCHRONIZED";
                stab.innerText = "100.0";
                await triggerPulse(); 
                await new Promise(r => setTimeout(r, 2000));
                stab.innerText = (95 + Math.random()*4).toFixed(1);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.clear();
            const w = window.innerWidth, h = window.innerHeight;
            grid.position.z = Math.sin(Date.now() * 0.001) * 0.2;
            views.forEach(v => {
                renderer.setViewport(v.l*w, v.b*h, v.w*w, v.h*h);
                renderer.setScissor(v.l*w, v.b*h, v.w*w, v.h*h);
                renderer.setScissorTest(true);
                pieces.forEach(p => p.material.forEach(m => m.wireframe = v.wire));
                v.camera.lookAt(0,0,0);
                composer.passes[0].camera = v.camera;
                composer.render();
            });
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth, h = window.innerHeight;
            renderer.setSize(w, h);
            composer.setSize(w, h);
            views.forEach(v => {
                v.camera.aspect = (w*v.w)/(h*v.h);
                v.camera.updateProjectionMatrix();
            });
        });
    </script>
</body>
</html>
