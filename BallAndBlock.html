<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Ball vs Blocks Simulator</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: sans-serif; overflow: hidden; display: flex; }
        
        /* 設定パネル */
        #settings { 
            width: 300px; padding: 20px; background: #111; border-right: 2px solid #333; 
            height: 100vh; overflow-y: auto; box-sizing: border-box;
            transition: transform 0.3s ease; z-index: 1000;
        }

        /* モバイル用トグルボタン */
        #menu-toggle {
            position: absolute; top: 15px; left: 15px; z-index: 1100;
            background: #4CAF50; border: none; color: white; padding: 10px 15px;
            border-radius: 4px; cursor: pointer; font-weight: bold; display: none;
        }

        @media screen and (max-width: 900px) {
            #settings {
                position: absolute; left: 0; transform: translateX(-100%);
                background: rgba(17, 17, 17, 0.95);
            }
            #settings.open { transform: translateX(0); }
            #menu-toggle { display: block; }
        }

        #game-container { flex-grow: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        canvas { background: #000; display: block; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8em; margin-bottom: 5px; color: #888; }
        input[type="range"] { width: 100%; cursor: pointer; }
        button#start-btn { width: 100%; padding: 12px; background: #4CAF50; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        button#start-btn:hover { background: #45a049; box-shadow: 0 0 15px #4CAF50; }
        
        #hud { position: absolute; top: 10px; right: 20px; pointer-events: none; text-shadow: 0 0 10px rgba(255,255,255,0.5); text-align: right; }
        .stat { font-size: 1.2em; margin-bottom: 5px; font-variant-numeric: tabular-nums; }
        #combo-container { color: #00f2ff; font-weight: bold; transform: scale(1); transition: 0.1s; }
        .nav-btn { position: absolute; top: 20px; right: 10px; font-size: 14px; color: #eee; text-decoration: none; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 4px; z-index: 1000; display: none; }
    </style>
</head>
<body>
<button id="menu-toggle">Settings ☰</button>
<a href="menu.html" class="nav-btn">メニューに戻る</a>

<div id="settings">
    <h2 style="color: #4CAF50;">NEON SIMULATOR</h2>
    <div class="control-group">
        <label>制限時間: <span id="val-time">60</span>秒</label>
        <input type="range" id="input-time" min="30" max="300" step="30" value="60">
    </div>
    <div class="control-group">
        <label>ボールの数: <span id="val-balls">50</span></label>
        <input type="range" id="input-balls" min="1" max="1000" step="1" value="50">
    </div>
    <div class="control-group">
        <label>ボールの速さ: <span id="val-bSpeed">5</span></label>
        <input type="range" id="input-bSpeed" min="2" max="15" step="1" value="5">
    </div>
    <div class="control-group">
        <label>ブロックの数: <span id="val-blocks">300</span></label>
        <input type="range" id="input-blocks" min="10" max="10000" step="10" value="300">
    </div>
    <div class="control-group">
        <label>中央へ寄る速さ: <span id="val-attract">0.01</span></label>
        <input type="range" id="input-attract" min="0" max="0.2" step="0.01" value="0.01">
    </div>
    <button id="start-btn">START / RESTART</button>
    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
    <div class="stat">High Score: <span id="high-score">0</span></div>
</div>

<div id="game-container">
    <div id="hud">
        <div class="stat">Time: <span id="timer">0.0</span>s</div>
        <div class="stat">Score: <span id="score">0</span></div>
        <div id="combo-container" class="stat">Combo: <span id="combo">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start-btn');
const settingsPanel = document.getElementById('settings');
const toggleBtn = document.getElementById('menu-toggle');

// UI初期化
const inputs = ['time', 'balls', 'bSpeed', 'blocks', 'attract'];
inputs.forEach(id => {
    const el = document.getElementById('input-' + id);
    el.oninput = () => document.getElementById('val-' + id).textContent = el.value;
});

toggleBtn.onclick = () => {
    settingsPanel.classList.toggle('open');
    setTimeout(resize, 305);
};

let balls = [];
let blocks = [];
let particles = [];
let score = 0;
let highScore = 0;
let timeLeft = 0;
let isRunning = false;
let lastTime = 0;
let combo = 0;
let lastHitTime = 0;
const COMBO_WINDOW = 1;
let shakeDuration = 0;
let shakeIntensity = 0;

const blockBaseTypes = [
    { color: '#00f2ff', glow: '#00b8ff', points: 1 },
    { color: '#7cfc00', glow: '#32cd32', points: 2 },
    { color: '#ff00ff', glow: '#ff00ff', points: 3 },
    { color: '#ffff00', glow: '#ffcc00', points: 5 },
    { color: '#ff4d4d', glow: '#ff0000', points: 8 },
    { color: '#ffffff', glow: '#00ffff', points: 10 }
];

function resize() {
    const isMobileMode = window.innerWidth <= 900;
    canvas.width = isMobileMode ? window.innerWidth : window.innerWidth - 300;
    canvas.height = window.innerHeight;
}
window.onresize = resize;
resize();

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; 
        this.size = Math.random() * 3 + 1;
        this.life = 1.0; 
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.vx = Math.cos(angle) * speed; 
        this.vy = Math.sin(angle) * speed;
    }
    update(deltaTime) {
        this.x += this.vx; this.y += this.vy;
        this.life -= 0.02;
    }
    draw() {
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function createParticles(x, y, color, count = 15) {
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
}

function triggerShake(intensity, duration) {
    shakeIntensity = intensity; shakeDuration = duration;
}

class Ball {
    constructor(speed) {
        this.r = 6; 
        this.x = canvas.width / 2; 
        this.y = canvas.height / 2;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed; 
        this.vy = Math.sin(angle) * speed;
        this.history = []; // 軌跡
    }
    update() {
        this.history.push({x: this.x, y: this.y});
        if(this.history.length > 8) this.history.shift();

        this.x += this.vx; this.y += this.vy;
        if (this.x < this.r) { this.x = this.r; this.vx *= -1; }
        if (this.x > canvas.width - this.r) { this.x = canvas.width - this.r; this.vx *= -1; }
        if (this.y < this.r) { this.y = this.r; this.vy *= -1; }
        if (this.y > canvas.height - this.r) { this.y = canvas.height - this.r; this.vy *= -1; }
    }
    draw() {
        // トレイル描画
        this.history.forEach((pos, i) => {
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, this.r * (i / 8), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${i / 20})`;
            ctx.fill();
        });

        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#fff";
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.restore();
    }
}

class Block {
    constructor(x, y) {
        this.size = 18; this.x = x; this.y = y;
        this.rotation = Math.random() * Math.PI;
        this.init();
    }
    init() {
        const rand = Math.random();
        if (rand < 0.05) {
            this.type = 'explosive'; this.hp = 1; 
            this.color = '#ff4d4d'; this.glow = '#ff0000'; this.points = 25;
        } else if (rand < 0.15) {
            this.type = 'tough'; this.hp = 3; this.maxHp = 3;
            this.color = '#a0a0a0'; this.glow = '#ffffff'; this.points = 15;
        } else {
            this.type = 'normal';
            const b = blockBaseTypes[Math.floor(Math.random() * blockBaseTypes.length)];
            this.color = b.color; this.glow = b.glow; this.points = b.points;
            this.hp = 1;
        }
    }
    spawn() {
        const side = Math.floor(Math.random() * 4);
        if(side === 0) { this.x = Math.random() * canvas.width; this.y = -30; }
        else if(side === 1) { this.x = canvas.width + 30; this.y = Math.random() * canvas.height; }
        else if(side === 2) { this.x = Math.random() * canvas.width; this.y = canvas.height + 30; }
        else { this.x = -30; this.y = Math.random() * canvas.height; }
        this.vx = 0; this.vy = 0; this.init();
    }
    update(attraction) {
        const dx = canvas.width / 2 - this.x;
        const dy = canvas.height / 2 - this.y;
        const dist = Math.max(1, Math.hypot(dx, dy));
        this.x += (dx / dist) * attraction * 60;
        this.y += (dy / dist) * attraction * 60;
        this.rotation += 0.02;
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.glow;
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        if(this.type === 'tough') {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = this.hp;
            ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
        }
        ctx.restore();
    }
}

function initGame() {
    balls = []; blocks = []; particles = [];
    score = 0; combo = 0;
    timeLeft = parseFloat(document.getElementById('input-time').value);
    const ballCount = parseInt(document.getElementById('input-balls').value);
    const blockCount = parseInt(document.getElementById('input-blocks').value);
    const ballSpeed = parseFloat(document.getElementById('input-bSpeed').value);

    for (let i = 0; i < ballCount; i++) balls.push(new Ball(ballSpeed));

    const cx = canvas.width / 2, cy = canvas.height / 2;
    for (let i = 0; i < blockCount; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * 250 + 150;
        blocks.push(new Block(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
    }

    isRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
    if (window.innerWidth <= 900) settingsPanel.classList.remove('open');
}

function handleBlockDestruction(block) {
    const now = performance.now() / 1000;
    combo = (now - lastHitTime < COMBO_WINDOW) ? combo + 1 : 1;
    lastHitTime = now;
    score += Math.round(block.points * (1 + (combo - 1) * 0.1));
    
    createParticles(block.x, block.y, block.color, 20);
    
    if (block.type === 'explosive') {
        triggerShake(12, 0.4);
        blocks.forEach(other => {
            if (other !== block && Math.hypot(block.x - other.x, block.y - other.y) < 130) {
                score += other.points;
                createParticles(other.x, other.y, other.color, 8);
                other.spawn();
            }
        });
    }
    block.spawn();
}

function adjustEntitiesInRealtime() {
    const targetBallCount = parseInt(document.getElementById('input-balls').value);
    const targetBallSpeed = parseFloat(document.getElementById('input-bSpeed').value);
    const targetBlockCount = parseInt(document.getElementById('input-blocks').value);

    while (balls.length < targetBallCount) balls.push(new Ball(targetBallSpeed));
    while (balls.length > targetBallCount) balls.pop();

    balls.forEach(ball => {
        const speed = Math.hypot(ball.vx, ball.vy);
        if (speed > 0) {
            ball.vx = (ball.vx / speed) * targetBallSpeed;
            ball.vy = (ball.vy / speed) * targetBallSpeed;
        }
    });

    while (blocks.length < targetBlockCount) {
        const nb = new Block(0, 0); nb.spawn(); blocks.push(nb);
    }
    while (blocks.length > targetBlockCount) blocks.pop();
}

function gameLoop(timestamp) {
    if (!isRunning) return;
    const deltaTime = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    timeLeft -= deltaTime;

    if (timestamp / 1000 - lastHitTime >= COMBO_WINDOW) combo = 0;

    if (timeLeft <= 0) {
        timeLeft = 0; isRunning = false;
        if (score > highScore) {
            highScore = score;
            document.getElementById('high-score').textContent = highScore;
        }
        alert("Game Over! Score: " + score);
        return;
    }
    
    adjustEntitiesInRealtime();

    // 背景描画（少し残像が残るように0.2の不透明度で塗りつぶし）
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    if (shakeDuration > 0) {
        shakeDuration -= deltaTime;
        ctx.save();
        ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
    }

    const attraction = parseFloat(document.getElementById('input-attract').value);
    
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => { p.update(); p.draw(); });

    const cx = canvas.width / 2, cy = canvas.height / 2;
    blocks.forEach(block => {
        block.update(attraction);
        if (Math.hypot(block.x - cx, block.y - cy) < 15) {
            score = Math.max(0, score - 5);
            createParticles(block.x, block.y, '#ff0000', 5);
            block.spawn();
        }
        block.draw();
    });

    balls.forEach(ball => {
        ball.update();
        blocks.forEach(block => {
            if (ball.x + ball.r > block.x - block.size/2 && ball.x - ball.r < block.x + block.size/2 &&
                ball.y + ball.r > block.y - block.size/2 && ball.y - ball.r < block.y + block.size/2) {
                
                const ox = (ball.r + block.size/2) - Math.abs(ball.x - block.x);
                const oy = (ball.r + block.size/2) - Math.abs(ball.y - block.y);
                if (ox < oy) {
                    ball.vx *= -1; ball.x += (ball.x < block.x ? -ox : ox);
                } else {
                    ball.vy *= -1; ball.y += (ball.y < block.y ? -oy : oy);
                }
                
                block.hp--;
                if (block.hp <= 0) handleBlockDestruction(block);
                else createParticles(ball.x, ball.y, '#fff', 5);
            }
        });
        ball.draw();
    });

    if (shakeDuration > 0) ctx.restore();

    // HUD更新
    document.getElementById('timer').textContent = Math.max(0, timeLeft).toFixed(1);
    document.getElementById('score').textContent = score;
    const comboEl = document.getElementById('combo');
    comboEl.textContent = combo;
    document.getElementById('combo-container').style.transform = combo > 0 ? `scale(${1 + Math.min(combo * 0.05, 1)})` : 'scale(1)';

    requestAnimationFrame(gameLoop);
}

startBtn.onclick = initGame;
window.onload = initGame;
</script>
</body>
</html>
