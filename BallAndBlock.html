<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Ball vs Blocks Simulator - Circular Start</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; display: flex; }
        
        /* 設定パネルの基本スタイル */
        #settings { 
            width: 300px; padding: 20px; background: #2a2a2a; border-right: 2px solid #444; 
            height: 100vh; overflow-y: auto; box-sizing: border-box;
            transition: transform 0.3s ease; z-index: 1000;
        }

        /* モバイル用トグルボタン */
        #menu-toggle {
            position: absolute; top: 15px; left: 15px; z-index: 1100;
            background: #4CAF50; border: none; color: white; padding: 10px 15px;
            border-radius: 4px; cursor: pointer; font-weight: bold; display: none;
        }

        /* 画面幅が900px未満（300pxが1/3以上を占める場合）のスタイル */
        @media screen and (max-width: 900px) {
            #settings {
                position: absolute;
                left: 0;
                transform: translateX(-100%);
                background: rgba(42, 42, 42, 0.95);
            }
            #settings.open {
                transform: translateX(0);
            }
            #menu-toggle {
                display: block;
            }
        }

        #game-container { flex-grow: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        canvas { background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); display: block; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8em; margin-bottom: 5px; color: #ccc; }
        input[type="range"] { width: 100%; }
        button#start-btn { width: 100%; padding: 10px; background: #4CAF50; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button#start-btn:hover { background: #45a049; }
        
        #hud { position: absolute; top: 10px; right: 10px; pointer-events: none; text-shadow: 1px 1px 2px #000; text-align: right; }
        .stat { font-size: 1.2em; margin-bottom: 5px; }
        .nav-btn { position: absolute; top: 20px; right: 10px; font-size: 14px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000; }
    </style>
</head>
<body>
<button id="menu-toggle">Settings ☰</button>
<a href="menu.html" class="nav-btn">メニューに戻る</a>

<div id="settings">
    <h2>Settings</h2>
    <div class="control-group">
        <label>制限時間: <span id="val-time">60</span>秒</label>
        <input type="range" id="input-time" min="30" max="300" step="30" value="60">
    </div>
    <div class="control-group">
        <label>ボールの数: <span id="val-balls">3</span></label>
        <input type="range" id="input-balls" min="1" max="1000" step="1" value="3">
    </div>
    <div class="control-group">
        <label>ボールの速さ: <span id="val-bSpeed">5</span></label>
        <input type="range" id="input-bSpeed" min="2" max="15" step="1" value="5">
    </div>
    <div class="control-group">
        <label>ブロックの数: <span id="val-blocks">1000</span></label>
        <input type="range" id="input-blocks" min="10" max="10000" step="10" value="1000">
    </div>
    <div class="control-group">
        <label>中央へ寄る速さ: <span id="val-attract">0.01</span></label>
        <input type="range" id="input-attract" min="0" max="0.2" step="0.01" value="0.01">
    </div>
    <button id="start-btn">Start / Restart Game</button>
    <hr>
    <div class="stat">High Score: <span id="high-score">0</span></div>
</div>

<div id="game-container">
    <div id="hud">
        <div class="stat">Time: <span id="timer">0.0</span>s</div>
        <div class="stat">Score: <span id="score">0</span></div>
        <div class="stat">Combo: <span id="combo">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start-btn');
const settingsPanel = document.getElementById('settings');
const toggleBtn = document.getElementById('menu-toggle');

// UI Elements for updates
const inputs = ['time', 'balls', 'bSpeed', 'blocks', 'attract'];
inputs.forEach(id => {
    const el = document.getElementById('input-' + id);
    el.oninput = () => document.getElementById('val-' + id).textContent = el.value;
});

// パネルの出し入れ
toggleBtn.onclick = () => {
    settingsPanel.classList.toggle('open');
    setTimeout(resize, 305);
};

let balls = [];
let blocks = [];
let particles = [];
let score = 0;
let highScore = 0;
let timeLeft = 0;
let isRunning = false;
let lastTime = 0;
let combo = 0;
let lastHitTime = 0;
const COMBO_WINDOW = 1;
let shakeDuration = 0;
let shakeIntensity = 0;

const blockBaseTypes = [
    { color: '#ff7675', points: 1 }, { color: '#74b9ff', points: 2 },
    { color: '#55efc4', points: 3 }, { color: '#ffeaa7', points: 5 },
    { color: '#a29bfe', points: 8 }, { color: '#fd79a8', points: 10 }
];

function resize() {
    // 画面幅が900pxより大きい場合は、常に左側にパネルがあるものとして計算
    const isMobileMode = window.innerWidth <= 900;
    canvas.width = isMobileMode ? window.innerWidth : window.innerWidth - 300;
    canvas.height = window.innerHeight;
}
window.onresize = resize;
resize();

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.size = Math.random() * 5 + 2;
        this.life = 1; this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 50 + 20;
        this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
    }
    update(deltaTime) {
        this.x += this.vx * deltaTime; this.y += this.vy * deltaTime;
        this.vy += 100 * deltaTime; this.life -= deltaTime;
        this.vx *= 0.99; this.vy *= 0.99;
    }
    draw() {
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life > 0 ? this.life : 0;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.restore();
    }
}

function createParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
}

function triggerShake(intensity, duration) {
    shakeIntensity = intensity; shakeDuration = duration;
}

class Ball {
    constructor(speed) {
        this.r = 8; this.x = canvas.width / 2; this.y = canvas.height / 2;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
        this.color = 'white';
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < this.r) { this.x = this.r; this.vx *= -1; }
        if (this.x > canvas.width - this.r) { this.x = canvas.width - this.r; this.vx *= -1; }
        if (this.y < this.r) { this.y = this.r; this.vy *= -1; }
        if (this.y > canvas.height - this.r) { this.y = canvas.height - this.r; this.vy *= -1; }
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = this.color; ctx.fill(); ctx.closePath();
    }
}

class Block {
    constructor(x, y) {
        this.size = 20; this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.init();
    }
    init() {
        const rand = Math.random();
        if (rand < 0.05) {
            this.type = 'explosive'; this.hp = 1; this.maxHp = 1;
            this.color = '#ff4d4d'; this.points = 25;
        } else if (rand < 0.15) {
            this.type = 'tough'; this.hp = 3; this.maxHp = 3;
            this.color = '#84817a'; this.points = 15;
        } else {
            this.type = 'normal';
            const baseType = blockBaseTypes[Math.floor(Math.random() * blockBaseTypes.length)];
            this.color = baseType.color; this.points = baseType.points;
            this.hp = 1; this.maxHp = 1;
        }
    }
    spawn() {
        const side = Math.floor(Math.random() * 4);
        if(side === 0) { this.x = Math.random() * canvas.width; this.y = -50; }
        else if(side === 1) { this.x = canvas.width + 50; this.y = Math.random() * canvas.height; }
        else if(side === 2) { this.x = Math.random() * canvas.width; this.y = canvas.height + 50; }
        else { this.x = -50; this.y = Math.random() * canvas.height; }
        this.vx = 0; this.vy = 0; this.init();
    }
    takeDamage() {
        this.hp--; return this.hp <= 0;
    }
    update(attraction) {
        const centerX = canvas.width / 2, centerY = canvas.height / 2;
        const angle = Math.atan2(centerY - this.y, centerX - this.x);
        this.vx += Math.cos(angle) * attraction; this.vy += Math.sin(angle) * attraction;
        this.x += this.vx; this.y += this.vy;
        this.vx *= 0.98; this.vy *= 0.98;
    }
    draw() {
        if (this.type === 'tough') {
            const ratio = Math.max(0, this.hp / this.maxHp);
            ctx.fillStyle = `rgb(${132 * ratio + 40}, ${129 * ratio + 40}, ${122 * ratio + 40})`;
        } else { ctx.fillStyle = this.color; }
        ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
    }
}

function initGame() {
    balls = []; blocks = []; particles = [];
    score = 0; combo = 0;
    timeLeft = parseFloat(document.getElementById('input-time').value);
    const ballCount = parseInt(document.getElementById('input-balls').value);
    const blockCount = parseInt(document.getElementById('input-blocks').value);
    const ballSpeed = parseFloat(document.getElementById('input-bSpeed').value);

    for (let i = 0; i < ballCount; i++) balls.push(new Ball(ballSpeed));

    const centerX = canvas.width / 2, centerY = canvas.height / 2;
    const innerRadius = 100, outerRadius = 300;
    for (let i = 0; i < blockCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.sqrt(Math.random()) * (outerRadius - innerRadius) + innerRadius;
        blocks.push(new Block(centerX + Math.cos(angle) * radius, centerY + Math.sin(angle) * radius));
    }

    isRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);

    // モバイルなら開始時に設定を閉じる
    if (window.innerWidth <= 900) {
        settingsPanel.classList.remove('open');
        setTimeout(resize, 305);
    }
}

function handleBlockDestruction(block) {
    const now = performance.now() / 1000;
    combo = (now - lastHitTime < COMBO_WINDOW) ? combo + 1 : 1;
    lastHitTime = now;
    score += Math.round(block.points * (1 + (combo - 1) * 0.1));
    createParticles(block.x, block.y, block.color);
    if (block.type === 'explosive') {
        triggerShake(8, 0.3);
        blocks.forEach(other => {
            if (other !== block && Math.hypot(block.x - other.x, block.y - other.y) < 100) {
                score += other.points;
                createParticles(other.x, other.y, other.color, 5);
                other.spawn();
            }
        });
    }
    block.spawn();
}

function adjustEntitiesInRealtime() {
    const targetBallCount = parseInt(document.getElementById('input-balls').value);
    const targetBallSpeed = parseFloat(document.getElementById('input-bSpeed').value);
    const targetBlockCount = parseInt(document.getElementById('input-blocks').value);

    while (balls.length < targetBallCount) balls.push(new Ball(targetBallSpeed));
    while (balls.length > targetBallCount) balls.pop();

    balls.forEach(ball => {
        const currentSpeed = Math.hypot(ball.vx, ball.vy);
        if (currentSpeed > 0.01 && Math.abs(currentSpeed - targetBallSpeed) > 0.1) {
            ball.vx = (ball.vx / currentSpeed) * targetBallSpeed;
            ball.vy = (ball.vy / currentSpeed) * targetBallSpeed;
        }
    });

    while (blocks.length < targetBlockCount) {
        const newBlock = new Block(0, 0);
        newBlock.spawn();
        blocks.push(newBlock);
    }
    while (blocks.length > targetBlockCount) blocks.pop();
}

function gameLoop(timestamp) {
    if (!isRunning) return;
    const deltaTime = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    timeLeft -= deltaTime;

    if (timestamp / 1000 - lastHitTime >= COMBO_WINDOW) combo = 0;

    if (timeLeft <= 0) {
        timeLeft = 0; isRunning = false;
        if (score > highScore) {
            highScore = score;
            document.getElementById('high-score').textContent = highScore;
        }
        alert("Game Over! Score: " + score);
    }
    
    adjustEntitiesInRealtime();

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (shakeDuration > 0) {
        shakeDuration -= deltaTime;
        ctx.save();
        ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
    }

    const attraction = parseFloat(document.getElementById('input-attract').value);
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => { p.update(deltaTime); p.draw(); });

    const centerX = canvas.width / 2, centerY = canvas.height / 2;
    blocks.forEach(block => {
        block.update(attraction);
        if (Math.hypot(block.x - centerX, block.y - centerY) < 10) {
            score -= block.points; block.spawn();
        }
        block.draw();
    });

    balls.forEach(ball => {
        ball.update();
        blocks.forEach(block => {
            if (ball.x + ball.r > block.x - block.size/2 && ball.x - ball.r < block.x + block.size/2 &&
                ball.y + ball.r > block.y - block.size/2 && ball.y - ball.r < block.y + block.size/2) {
                const overlapX = (ball.r + block.size/2) - Math.abs(ball.x - block.x);
                const overlapY = (ball.r + block.size/2) - Math.abs(ball.y - block.y);
                if (overlapX < overlapY) {
                    ball.vx *= -1; ball.x += (ball.x < block.x ? -overlapX : overlapX);
                } else {
                    ball.vy *= -1; ball.y += (ball.y < block.y ? -overlapY : overlapY);
                }
                if (block.takeDamage()) handleBlockDestruction(block);
            }
        });
        ball.draw();
    });

    if (shakeDuration > 0) ctx.restore();

    document.getElementById('timer').textContent = Math.max(0, timeLeft).toFixed(1);
    document.getElementById('score').textContent = score;
    document.getElementById('combo').textContent = combo;

    if (isRunning) requestAnimationFrame(gameLoop);
}

startBtn.onclick = initGame;

// 画面起動時に自動でスタート
window.onload = () => {
    initGame();
};
</script>
</body>
</html>
