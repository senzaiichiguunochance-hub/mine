<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>モグラたたき | 森のひろば</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
         カラーパレット（base.html のオレンジ系から「空と森」へ一新）
         ============================================================ */
      :root {
        --page-bg: linear-gradient(180deg, #79cdf7 0%, #c9edfb 32%, #dcf6c6 74%, #b9e893 100%);
        --card-bg: rgba(255, 255, 255, 0.97);
        --card-border: #8fd8ae;
        --card-shadow: 0 18px 40px rgba(21, 90, 52, 0.22), 0 3px 0 rgba(21, 90, 52, 0.08);
        --ink: #20362a;
        --muted: #5d7266;
        --primary: #0b9e6d;
        --primary-dark: #067647;
        --primary-deep: #045c36;
        --accent: #ffb020;
        --accent-dark: #b54708;
        --danger: #f04438;
        --box-bg: #effaf2;
        --box-border: #cdeeda;
        --chip-bg: #ffffff;
        --grass-1: #55c46e;
        --grass-2: #3aa856;
        --grass-edge: #2c8a44;
        --soil-1: #b57e50;
        --soil-2: #7c4a2d;
        --modal-bg: rgba(9, 43, 27, 0.62);
        --hint-bg: rgba(255, 255, 255, 0.82);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: linear-gradient(180deg, #052e2b 0%, #07332a 40%, #0a4028 78%, #0d4d2c 100%);
          --card-bg: #0e2a21;
          --card-border: #1f4d3a;
          --card-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
          --ink: #eaf7ee;
          --muted: #a7c4b2;
          --primary: #12b76a;
          --primary-dark: #067647;
          --primary-deep: #054f31;
          --box-bg: #123528;
          --box-border: #1e4a37;
          --chip-bg: #143a2a;
          --grass-1: #35a355;
          --grass-2: #268047;
          --grass-edge: #1c6b38;
          --modal-bg: rgba(2, 18, 11, 0.72);
          --hint-bg: rgba(10, 40, 26, 0.85);
        }
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html {
        -webkit-text-size-adjust: 100%;
        background: var(--page-bg);
        min-height: 100%;
      }

      body {
        font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 22px 12px 52px;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }

      /* 背景の流れる雲 */
      .cloud {
        position: fixed;
        z-index: 0;
        opacity: 0.75;
        pointer-events: none;
        animation: drift linear infinite;
      }
      .cloud.c1 { top: 4%; width: 150px; animation-duration: 74s; }
      .cloud.c2 { top: 13%; width: 96px; animation-duration: 105s; animation-delay: -38s; opacity: 0.55; }
      .cloud.c3 { top: 26%; width: 120px; animation-duration: 88s; animation-delay: -64s; opacity: 0.4; }
      @keyframes drift {
        from { transform: translateX(-30vw); }
        to { transform: translateX(115vw); }
      }
      @media (prefers-color-scheme: dark) { .cloud { opacity: 0.16; } }

      /* === メインカード（base.html のコンテナを継承） === */
      .container {
        position: relative;
        z-index: 1;
        background: var(--card-bg);
        border-radius: 24px;
        border: 2px solid var(--card-border);
        box-shadow: var(--card-shadow);
        padding: 18px 18px 20px;
        width: 100%;
        max-width: 560px;
      }

      /* === キービジュアル（描き起こしSVGシーン） === */
      .hero {
        border-radius: 16px;
        overflow: hidden;
        border: 2px solid var(--box-border);
        line-height: 0;
      }
      .hero svg { width: 100%; height: auto; display: block; }

      h1 {
        text-align: center;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--primary-deep);
        margin: 14px 0 2px;
        text-shadow: 0 2px 0 rgba(11, 158, 109, 0.18);
      }
      @media (prefers-color-scheme: dark) { h1 { color: #4ade80; text-shadow: none; } }
      .subtitle {
        text-align: center;
        font-family: "Baloo 2", "M PLUS Rounded 1c", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.34em;
        color: var(--muted);
        margin-bottom: 14px;
      }

      /* === スタッツ（base.html の .box-sub を発展） === */
      .stats-row { display: flex; gap: 10px; margin-bottom: 10px; }
      .box-sub {
        flex: 1;
        background: var(--box-bg);
        padding: 10px 8px 9px;
        border-radius: 14px;
        border: 1.5px solid var(--box-border);
        text-align: center;
      }
      .box-title {
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: var(--primary-dark);
        margin-bottom: 2px;
      }
      @media (prefers-color-scheme: dark) { .box-title { color: #4ade80; } }
      .box-value {
        font-family: "Baloo 2", sans-serif;
        font-size: 1.9rem;
        font-weight: 800;
        line-height: 1.05;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .box-value.combo-on { color: var(--accent-dark); }
      @media (prefers-color-scheme: dark) { .box-value.combo-on { color: var(--accent); } }
      .box-value.time-low { color: var(--danger); }

      #time-bar-track {
        height: 8px;
        background: var(--box-border);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 7px;
      }
      #time-bar-fill {
        height: 100%;
        width: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #12b76a, #7ce38b);
        transition: width 0.12s linear;
      }
      #time-bar-fill.low { background: linear-gradient(90deg, #f04438, #ff8a5c); }

      .meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 12px 0;
        flex-wrap: wrap;
      }
      .high-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: var(--chip-bg);
        border: 1.5px solid var(--box-border);
        border-radius: 999px;
        padding: 6px 14px 6px 10px;
        font-size: 0.78rem;
        font-weight: 800;
        color: var(--muted);
        min-height: 36px;
      }
      .high-chip b {
        font-family: "Baloo 2", sans-serif;
        font-size: 1.05rem;
        color: var(--accent-dark);
      }
      @media (prefers-color-scheme: dark) { .high-chip b { color: var(--accent); } }
      .high-chip svg { width: 17px; height: 17px; }

      /* === 難易度セグメント === */
      .difficulty-select { display: flex; gap: 6px; flex: 1 1 230px; }
      .diff-btn {
        flex: 1;
        min-height: 44px;
        padding: 8px 6px;
        white-space: nowrap;
        font-family: inherit;
        font-size: 0.82rem;
        font-weight: 800;
        background: var(--chip-bg);
        color: var(--muted);
        border: 1.5px solid var(--box-border);
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 2px 0 var(--box-border);
        transition: transform 0.1s, box-shadow 0.1s, background 0.15s, color 0.15s;
      }
      .diff-btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--box-border); }
      .diff-btn.selected {
        background: var(--primary);
        border-color: var(--primary-dark);
        color: #fff;
        box-shadow: 0 2px 0 var(--primary-dark);
      }
      .diff-btn:disabled { opacity: 0.45; cursor: not-allowed; }

      button:focus-visible, .hole:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      /* === ゲームボード（草原パネル） === */
      #board-area { position: relative; margin-top: 4px; }
      #board {
        position: relative;
        border-radius: 20px;
        padding: clamp(12px, 3.4vw, 20px);
        background:
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.055) 0 34px, rgba(0, 0, 0, 0.045) 34px 68px),
          linear-gradient(180deg, var(--grass-1), var(--grass-2));
        border: 2px solid var(--grass-edge);
        box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.25), inset 0 -10px 24px rgba(0, 60, 25, 0.22), 0 6px 16px rgba(21, 90, 52, 0.18);
      }
      #board.shake { animation: board-shake 0.22s ease; }
      @keyframes board-shake {
        0%, 100% { transform: translateX(0); }
        30% { transform: translateX(-4px); }
        65% { transform: translateX(4px); }
      }
      #game-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(8px, 2.6vw, 16px);
      }

      /* --- 穴とモグラ --- */
      .hole {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 0.94;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      .hole .mound-back,
      .hole .pit,
      .hole .mound-front { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; }
      .mound-back {
        bottom: 1%;
        width: 96%;
        height: 42%;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 34%, #c98f5c 0%, var(--soil-1) 46%, var(--soil-2) 100%);
        box-shadow: 0 4px 8px rgba(60, 32, 10, 0.35);
      }
      .pit {
        bottom: 15%;
        width: 78%;
        height: 31%;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 42%, #170c05 0%, #2b1709 58%, #41240f 100%);
        box-shadow: inset 0 7px 12px rgba(0, 0, 0, 0.9), inset 0 -3px 5px rgba(120, 72, 34, 0.55);
        z-index: 1;
      }
      .mole-clip {
        position: absolute;
        left: 0; right: 0; top: 0; bottom: 13%;
        overflow: hidden;
        z-index: 2;
        pointer-events: none;
      }
      .mole {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 86%;
        transform: translate(-50%, 108%);
        transition: transform 0.19s cubic-bezier(0.34, 1.45, 0.64, 1);
        line-height: 0;
        filter: drop-shadow(0 3px 3px rgba(43, 23, 8, 0.35));
      }
      .mole.up { transform: translate(-50%, 6%); }
      .mole.hit { transform: translate(-50%, 34%) scale(0.94); transition: transform 0.16s ease-in; }
      .mole svg { width: 100%; height: auto; display: block; overflow: visible; }
      .mole .eye-dizzy, .mole .mouth-dizzy { display: none; }
      .mole.hit .eye-normal, .mole.hit .mouth-normal { display: none; }
      .mole.hit .eye-dizzy, .mole.hit .mouth-dizzy { display: block; }
      .mole .sparkle { animation: twinkle 0.9s ease-in-out infinite alternate; transform-origin: center; transform-box: fill-box; }
      .mole .sparkle.s2 { animation-delay: 0.45s; }
      @keyframes twinkle { from { opacity: 0.25; transform: scale(0.7) rotate(0deg); } to { opacity: 1; transform: scale(1.15) rotate(20deg); } }
      .mole.hit .star-spin { animation: star-spin 0.7s linear infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes star-spin { to { transform: rotate(360deg); } }

      .mound-front {
        bottom: 0;
        width: 99%;
        height: 34%;
        z-index: 3;
        line-height: 0;
      }
      .mound-front svg { width: 100%; height: 100%; display: block; }
      .hole.miss-flash .pit { box-shadow: inset 0 7px 12px rgba(0,0,0,0.9), 0 0 0 4px rgba(240, 68, 56, 0.75); }

      .key-hint {
        position: absolute;
        top: 2%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        font-family: "Baloo 2", sans-serif;
        font-size: 0.66rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--muted);
        background: var(--hint-bg);
        border-radius: 6px;
        padding: 1px 7px;
        pointer-events: none;
      }

      .float-text {
        position: absolute;
        left: 50%;
        top: 16%;
        transform: translateX(-50%);
        z-index: 6;
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: clamp(1.15rem, 5.4vw, 1.6rem);
        color: #fff;
        -webkit-text-stroke: 4px var(--primary-dark);
        paint-order: stroke fill;
        text-shadow: 0 3px 0 rgba(4, 92, 54, 0.35);
        pointer-events: none;
        animation: float-up 0.72s ease-out forwards;
        white-space: nowrap;
      }
      .float-text.gold { -webkit-text-stroke-color: var(--accent-dark); text-shadow: 0 3px 0 rgba(181, 71, 8, 0.35); }
      @keyframes float-up {
        0% { transform: translate(-50%, 6px) scale(0.7); opacity: 0; }
        22% { transform: translate(-50%, 0) scale(1.12); opacity: 1; }
        100% { transform: translate(-50%, -44px) scale(1); opacity: 0; }
      }
      .particle {
        position: absolute;
        z-index: 5;
        pointer-events: none;
        border-radius: 50%;
        transition: transform 0.5s cubic-bezier(0.17, 0.67, 0.35, 1), opacity 0.5s ease-out;
      }
      .particle.star { border-radius: 0; clip-path: polygon(50% 0%, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0% 50%, 37% 37%); }

      /* === カウントダウン === */
      #countdown-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        background: rgba(6, 46, 25, 0.55);
        backdrop-filter: blur(2px);
      }
      #countdown-overlay span {
        font-family: "Baloo 2", sans-serif;
        font-size: clamp(3.4rem, 16vw, 5.2rem);
        font-weight: 800;
        color: #fff;
        -webkit-text-stroke: 6px var(--primary-dark);
        paint-order: stroke fill;
        text-shadow: 0 6px 0 rgba(4, 92, 54, 0.4);
        animation: count-pop 0.55s ease;
      }
      @keyframes count-pop { 0% { transform: scale(1.7); opacity: 0; } 60% { transform: scale(0.94); opacity: 1; } 100% { transform: scale(1); } }

      /* === プライマリボタン（base.html の .btn-primary を継承・発展） === */
      .btn-primary {
        background: linear-gradient(180deg, #14c07f, var(--primary) 55%, #0a8a5c);
        color: #fff;
        border: none;
        border-radius: 14px;
        padding: 15px 10px;
        font-family: inherit;
        font-size: 1.08rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        cursor: pointer;
        box-shadow: 0 5px 0 var(--primary-dark), 0 10px 18px rgba(11, 158, 109, 0.3);
        width: 100%;
        min-height: 56px;
        margin-top: 16px;
        transition: transform 0.1s, box-shadow 0.1s, filter 0.15s;
        text-shadow: 0 1px 2px rgba(4, 92, 54, 0.5);
      }
      .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
      .btn-primary:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--primary-dark); }
      .btn-primary:disabled { background: #9db8ab; box-shadow: 0 3px 0 #7d9a8b; cursor: not-allowed; text-shadow: none; }
      @media (prefers-color-scheme: dark) { .btn-primary:disabled { background: #33503f; box-shadow: 0 3px 0 #22382c; color: #8fb8a0; } }

      .btn-secondary {
        background: var(--chip-bg);
        border: 1.5px solid var(--box-border);
        color: var(--ink);
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 800;
        padding: 10px 12px;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 2px 0 var(--box-border);
        width: 100%;
        min-height: 48px;
        transition: transform 0.1s, box-shadow 0.1s;
      }
      .btn-secondary:active { transform: translateY(2px); box-shadow: 0 0 0 var(--box-border); }

      /* === ルール説明 === */
      .rules {
        background: var(--box-bg);
        border: 1.5px solid var(--box-border);
        border-radius: 14px;
        padding: 12px 14px;
        margin-top: 16px;
      }
      .rules .box-title { text-align: left; margin-bottom: 8px; }
      .rule-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.83rem;
        font-weight: 500;
        color: var(--ink);
        padding: 4px 0;
      }
      .rule-row svg { width: 26px; height: 26px; flex-shrink: 0; }
      .rule-row b { font-weight: 800; }
      .rule-note { font-size: 0.74rem; color: var(--muted); margin-top: 8px; line-height: 1.6; }

      /* === 結果モーダル === */
      #result-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: var(--modal-bg);
      }
      #result-card {
        background: var(--card-bg);
        border: 2px solid var(--card-border);
        border-radius: 22px;
        box-shadow: var(--card-shadow);
        padding: 22px 22px 20px;
        text-align: center;
        width: 100%;
        max-width: 340px;
        animation: card-in 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
      }
      @keyframes card-in { from { transform: translateY(18px) scale(0.94); opacity: 0; } to { transform: none; opacity: 1; } }
      #result-card .result-mole { width: 104px; margin: 0 auto; line-height: 0; }
      #result-card h2 {
        font-family: "Baloo 2", "M PLUS Rounded 1c", sans-serif;
        font-size: 1.05rem;
        letter-spacing: 0.3em;
        color: var(--muted);
        margin-top: 6px;
      }
      #result-score {
        font-family: "Baloo 2", sans-serif;
        font-size: 3.6rem;
        font-weight: 800;
        line-height: 1.1;
        color: var(--primary-dark);
      }
      @media (prefers-color-scheme: dark) { #result-score { color: #4ade80; } }
      #new-record-badge {
        display: none;
        width: fit-content;
        margin: 2px auto 10px;
        background: linear-gradient(180deg, #ffd25e, var(--accent));
        color: #7a3a00;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        padding: 5px 14px;
        border-radius: 999px;
        box-shadow: 0 3px 0 var(--accent-dark);
      }
      .result-stats { display: flex; gap: 8px; margin: 12px 0 4px; }
      .result-stats .box-sub { padding: 8px 4px 7px; }
      .result-stats .box-value { font-size: 1.3rem; }
      #result-highscore { font-size: 0.8rem; color: var(--muted); font-weight: 700; margin-top: 8px; }
      #result-card .btn-primary { margin-top: 14px; }
      #result-card .btn-secondary { margin-top: 10px; }

      @media (max-width: 380px) {
        h1 { font-size: 1.7rem; }
        .box-value { font-size: 1.6rem; }
        .container { padding: 14px 12px 16px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cloud, .mole .sparkle, .mole.hit .star-spin, #result-card { animation: none !important; }
        .mole, .particle, .float-text, #time-bar-fill { transition: none !important; }
        .float-text { animation-duration: 0.01s; }
        #board.shake { animation: none; }
      }

      /* === 右上：メニューに戻るボタン（base.html と同じ） === */
      .menu-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 11px;
        color: #71716a;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.9);
        padding: 4px 10px;
        border-radius: 999px;
        border: 1.5px solid #e4e4e7;
        font-weight: bold;
        z-index: 1000;
      }
    </style>
    <!-- GoatCounter アクセス解析 -->
    <script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>

    <!-- 右上固定リンク -->
    <a href="menu.html" class="menu-btn">メニューに戻る</a>

    <!-- 背景の雲 -->
    <svg class="cloud c1" viewBox="0 0 200 60" aria-hidden="true"><g fill="#ffffff"><ellipse cx="55" cy="40" rx="48" ry="18"/><ellipse cx="105" cy="28" rx="42" ry="22"/><ellipse cx="150" cy="42" rx="40" ry="15"/></g></svg>
    <svg class="cloud c2" viewBox="0 0 200 60" aria-hidden="true"><g fill="#ffffff"><ellipse cx="55" cy="40" rx="48" ry="18"/><ellipse cx="105" cy="28" rx="42" ry="22"/><ellipse cx="150" cy="42" rx="40" ry="15"/></g></svg>
    <svg class="cloud c3" viewBox="0 0 200 60" aria-hidden="true"><g fill="#ffffff"><ellipse cx="55" cy="40" rx="48" ry="18"/><ellipse cx="105" cy="28" rx="42" ry="22"/><ellipse cx="150" cy="42" rx="40" ry="15"/></g></svg>

    <!-- モグラの描き起こしフィギュア（バナー／アイコン共用） -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <g id="moleFigure">
          <circle cx="-52" cy="-148" r="17" fill="#8a5a3b"/><circle cx="-52" cy="-148" r="9" fill="#eec39c"/>
          <circle cx="52" cy="-148" r="17" fill="#8a5a3b"/><circle cx="52" cy="-148" r="9" fill="#eec39c"/>
          <ellipse cx="0" cy="-76" rx="74" ry="80" fill="#a06a42"/>

    <script>
      "use strict";
      const gameContainer = document.getElementById('game-container');
      const board = document.getElementById('board');
      const scoreDisplay = document.getElementById('score');
      const comboDisplay = document.getElementById('combo');
      const timeDisplay = document.getElementById('time');
      const timeBarFill = document.getElementById('time-bar-fill');
      const highScoreDisplay = document.getElementById('high-score');
      const startButton = document.getElementById('startButton');
      const countdownOverlay = document.getElementById('countdown-overlay');
      const countdownNum = document.getElementById('countdown-num');
      const difficultySelect = document.getElementById('difficulty-select');
      const resultOverlay = document.getElementById('result-overlay');
      const resultScore = document.getElementById('result-score');
      const resultHits = document.getElementById('result-hits');
      const resultMaxCombo = document.getElementById('result-maxcombo');
      const resultAccuracy = document.getElementById('result-accuracy');
      const resultHighScore = document.getElementById('result-highscore');
      const newRecordBadge = document.getElementById('new-record-badge');
      const retryButton = document.getElementById('retryButton');
      const closeResultButton = document.getElementById('closeResultButton');

      const DIFFICULTIES = {
        easy:   { duration: 30, startInterval: 1150, minInterval: 680, speedUp: 0.990 },
        normal: { duration: 25, startInterval: 920,  minInterval: 480, speedUp: 0.985 },
        hard:   { duration: 20, startInterval: 640,  minInterval: 310, speedUp: 0.968 },

      let currentDifficulty = 'normal';
      let settings = DIFFICULTIES.normal;

      const KEY_LAYOUTS = [
        ['KeyQ','KeyW','KeyE','KeyA','KeyS','KeyD','KeyZ','KeyX','KeyC'],
        ['Numpad7','Numpad8','Numpad9','Numpad4','Numpad5','Numpad6','Numpad1','Numpad2','Numpad3'],
        ['KeyU','KeyI','KeyO','KeyJ','KeyK','KeyL','KeyM','Comma','Period'],
      ];
      const KEY_HINTS = ['Q','W','E','A','S','D','Z','X','C'];

      /* ---------- モグラSVG（バリエーション生成） ---------- */
      const PALETTES = {
        normal: { ear:'#8a5a3b', inner:'#eec39c', fur:'#a06a42', shade:'#b57e50', belly:'#f0d7b4', muzzle:'#f5e0c0', paw:'#8a5a3b', line:'#6b4426' },
        gold:   { ear:'#d99a26', inner:'#ffe9a8', fur:'#f2b63c', shade:'#ffd968', belly:'#fff0bd', muzzle:'#ffedb8', paw:'#d99a26', line:'#8a5a12' },
      };
      const ACCESSORIES = {
        sprout: '<path d="M0 -158 C0 -166 -2 -170 -6 -176" stroke="#5da244" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M-6 -176 C-18 -182 -26 -178 -30 -168 C-20 -164 -10 -167 -6 -176 Z" fill="#69b84f"/><path d="M-4 -178 C4 -188 14 -188 20 -180 C12 -172 2 -172 -4 -178 Z" fill="#7cc75e"/>',
        flower: '<g><circle cx="52" cy="-160" r="8" fill="#ff8fb3"/><circle cx="66" cy="-152" r="8" fill="#ff8fb3"/><circle cx="62" cy="-140" r="8" fill="#ff8fb3"/><circle cx="46" cy="-142" r="8" fill="#ff8fb3"/><circle cx="44" cy="-154" r="8" fill="#ff8fb3"/><circle cx="54" cy="-151" r="6.5" fill="#ffd93f"/></g>',
        helmet: '<path d="M-58 -138 A58 58 0 0 1 58 -138 Z" fill="#ffc61a"/><rect x="-66" y="-142" width="132" height="11" rx="5.5" fill="#f5a623"/><rect x="-8" y="-196" width="16" height="18" rx="5" fill="#f5a623"/>',
        shades: '<g><rect x="-52" y="-118" width="42" height="26" rx="9" fill="#263238"/><rect x="10" y="-118" width="42" height="26" rx="9" fill="#263238"/><path d="M-10 -110 Q0 -116 10 -110" stroke="#263238" stroke-width="5" fill="none"/><path d="M-44 -112 L-24 -98" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><path d="M18 -112 L38 -98" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/></g>',
        crown:  '<path d="M-26 -160 L-30 -182 L-13 -168 L0 -186 L13 -168 L30 -182 L26 -160 Z" fill="#ffcf3d" stroke="#d99a26" stroke-width="3" stroke-linejoin="round"/><circle cx="0" cy="-166" r="4" fill="#e5637e"/>',
        none: '',
      };
      function moleSVG(golden, accessory) {
        const p = golden ? PALETTES.gold : PALETTES.normal;
        const acc = ACCESSORIES[golden ? 'crown' : accessory] || '';
        const sparkles = golden
          ? '<path class="sparkle" d="M-72 -150 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5z" fill="#fff3b0"/><path class="sparkle s2" d="M66 -96 l2.8 6.4 6.4 2.8 -6.4 2.8 -2.8 6.4 -2.8 -6.4 -6.4 -2.8 6.4 -2.8z" fill="#fff3b0"/>'
          : '';
        const dizzyStars = '<g class="star-spin" opacity="0"><path d="M-58 -168 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6z" fill="#ffb020"/><path d="M52 -176 l2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2z" fill="#ffb020"/></g>';
        return '<svg viewBox="-100 -200 200 200" aria-hidden="true">'
          + '<circle cx="-52" cy="-148" r="17" fill="' + p.ear + '"/><circle cx="-52" cy="-148" r="9" fill="' + p.inner + '"/>'
          + '<circle cx="52" cy="-148" r="17" fill="' + p.ear + '"/><circle cx="52" cy="-148" r="9" fill="' + p.inner + '"/>'
          + '<ellipse cx="0" cy="-76" rx="74" ry="80" fill="' + p.fur + '"/>'
          + '<ellipse cx="-26" cy="-118" rx="38" ry="30" fill="' + p.shade + '" opacity="0.75"/>'
          + '<ellipse cx="0" cy="-50" rx="46" ry="40" fill="' + p.belly + '"/>'
          + '<ellipse cx="-66" cy="-14" rx="16" ry="11" fill="' + p.paw + '" transform="rotate(24 -66 -14)"/>'
          + '<ellipse cx="66" cy="-14" rx="16" ry="11" fill="' + p.paw + '" transform="rotate(-24 66 -14)"/>'
          + '<circle cx="-44" cy="-70" r="9" fill="#f2a18f" opacity="0.55"/><circle cx="44" cy="-70" r="9" fill="#f2a18f" opacity="0.55"/>'
          + '<g stroke="#8a6844" stroke-width="2" stroke-linecap="round" opacity="0.6"><path d="M-30 -66 L-52 -70"/><path d="M-30 -58 L-50 -54"/><path d="M30 -66 L52 -70"/><path d="M30 -58 L50 -54"/></g>'
          + '<ellipse cx="0" cy="-64" rx="30" ry="21" fill="' + p.muzzle + '"/>'
          + '<g class="mouth-normal"><path d="M-9 -46 Q0 -39 9 -46" stroke="' + p.line + '" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="-6" y="-45" width="12" height="13" rx="3" fill="#ffffff" stroke="#d8c3a5" stroke-width="1.5"/></g>'
          + '<g class="mouth-dizzy"><ellipse cx="0" cy="-44" rx="7" ry="9" fill="' + p.line + '"/></g>'
          + '<ellipse cx="0" cy="-74" rx="14" ry="10" fill="#e5637e"/><ellipse cx="0" cy="-70" rx="14" ry="5" fill="#c94f68" opacity="0.55"/><circle cx="-5" cy="-78" r="3.5" fill="#ffffff" opacity="0.9"/>'
          + '<g class="eye-normal"><circle cx="-27" cy="-104" r="8.5" fill="#2b1a12"/><circle cx="-30" cy="-107" r="3" fill="#ffffff"/><circle cx="27" cy="-104" r="8.5" fill="#2b1a12"/><circle cx="24" cy="-107" r="3" fill="#ffffff"/></g>'
          + '<g class="eye-dizzy" stroke="#2b1a12" stroke-width="4.5" stroke-linecap="round"><path d="M-35 -112 L-19 -96 M-19 -112 L-35 -96"/><path d="M19 -112 L35 -96 M35 -112 L19 -96"/></g>'
          + acc + sparkles + dizzyStars
          + '</svg>';
      }
      const MOUND_FRONT = '<svg viewBox="0 0 200 70" preserveAspectRatio="none" aria-hidden="true">'
        + '<path d="M2 70 C6 30 40 8 100 8 C160 8 194 30 198 70 Z" fill="#7c4a2d"/>'
        + '<path d="M14 70 C20 38 48 18 100 18 C152 18 180 38 186 70 Z" fill="#96683c"/>'
        + '<g fill="#6e3f22"><ellipse cx="52" cy="52" rx="7" ry="3.4"/><ellipse cx="140" cy="58" rx="9" ry="4"/><ellipse cx="102" cy="44" rx="5" ry="2.6"/></g>'
        + '<g fill="#c9c2b4"><ellipse cx="70" cy="62" rx="6" ry="3.4"/><ellipse cx="158" cy="44" rx="5" ry="3"/></g>'
        + '<g stroke="#2f9e4f" stroke-width="4" stroke-linecap="round" fill="none"><path d="M22 34 q-2 -12 -8 -18"/><path d="M28 32 q1 -12 7 -18"/><path d="M172 34 q2 -12 8 -18"/><path d="M166 32 q-1 -12 -7 -18"/></g>'
        + '</svg>';

      /* ---------- 状態 ---------- */
      let score = 0, combo = 0, maxCombo = 0, hits = 0, attempts = 0;
      let sessionHigh = 0;
      let timeLeft = settings.duration;
      let interval = settings.startInterval;
      let holeTimer = null, tickTimer = null;
      let gameRunning = false, countingDown = false;
      let activeIndex = -1, moleHit = true, lastIndex = -1;
      let holes = [];
      let audioCtx = null;

      function createBoard() {
        gameContainer.innerHTML = '';
        holes = [];
        for (let i = 0; i < 9; i++) {
          const hole = document.createElement('button');
          hole.type = 'button';
          hole.className = 'hole';
          hole.setAttribute('aria-label', '穴 ' + (i + 1));
          hole.innerHTML =
            '<span class="mound-back"></span>'
            + '<span class="pit"></span>'
            + '<span class="mole-clip"><span class="mole"></span></span>'
            + '<span class="mound-front">' + MOUND_FRONT + '</span>'
            + '<span class="key-hint">' + KEY_HINTS[i] + '</span>';
          gameContainer.appendChild(hole);
          const mole = hole.querySelector('.mole');
          holes.push({ hole, mole });
          hole.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleTap(i, e);
          });
        }
      }

      function handleTap(i, e) {
        if (!gameRunning) return;
        attempts++;
        const { hole, mole } = holes[i];
        if (i === activeIndex && mole.classList.contains('up') && !moleHit) {
          whack(mole, hole, e);
        } else {
          miss(hole);
        }
      }

      document.addEventListener('keydown', (e) => {
        if (!gameRunning || e.repeat) return;
        for (const layout of KEY_LAYOUTS) {
          const idx = layout.indexOf(e.code);
          if (idx !== -1) { e.preventDefault(); handleTap(idx, null); return; }
        }
      });

      /* ---------- サウンド ---------- */
      function ensureAudio() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }
      function playTone(freq, dur, type, vol, delay, slideTo) {
        if (!audioCtx) return;
        const t0 = audioCtx.currentTime + (delay || 0);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
        gain.gain.setValueAtTime(vol || 0.15, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + dur);
      }

      /* ---------- エフェクト ---------- */
      function createParticles(hole, golden) {
        const colors = golden ? ['#ffd23f', '#ffb020', '#fff3b0'] : ['#7ce38b', '#12b76a', '#d9f99d'];
        for (let i = 0; i < 14; i++) {
          const pt = document.createElement('span');
          pt.className = 'particle' + (i % 3 === 0 ? ' star' : '');
          const size = 5 + Math.random() * 7;
          pt.style.width = size + 'px';
          pt.style.height = size + 'px';
          pt.style.backgroundColor = colors[i % colors.length];
          pt.style.left = '50%';
          pt.style.top = '38%';
          hole.appendChild(pt);
          const angle = Math.random() * Math.PI * 2;
          const dist = 42 + Math.random() * 62;
          requestAnimationFrame(() => {
            pt.style.transform = 'translate(' + Math.cos(angle) * dist + 'px,' + (Math.sin(angle) * dist - 18) + 'px) rotate(' + (Math.random() * 160 - 80) + 'deg)';
            pt.style.opacity = '0';
          });
          setTimeout(() => pt.remove(), 540);
        }
      }
      function showFloatText(hole, text, golden) {
        const el = document.createElement('span');
        el.className = 'float-text' + (golden ? ' gold' : '');
        el.textContent = text;
        hole.appendChild(el);
        setTimeout(() => el.remove(), 740);
      }

      /* ---------- ゲームロジック ---------- */
      function updateCombo() {
        const mult = Math.min(5, 1 + Math.floor(combo / 5));
        comboDisplay.textContent = '×' + mult;
        comboDisplay.classList.toggle('combo-on', mult > 1);
        return mult;
      }
      function miss(hole) {
        if (combo >= 3) playTone(150, 0.14, 'sawtooth', 0.1);
        combo = 0;
        updateCombo();
        hole.classList.add('miss-flash');
        setTimeout(() => hole.classList.remove('miss-flash'), 240);
        board.classList.remove('shake');
        void board.offsetWidth;
        board.classList.add('shake');
      }
      function whack(mole, hole) {
        moleHit = true;
        const golden = mole.dataset.golden === '1';
        combo++;
        maxCombo = Math.max(maxCombo, combo);
        hits++;
        const mult = updateCombo();
        const points = (golden ? 3 : 1) * mult;
        score += points;
        scoreDisplay.textContent = score;
        if (golden) { playTone(1046, 0.1, 'triangle', 0.16); playTone(1318, 0.12, 'triangle', 0.15, 0.06); playTone(1568, 0.16, 'triangle', 0.14, 0.12); }
        else { playTone(700, 0.12, 'triangle', 0.17, 0, 1180); }
        mole.classList.add('hit');
        mole.classList.remove('up');
        mole.querySelectorAll('.star-spin').forEach(s => { s.setAttribute('opacity', '1'); });
        createParticles(hole, golden);
        showFloatText(hole, '+' + points, golden);
        setTimeout(() => { mole.classList.remove('hit'); mole.querySelectorAll('.star-spin').forEach(s => s.setAttribute('opacity', '0')); }, 260);
      }
      function popMole() {
        if (activeIndex !== -1 && !moleHit) { combo = 0; updateCombo(); }
        holes.forEach(h => h.mole.classList.remove('up'));
        let idx;
        do { idx = Math.floor(Math.random() * holes.length); } while (idx === lastIndex);
        lastIndex = idx;
        activeIndex = idx;
        moleHit = false;
        const golden = Math.random() < 0.12;
        const accessories = ['sprout', 'sprout', 'flower', 'helmet', 'shades', 'none'];
        const acc = accessories[Math.floor(Math.random() * accessories.length)];
        const { mole } = holes[idx];
        mole.dataset.golden = golden ? '1' : '0';
        mole.innerHTML = moleSVG(golden, acc);
        playTone(280 + Math.random() * 60, 0.06, 'sine', 0.05);
        requestAnimationFrame(() => requestAnimationFrame(() => mole.classList.add('up')));
      }
      function scheduleMole() {
        holeTimer = setTimeout(() => {
          if (!gameRunning) return;
          popMole();
          interval = Math.max(settings.minInterval, interval * settings.speedUp);
          scheduleMole();
        }, interval);
      }
      function updateTimeUI() {
        const shown = Math.max(0, Math.ceil(timeLeft));
        timeDisplay.textContent = shown;
        timeDisplay.classList.toggle('time-low', timeLeft <= 5.5);
        timeBarFill.style.width = Math.max(0, (timeLeft / settings.duration) * 100) + '%';
        timeBarFill.classList.toggle('low', timeLeft <= 5.5);
      }
      function countdown(done) {
        countingDown = true;
        let n = 3;
        countdownOverlay.style.display = 'flex';
        const showNum = () => {
          countdownNum.textContent = n;
          countdownNum.style.animation = 'none';
          void countdownNum.offsetWidth;
          countdownNum.style.animation = '';
          playTone(620, 0.09, 'sine', 0.13);
        };
        showNum();
        const step = () => {
          n--;
          if (n > 0) { showNum(); setTimeout(step, 620); }
          else {
            countdownNum.textContent = 'START!';
            countdownNum.style.animation = 'none';
            void countdownNum.offsetWidth;
            countdownNum.style.animation = '';
            playTone(920, 0.2, 'triangle', 0.17);
            setTimeout(() => { countdownOverlay.style.display = 'none'; countingDown = false; done(); }, 520);
          }
        };
        setTimeout(step, 620);
      }
      function setDifficulty(diff) {
        if (gameRunning || countingDown) return;
        currentDifficulty = diff;
        settings = DIFFICULTIES[diff];
        timeLeft = settings.duration;
        updateTimeUI();
        [...difficultySelect.children].forEach(btn => btn.classList.toggle('selected', btn.dataset.diff === diff));
      }
      difficultySelect.addEventListener('click', (e) => {
        const btn = e.target.closest('.diff-btn');
        if (btn) setDifficulty(btn.dataset.diff);
      });
      function startGame() {
        ensureAudio();
        score = 0; combo = 0; maxCombo = 0; hits = 0; attempts = 0;
        settings = DIFFICULTIES[currentDifficulty];
        timeLeft = settings.duration;
        interval = settings.startInterval;
        activeIndex = -1; lastIndex = -1; moleHit = true;
        scoreDisplay.textContent = '0';
        updateCombo();
        updateTimeUI();
        startButton.disabled = true;
        startButton.textContent = 'プレイ中…';
        [...difficultySelect.children].forEach(btn => btn.disabled = true);
        countdown(() => {
          gameRunning = true;
          popMole();
          scheduleMole();
          let lastTickSec = Math.ceil(timeLeft);
          tickTimer = setInterval(() => {
            timeLeft -= 0.1;
            const sec = Math.ceil(timeLeft);
            if (sec !== lastTickSec) {
              lastTickSec = sec;
              if (sec <= 3 && sec > 0) playTone(660, 0.07, 'sine', 0.11);
            }
            updateTimeUI();
            if (timeLeft <= 0) endGame();
          }, 100);
        });
      }
      function endGame() {
        clearInterval(tickTimer);
        clearTimeout(holeTimer);
        gameRunning = false;
        timeLeft = 0;
        updateTimeUI();
        holes.forEach(h => h.mole.classList.remove('up'));
        startButton.disabled = false;
        startButton.textContent = 'ゲームスタート';
        [...difficultySelect.children].forEach(btn => btn.disabled = false);
        playTone(523, 0.14, 'triangle', 0.15, 0);
        playTone(659, 0.14, 'triangle', 0.15, 0.14);
        playTone(784, 0.16, 'triangle', 0.16, 0.28);
        playTone(1046, 0.3, 'triangle', 0.16, 0.42);
        const isRecord = score > sessionHigh;
        if (isRecord) sessionHigh = score;
        highScoreDisplay.textContent = sessionHigh;
        resultScore.textContent = score;
        resultHits.textContent = hits;
        resultMaxCombo.textContent = maxCombo;
        resultAccuracy.textContent = attempts > 0 ? Math.round((hits / attempts) * 100) + '%' : '–';
        resultHighScore.textContent = 'ハイスコア: ' + sessionHigh;
        newRecordBadge.style.display = isRecord && score > 0 ? 'block' : 'none';
        setTimeout(() => { resultOverlay.style.display = 'flex'; retryButton.focus(); }, 480);
      }
      retryButton.addEventListener('click', () => { resultOverlay.style.display = 'none'; startGame(); });
      closeResultButton.addEventListener('click', () => { resultOverlay.style.display = 'none'; startButton.focus(); });
      startButton.addEventListener('click', startGame);

      createBoard();
      updateTimeUI();
    </script>
  </body>
</html>
