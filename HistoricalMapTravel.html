        :root {

        /* カラーテーマ機能[4]の再現 */
        body.theme-cool { --primary-color: #2c3e50; }

        body.theme-kirei { --primary-color: #00bcd4; }

        body { font-family: sans-serif; margin: 0; background: var(--bg-color); overflow: hidden; }
        #map { height: 70vh; width: 100%; }
        
        .ui-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: var(--panel-bg); padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 280px;

        .timeline-container {

        input[type="range"] { width: 80%; cursor: pointer; }

        /* リズムログ/足跡[3] */
        #log-area {
            height: 15vh; overflow-y: auto; padding: 10px; font-size: 0.9em;
            background: #222; color: #eee; border-top: 4px solid var(--primary-color);
        }
        .log-entry { border-left: 3px solid var(--primary-color); padding-left: 10px; margin-bottom: 5px; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .btn {
            background: var(--primary-color); color: white; border: none; padding: 8px 15px;
            border-radius: 5px; cursor: pointer; margin-top: 5px; width: 100%;
        }
    </style>

    let activeMarkers = [];

    function updateEra(year) {
        document.getElementById('current-era').innerText = `西暦 ${year}年`;
        
        // 該当する年のイベントを表示
        activeMarkers.forEach(m => map.removeLayer(m));
        activeMarkers = [];

        historyEvents.forEach(ev => {
            if (year >= ev.year && year < parseInt(year) + 20) {
                const marker = L.marker([ev.lat, ev.lng]).addTo(map)
                    .bindPopup(`<b>${ev.title} (${ev.year}年)</b><br>${ev.desc}`).openPopup();
                activeMarkers.push(marker);
                addLog(`✨ ${ev.year}年：${ev.title}を目撃しました`);
            }
        });
    }

    // ログ記録機能[3]
    function addLog(msg) {
        const logArea = document.getElementById('log-area');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerText = msg;
        logArea.prepend(entry);
    }

    // 保存機能[5]のシミュレーション
    function saveAdventure() {
        const logs = document.getElementById('log-area').innerText;
        const blob = new Blob([logs], {type: "text/plain"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "adventure_log.txt";
        a.click();
        alert("冒険の足跡を保存しました！");
    }
