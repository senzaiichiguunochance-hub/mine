<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>日本地震情報マップ（API版）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" type="text/css" href="Style.css" />
<style>
  body, html { margin: 0; padding: 0; height: 100%; }
  .container { padding: 10px; }
  
  #map { 
    height: 100%; 
    width: 100%;
    background-color: #f0f0f0;
  }
  #main-content {
    display: flex;
    height: 70vh;
  }
  #map-container {
    width: 70%;
    height: 100%;
  }
  #info-list-container {
    width: 30%;
    height: 100%;
    overflow-y: auto;
    padding: 0 15px;
    box-sizing: border-box;
  }
  .info-item {
    border-bottom: 1px solid #eee;
    padding: 10px 5px;
    font-size: 0.9rem;
  }
  .info-item:first-child {
    border-top: 1px solid #eee;
  }
  .info-item strong {
    color: white;
  }
  
  .controls {
    display:flex; flex-wrap:wrap; align-items:center; gap:15px; margin-bottom: 10px;
  }
  .note { font-size: 0.85rem; color: #666; }
  .box { margin-bottom: 15px; }

  /* ローディング画面 */
  #loadingOverlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(26, 26, 46, 0.85); 
    display:none; align-items:center; justify-content:center;
    flex-direction:column; z-index:9999; color: white;
  }
  .spinner {
    border:6px solid #16213e; 
    border-top:6px solid #00bcd4;
    border-radius:50%;
    width:60px; height:60px;
    animation: spin 1s linear infinite;
    margin-bottom:15px;
  }
  @keyframes spin {
    0% { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
  }
  #progressBarContainer {
    width:220px; background: #333; height:10px; border-radius:5px; overflow:hidden;
  }
  #progressBar {
    width:0%; height:100%; background: #00bcd4; transition:width 0.2s;
  }

  /* マーカー基本スタイル */
  .quake-marker-base {
    width: 24px !important;
    height: 24px !important;
    border-radius: 50%;
    background-color: #fff;
    border: 2px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: #333;
    box-shadow: 0 0 5px rgba(0,0,0,0.5);
  }

  /* 震度別カラー */
  .quake-marker-10 { background-color: #f2f2f2; border-color: #999; }
  .quake-marker-20 { background-color: #bfdfff; border-color: #6a9edc; }
  .quake-marker-30 { background-color: #a0f0ff; border-color: #55c6d9; }
  .quake-marker-40 { background-color: #ffc9a0; border-color: #d18d53; }
  .quake-marker-45 { background-color: #ffab4f; border-color: #e07b00; }
  .quake-marker-50 { background-color: #ff7f00; border-color: #cc6600; }
  .quake-marker-55 { background-color: #ff0000; border-color: #cc0000; color: white; }
  .quake-marker-60 { background-color: #cc0000; border-color: #990000; color: white; }
  .quake-marker-70 { background-color: #660000; border-color: #330000; color: white; }
</style>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

<div class="container">
    <br>
    <header class="header">
        <h1>日本地震情報マップ (API版)</h1>
    </header>

    <div class="box">
        <div id="controls" class="controls">
            <label>取得件数: <input type="number" id="limit" value="100" min="10" max="100" style="width:80px"></label>
            <label>最小震度:
                <select id="minScale">
                    <option value="0">すべて</option>
                    <option value="10">1</option>
                    <option value="20">2</option>
                    <option value="30">3</option>
                    <option value="40">4</option>
                    <option value="45">5弱</option>
                    <option value="50">5強</option>
                    <option value="55">6弱</option>
                    <option value="60">6強</option>
                    <option value="70">7</option>
                </select>
            </label>
            <button id="btnLoad" class="primary" style="padding: 5px 15px;">表示</button>
        </div>
        <div class="note">※P2P地震情報APIより直近のデータを取得します。</div>
    </div>

    <div id="main-content">
        <div id="map-container">
            <div id="map"></div>
        </div>
        <div id="info-list-container"></div>
    </div>
</div>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="progressBarContainer"><div id="progressBar"></div></div>
  <div id="loadingText" style="margin-top:8px;">データ読込中...</div>
</div>

<script>
// P2P地震情報API
const P2P_API_URL = "https://api.p2pquake.net/v2/history?codes=551&limit=";

let map;
let layerGroup;

// 地図初期化
function initializeMap() {
    if (typeof L === 'undefined') {
        alert("Leafletの読み込みに失敗しました。");
        return false;
    }

    if (!map) {
        map = L.map("map").setView([36.5, 138.0], 5);
        layerGroup = L.layerGroup().addTo(map);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap contributors",
            maxZoom: 18
        }).addTo(map);
    }
    return true;
}

// UI要素
const overlay = document.getElementById("loadingOverlay");
const btn = document.getElementById("btnLoad");
const progressBar = document.getElementById("progressBar");
const loadingText = document.getElementById("loadingText");
const limitInput = document.getElementById("limit");
const minScaleSelect = document.getElementById("minScale"); 
const LS_MIN_SCALE_KEY = "earthquake_min_scale";

function showOverlay(msg="処理中...") {
  overlay.style.display = "flex";
  loadingText.textContent = msg;
  progressBar.style.width = "0%";
  btn.disabled = true;
}

function hideOverlay() {
  overlay.style.display = "none";
  btn.disabled = false;
}

// 震度に応じたCSSクラス取得
function getScaleClass(scale) {
    if (scale >= 70) return "quake-marker-70";
    if (scale >= 60) return "quake-marker-60";
    if (scale >= 55) return "quake-marker-55";
    if (scale >= 50) return "quake-marker-50";
    if (scale >= 45) return "quake-marker-45";
    if (scale >= 40) return "quake-marker-40";
    if (scale >= 30) return "quake-marker-30";
    if (scale >= 20) return "quake-marker-20";
    if (scale >= 10) return "quake-marker-10";
    return "quake-marker-10";
}

// 震度数値をテキストに変換（例: 45 -> 震度5弱）
function formatScaleText(scale) {
    if (scale === 0) return "-";
    
    let intScale = Math.floor(scale / 10);
    let suffix = "";

    if (scale % 10 === 5) {
        intScale += 1;
        suffix = "弱";
    } else if (scale % 10 === 0 && scale >= 50) {
        if (scale === 50 || scale === 60) {
            suffix = "強";
        }
    }
    return `震度${intScale}${suffix}`;
}

// APIデータ取得・描画処理
async function loadFromApi() {
  const infoListContainer = document.getElementById("info-list-container");
  try {
    showOverlay("データ読込中...");
    infoListContainer.innerHTML = ""; // リストをクリア
    
    const limit = Math.min(parseInt(limitInput.value || 100), 100); 
    const selectedMinScale = parseInt(minScaleSelect.value) || 0; 
    localStorage.setItem(LS_MIN_SCALE_KEY, selectedMinScale.toString());

    const url = `${P2P_API_URL}${limit}`;
    const r = await fetch(url);

    if (!r.ok) throw new Error(`APIエラー: ${r.status}`);

    const rawData = await r.json();
    
    // 地震情報(551)かつ震源情報が存在するデータのみ抽出
    const records = rawData.filter(item => item.code === 551 && item.earthquake && item.earthquake.hypocenter);
    
    const filtered = records.filter(rec => {
        const maxScale = rec.earthquake.maxScale || 0;
        return maxScale >= selectedMinScale;
    });

    // 日時の降順でソート
    filtered.sort((a, b) => new Date(b.time) - new Date(a.time));

    loadingText.textContent = `該当データ: ${filtered.length}件 描画準備中...`;
    
    layerGroup.clearLayers();
    await new Promise(res => setTimeout(res, 100));

    const chunkSize = 20; 
    let done = 0;

    for (let i = 0; i < filtered.length; i += chunkSize) {
      const chunk = filtered.slice(i, i + chunkSize);
      
      let listHtml = '';
      for (const r of chunk) {
        const lat = parseFloat(r.earthquake.hypocenter.latitude);
        const lng = parseFloat(r.earthquake.hypocenter.longitude);
        const timeStr = new Date(r.time).toLocaleString('ja-JP');
        const maxScale = r.earthquake.maxScale || 0;
        const scaleText = formatScaleText(maxScale);

        // リスト項目HTMLの生成
        listHtml += `
            <div class="info-item">
                <strong>場所:</strong> ${r.earthquake.hypocenter.name || "情報なし"}<br>
                <strong>日時:</strong> ${timeStr}<br>
                <strong>M:</strong> ${r.earthquake.magnitude || "-"}
                <strong>深さ:</strong> ${r.earthquake.hypocenter.depth ? r.earthquake.hypocenter.depth + 'km' : "-"}<br>
                <strong>最大震度:</strong> ${scaleText}
            </div>
        `;
        
        // 無効な座標はスキップ
        if (lat === -200 || lng === -200 || !isFinite(lat) || !isFinite(lng)) continue;

        const scaleClass = getScaleClass(maxScale);
        const displayScale = scaleText.replace("震度", "");

        const customIcon = L.divIcon({
            className: `quake-marker-base ${scaleClass}`,
            html: `<span>${displayScale}</span>`,
            iconSize: [24, 24],
            popupAnchor: [0, -12]
        });
        
        const popup = `
          <div style="min-width:200px;">
            <b>${r.earthquake.hypocenter.name || "震源地不明"}</b><br>
            <hr style="margin:5px 0;">
            日時: ${timeStr}<br>
            M${r.earthquake.magnitude || "-"} / 深さ${r.earthquake.hypocenter.depth ? r.earthquake.hypocenter.depth + 'km' : "-"}<br>
            最大震度: <b>${scaleText}</b>
          </div>
        `;
        L.marker([lat, lng], {icon: customIcon}).bindPopup(popup).addTo(layerGroup);
      }
      
      infoListContainer.innerHTML += listHtml;
      done += chunk.length;
      const percent = Math.round((done / filtered.length) * 100);
      progressBar.style.width = percent + "%";
      await new Promise(res => setTimeout(res, 5)); 
    }

    if (filtered.length > 0) {
        try {
            map.fitBounds(layerGroup.getBounds(), { padding: [30, 30] });
        } catch(e) { console.log("Bounds adjust failed"); }
    }

    loadingText.textContent = "完了";
    await new Promise(res => setTimeout(res, 500));

  } catch (err) {
    console.error(err);
    alert("エラーが発生しました:\n" + err.message);
  } finally {
    hideOverlay();
  }
}

// 起動時処理
window.onload = function() {
    if(initializeMap()) {
        const savedMinScale = localStorage.getItem(LS_MIN_SCALE_KEY);
        if (savedMinScale !== null) {
            minScaleSelect.value = savedMinScale;
        }
        loadFromApi();
    }
};

btn.addEventListener("click", loadFromApi);
</script>
</body>
</html>
