<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>日本地震情報マップ（API版）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" type="text/css" href="Style.css" />
<style>
  body, html { margin: 0; padding: 0; height: 100%; }
  .container { padding: 10px; }
  
  #map { 
    height: 100%; 
    width: 100%;
    background-color: #f0f0f0;
  }
  #main-content {
    display: flex;
    height: 70vh;
  }
  #map-container {
    width: 70%;
    height: 100%;
  }
  #info-list-container {
    width: 30%;
    height: 100%;
    overflow-y: auto;
    padding: 0 15px;
    box-sizing: border-box;
  }
  .info-item {
    border-bottom: 1px solid #eee;
    padding: 10px 5px;
    font-size: 0.9rem;
  }
  .info-item:first-child {
    border-top: 1px solid #eee;
  }
  .info-item strong {
    color: white;
  }
  
  .controls {
    display:flex; flex-wrap:wrap; align-items:center; gap:15px; margin-bottom: 10px;
  }
  .note { font-size: 0.85rem; color: #666; }
  .box { margin-bottom: 15px; }

  /* ローディング画面 */
  #loadingOverlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(26, 26, 46, 0.85); 
    display:none; align-items:center; justify-content:center;
    flex-direction:column; z-index:9999; color: white;
  }
  .spinner {
    border:6px solid #16213e; 
    border-top:6px solid #00bcd4;
    border-radius:50%;
    width:60px; height:60px;
    animation: spin 1s linear infinite;
    margin-bottom:15px;
  }
  @keyframes spin {
    0% { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
  }
  #progressBarContainer {
    width:220px; background: #333; height:10px; border-radius:5px; overflow:hidden;
  }
  #progressBar {
    width:0%; height:100%; background: #00bcd4; transition:width 0.2s;
  }

  /* マーカー基本スタイル */
  .quake-marker-base {
    width: 24px !important;
    height: 24px !important;
    border-radius: 50%;
    background-color: #fff;
    border: 2px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: #333;
    box-shadow: 0 0 5px rgba(0,0,0,0.5);
  }

  /* マグニチュード別カラー */
  .quake-m-low { background-color: #a0f0ff; border-color: #55c6d9; }
  .quake-m-mid { background-color: #ffc9a0; border-color: #d18d53; }
  .quake-m-high { background-color: #ff7f00; border-color: #cc6600; }
  .quake-m-vhigh { background-color: #ff0000; border-color: #cc0000; color: white; }
</style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

<div class="container">
    <br>
    <header class="header">
        <h1>日本近海 地震情報マップ (USGS API版)</h1>
    </header>

    <div class="box">
        <div id="controls" class="controls">
            <label>取得件数: <input type="number" id="limit" value="100" min="10" max="200" style="width:80px"></label>
            <label>最小マグニチュード:
                <select id="minScale">
                    <option value="0">すべて</option>
                    <option value="2.5">M 2.5 以上</option>
                    <option value="3.5">M 3.5 以上</option>
                    <option value="4.5">M 4.5 以上</option>
                    <option value="5.5">M 5.5 以上</option>
                    <option value="6.5">M 6.5 以上</option>
                </select>
            </label>
            <button id="btnLoad" class="primary" style="padding: 5px 15px;">表示</button>
        </div>
        <div class="note">※USGS (米国地質調査所) APIより日本周辺の最新地震データを取得します。</div>
    </div>

    <div id="main-content">
        <div id="map-container">
            <div id="map"></div>
        </div>
        <div id="info-list-container"></div>
    </div>
</div>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="progressBarContainer"><div id="progressBar"></div></div>
  <div id="loadingText" style="margin-top:8px;">データ読込中...</div>
</div>

<script>
let map;
let layerGroup;

// 地図初期化
function initializeMap() {
    if (typeof L === 'undefined') {
        alert("Leafletの読み込みに失敗しました。");
        return false;
    }

    if (!map) {
        map = L.map("map").setView([36.5, 138.0], 5);
        layerGroup = L.layerGroup().addTo(map);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap contributors",
            maxZoom: 18
        }).addTo(map);
    }
    return true;
}

const overlay = document.getElementById("loadingOverlay");
const btn = document.getElementById("btnLoad");
const progressBar = document.getElementById("progressBar");
const loadingText = document.getElementById("loadingText");
const limitInput = document.getElementById("limit");
const minScaleSelect = document.getElementById("minScale"); 

function showOverlay(msg="処理中...") {
  overlay.style.display = "flex";
  loadingText.textContent = msg;
  progressBar.style.width = "0%";
  btn.disabled = true;
}

function hideOverlay() {
  overlay.style.display = "none";
  btn.disabled = false;
}

// マグニチュードに応じたカラー表示
function getMClass(m) {
    if (m >= 6.0) return "quake-m-vhigh";
    if (m >= 5.0) return "quake-m-high";
    if (m >= 4.0) return "quake-m-mid";
    return "quake-m-low";
}

// USGS APIよりデータ取得
async function loadFromApi() {
  const infoListContainer = document.getElementById("info-list-container");
  try {
    showOverlay("データ読込中...");
    infoListContainer.innerHTML = "";
    
    const limit = Math.min(parseInt(limitInput.value || 100), 200); 
    const minMag = parseFloat(minScaleSelect.value) || 0; 

    // 日本周辺（緯度20~50, 経度120~150）の範囲を指定して取得
    const url = `https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minlatitude=20&maxlatitude=50&minlongitude=120&maxlongitude=150&limit=${limit}&minmagnitude=${minMag}`;
    
    const r = await fetch(url);
    if (!r.ok) throw new Error(`APIエラー: ${r.status}`);

    const rawData = await r.json();
    const filtered = rawData.features || [];

    loadingText.textContent = `該当データ: ${filtered.length}件 描画準備中...`;
    
    layerGroup.clearLayers();
    await new Promise(res => setTimeout(res, 100));

    const chunkSize = 20; 
    let done = 0;

    for (let i = 0; i < filtered.length; i += chunkSize) {
      const chunk = filtered.slice(i, i + chunkSize);
      let listHtml = '';

      for (const feature of chunk) {
        const props = feature.properties;
        const coords = feature.geometry.coordinates; // [lng, lat, depth]
        
        const lng = coords[0];
        const lat = coords[1];
        const depth = coords[2];
        const mag = props.mag ? props.mag.toFixed(1) : "-";
        const timeStr = new Date(props.time).toLocaleString('ja-JP');
        const place = props.place || "日本周辺";

        listHtml += `
            <div class="info-item">
                <strong>場所:</strong> ${place}<br>
                <strong>日時:</strong> ${timeStr}<br>
                <strong>M:</strong> ${mag}
                <strong>深さ:</strong> ${depth ? Math.round(depth) + 'km' : "-"}<br>
            </div>
        `;
        
        if (!isFinite(lat) || !isFinite(lng)) continue;

        const mClass = getMClass(props.mag || 0);

        const customIcon = L.divIcon({
            className: `quake-marker-base ${mClass}`,
            html: `<span>M${Math.floor(mag)}</span>`,
            iconSize: [24, 24],
            popupAnchor: [0, -12]
        });
        
        const popup = `
          <div style="min-width:200px;">
            <b>${place}</b><br>
            <hr style="margin:5px 0;">
            日時: ${timeStr}<br>
            <b>M${mag}</b> / 深さ ${depth ? Math.round(depth) + 'km' : "-"}
          </div>
        `;
        L.marker([lat, lng], {icon: customIcon}).bindPopup(popup).addTo(layerGroup);
      }
      
      infoListContainer.innerHTML += listHtml;
      done += chunk.length;
      const percent = Math.round((done / (filtered.length || 1)) * 100);
      progressBar.style.width = percent + "%";
      await new Promise(res => setTimeout(res, 5)); 
    }

    if (filtered.length > 0) {
        try {
            map.fitBounds(layerGroup.getBounds(), { padding: [30, 30] });
        } catch(e) { console.log("Bounds adjust failed"); }
    }

    loadingText.textContent = "完了";
    await new Promise(res => setTimeout(res, 500));

  } catch (err) {
    console.error(err);
    alert("エラーが発生しました:\n" + err.message);
  } finally {
    hideOverlay();
  }
}

window.onload = function() {
    if(initializeMap()) {
        loadFromApi();
    }
};

btn.addEventListener("click", loadFromApi);
</script>
</body>
</html>
