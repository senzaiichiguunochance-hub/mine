<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>海外安全情報（外務省オープンデータ）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- 基本スタイル設定 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@300;400;600&display=swap');
:root {
    --bg-color: #c1c19d;
    --card-color: #16213e;
    --primary-color: #0f3460;
    --secondary-color: #e94560;
    --font-color: #dcdcdc;
    --hover-color: #537895;
}
body {
    font-family: 'Noto Sans JP', sans-serif;
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    color: var(--font-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
}
.container { width: 90%; max-width: 1200px; text-align: center; }
.header { margin-bottom: 40px; }
.header h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 3em;
    font-weight: 600;
    color: var(--secondary-color);
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 15px var(--secondary-color);
}
.box {
    background-color: var(--card-color);
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    margin-bottom: 20px;
    border: 1px solid var(--primary-color);
}
label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.95rem; }
input[type="text"], select {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--primary-color);
    background-color: #0f1a3a;
    color: var(--font-color);
    font-size: 1rem;
}
textarea {
    width: 100%; min-height: 120px;
    padding: 10px; border-radius: 10px;
    border: 1px solid var(--primary-color);
    background-color: #0f1a3a; color: var(--font-color);
    font-size: 1rem; resize: vertical;
}
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 15px; }
button {
    padding: 10px 20px; border-radius: 12px; border: none;
    cursor: pointer; font-weight: 600; font-size: 1rem;
    transition: 0.3s;
}
button.primary { background-color: var(--primary-color); color: var(--font-color); }
button.primary:hover { background-color: var(--hover-color); }
button.secondary { background-color: var(--secondary-color); color: var(--font-color); }
button.secondary:hover { background-color: #ff5678; }
#mofa-results .card {
    background-color: var(--card-color);
    border: 1px solid var(--primary-color);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
    text-align: left;
}
#mofa-results .card h4 { color: var(--secondary-color); margin-top: 0; margin-bottom: 10px; font-size: 1.2em; }
#mofa-results .card p { font-size: 0.95em; line-height: 1.5; margin-bottom: 5px; }
#mofa-results .card a.action-btn {
    background-color: var(--secondary-color);
    color: var(--font-color);
    padding: 8px 15px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    display: inline-block;
    margin-top: 10px;
}
.error-box {
    background-color: rgba(233, 69, 96, 0.08);
    border-left: 4px solid var(--secondary-color);
    color: var(--secondary-color);
    padding: 10px 12px;
    margin-top: 12px;
    border-radius: 6px;
    font-size: 0.95em;
    white-space: pre-wrap;
    word-break: break-word;
}
.map-container {
    height: 150px;
    width: 100%;
    margin-top: 15px;
    border-radius: 8px;
    z-index: 0;
}
</style>

<!-- fetch のエラーハンドリング強化 -->
<script>
(function(){
  const _origFetch = window.fetch.bind(window);
  window.fetch = async function(input, init){
    let resp;
    try {
      resp = await _origFetch(input, init);
    } catch (e) {
      throw new Error('通信エラー: サーバーへ接続できません。');
    }
    let text = '';
    try {
      text = await resp.clone().text();
    } catch {}
    const trimmed = (text || '').trim();
    if (trimmed.startsWith('<html') || trimmed.startsWith('<!DOCTYPE')) {
      throw new Error('APIがHTMLエラーを返しました。');
    }
    if (!resp.ok) {
      throw new Error('HTTPエラー: ' + resp.status);
    }
    return resp;
  };
  window.showError = function(container, title, error, url) {
    const box = document.createElement('div');
    box.className = 'error-box';
    box.innerHTML = `<strong>${title}</strong><br>${error.message}${url ? `<br><small>URL: ${url}</small>` : ''}`;
    container.appendChild(box);
  };
})();
</script>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

<div class="container">
    <header class="header"><h1>海外安全情報（外務省オープンデータ）</h1></header>

    <div class="box">
        <!-- 操作パネル -->
        <div id="mofa-controls" class="controls">
            <select id="mofa-type" onchange="toggleMofaCodeInputs()">
                <option value="newarrival">1. 新着情報</option>
                <option value="allregions">2. すべての地域</option>
            </select>
            <select id="mofa-detail">
                <option value="">通常</option>
                <option value="A">全量</option>
                <option value="L">軽量</option>
            </select>
            <input type="text" id="mofa-region-code" placeholder="地域コード" style="display:none; width:100px;">
            <input type="text" id="mofa-country-code" placeholder="国コード" style="display:none; width:100px;">
            <button class="primary" onclick="getMofaData()">情報を取得</button>
            <input type="text" id="mofa-filter" placeholder="先に「情報を取得」を押してください。スペース区切りで複数条件検索可能です。" oninput="renderMofaResults()" style="flex-grow:1;">
        </div>

        <h2>検索結果</h2>
        <div id="mofa-results"></div>
    </div>
</div>

<script>
// 国名と緯度経度のマッピングデータ
const countryCoordinates = {
    '日本': [35.6895, 139.6917],
};

// 国名から座標を動的に取得する非同期関数
async function getCountryCoords(countryName) {
    if (!countryName) return null;

    console.log(`Cache miss for: ${countryName}. Fetching from API...`);
    // APIエンドポイント (日本語名での検索を試みる)
    const url = `https://restcountries.com/v3.1/translation/${encodeURIComponent(countryName)}`;

    try {
        let response = await fetch(url);
        if (!response.ok) {
            // translation APIで失敗した場合、通常のname検索でフォールバック
            console.log(`Fallback to name search for: ${countryName}`);
            const fallbackUrl = `https://restcountries.com/v3.1/name/${encodeURIComponent(countryName)}`;
            response = await fetch(fallbackUrl);
        }

        if (!response.ok) {
            console.error(`Could not find coordinates for ${countryName}. Status: ${response.status}`);
            return null;
        }

        const data = await response.json();
        // APIは複数の結果を返すことがあるため、最初の結果を利用する
        const countryData = data[0];
        const coords = countryData?.latlng;

        if (coords && coords.length === 2) {
            console.log(`Found coords for ${countryName}: ${coords}`);
            countryCoordinates[countryName] = coords; // キャッシュに保存
            return coords;
        } else {
            console.error(`Invalid coordinate data for ${countryName}`, countryData);
            return null;
        }
    } catch (e) {
        console.error(`Network or parsing error for ${countryName}:`, e);
        return null;
    }
}

// ミニマップを初期化する関数
function initMiniMap(elementId, lat, lon) {
    // すでに地図が初期化されているかチェック
    const container = L.DomUtil.get(elementId);
    if(container._leaflet_id) {
        return;
    }

    const map = L.map(elementId, {
        zoomControl: false,
        scrollWheelZoom: false,
        dragging: false,
        doubleClickZoom: false,
        attributionControl: false // 右下の帰属表示を消す
    }).setView([lat, lon], 4); // ズームレベルを4に調整

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        // attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' // 表示しない
    }).addTo(map);

    L.marker([lat, lon]).addTo(map);
}

let mofaRawData = [];

function toggleMofaCodeInputs() {
    const type = document.getElementById('mofa-type').value;
    document.getElementById('mofa-region-code').style.display = 'none';
    document.getElementById('mofa-country-code').style.display = 'none';
}

async function renderMofaResults() {
    const f = document.getElementById('mofa-filter').value.toLowerCase().trim();
    const box = document.getElementById('mofa-results');
    if (mofaRawData.length === 0) {
        box.innerHTML = '<p>まず「情報を取得」を押してください。</p>';
        return;
    }
    const keywords = f.split(/\s+/).filter(x => x);
    const filtered = mofaRawData.filter(item => {
        const t = item.querySelector('title')?.textContent.toLowerCase() || '';
        const c = item.querySelector('country > name')?.textContent.toLowerCase() || '';
        const lead = item.querySelector('lead')?.textContent.toLowerCase() || '';
        const main = item.querySelector('mainText')?.textContent.toLowerCase() || '';
        const info = item.querySelector('contentInfo')?.textContent.toLowerCase() || '';
        return keywords.every(k => t.includes(k) || c.includes(k) || lead.includes(k) || main.includes(k) || info.includes(k));
    });
    let html = `<h3>${filtered.length}件の情報が見つかりました</h3>`;
    filtered.forEach((item, index) => {
        const title = item.querySelector('title')?.textContent || '';
        const country = item.querySelector('country > name')?.textContent || '';
        const date = item.querySelector('leaveDate')?.textContent || '';
        const lead = item.querySelector('lead')?.textContent || '';
        const url = item.querySelector('infoUrl')?.textContent || '#';
        html += `
        <div class="card">
            <h4>${title}</h4>
            <p><strong>国/地域:</strong> ${country}</p>
            <p><strong>発表日時:</strong> ${date}</p>
            <p>${lead}</p>
            <div id="map-${index}" class="map-container"></div>
            <a href="${url}" target="_blank" class="action-btn" style="margin-top: 15px;">原文のページへ</a>
        </div>`;
    });
    box.innerHTML = html;

    // HTMLをDOMに反映させた後に地図をレンダリング
    // for...of ループを使い、非同期処理を正しく待つ
    for (const [index, item] of filtered.entries()) {
        const country = item.querySelector('country > name')?.textContent || '';
        const mapDiv = document.getElementById(`map-${index}`);

        if (!country || !mapDiv) continue;

        let coords = countryCoordinates[country];

        // キャッシュになければAPIから取得
        if (!coords) {
            coords = await getCountryCoords(country);
        }

        if (coords) {
            const [lat, lon] = coords;
            initMiniMap(`map-${index}`, lat, lon);
        } else {
            // 最終的に座標が取得できなければ地図コンテナを非表示にする
            mapDiv.style.display = 'none';
        }
    }
}

async function getMofaData() {
    const box = document.getElementById('mofa-results');
    box.innerHTML = '<p>情報を取得中...</p>';
    document.getElementById('mofa-filter').value = '';

    const type = document.getElementById('mofa-type').value;
    const detail = document.getElementById('mofa-detail').value;

    let path = (type === 'newarrival') ? 'area/newarrival' : 'area/00';
    const url = `https://www.ezairyu.mofa.go.jp/opendata/${path}${detail}.xml`;
    const proxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;

    try {
        const resp = await fetch(proxy);
        const xmlText = await resp.text();
        const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
        const items = xml.getElementsByTagName('mail');
        mofaRawData = Array.from(items);
        renderMofaResults();
    } catch (e) {
        mofaRawData = [];
        box.innerHTML = '<p>情報の取得に失敗しました。</p>';
        showError(box, '海外安全情報APIエラー', e, url);
    }
}

document.addEventListener('DOMContentLoaded', toggleMofaCodeInputs);
</script>
</body>
</html>
