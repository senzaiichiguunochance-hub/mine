<script>
(function(){
  const _origFetch = window.fetch.bind(window);
  window.fetch = async function(input, init){
    let resp;
    try { resp = await _origFetch(input, init); } catch (e) { throw new Error('通信エラー: サーバーへ接続できません。'); }
    let text = '';
    try { text = await resp.clone().text(); } catch {}
    const trimmed = (text || '').trim();
    if (trimmed.startsWith('<html') || trimmed.startsWith('<!DOCTYPE')) { throw new Error('APIがHTMLエラーを返しました。'); }
    if (!resp.ok) { throw new Error('HTTPエラー: ' + resp.status); }
    return resp;
  };
  window.showError = function(container, title, error, url) {
    const box = document.createElement('div');
    box.className = 'error-box';
    box.innerHTML = `<strong>${title}</strong><br>${error.message}${url ? `<br><small style="color:#78716c;">URL: ${url}</small>` : ''}`;
    container.appendChild(box);
  };
})();
</script>

// 内蔵データから座標を取得する（超高速＆確実）
function getCountryCoords(countryName) {
    if (!countryName) return null;
    if (countryCoordinates[countryName]) return countryCoordinates[countryName];
    for (const key in countryCoordinates) {
        if (countryName.includes(key) || key.includes(countryName)) return countryCoordinates[key];
    }
    return null;
}

function initMiniMap(elementId, lat, lon) {
    const container = L.DomUtil.get(elementId);
    if(container && container._leaflet_id) return;

    const map = L.map(elementId, {
        zoomControl: false, scrollWheelZoom: false, dragging: false, doubleClickZoom: false, attributionControl: false
    }).setView([lat, lon], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {}).addTo(map);
    L.marker([lat, lon]).addTo(map);
}

let mofaRawData = [];

function toggleMofaCodeInputs() {
    // 制御用（必要に応じて拡張）
}

function renderMofaResults() {
    const f = document.getElementById('mofa-filter').value.toLowerCase().trim();
    const box = document.getElementById('mofa-results');
    if (mofaRawData.length === 0) {
        box.innerHTML = '<p class="status-msg">データが見つかりませんでした。</p>';
        return;
    }

    const keywords = f.split(/\s+/).filter(x => x);
    const filtered = mofaRawData.filter(item => {
        const t = item.querySelector('title')?.textContent.toLowerCase() || '';
        const c = item.querySelector('country > name')?.textContent.toLowerCase() || '';
        const lead = item.querySelector('lead')?.textContent.toLowerCase() || '';
        return keywords.every(k => t.includes(k) || c.includes(k) || lead.includes(k));
    });

    let html = `<h3>${filtered.length}件の最新情報が見つかりました</h3>`;
    filtered.forEach((item, index) => {
        const title = item.querySelector('title')?.textContent || 'タイトルなし';
        const country = item.querySelector('country > name')?.textContent || '不明';
        const date = item.querySelector('leaveDate')?.textContent || '';
        const lead = item.querySelector('lead')?.textContent || '';
        const url = item.querySelector('infoUrl')?.textContent || '#';

        html += `
        <div class="card">
            <h4>${title}</h4>
            <p><strong>国/地域:</strong> ${country}</p>
            <p><strong>発表日時:</strong> ${date}</p>
            <p>${lead}</p>
            <div id="map-${index}" class="map-container"></div>
            <a href="${url}" target="_blank" class="action-btn">原文のページへ</a>
        </div>`;
    });
    box.innerHTML = html;

    filtered.forEach((item, index) => {
        const country = item.querySelector('country > name')?.textContent || '';
        const coords = getCountryCoords(country);
        if (coords) {
            initMiniMap(`map-${index}`, coords[0], coords[1]);
        } else {
            const mapDiv = document.getElementById(`map-${index}`);
            if (mapDiv) mapDiv.style.display = 'none';
        }
    });
}

// 外務省APIから最新データを動的に取得
async function getMofaData() {
    const box = document.getElementById('mofa-results');
    box.innerHTML = '<p class="status-msg">外務省サーバーから最新情報を取得中...</p>';
    document.getElementById('mofa-filter').value = '';

    const type = document.getElementById('mofa-type').value;
    const detail = document.getElementById('mofa-detail').value;

    let path = (type === 'newarrival') ? 'area/newarrival' : 'area/00';
    const targetUrl = `https://www.ezairyu.mofa.go.jp/opendata/${path}${detail}.xml`;

    // allorigins プロキシを経由してCORSを回避しつつ最新データをFetch
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

    try {
        const resp = await fetch(proxyUrl);
        if (!resp.ok) throw new Error(`HTTP error! status: ${resp.status}`);
        
        const json = await resp.json();
        const xmlText = json.contents; // プロキシから受け取った生XML

        const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
        const items = xml.getElementsByTagName('mail');
        
        mofaRawData = Array.from(items);
        renderMofaResults();
    } catch (e) {
        console.error(e);
        mofaRawData = [];
        box.innerHTML = `<div class="error-box"><strong>最新データの取得に失敗しました</strong><br>${e.message}<br><small>※「すべての地域」はデータ容量が大きいためタイムアウトする場合があります。「新着情報」でお試しください。</small></div>`;
    }
}

document.addEventListener('DOMContentLoaded', () => {
    toggleMofaCodeInputs();
});
</script>
</body>
