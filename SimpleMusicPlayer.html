<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オーディオプレーヤー</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff7ed, #ffedd5, #fef08a);
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary: #f97316;
      --primary-hover: #ea580c;
      --text: #44403c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    .menu-btn {
      position: absolute;
      top: 10px; right: 10px;
      font-size: 11px; color: #71716a;
      text-decoration: none;
      background: rgba(255,255,255,0.9);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1.5px solid #e4e4e7;
      font-weight: bold;
      z-index: 1000;
    }

    .container {
      background: var(--card-bg);
      border-radius: 24px;
      border: 2px solid #fed7aa;
      box-shadow: 0 10px 25px rgba(180,150,120,0.15);
      padding: 16px;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

    .btn-drum {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #c2410c;
      display: flex; align-items: center; justify-content: center; width: 100%;
    }
    .btn-drum:active { transform: translateY(2px); box-shadow: 0 1px 0 #c2410c; }

    .file-wrapper { position: relative; overflow: hidden; width: 100%; }
    .file-wrapper input[type=file] {
      position: absolute; top:0; left:0; opacity:0; font-size:100px; cursor:pointer;
    }

    .drop-zone {
      border: 1px dashed #fdba74;
      border-radius: 8px;
      padding: 6px;
      font-size: 10px;
      font-weight: bold;
      color: #a8a29e;
      text-align: center;
      background: rgba(255,247,237,0.5);
      display: flex; align-items: center; justify-content: center;
    }

    .status-text { text-align: center; font-size: 10px; font-weight: bold; color: #a8a29e; margin-bottom: 12px; }

    .display-pad {
      background: #292524;
      color: #f5f5f4;
      padding: 14px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 12px;
    }

    .track-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fde047;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    input[type=range] {
      width: 100%;
      height: 6px;
      background: #44403c;
      border-radius: 999px;
      outline: none;
      -webkit-appearance: none;
      touch-action: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fb923c;
      cursor: pointer;
    }

    .time-display {
      font-size: 1.25rem;
      font-weight: bold;
      color: #fb923c;
      font-family: monospace;
      margin-top: 6px;
    }

    .controls-main { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .btn-secondary {
      background: white; border: 1px solid #e7e5e4;
      color: #44403c; font-size: 12px; font-weight: bold;
      padding: 10px; border-radius: 12px; cursor: pointer; flex: 1; max-width: 90px;
      box-shadow: 0 3px 0 #d6d3d1;
    }
    .btn-secondary:active { transform: translateY(2px); box-shadow: 0 1px 0 #d6d3d1; }

    .btn-play {
      background: var(--primary); color: white; border: none;
      font-size: 14px; font-weight: bold; padding: 10px; border-radius: 12px;
      cursor: pointer; flex: 2; max-width: 160px; box-shadow: 0 3px 0 #c2410c;
    }
    .btn-play:active { transform: translateY(2px); box-shadow: 0 1px 0 #c2410c; }

    .box-sub {
      background: rgba(255,247,237,0.7);
      padding: 10px; border-radius: 12px;
      border: 1px solid #ffedd5; margin-bottom: 12px;
    }
    .box-title { font-size: 11px; font-weight: bold; color: var(--primary); margin-bottom: 6px; }

    .flex-wrap { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; margin-bottom: 4px; }
    .btn-seek {
      background: white; border: 1px solid #e7e5e4; color: #57534e;
      font-size: 11px; font-weight: bold; padding: 6px 0; border-radius: 8px;
      flex: 1; min-width: 55px; cursor: pointer; box-shadow: 0 2px 0 #d6d3d1;
    }
    .btn-seek:active { transform: translateY(2px); box-shadow: 0 0 0; }

    .playlist-box { max-height: 140px; overflow-y: auto; }
    .playlist-item {
      padding: 8px; border-radius: 8px; font-size: 11px; font-weight: bold;
      cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      border: 1px solid #e7e5e4; background: white; color: #57534e; margin-bottom: 4px;
    }
    .playlist-item.active {
      background: var(--primary); color: white; border-color: #ea580c;
    }
  </style>
</head>
<body>

<a href="menu.html" class="menu-btn">メニューに戻る</a>

<div class="container">
  <h1>オーディオプレーヤー</h1>

  <div class="grid-2">
    <div style="text-align:center;">
      <div class="file-wrapper">
        <button class="btn-drum">📁 フォルダ選択</button>
        <input type="file" id="folderInput" webkitdirectory directory multiple>
      </div>
      <div id="folderStatus" style="font-size:10px; font-weight:bold; color:#78716c; margin-top:4px;">未選択</div>
    </div>
    <div id="dropZone" class="drop-zone">ここにフォルダをドロップ</div>
  </div>

  <div class="status-text">🔒 ※データはブラウザ内でのみ安全に処理されます</div>

  <div class="display-pad">
    <div id="trackTitle" class="track-title">トラックが選択されていません</div>
    <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.1">
    <div id="timeDisplay" class="time-display">00:00:00 / 00:00:00</div>
  </div>

  <div class="controls-main">
    <button id="prevBtn" class="btn-secondary">⏮ 前へ</button>
    <button id="playPauseBtn" class="btn-play">▶ 再生</button>
    <button id="nextBtn" class="btn-secondary">次へ ⏭</button>
  </div>

  <div class="box-sub">
    <div class="box-title">★ スキップコントロール</div>
    <div class="flex-wrap">
      <button class="btn-seek" data-seconds="-30">-30秒</button>
      <button class="btn-seek" data-seconds="-15">-15秒</button>
      <button class="btn-seek" data-seconds="-10">-10秒</button>
      <button class="btn-seek" data-seconds="-5">-5秒</button>
    </div>
    <div class="flex-wrap">
      <button class="btn-seek" data-seconds="5">+5秒</button>
      <button class="btn-seek" data-seconds="10">+10秒</button>
      <button class="btn-seek" data-seconds="15">+15秒</button>
      <button class="btn-seek" data-seconds="30">+30秒</button>
    </div>
  </div>

  <div class="box-sub">
    <div class="box-title">★ プレイリスト</div>
    <div class="playlist-box">
      <div id="playlist"></div>
    </div>
  </div>
</div>

<audio id="audioPlayer"></audio>

<script>
  const DB_NAME = 'AudioAppCacheDB';
  const STORE_NAME = 'audioFiles';

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME, { keyPath: 'id' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveToDB(files, folderName) {
    try {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      await new Promise(r => { store.clear().onsuccess = r; });
      for (let i = 0; i < files.length; i++) {
        store.put({ id: i, name: files[i].name, blob: files[i] });
      }
      localStorage.setItem('audio_folder_name', folderName);
    } catch (e) {}
  }

  async function loadFromDB() {
    try {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readonly');
      return await new Promise(resolve => {
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    } catch (e) { return []; }
  }

  let fileList = [];
  let currentIndex = -1;
  let isUserSeeking = false;

  const audio = document.getElementById('audioPlayer');
  const folderInput = document.getElementById('folderInput');
  const folderStatus = document.getElementById('folderStatus');
  const trackTitle = document.getElementById('trackTitle');
  const timeDisplay = document.getElementById('timeDisplay');
  const seekSlider = document.getElementById('seekSlider');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const playlistEl = document.getElementById('playlist');

  window.addEventListener('DOMContentLoaded', async () => {
    document.querySelectorAll('.btn-seek').forEach(btn => {
      btn.addEventListener('click', () => seekSeconds(parseFloat(btn.dataset.seconds)));
    });

    const cached = await loadFromDB();
    const savedFolderName = localStorage.getItem('audio_folder_name');

    if (cached.length > 0) {
      fileList = cached.map(item => ({ name: item.name, file: item.blob }));
      folderStatus.textContent = savedFolderName ? `選択中: ${savedFolderName}` : "復元完了";
      renderPlaylist();
      restoreSavedTrack();
    }
  });

  function restoreSavedTrack() {
    const savedName = localStorage.getItem('audio_last_file');
    const savedTime = parseFloat(localStorage.getItem('audio_last_time') || 0);

    let targetIdx = 0;
    if (savedName) {
      const idx = fileList.findIndex(f => f.name === savedName);
      if (idx !== -1) targetIdx = idx;
    }
    loadTrack(targetIdx, savedTime);
  }

  // 軽量化したスライダーイベント
  seekSlider.addEventListener('input', () => {
    isUserSeeking = true;
    if (audio.duration) {
      const targetTime = (seekSlider.value / 100) * audio.duration;
      timeDisplay.textContent = `${formatTime(targetTime)} / ${formatTime(audio.duration)}`;
    }
  });

  seekSlider.addEventListener('change', () => {
    if (audio.duration) {
      audio.currentTime = (seekSlider.value / 100) * audio.duration;
    }
    isUserSeeking = false;
    saveCurrentState();
  });

  folderInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    const folderName = files[0].webkitRelativePath ? files[0].webkitRelativePath.split('/')[0] : "選択フォルダ";
    folderStatus.textContent = `選択中: ${folderName}`;
    await processFiles(files, folderName);
  });

  async function processFiles(rawFiles, folderName) {
    const filteredFiles = rawFiles.filter(f => ['mp3', 'm4a', 'wav', 'ogg', 'aac', 'flac'].includes(f.name.split('.').pop().toLowerCase()));
    if (filteredFiles.length === 0) return;

    const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
    filteredFiles.sort((a, b) => collator.compare(a.name, b.name));

    fileList = filteredFiles.map(f => ({ name: f.name, file: f }));
    renderPlaylist();
    await saveToDB(filteredFiles, folderName);
    loadTrack(0, 0);
  }

  function renderPlaylist() {
    playlistEl.innerHTML = '';
    fileList.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
      div.textContent = `${index + 1}. ${item.name}`;
      div.addEventListener('click', () => loadAndPlayTrack(index, 0, true));
      playlistEl.appendChild(div);
    });
  }

  function loadTrack(index, seekTime = 0) {
    if (index < 0 || index >= fileList.length) return;
    currentIndex = index;
    const item = fileList[currentIndex];

    if (audio.src) URL.revokeObjectURL(audio.src);
    audio.src = URL.createObjectURL(item.file);
    trackTitle.textContent = item.name;
    
    // プレイリストのハイライト更新
    const items = playlistEl.children;
    for(let i=0; i<items.length; i++) {
      items[i].classList.toggle('active', i === currentIndex);
    }

    audio.onloadedmetadata = () => {
      audio.currentTime = seekTime;
      timeDisplay.textContent = `${formatTime(seekTime)} / ${formatTime(audio.duration || 0)}`;
      if (audio.duration) seekSlider.value = (seekTime / audio.duration) * 100;
    };
  }

  async function loadAndPlayTrack(index, seekTime = 0, autoPlay = false) {
    loadTrack(index, seekTime);
    if (autoPlay) {
      try {
        await audio.play();
        playPauseBtn.textContent = '⏸ 一時停止';
      } catch (e) {}
    } else {
      audio.pause();
      playPauseBtn.textContent = '▶ 再生';
    }
  }

  playPauseBtn.addEventListener('click', async () => {
    if (fileList.length === 0) return;
    if (audio.paused) {
      await audio.play();
      playPauseBtn.textContent = '⏸ 一時停止';
    } else {
      audio.pause();
      playPauseBtn.textContent = '▶ 再生';
      saveCurrentState(); // 一時停止時に保存
    }
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentIndex > 0) loadAndPlayTrack(currentIndex - 1, 0, !audio.paused);
    else audio.currentTime = 0;
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentIndex < fileList.length - 1) loadAndPlayTrack(currentIndex + 1, 0, !audio.paused);
  });

  audio.addEventListener('ended', () => {
    if (currentIndex < fileList.length - 1) loadAndPlayTrack(currentIndex + 1, 0, true);
    else playPauseBtn.textContent = '▶ 再生';
  });

  function seekSeconds(seconds) {
    if (!audio.src || isNaN(audio.duration)) return;
    let targetTime = audio.currentTime + seconds;
    audio.currentTime = Math.max(0, Math.min(targetTime, audio.duration));
  }

  // 高速化した timeupdate（保存処理を除去）
  audio.addEventListener('timeupdate', () => {
    if (!isUserSeeking && audio.duration) {
      seekSlider.value = (audio.currentTime / audio.duration) * 100;
      timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    }
  });

  function formatTime(seconds) {
    if (isNaN(seconds)) return "00:00:00";
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  // 必要なタイミングでのみ保存
  function saveCurrentState() {
    if (currentIndex >= 0 && fileList[currentIndex]) {
      localStorage.setItem('audio_last_file', fileList[currentIndex].name);
      localStorage.setItem('audio_last_time', audio.currentTime);
    }
  }

  // ページを閉じる・バックグラウンドに移動した時に保存
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveCurrentState();
  });
</script>

</body>
</html>
