<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイトルを入力</title>
  <style>
    /* === 共通カラー変数・基本設定 === */
    :root {
      --bg-gradient: linear-gradient(135deg, #fff7ed, #ffedd5, #fef08a);
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: #fed7aa;
      --primary: #f97316;
      --primary-dark: #c2410c;
      --primary-border: #ea580c;
      --sub-bg: rgba(255, 247, 237, 0.7);
      --sub-border: #ffedd5;
      --text: #44403c;
      --text-muted: #78716c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* === 右上：メニューに戻るボタン === */
    .menu-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 11px;
      color: #71716a;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1.5px solid #e4e4e7;
      font-weight: bold;
      z-index: 1000;
    }

    /* === メインコンテナ・見出し === */
    .container {
      background: var(--card-bg);
      border-radius: 24px;
      border: 2px solid var(--card-border);
      box-shadow: 0 10px 25px rgba(180, 150, 120, 0.15);
      padding: 16px;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 12px;
    }

    /* === 汎用UIパーツ（AIへのデザイン基準用） === */
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--primary-dark);
      width: 100%;
    }
    .btn-primary:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--primary-dark);
    }

    .btn-secondary {
      background: white;
      border: 1px solid #e7e5e4;
      color: var(--text);
      font-size: 12px;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 0 #d6d3d1;
    }
    .btn-secondary:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 #d6d3d1;
    }

    .box-sub {
      background: var(--sub-bg);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--sub-border);
      margin-bottom: 12px;
    }
    .box-title {
      font-size: 11px;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 6px;
    }
  </style>
  <!-- GoatCounter アクセス解析 -->
  <script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

  <!-- 右上固定リンク -->
  <a href="menu.html" class="menu-btn">メニューに戻る</a>

  <!-- メインコンテンツ枠 -->
  <div class="container">
    <h1>アプリのタイトル</h1>

    <div class="box-sub">
      <div class="box-title">★ セクション見出し</div>
      <p style="font-size: 12px; color: var(--text-muted);">ここにコンテンツが入ります。</p>
    </div>

    <button class="btn-primary">メインボタン</button>
  </div>

  <script>
    // ここにJavaScriptを記述
  </script>

</body>
</html>
