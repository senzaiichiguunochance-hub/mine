<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歴史年代順 並び替えクイズ</title>
  <style>
    :root {
      --primary-color: #8E44AD; /* 歴史っぽい紫 */
      --accent-color: #E67E22;
      --bg-color: #F5F6FA;
      --card-bg: #FFFFFF;
      --success-color: #2ECC71;
      --gold-color: #F39C12;
      --danger-color: #E74C3C;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 60px 16px 24px;
      display: flex;
      justify-content: center;
      color: #2C3E50;
      user-select: none;
    }

    /* 右上メニューリンク */
    .back-link {
      position: fixed;
      top: 14px;
      right: 14px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--primary-color);
      text-decoration: none;
      background: white;
      border: 2px solid var(--primary-color);
      padding: 6px 14px;
      border-radius: 20px;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: all 0.2s;
    }
    .back-link:hover {
      background: var(--primary-color);
      color: white;
    }

    .container {
      background: white;
      max-width: 480px;
      width: 100%;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 14px;
      color: var(--primary-color);
    }

    /* テーマ選択 */
    .theme-selector {
      margin-bottom: 12px;
      text-align: center;
    }

    .theme-selector select {
      width: 100%;
      padding: 10px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 2px solid var(--primary-color);
      font-weight: bold;
      color: var(--primary-color);
      background: white;
      outline: none;
    }

    /* 成績表示（前回情報保持） */
    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      background: #F4ECF7;
      border: 1px solid #EBDEF0;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 14px;
    }

    .stat-item {
      flex: 1;
      text-align: center;
    }
    .stat-label {
      font-size: 0.7rem;
      color: #666;
      display: block;
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 1rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .instruction {
      background: #EBF5FB;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 14px;
      font-weight: bold;
      color: #2980B9;
    }

    /* カードリスト */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      position: relative;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid #E0E0E0;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      cursor: grab;
      touch-action: none;
    }

    .card:active { cursor: grabbing; }

    .card.dragging {
      opacity: 0.4;
      border-style: dashed;
      border-color: var(--primary-color);
    }

    .drag-handle {
      font-size: 1.1rem;
      color: #BDC3C7;
      cursor: grab;
    }

    .card-content { flex: 1; }

    .card-title {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 3px;
      color: #2C3E50;
    }

    .card-desc {
      font-size: 0.75rem;
      color: #7F8C8D;
      line-height: 1.3;
    }

    .year-badge {
      display: none;
      background: var(--success-color);
      color: white;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    /* ボタン群 */
    .btn-group {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .action-btn {
      flex: 1;
      background: var(--success-color);
      color: white;
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 0 #27AE60;
      transition: transform 0.1s;
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #27AE60;
    }

    .btn-giveup {
      background: var(--gold-color);
      box-shadow: 0 4px 0 #D68910;
    }

    .btn-next {
      background: var(--primary-color);
      box-shadow: 0 4px 0 #6C3483;
    }

    .btn-share {
      background: white;
      color: var(--primary-color);
      border: 2px solid var(--primary-color);
      box-shadow: 0 2px 0 var(--primary-color);
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 20px;
      margin-top: 12px;
      width: 100%;
      cursor: pointer;
    }

    /* 結果メッセージ */
    .result-msg {
      text-align: center;
      font-size: 1.05rem;
      font-weight: bold;
      margin-top: 12px;
      min-height: 1.5rem;
    }

    .correct-msg { color: var(--success-color); }
    .wrong-msg { color: var(--danger-color); }
    .giveup-msg { color: var(--gold-color); }

    .is-correct {
      border-color: var(--success-color);
      background-color: #EAFAF1;
    }

    /* ログ表示ボックス */
    .log-box {
      margin-top: 16px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 8px 12px;
      text-align: left;
      max-height: 110px;
      overflow-y: auto;
    }

    .log-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #666;
      margin-bottom: 4px;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 2px;
    }

    .log-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.8rem;
    }

    .log-item { margin-bottom: 2px; }
    .log-item.ok { color: var(--success-color); font-weight: bold; }
    .log-item.ng { color: var(--danger-color); }
    .log-item.giveup { color: var(--gold-color); }

    /* モーダル (SNSシェア) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .modal-card h2 {
      font-size: 1.2rem;
      margin-top: 0;
      margin-bottom: 10px;
      color: #333;
    }

    .modal-share-btns {
      display: flex;
      gap: 10px;
      margin: 14px 0;
    }

    .btn-sns {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }
    .btn-x { background: #000000; }
    .btn-line { background: #06C755; }
  </style>

</head>

  <!-- 右上メニューに戻るボタン -->

<div class="container">
  <h1>🛡️ 歴史年代順 並び替えクイズ</h1>

    </select>

  <div class="stats-row">

      <span class="stat-value" id="stat-total">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">正解</span>
      <span class="stat-value" id="stat-correct">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">不正解</span>
      <span class="stat-value" id="stat-wrong">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">ギブアップ</span>
      <span class="stat-value" id="stat-giveup">0</span>
    </div>
  </div>

  <div class="instruction">
    🖐️ カードをドラッグして【古い順（昔 ➔ 最近）】に並べ替えよう！
  </div>

  <!-- カード一覧 -->
  <div class="card-list" id="card-list"></div>

  <!-- 操作ボタン -->
  <div class="btn-group">
    <button class="action-btn" id="check-btn" onclick="checkAnswer()">⭕ 答え合わせ</button>
    <button class="action-btn btn-giveup" id="giveup-btn" onclick="giveUp()">💡 ギブアップ</button>
    <button class="action-btn btn-next" id="next-btn" onclick="loadNextTheme()" style="display:none;">次のテーマへ</button>
  </div>

  <!-- 結果フィードバック -->
  <div class="result-msg" id="result-msg"></div>

  <!-- SNSシェアボタン -->
  <button class="btn-share" onclick="openShareModal()">結果をSNSでシェア</button>

  <!-- 今回の解答ログ -->
  <div class="log-box">
    <div class="log-title">今回の解答ログ</div>
    <ul id="log-list" class="log-list"></ul>
  </div>
</div>

<!-- SNSシェアモーダル -->
<div class="modal-overlay" id="share-modal">
  <div class="modal-card">
    <h2>結果をシェアする</h2>
    <p id="share-text-preview" style="font-size:0.85rem; color:#555; white-space:pre-wrap; margin-bottom:12px;"></p>
    <div class="modal-share-btns">
      <button class="btn-sns btn-x" id="share-x-btn">Xでシェア</button>
      <button class="btn-sns btn-line" id="share-line-btn">LINEでシェア</button>
    </div>
    <button class="action-btn" style="background:#888; box-shadow:none; padding:6px 16px; font-size:0.85rem;" onclick="closeShareModal()">閉じる</button>
  </div>
</div>

      themeTitle: "【世界史】第一次世界大戦〜世界恐慌",
      events: [
        { id: 1, title: "サラエボ事件をきっかけに「第一次世界大戦」勃発", desc: "三国協商と三国同盟の全面衝突", year: 1914 },
        { id: 2, title: "「ロシア革命」が起こる", desc: "レーニンらの指導により世界初の社会主義国へ", year: 1917 },
        { id: 3, title: "ベルサイユ条約の調印", desc: "第一次世界大戦が講和を迎える", year: 1919 },
        { id: 4, title: "ニューヨークでの「世界恐慌」勃発", desc: "株価暴落により世界的な大不況に", year: 1929 }
      ]
    },
    {
      themeId: "world_ww2",
      themeTitle: "【世界史】第二次世界大戦〜冷戦",
      events: [
        { id: 1, title: "ナチス・ドイツがポーランドへ侵攻（第二次世界大戦）", desc: "英仏が宣戦布告し世界大戦へ", year: 1939 },
        { id: 2, title: "「国際連合（UN）」の発足", desc: "国際連盟の反省を生かし51か国でスタート", year: 1945 },
        { id: 3, title: "「朝鮮戦争」の勃発", desc: "南北分断に伴う冷戦の激化", year: 1950 },
        { id: 4, title: "「ベルリンの壁」崩壊", desc: "冷戦の終結の象徴となった歴史的出来事", year: 1989 }
      ]
    }
  ];

  let currentEvents = []; 
  let draggedElement = null;
  let activeTouchCard = null;

  // 成績の記憶（LocalStorage）
  const STORAGE_KEY = 'history_quiz_stats';
  let stats = loadStats();

  function loadStats() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (data && typeof data.total === 'number') return data;
    } catch(e){}
    return { total: 0, correct: 0, wrong: 0, giveup: 0 };
  }

  function saveStats() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
  }

  function updateStatsUI() {
    document.getElementById('stat-total').textContent = stats.total;
    document.getElementById('stat-correct').textContent = stats.correct;
    document.getElementById('stat-wrong').textContent = stats.wrong;
    document.getElementById('stat-giveup').textContent = stats.giveup;
  }

  function addLog(text, className) {
    const list = document.getElementById('log-list');
    const li = document.createElement('li');
    li.className = `log-item ${className}`;
    li.textContent = text;
    list.prepend(li);
  }

  // 初期化
  window.onload = () => {
    initThemeSelect();
    updateStatsUI();
    loadSelectedTheme();
  };

  function initThemeSelect() {
    const select = document.getElementById('theme-select');
    select.innerHTML = quizData.map((q, index) => 
      `<option value="${index}">${q.themeTitle}</option>`
    ).join('');
  }

  function loadSelectedTheme() {
    const selectIndex = document.getElementById('theme-select').value;
    const rawEvents = quizData[selectIndex].events;

    // シャッフル
    currentEvents = [...rawEvents].sort(() => Math.random() - 0.5);

    // UIリセット
    document.getElementById('result-msg').textContent = '';
    document.getElementById('result-msg').className = 'result-msg';
    
    document.getElementById('check-btn').style.display = 'block';
    document.getElementById('giveup-btn').style.display = 'block';
    document.getElementById('next-btn').style.display = 'none';

    renderCards();
  }

  function renderCards() {
    const listContainer = document.getElementById('card-list');
    listContainer.innerHTML = '';

    currentEvents.forEach((item, index) => {
      const yearText = item.year < 0 ? `紀元前${Math.abs(item.year)}年` : `${item.year}年`;
      const cardHTML = `
        <div class="card" id="card-${index}" draggable="true">
          <div class="drag-handle">☰</div>
          <div class="card-content">
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.desc}</div>
          </div>
          <div class="year-badge" id="year-${index}">${yearText}</div>
        </div>
      `;
      listContainer.innerHTML += cardHTML;
    });

    setupDragAndDrop();
  }

  // ドラッグ＆ドロップ設定
  function setupDragAndDrop() {
    const cards = document.querySelectorAll('.card');
    const container = document.getElementById('card-list');

    cards.forEach(card => {
      card.addEventListener('dragstart', (e) => {
        draggedElement = card;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        draggedElement = null;
        updateCurrentEventsFromDOM();
      });

      card.addEventListener('touchstart', (e) => {
        activeTouchCard = card;
        card.classList.add('dragging');
      }, { passive: true });

      card.addEventListener('touchmove', (e) => {
        if (!activeTouchCard) return;
        const touchLocation = e.touches[0];
        const targetElement = document.elementFromPoint(touchLocation.clientX, touchLocation.clientY);
        const targetCard = targetElement ? targetElement.closest('.card') : null;

        if (targetCard && targetCard !== activeTouchCard) {
          const bounding = targetCard.getBoundingClientRect();
          const offset = touchLocation.clientY - bounding.top - (bounding.height / 2);
          if (offset > 0) {
            container.insertBefore(activeTouchCard, targetCard.nextSibling);
          } else {
            container.insertBefore(activeTouchCard, targetCard);
          }
        }
      }, { passive: true });

      card.addEventListener('touchend', () => {
        if (activeTouchCard) {
          activeTouchCard.classList.remove('dragging');
          activeTouchCard = null;
          updateCurrentEventsFromDOM();
        }
      });
    });

    container.addEventListener('dragover', (e) => {
      e.preventDefault();
      const afterElement = getDragAfterElement(container, e.clientY);
      if (afterElement == null) {
        container.appendChild(draggedElement);
      } else {
        container.insertBefore(draggedElement, afterElement);
      }
    });
  }

  function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll('.card:not(.dragging)')];

    return draggableElements.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  function updateCurrentEventsFromDOM() {
    const cards = document.querySelectorAll('.card');
    const newEvents = [];
    cards.forEach(card => {
      const title = card.querySelector('.card-title').textContent;
      const item = currentEvents.find(e => e.title === title);
      if (item) newEvents.push(item);
    });
    currentEvents = newEvents;
  }

  // 答え合わせ
  function checkAnswer() {
    updateCurrentEventsFromDOM();
    const resultDiv = document.getElementById('result-msg');
    let isCorrect = true;

    for (let i = 0; i < currentEvents.length - 1; i++) {
      if (currentEvents[i].year > currentEvents[i + 1].year) {
        isCorrect = false;
        break;
      }
    }

    const select = document.getElementById('theme-select');
    const themeTitle = quizData[select.value].themeTitle.replace(/【.*?】/, '');

    stats.total++;

    if (isCorrect) {
      stats.correct++;
      saveStats();
      updateStatsUI();

      resultDiv.textContent = '🎉 正解！ 正しい歴史の流れです！';
      resultDiv.className = 'result-msg correct-msg';

      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        card.querySelector('.year-badge').style.display = 'block';
        card.classList.add('is-correct');
      });

      addLog(`[正解] ${themeTitle}`, 'ok');

      document.getElementById('check-btn').style.display = 'none';
      document.getElementById('giveup-btn').style.display = 'none';
      document.getElementById('next-btn').style.display = 'block';

    } else {
      stats.wrong++;
      saveStats();
      updateStatsUI();

      resultDiv.textContent = '❌ 残念！ もう一度 順番を考えてみよう';
      resultDiv.className = 'result-msg wrong-msg';
      addLog(`[不正解] ${themeTitle}`, 'ng');
    }
  }

  // ギブアップ
  function giveUp() {
    const select = document.getElementById('theme-select');
    const themeTitle = quizData[select.value].themeTitle.replace(/【.*?】/, '');

    stats.total++;
    stats.giveup++;
    saveStats();
    updateStatsUI();

    // 正解の年代順にソートして再描画
    currentEvents.sort((a, b) => a.year - b.year);
    renderCards();

    // 全バッジ表示
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
      card.querySelector('.year-badge').style.display = 'block';
    });

    const resultDiv = document.getElementById('result-msg');
    resultDiv.textContent = '💡 正解の順番はこちらです！';
    resultDiv.className = 'result-msg giveup-msg';

    addLog(`[ギブアップ] ${themeTitle}`, 'giveup');

    document.getElementById('check-btn').style.display = 'none';
    document.getElementById('giveup-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'block';
  }

  function loadNextTheme() {
    const select = document.getElementById('theme-select');
    let nextIndex = (parseInt(select.value) + 1) % quizData.length;
    select.value = nextIndex;
    loadSelectedTheme();
  }

  // SNSシェア関連
  function getShareText() {
    const select = document.getElementById('theme-select');
    const themeName = quizData[select.value].themeTitle;
    return `🛡️ 歴史年代順 並び替えクイズ\n「${themeName}」に挑戦！\n通算成績: ${stats.correct}勝${stats.wrong}敗 (ギブアップ${stats.giveup}回)\n#歴史並び替えクイズ\n`;
  }

  function openShareModal() {
    document.getElementById('share-text-preview').textContent = getShareText();
    document.getElementById('share-modal').style.display = 'flex';
  }

  function closeShareModal() {
    document.getElementById('share-modal').style.display = 'none';
  }

  document.getElementById('share-x-btn').addEventListener('click', () => {
    const text = getShareText();
    const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`;
    window.open(url, '_blank', 'noopener');
  });

  document.getElementById('share-line-btn').addEventListener('click', () => {
    const text = getShareText() + window.location.href;
    const url = `https://social-plugins.line.me/lineit/share?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank', 'noopener');
  });
</script>
</body>
</html>
