  <style>
    body {
      font-family: 'Kiwi Maru', serif, sans-serif;
      background-color: #fdf8f5;
    }
    
    /* Circle position logic with responsive canvas container */
    .zodiac-circle-container {
      position: relative;
      width: 100%;
      max-width: 620px; /* Expanded for 3x larger icons */
      aspect-ratio: 1 / 1;
      margin: 0 auto;
    }

    /* Grayscale vs Vibrant Color Styling for Zodiac Items */
    .zodiac-item {
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: grayscale(100%) opacity(0.4) saturate(0%);
      cursor: pointer;
      background-color: rgba(255, 255, 255, 0.7);
    }

    .zodiac-item:hover {
      filter: grayscale(40%) opacity(0.85) saturate(70%);
      transform: translate(-50%, -50%) scale(1.08) !important;
    }

    .zodiac-item.active {
      filter: grayscale(0%) opacity(1) saturate(130%);
      z-index: 30;
      background-color: #ffffff;
      box-shadow: 0 12px 28px -4px rgba(244, 114, 182, 0.45), 0 0 20px 2px rgba(251, 191, 36, 0.4);
    }

    /* Pulse animation for the selected active zodiac */
    @keyframes active-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1.22); }
      50% { transform: translate(-50%, -50%) scale(1.32); }
    }

    .zodiac-item.active-anim {
      animation: active-pulse 2.2s infinite ease-in-out;
    }

    /* Modal Animation */
    .modal-backdrop {
      transition: opacity 0.3s ease;
    }
    .modal-content {
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
  </style>

     * In Japanese/Chinese Zodiac:
     * 1900 = Rat (子, Index 0)
     * Formula: (year - 1900) % 12

    function getZodiacIndexFromYear(year) {
      let offset = (year - 1900) % 12;
      if (offset < 0) offset += 12;
      return offset;
    }

    function initApp() {
      currentYearText.textContent = DEFAULT_YEAR;

      // Load saved year from localStorage
      const savedYear = localStorage.getItem(STORAGE_KEY);
      if (savedYear !== null) {
        const parsed = parseInt(savedYear, 10);
        if (!isNaN(parsed) && parsed >= MIN_YEAR && parsed <= MAX_YEAR) {
          selectedYear = parsed;
        } else {
          selectedYear = DEFAULT_YEAR;
        }
      } else {
        selectedYear = DEFAULT_YEAR;
      }

      // Render Circle Layout
      renderZodiacCircle();

      // Update State & UI
      updateYearAndZodiac(selectedYear, false);

      // Attach Event Listeners
      setupEventListeners();
    }

    /**
     * Render Zodiac Items in a Circle Layout
     */
    function renderZodiacCircle() {
      zodiacWheel.innerHTML = '';
      const total = ZODIAC_DATA.length;
      
      // Radius percentage from center for enlarged icons
      const radius = 38; 

      ZODIAC_DATA.forEach((zodiac, i) => {
        // Calculate angle in radians (Clockwise starting from top / 子 at 12 o'clock)
        const angleDegree = (i * (360 / total)) - 90;
        const angleRad = (angleDegree * Math.PI) / 180;

        // Calculate X and Y coordinates in percentage
        const x = 50 + radius * Math.cos(angleRad);
        const y = 50 + radius * Math.sin(angleRad);

        // Create Item element (Approx 3x larger icon box with responsive dimensions)
        const itemEl = document.createElement('div');
        itemEl.className = 'zodiac-item absolute w-20 h-20 sm:w-28 sm:h-28 flex flex-col items-center justify-center p-2 rounded-3xl border-2 border-rose-100 shadow-md transition-all duration-300';
        itemEl.style.left = `${x}%`;
        itemEl.style.top = `${y}%`;
        itemEl.style.transform = `translate(-50%, -50%)`;
        itemEl.dataset.index = i;

        itemEl.innerHTML = `
          <div class="w-12 h-12 sm:w-16 sm:h-16 pointer-events-none drop-shadow-xs">${zodiac.svg}</div>
          <span class="text-xs sm:text-sm font-bold text-slate-700 mt-1 pointer-events-none">${zodiac.kanji}</span>
        `;

        // Click Handler: Highlights Zodiac and Opens Year Modal
        itemEl.addEventListener('click', () => {
          handleZodiacClick(i);
        });

        zodiacWheel.appendChild(itemEl);
      });
    }

    /**
     * Handle Direct Zodiac Item Click
     */
    function handleZodiacClick(zodiacIndex) {
      // Find the closest year matching this zodiac to current selectedYear
      const currentZodiacIdx = getZodiacIndexFromYear(selectedYear);
      let diff = zodiacIndex - currentZodiacIdx;
      let targetYear = selectedYear + diff;

      // Ensure within range
      if (targetYear < MIN_YEAR) targetYear += 12;
      if (targetYear > MAX_YEAR) targetYear -= 12;

      updateYearAndZodiac(targetYear, true);
      openYearModal(zodiacIndex);
    }

    /**
     * Update Year and Active Zodiac Display
     */
    function updateYearAndZodiac(year, saveToStorage = true) {
      selectedYear = year;
      yearInput.value = selectedYear;

      if (saveToStorage) {
        localStorage.setItem(STORAGE_KEY, selectedYear.toString());
      }

      selectedZodiacIndex = getZodiacIndexFromYear(selectedYear);
      const currentZodiac = ZODIAC_DATA[selectedZodiacIndex];

      // Update Center Info
      centerKanji.textContent = currentZodiac.kanji;
      centerReading.textContent = `（${currentZodiac.reading}）`;
      centerYear.textContent = `${selectedYear}年`;

      // Update Circle Highlight
      const items = zodiacWheel.querySelectorAll('.zodiac-item');
      items.forEach((item) => {
        const idx = parseInt(item.dataset.index, 10);
        if (idx === selectedZodiacIndex) {
          item.classList.add('active', 'active-anim', 'ring-4', 'ring-amber-300', 'border-rose-400');
        } else {
          item.classList.remove('active', 'active-anim', 'ring-4', 'ring-amber-300', 'border-rose-400');
        }
      });
    }

    /**
     * Input Validation & Fallback Logic
     */
    function validateAndUpdateInput() {
      const val = yearInput.value.trim();
      const num = parseInt(val, 10);

      // Reset to DEFAULT_YEAR if invalid, non-numeric, or out of 1900-2100 bounds
      if (val === '' || isNaN(num) || num < MIN_YEAR || num > MAX_YEAR) {
        updateYearAndZodiac(DEFAULT_YEAR, true);
      } else {
        updateYearAndZodiac(num, true);
      }
    }

    /**
     * Modal Logic: Display all years for a given Zodiac (1900 - 2100)
     */
    function openYearModal(zodiacIndex) {
      const zodiac = ZODIAC_DATA[zodiacIndex];

      // Calculate all years matching this zodiac in range 1900-2100
      const matchingYears = [];
      for (let y = MIN_YEAR; y <= MAX_YEAR; y++) {
        if (getZodiacIndexFromYear(y) === zodiacIndex) {
          matchingYears.push(y);
        }
      }

      // Populate Modal Elements
      modalIconContainer.innerHTML = zodiac.svg;
      modalZodiacName.textContent = `${zodiac.kanji}年 (${zodiac.animal})`;
      modalZodiacReading.textContent = `（${zodiac.reading}）`;
      modalYearCount.textContent = matchingYears.length;

      // Clear & Build Year Grid
      modalYearGrid.innerHTML = '';
      matchingYears.forEach(yr => {
        const btn = document.createElement('button');
        const isSelected = (yr === selectedYear);

        btn.className = `py-2 px-3 rounded-xl text-sm font-bold transition shadow-xs flex flex-col items-center justify-center border ${
          isSelected 
            ? 'bg-rose-500 text-white border-rose-500 ring-2 ring-rose-200' 
            : 'bg-rose-50/60 hover:bg-rose-100 text-slate-700 border-rose-100'
        }`;
        
        btn.innerHTML = `
          <span>${yr}年</span>
        `;

        // Click on year in modal selects it and closes modal
        btn.addEventListener('click', () => {
          updateYearAndZodiac(yr, true);
          closeYearModal();
        });

        modalYearGrid.appendChild(btn);
      });

      // Show Modal
      yearModal.classList.remove('opacity-0', 'pointer-events-none');
      const content = yearModal.querySelector('.modal-content');
      content.classList.remove('scale-90');
      content.classList.add('scale-100');
    }

    /**
     * Close Modal
     */
    function closeYearModal() {
      const content = yearModal.querySelector('.modal-content');
      content.classList.remove('scale-100');
      content.classList.add('scale-90');
      
      yearModal.classList.add('opacity-0', 'pointer-events-none');
    }

    /**
     * Setup Event Listeners
     */
    function setupEventListeners() {
      // Input Change / Blur events
      yearInput.addEventListener('change', validateAndUpdateInput);
      yearInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          validateAndUpdateInput();
          yearInput.blur();
        }
      });

      // Arrow Buttons
      prevYearBtn.addEventListener('click', () => {
        let newYr = selectedYear - 1;
        if (newYr < MIN_YEAR) newYr = MAX_YEAR;
        updateYearAndZodiac(newYr, true);
      });

      nextYearBtn.addEventListener('click', () => {
        let newYr = selectedYear + 1;
        if (newYr > MAX_YEAR) newYr = MIN_YEAR;
        updateYearAndZodiac(newYr, true);
      });

      // Reset Button
      resetBtn.addEventListener('click', () => {
        updateYearAndZodiac(DEFAULT_YEAR, true);
      });

      // Modal Close Events
      closeModalBtn.addEventListener('click', closeYearModal);
      closeModalFooterBtn.addEventListener('click', closeYearModal);
      modalBackdrop.addEventListener('click', closeYearModal);

      // ESC key closes modal
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeYearModal();
        }
      });
    }

    // Initialize on DOM load
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
