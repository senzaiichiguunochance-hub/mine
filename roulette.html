<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ルーレットシミュレーター</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: var(--theme-body-bg, #000000); 
            font-family: 'Share Tech Mono', monospace; 
            user-select: none;
            transition: background 0.3s ease;
        }
        
        #ui { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; 
            padding: 10px; box-sizing: border-box; color: var(--theme-primary, #00ffff); pointer-events: none; z-index: 10;
        }

        /* --- 1. 上部エリア (ステータスのみ) --- */
        .header { 
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 10px; pointer-events: auto;
        }
        .status-container { border-left: 4px solid var(--theme-primary, #00ffff); padding-left: 12px; }
        .status-main { font-size: 16px; color: #ffffff; font-weight: bold; letter-spacing: 1px; }
        
        .btn-menu {
            font-size: 11px; color: #ffffff; text-decoration: none; 
            background: rgba(34, 34, 34, 0.8); border: 1px solid #555555; 
            padding: 6px 12px; font-weight: bold; pointer-events: auto;
        }

        /* --- 2. 下部エリア (全てのUIを集約) --- */
        .bottom-ui-wrapper {
            margin-top: auto; /* 画面最下部に固定 */
            pointer-events: auto;
            display: flex; flex-direction: column; gap: 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 70%, transparent);
            padding: 15px 15px 25px 15px; /* 下部に少し余白 */
        }

        /* 統計パネルと結果パネルを横並びに */
        .info-panels-row { display: flex; gap: 8px; }
        .cyber-panel { background: var(--theme-panel-bg, #111111); padding: 8px; flex: 1; border-radius: 0; border: 1px solid rgba(255,255,255,0.2); }
        
        .panel-current { border: 2px solid var(--theme-current-border, #ff0055); text-align: center; }
        .panel-current h3 { margin: 0; font-size: 10px; color: var(--theme-current-border); border-bottom: 1px solid currentColor; padding-bottom: 2px; }
        .res-val { font-size: 28px; font-weight: bold; color: #ffffff; line-height: 1.2; }

        .panel-total { border: 2px solid var(--theme-total-border, #00ffff); }
        .panel-total h3 { margin: 0 0 4px 0; font-size: 10px; text-align: center; border-bottom: 1px solid currentColor; }
        .stats-row { display: flex; justify-content: space-around; font-size: 11px; }

        /* 操作パネル */
        .interactive-panel {
            background: var(--theme-panel-bg, #111111);
            border: 2px solid var(--theme-primary, #00ffff);
            padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .theme-select-container { font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; }
        .theme-dropdown { background: #000000; color: #ffffff; border: 1px solid var(--theme-primary); padding: 2px; font-family: inherit; font-size: 12px; }

        .btn-roll {
            background: var(--theme-primary, #00ffff); color: var(--theme-btn-text, #000000);
            border: none; padding: 14px; font-family: inherit; font-size: 18px; font-weight: bold; cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-roll:active { transform: scale(0.98); }
        .btn-roll:disabled { background: #333333; color: #777777; }

        /* PC用レイアウト調整 */
        @media (min-width: 769px) {
            .bottom-ui-wrapper { width: 350px; background: none; margin-left: 20px; margin-bottom: 20px; }
            .status-main { font-size: 20px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div id="ui">
        <div class="header">
            <div class="status-container">
                <div class="status-main">PROTOCOL: <span id="status-text">READY</span></div>
                <div style="font-size: 9px; color: #aaaaaa;">STABILITY: <span id="stability">100.0</span>%</div>
            </div>
            <a href="menu.html" class="btn-menu">MENU</a>
        </div>

        <div class="bottom-ui-wrapper">
            <!-- 情報パネル (結果・統計) -->
            <div class="info-panels-row">
                <div class="cyber-panel panel-current" id="results-panel" style="visibility: hidden;">
                    <h3>RESULT</h3>
                    <div class="res-val" id="res-total">0</div>
                </div>
                <div class="cyber-panel panel-total" id="total-panel" style="display: none;">
                    <h3>STATISTICS</h3>
                    <div class="stats-row">
                        <span>ROLLS: <b id="total-rolls">0</b></span>
                        <span>AVG: <b id="total-avg">0</b></span>
                    </div>
                </div>
            </div>

            <!-- 操作パネル -->
            <div class="interactive-panel">
                <div class="theme-select-container">
                    <span>THEME:</span>
                    <select id="theme-dropdown" class="theme-dropdown">
                        <option value="cool">クール</option>
                        <option value="cute">かわいい</option>
                        <option value="beautiful">キレイ</option>
                        <option value="hot">かっこいい</option>
                    </select>
                </div>
                <button class="btn-roll" id="roll-button" onclick="spinRoulette()">SPIN WHEEL</button>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

        // --- グローバル変数 ---
        let scene, renderer, composer, grid, pulse, mainCamera;
        let wheelMesh, pointerPivot; 
        let isRolling = false;
        let currentThemeKey = 'cool';
        const totalSegments = 12;

        const THEMES = {
            cool: {
                primary: '#00ffff', panelBg: '#090f1a', btnText: '#000000',
                gridLine: 0x0088cc, gridHex: 0x001122, bodyBg: '#020408',                      
                wheelBgEven: '#112233', wheelBgOdd: '#00ffff', textEven: '#ffffff', textOdd: '#000000',
                pointerColor: '#ff0055', currentBorder: '#ff0055', totalBorder: '#00ffff'
            },
            cute: {
                primary: '#ff5599', panelBg: '#1a0a12', btnText: '#ffffff',
                gridLine: 0xaa4466, gridHex: 0x220510, bodyBg: '#0a0206',
                wheelBgEven: '#331122', wheelBgOdd: '#ff5599', textEven: '#ffffff', textOdd: '#ffffff',
                pointerColor: '#ff0000', currentBorder: '#ff0066', totalBorder: '#ff5599'
            },
            beautiful: {
                primary: '#bd93f9', panelBg: '#0f0c1b', btnText: '#000000',
                gridLine: 0x5b4488, gridHex: 0x110522, bodyBg: '#04020a',
                wheelBgEven: '#221133', wheelBgOdd: '#bd93f9', textEven: '#ffffff', textOdd: '#000000',
                pointerColor: '#ff0000', currentBorder: '#e0aaff', totalBorder: '#bd93f9'
            },
            hot: {
                primary: '#ff4500', panelBg: '#1a0800', btnText: '#ffffff',
                gridLine: 0x992200, gridHex: 0x220500, bodyBg: '#080200',
                wheelBgEven: '#220000', wheelBgOdd: '#ff4500', textEven: '#ffffff', textOdd: '#ffffff',
                pointerColor: '#ffcc00', currentBorder: '#ff0000', totalBorder: '#ffaa00'
            }
        };

        const globalStats = { rolls: 0, sum: 0, history: [] };

        init();
        animate();
        setupRouletteObject(); 

        function applyTheme(themeKey) {
            currentThemeKey = themeKey;
            const theme = THEMES[themeKey] || THEMES.cool;
            const root = document.documentElement;
            root.style.setProperty('--theme-body-bg', theme.bodyBg);
            root.style.setProperty('--theme-primary', theme.primary);
            root.style.setProperty('--theme-panel-bg', theme.panelBg);
            root.style.setProperty('--theme-btn-text', theme.btnText);
            root.style.setProperty('--theme-current-border', theme.currentBorder);
            root.style.setProperty('--theme-total-border', theme.totalBorder);
            
            if (renderer) renderer.setClearColor(new THREE.Color(theme.bodyBg), 1);
            if (grid) {
                scene.remove(grid);
                grid = new THREE.GridHelper(30, 60, theme.gridLine, theme.gridHex);
                grid.position.y = -2;
                scene.add(grid);
            }
            if (pulse) pulse.material.color.setHex(theme.gridLine);
            
            // 💡 テーマを保存
            localStorage.setItem('cyber-roulette-theme', themeKey);
            
            if (!isRolling) setupRouletteObject();
        }

        function init() {
            scene = new THREE.Scene();
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            mainCamera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, mainCamera));

            grid = new THREE.GridHelper(30, 60, 0x00f3ff, 0x002244);
            grid.position.y = -2;
            scene.add(grid);

            const pulseGeo = new THREE.SphereGeometry(3, 32, 32);
            const pulseMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0 });
            pulse = new THREE.Mesh(pulseGeo, pulseMat);
            scene.add(pulse);

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const p = new THREE.DirectionalLight(0xffffff, 1.2); 
            p.position.set(5, 15, 5); 
            scene.add(p);
            
            adjustCameraAndObjectPosition();

            const dropdown = document.getElementById('theme-dropdown');
            
            // 💡 保存されたテーマを読み込み
            const savedTheme = localStorage.getItem('cyber-roulette-theme') || 'cool';
            dropdown.value = savedTheme;
            applyTheme(savedTheme);
            
            dropdown.addEventListener('change', (e) => applyTheme(e.target.value));
        }

        function createRouletteTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            const theme = THEMES[currentThemeKey] || THEMES.cool;
            const cx = 512, cy = 512, r = 480;
            const angleStep = (Math.PI * 2) / totalSegments;
            const startOffset = Math.PI - (angleStep / 2);

            for (let i = 0; i < totalSegments; i++) {
                const startAngle = startOffset + i * angleStep;
                const endAngle = startAngle + angleStep;
                ctx.fillStyle = (i % 2 === 0) ? theme.wheelBgEven : theme.wheelBgOdd;
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, startAngle, endAngle); ctx.fill();
                ctx.strokeStyle = theme.bodyBg; ctx.lineWidth = 6; ctx.stroke();
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + angleStep / 2 + Math.PI / 2); 
                ctx.fillStyle = (i % 2 === 0) ? theme.textEven : theme.textOdd;
                ctx.font = `bold 64px 'Share Tech Mono', sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(i + 1, 0, -r + 80);
                ctx.restore();
            }
            ctx.fillStyle = theme.panelBg; ctx.beginPath(); ctx.arc(cx, cy, 80, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = theme.primary; ctx.lineWidth = 6; ctx.stroke();
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function setupRouletteObject() {
            if (wheelMesh) {
                scene.remove(wheelMesh);
                wheelMesh.geometry.dispose();
                if (Array.isArray(wheelMesh.material)) wheelMesh.material.forEach(m => m.dispose());
                else wheelMesh.material.dispose();
            }
            if (pointerPivot) scene.remove(pointerPivot);

            const theme = THEMES[currentThemeKey] || THEMES.cool;
            const wheelGeo = new THREE.CylinderGeometry(2.5, 2.5, 0.2, 64);
            const texture = createRouletteTexture();
            wheelMesh = new THREE.Mesh(wheelGeo, [
                new THREE.MeshStandardMaterial({ color: 0x222222 }),
                new THREE.MeshStandardMaterial({ map: texture }),
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            ]);
            scene.add(wheelMesh);

            pointerPivot = new THREE.Group();
            const pointerGeo = new THREE.ConeGeometry(0.18, 0.5, 4);
            const pointerMat = new THREE.MeshStandardMaterial({ color: theme.pointerColor, emissive: theme.pointerColor, emissiveIntensity: 0.4 });
            const pointerMesh = new THREE.Mesh(pointerGeo, pointerMat);
            pointerMesh.position.set(0, 0.15, -2.3);
            pointerMesh.rotation.set(Math.PI / 2, 0, 0); 
            pointerPivot.add(pointerMesh);
            scene.add(pointerPivot);
            adjustCameraAndObjectPosition();
        }

        function adjustCameraAndObjectPosition() {
            if(!mainCamera) return;
            const w = window.innerWidth, h = window.innerHeight;
            mainCamera.aspect = w / h;
            mainCamera.updateProjectionMatrix();

            const isMobile = w <= 768;
            const cameraDist = isMobile ? (h > w ? 12 : 8) : 8;
            mainCamera.position.set(0, cameraDist, cameraDist * 0.5);
            mainCamera.lookAt(0, 0, 0);

            // ルーレットを画面上部の空きスペースへ移動
            const offsetY = (isMobile && h > w) ? 1.5 : 0;
            const offsetX = isMobile ? 0 : -0.8;
            
            if (wheelMesh) wheelMesh.position.set(offsetX, offsetY, 0);
            if (pointerPivot) pointerPivot.position.set(offsetX, offsetY, 0);
        }

        async function triggerPulse() {
            pulse.scale.setScalar(0.2); pulse.material.opacity = 0.9;
            for(let i=0; i<25; i++) {
                pulse.scale.addScalar(0.2); pulse.material.opacity -= 0.9/25;
                await new Promise(r => requestAnimationFrame(r));
            }
            pulse.material.opacity = 0;
        }

        async function spinRoulette() {
            if (isRolling) return;
            isRolling = true;
            const txt = document.getElementById('status-text');
            const stab = document.getElementById('stability');
            const rollBtn = document.getElementById('roll-button');
            const resPanel = document.getElementById('results-panel');
            
            txt.innerText = "SPINNING"; rollBtn.disabled = true;
            resPanel.style.visibility = 'hidden';

            const resultNumber = Math.floor(Math.random() * totalSegments) + 1;
            const angleStep = (Math.PI * 2) / totalSegments;
            const randomOffset = (Math.random() * 0.8 - 0.4) * angleStep;
            const targetAngle = -((resultNumber - 1) * angleStep + randomOffset);
            const extraRotation = -(Math.PI * 2 * (5 + Math.floor(Math.random() * 2)));
            
            const startRotation = pointerPivot.rotation.y;
            const finalRotationY = (Math.floor(startRotation / (Math.PI * 2)) * (Math.PI * 2)) + extraRotation + targetAngle;

            const duration = 3000;
            const startTime = Date.now();

            while (Date.now() - startTime < duration) {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / duration;
                const easeOut = 1 - Math.pow(1 - progress, 4);
                pointerPivot.rotation.y = startRotation + (finalRotationY - startRotation) * easeOut;
                stab.innerText = (80 + Math.random() * 20 * (1 - progress)).toFixed(1);
                await new Promise(r => requestAnimationFrame(r));
            }

            pointerPivot.rotation.y = finalRotationY;
            txt.innerText = "LOCKED"; stab.innerText = "100.0";
            await triggerPulse();
            updateStats(resultNumber);
            rollBtn.disabled = false; isRolling = false;
        }

        function updateStats(result) {
            globalStats.rolls++;
            globalStats.sum += result;
            document.getElementById('res-total').innerText = result;
            document.getElementById('results-panel').style.visibility = 'visible';
            document.getElementById('total-rolls').innerText = globalStats.rolls;
            document.getElementById('total-avg').innerText = (globalStats.sum / globalStats.rolls).toFixed(1);
            document.getElementById('total-panel').style.display = 'block';
        }

        function animate() {
            requestAnimationFrame(animate);
            if (grid) grid.position.z = Math.sin(Date.now() * 0.001) * 0.2;
            composer.render();
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            adjustCameraAndObjectPosition();
        });

        window.spinRoulette = spinRoulette;
    </script>
</body>
</html>
