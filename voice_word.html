<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声文字起こし</title>
    <link rel="stylesheet" type="text/css" href="Style.css" />
    <style>
        /* Style.cssでカバーしきれない微調整 */
        #result-area {
            background-color: #0f1a3a;
            border-radius: 10px;
            padding: 20px;
            min-height: 200px;
            line-height: 1.6;
            white-space: pre-wrap;
            text-align: left;
            border: 1px solid var(--primary-color);
        }
        .interim {
            color: #888;
        }
        #status {
            margin-bottom: 15px;
            font-weight: bold;
            min-height: 1.2em;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: white; text-decoration: none;">メニューに戻る</a>

    <div class="container">
        <header class="header">
            <h1>🎙️ 音声文字起こし</h1>
        </header>

        <div class="box">
            <div class="controls">
                <select id="language-select">
                    <option value="ja-JP">日本語 (Japanese)</option>
                    <option value="en-US">英語 (English)</option>
                </select>
                <button id="start-btn" class="primary">開始</button>
                <button id="stop-btn" class="secondary" disabled>停止</button>
                <button id="clear-btn" style="background-color:#6c757d;">クリア</button>
            </div>
            <div id="status">待機中...</div>
        </div>

        <div class="box">
            <div id="result-area"></div>
        </div>
    </div>

    <script>
        // ブラウザの音声認識APIの互換性をチェック
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("お使いのブラウザは音声認識に対応していません。Google Chromeをお試しください。");
        } else {
            const recognition = new SpeechRecognition();
            
            // 設定
            recognition.continuous = true; // 連続して認識する
            recognition.interimResults = true; // 途中経過の文字も表示する

            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            const clearBtn = document.getElementById('clear-btn');
            const resultArea = document.getElementById('result-area');
            const statusText = document.getElementById('status');
            const langSelect = document.getElementById('language-select');

            let finalTranscript = ''; // 確定した文章を保持する変数

            // 開始ボタン
            startBtn.addEventListener('click', () => {
                recognition.lang = langSelect.value; // 言語設定を適用
                recognition.start();
                
                startBtn.disabled = true;
                stopBtn.disabled = false;
                langSelect.disabled = true;
                statusText.textContent = "聞き取り中... 🎙️";
                statusText.style.color = "var(--secondary-color)";
            });

            // 停止ボタン
            stopBtn.addEventListener('click', () => {
                recognition.stop();
                
                startBtn.disabled = false;
                stopBtn.disabled = true;
                langSelect.disabled = false;
                statusText.textContent = "停止しました";
                statusText.style.color = "var(--font-color)";
            });

            // クリアボタン
            clearBtn.addEventListener('click', () => {
                finalTranscript = '';
                resultArea.innerHTML = '';
            });

            // 音声認識の結果が返ってきたときの処理
            recognition.onresult = (event) => {
                let interimTranscript = ''; // 途中経過の文章

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + '。\n'; // 確定したら改行を追加
                    } else {
                        interimTranscript = transcript;
                    }
                }

                // HTMLに表示（確定した文章は黒、途中経過はグレー）
                resultArea.innerHTML = finalTranscript + '<span class="interim">' + interimTranscript + '</span>';
            };

            // エラーハンドリング
            recognition.onerror = (event) => {
                console.error("Error:", event.error);
                statusText.textContent = "エラーが発生しました: " + event.error;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                langSelect.disabled = false;
            };

            // 音声認識が自動で止まってしまった場合の処理（再開などはせず状態を戻す）
            recognition.onend = () => {
                if (startBtn.disabled) { 
                    // 意図せず止まった場合や、stop()が完了した場合
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    langSelect.disabled = false;
                    statusText.textContent = "待機中...";
                    statusText.style.color = "var(--font-color)";
                }
            };
        }
    </script>
</body>
</html>
