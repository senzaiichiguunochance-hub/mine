<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>あの日の天気何だっけ？</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 20px; color: #334155; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1e293b; margin-bottom: 25px; }
        .controls { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .group { display: flex; flex-direction: column; gap: 5px; }
        select { padding: 10px 15px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 15px; min-width: 180px; background: white; }
        
        .charts-stack { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .chart-container { background: #fff; padding: 15px; border: 1px solid #e2e8f0; border-radius: 12px; position: relative; }
        .pie-size { height: 350px; }
        .line-size { height: 400px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th { background: #f8fafc; border-bottom: 2px solid #e2e8f0; padding: 12px; font-size: 14px; }
        td { border-bottom: 1px solid #f1f5f9; padding: 12px; text-align: center; font-size: 14px; }
        .temp-max { color: #ef4444; font-weight: bold; }
        .temp-min { color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>


<div class="container">
    <h1>あの日の天気何だっけ？</h1>
    
    <div class="controls">
        <div class="group"><label>都道府県</label><select id="pref" onchange="loadCities()"></select></div>
        <div class="group"><label>市区町村</label><select id="city" onchange="fetchAllData()"></select></div>
        <div class="group"><label>対象年月</label><select id="month" onchange="fetchAllData()"></select></div>
    </div>

    <div class="charts-stack">
        <div class="chart-container pie-size"><canvas id="weatherPieChart"></canvas></div>
        <div class="chart-container line-size"><canvas id="mainLineChart"></canvas></div>
    </div>

    <table>
        <thead>
            <tr><th>日付</th><th>天気</th><th>最高 / 最低 (°C)</th><th>降水 (mm)</th><th>風速 (m/s)</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
Chart.register(ChartDataLabels);
let pieChart = null, lineChart = null;

async function init() {
    try {
        const res = await fetch('https://geoapi.heartrails.com/api/json?method=getPrefectures');
        const json = await res.json();
        const pSel = document.getElementById('pref');
        if (json.response && json.response.prefecture) {
            json.response.prefecture.forEach(p => pSel.add(new Option(p, p)));
        }
        pSel.value = "東京都"; 
    } catch (e) { console.error(e); }

    // 対象年月の生成
    const mSel = document.getElementById('month');
    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth(); // 0-11

    // 1950年から今月までループ
    for (let y = currentYear; y >= 1950; y--) {
        // 今年の場合は今月まで、過去年なら12月まで
        let mEnd = (y === currentYear) ? currentMonth : 11;
        for (let m = mEnd; m >= 0; m--) {
            const displayMonth = String(m + 1).padStart(2, '0');
            const val = `${y}-${displayMonth}`;
            const opt = new Option(`${y}年 ${displayMonth}月`, val);
            
            // デフォルトは前月（今月が1月なら前年12月）
            const lastMonth = new Date(currentYear, currentMonth - 1, 1);
            const lastMonthVal = `${lastMonth.getFullYear()}-${String(lastMonth.getMonth() + 1).padStart(2, '0')}`;
            if (val === lastMonthVal) opt.selected = true;

            mSel.add(opt);
        }
    }
    loadCities();
}

async function loadCities() {
    const prefName = document.getElementById('pref').value;
    const citySel = document.getElementById('city');
    citySel.innerHTML = "<option>読み込み中...</option>";
    
    try {
        const res = await fetch(`https://geoapi.heartrails.com/api/json?method=getCities&prefecture=${encodeURIComponent(prefName)}`);
        const json = await res.json();
        citySel.innerHTML = "";
        citySel.add(new Option("（代表地点）", "REPRESENTATIVE"));

        if (json.response && json.response.location) {
            json.response.location.forEach(cityName => {
                const name = (typeof cityName === 'string') ? cityName : cityName.city;
                if(name) citySel.add(new Option(name, name));
            });
        }
    } catch (e) { console.error(e); }
    fetchAllData();
}

async function fetchAllData() {
    const pref = document.getElementById('pref').value;
    const city = document.getElementById('city').value;
    const monthVal = document.getElementById('month').value;
    if(!city || city.includes("読み込み")) return;

    let lat, lon;
    try {
        let queryUrl = `https://geoapi.heartrails.com/api/json?method=getTowns&prefecture=${encodeURIComponent(pref)}`;
        if (city !== "REPRESENTATIVE") queryUrl += `&city=${encodeURIComponent(city)}`;
        
        const geoRes = await fetch(queryUrl);
        const geoJson = await geoRes.json();
        const loc = geoJson.response.location[0];
        lat = loc.y; lon = loc.x;
    } catch (e) { return; }

    const [y, m] = monthVal.split('-');
    // 取得期間の終了日を決定（今月なら「昨日」までにするのが安全）
    const now = new Date();
    let endDay;
    if (parseInt(y) === now.getFullYear() && parseInt(m) === (now.getMonth() + 1)) {
        // 今月が選択されている場合、昨日の日付まで取得
        const yesterday = new Date(now.setDate(now.getDate() - 1));
        endDay = String(yesterday.getDate()).padStart(2, '0');
    } else {
        // 過去月なら月末まで
        endDay = String(new Date(y, m, 0).getDate()).padStart(2, '0');
    }

    const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${monthVal}-01&end_date=${monthVal}-${endDay}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max&timezone=Asia%2FTokyo`;

    const res = await fetch(url);
    const data = await res.json();
    if (data.daily) updateDisplay(data.daily);
}

function updateDisplay(d) {
    document.getElementById('tableBody').innerHTML = d.time.map((t, i) => `
        <tr>
            <td>${t}</td><td>${getWeatherName(d.weathercode[i])}</td>
            <td><span class="temp-max">${d.temperature_2m_max[i]}</span> / <span class="temp-min">${d.temperature_2m_min[i]}</span></td>
            <td>${d.precipitation_sum[i]}</td><td>${d.windspeed_10m_max[i]}</td>
        </tr>
    `).reverse().join('');
    updateCharts(d);
}

function getWeatherName(code) {
    if (code <= 1) return "☀️ 快晴";
    if (code <= 3) return "☁️ 曇り";
    if (code <= 65) return "☔ 雨";
    return "❄️ 雪/雷";
}

function updateCharts(d) {
    if (pieChart) pieChart.destroy();
    if (lineChart) lineChart.destroy();

    const weatherCounts = {};
    d.weathercode.forEach(c => {
        const name = getWeatherName(c);
        weatherCounts[name] = (weatherCounts[name] || 0) + 1;
    });

    const total = d.weathercode.length;

    pieChart = new Chart(document.getElementById('weatherPieChart'), {
        type: 'pie',
        data: {
            labels: Object.keys(weatherCounts),
            datasets: [{ 
                data: Object.values(weatherCounts), 
                backgroundColor: ['#fbbf24', '#94a3b8', '#3b82f6', '#ef4444'] 
            }]
        },
        options: {
            plugins: {
                title: { display: true, text: '天気の割合 (%)' },
                datalabels: {
                    formatter: (value, ctx) => {
                        let percentage = (value * 100 / total).toFixed(1) + "%";
                        return ctx.chart.data.labels[ctx.dataIndex] + "\n" + percentage;
                    },
                    color: '#fff',
                    font: { weight: 'bold' }
                },
                legend: { display: false }
            },
            maintainAspectRatio: false
        }
    });

    lineChart = new Chart(document.getElementById('mainLineChart'), {
        type: 'line',
        data: {
            labels: d.time,
            datasets: [
                { label: '最高気温', data: d.temperature_2m_max, borderColor: '#ef4444', yAxisID: 'y', tension: 0.2 },
                { label: '最低気温', data: d.temperature_2m_min, borderColor: '#3b82f6', yAxisID: 'y', tension: 0.2 },
                { label: '風速(m/s)', data: d.windspeed_10m_max, borderColor: '#10b981', yAxisID: 'y', borderDash: [3, 3] },
                { label: '降水(mm)', data: d.precipitation_sum, backgroundColor: 'rgba(96, 165, 250, 0.4)', yAxisID: 'y1', type: 'bar' }
            ]
        },
        options: {
            scales: {
                y: { type: 'linear', position: 'left', title: { display: true, text: '気温(°C)・風速' } },
                y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '降水量(mm)' } }
            },
            plugins: { 
                title: { display: true, text: '月間気象推移' },
                datalabels: { display: false }
            },
            maintainAspectRatio: false
        }
    });
}
init();
</script>
</body>
</html>
