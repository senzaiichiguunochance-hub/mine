<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>あの日の天気何だっけ？</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 20px; color: #334155; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1e293b; margin-bottom: 10px; }

        .location-display {
            position: sticky; top: 0; z-index: 2000;
            text-align: center; font-size: 1.2rem; font-weight: bold; color: #ffffff;
            margin: 10px -25px 20px -25px; padding: 15px;
            background: #2563eb; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .group { display: flex; flex-direction: column; gap: 5px; }
        select { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; min-width: 150px; }

        #map { width: 100%; height: 350px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 25px; z-index: 1000; }
        .charts-stack { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .chart-container { background: #fff; padding: 15px; border: 1px solid #e2e8f0; border-radius: 12px; height: 350px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; border-bottom: 2px solid #e2e8f0; padding: 12px; font-size: 14px; position: sticky; top: 54px; z-index: 10; background: #f8fafc; }
        td { border-bottom: 1px solid #f1f5f9; padding: 12px; text-align: center; font-size: 14px; }
        .temp-max { color: #ef4444; font-weight: bold; }
        .temp-min { color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>


<div class="container">
    <h1>あの日の天気何だっけ？</h1>
    <div id="locationName" class="location-display">地点を選択してください</div>

    <div class="controls">
        <div class="group"><label>都道府県</label><select id="pref" onchange="loadCities()"></select></div>
        <div class="group"><label>市区町村</label><select id="city" onchange="onCityChange()"></select></div>
        <div class="group"><label>対象年月</label><select id="month" onchange="refreshData()"></select></div>
    </div>

    <div id="map"></div>
    <div class="charts-stack">
        <div class="chart-container"><canvas id="weatherPieChart"></canvas></div>
        <div class="chart-container" style="height: 400px;"><canvas id="mainLineChart"></canvas></div>
    </div>
    <table>
        <thead>
            <tr><th>日付</th><th>天気</th><th>最高/最低 (°C)</th><th>降水 (mm)</th><th>風速 (m/s)</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
Chart.register(ChartDataLabels);
let pieChart = null, lineChart = null, map = null, marker = null;
let currentLat, currentLng;

async function init() {
    // 東京駅をデフォルトに
    currentLat = 35.681; currentLng = 139.767;
    map = L.map('map').setView([currentLat, currentLng], 14); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    map.on('click', async function(e) {
        currentLat = e.latlng.lat;
        currentLng = e.latlng.lng;
        updateMarker(currentLat, currentLng);
        await syncFromMap(currentLat, currentLng);
    });

    // 都道府県リスト
    const pRes = await fetch('https://geoapi.heartrails.com/api/json?method=getPrefectures');
    const pJson = await pRes.json();
    const pSel = document.getElementById('pref');
    pJson.response.prefecture.forEach(p => pSel.add(new Option(p, p)));
    pSel.value = "東京都";

    // 年月生成
    const mSel = document.getElementById('month');
    const now = new Date();
    for (let y = now.getFullYear(); y >= 1950; y--) {
        for (let m = 12; m >= 1; m--) {
            if (y === now.getFullYear() && m > now.getMonth()) continue;
            const val = `${y}-${String(m).padStart(2, '0')}`;
            const opt = new Option(`${y}年 ${m}月`, val);
            const lastM = new Date(); lastM.setMonth(lastM.getMonth() - 1);
            if(val === `${lastM.getFullYear()}-${String(lastM.getMonth()+1).padStart(2, '0')}`) opt.selected = true;
            mSel.add(opt);
        }
    }

    // 初回読み込み（東京）
    await loadCities();
}

// 都道府県変更時
async function loadCities(targetCity = null) {
    const prefName = document.getElementById('pref').value;
    const citySel = document.getElementById('city');
    const res = await fetch(`https://geoapi.heartrails.com/api/json?method=getCities&prefecture=${encodeURIComponent(prefName)}`);
    const json = await res.json();
    
    citySel.innerHTML = "";
    if(json.response && json.response.location) {
        json.response.location.forEach(c => {
            const name = (typeof c === 'string') ? c : c.city;
            citySel.add(new Option(name, name));
        });
    }

    // targetCityが指定されていない場合、リストの1番目（代表地点）を自動選択
    if(targetCity) {
        citySel.value = targetCity;
    } else {
        citySel.selectedIndex = 0;
    }
    
    // 市区町村が確定したので、その場所へピンを打つ
    await onCityChange();
}

// 市区町村コンボ変更時
async function onCityChange() {
    const pref = document.getElementById('pref').value;
    const city = document.getElementById('city').value;
    if(!city) return;

    const res = await fetch(`https://geoapi.heartrails.com/api/json?method=getTowns&prefecture=${encodeURIComponent(pref)}&city=${encodeURIComponent(city)}`);
    const json = await res.json();
    if(json.response && json.response.location) {
        const loc = json.response.location[0];
        currentLat = loc.y;
        currentLng = loc.x;
        map.setView([currentLat, currentLng], 12);
        updateMarker(currentLat, currentLng);
        
        // 「選択中の地点」表示も更新
        document.getElementById('locationName').innerText = `選択中の地点: ${pref}${city}`;
        refreshData();
    }
}

// 地図クリック時
async function syncFromMap(lat, lng) {
    const label = document.getElementById('locationName');
    label.innerText = "地点を解析中...";

    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ja`);
        const data = await res.json();
        
        if (data && data.address) {
            const addr = data.address;
            const name = data.display_name.split(',')[0]; 
            const pref = addr.province || addr.state || "";
            const city = addr.city || addr.town || addr.suburb || addr.village || "";
            
            label.innerText = `選択中の地点: ${pref}${city}付近 (${name})`;

            if(pref) {
                const cleanPref = pref.replace('府','').replace('県','').replace('都','').replace('道','');
                Array.from(document.getElementById('pref').options).forEach(opt => {
                    if(opt.value.includes(cleanPref)) document.getElementById('pref').value = opt.value;
                });
            }
            if(city) await loadCities(city);
        }
    } catch (e) { console.error(e); }
    refreshData();
}

function refreshData() {
    fetchWeather(currentLat, currentLng);
}

function updateMarker(lat, lon) {
    if (marker) marker.remove();
    marker = L.marker([lat, lon]).addTo(map);
}

async function fetchWeather(lat, lon) {
    const monthVal = document.getElementById('month').value;
    const [y, m] = monthVal.split('-');
    const endDay = new Date(y, m, 0).getDate();
    const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${monthVal}-01&end_date=${monthVal}-${endDay}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max&timezone=Asia%2FTokyo`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.daily) updateDisplay(data.daily);
}

function updateDisplay(d) {
    document.getElementById('tableBody').innerHTML = d.time.map((t, i) => `
        <tr><td>${t}</td><td>${getWeatherName(d.weathercode[i])}</td><td><span class="temp-max">${d.temperature_2m_max[i]}</span> / <span class="temp-min">${d.temperature_2m_min[i]}</span></td><td>${d.precipitation_sum[i]}</td><td>${d.windspeed_10m_max[i]}</td></tr>
    `).reverse().join('');
    updateCharts(d);
}

function getWeatherName(code) {
    if (code <= 1) return "☀️ 快晴";
    if (code <= 3) return "☁️ 曇り";
    if (code <= 65) return "☔ 雨";
    return "❄️ 雪/雷";
}

function updateCharts(d) {
    if (pieChart) pieChart.destroy();
    if (lineChart) lineChart.destroy();
    const counts = {};
    d.weathercode.forEach(c => { const n = getWeatherName(c); counts[n] = (counts[n] || 0) + 1; });
    pieChart = new Chart(document.getElementById('weatherPieChart'), {
        type: 'pie',
        data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: ['#fbbf24', '#94a3b8', '#3b82f6', '#ef4444'] }] },
        options: { plugins: { datalabels: { formatter: (v) => (v * 100 / d.weathercode.length).toFixed(1) + "%", color: '#fff' } }, maintainAspectRatio: false }
    });
    lineChart = new Chart(document.getElementById('mainLineChart'), {
        type: 'line',
        data: {
            labels: d.time,
            datasets: [
                { label: '最高気温', data: d.temperature_2m_max, borderColor: '#ef4444' },
                { label: '最低気温', data: d.temperature_2m_min, borderColor: '#3b82f6' },
                { label: '降水量(mm)', data: d.precipitation_sum, backgroundColor: 'rgba(96, 165, 250, 0.4)', type: 'bar' }
            ]
        },
        options: { plugins: { datalabels: { display: false } }, maintainAspectRatio: false }
    });
}
init();
</script>
</body>
</html>
