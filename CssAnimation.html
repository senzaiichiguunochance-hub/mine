<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Animation Components</title>
<style>
  /* --- デザイントークン --- */
  :root {
    --bg-color: #f0f2f5;
    --card-bg: #ffffff;
    --text-main: #1a1d23;
    --text-sub: #64748b;
    --accent-blue: #3b82f6;
    --accent-green: #22c55e;
    --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
    --transition-base: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* --- リセット & 基本スタイル --- */
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    padding: 60px 20px;
    margin: 0;
    line-height: 1.5;
  }

  h1 {
    text-align: center;
    font-weight: 800;
    font-size: 2rem;
    margin-bottom: 50px;
    letter-spacing: -0.025em;
  }

  /* --- グリッドレイアウト --- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* --- カードデザイン --- */
  .card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: var(--shadow-sm);
    transition: var(--transition-base);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.8);
  }

  .card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow-lg);
  }

  .icon-wrapper {
    width: 140px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    position: relative;
    font-size: 80px; /* 絵文字サイズ */
  }

  .label {
    font-size: 14px;
    color: var(--text-sub);
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  /* --- 個別コンポーネントのスタイル --- */

  /* 1. MILK */
  .milk-carton {
    width: 60px; height: 90px;
    border: 6px solid var(--text-main);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  .milk-inner {
    position: absolute; bottom: 0; width: 100%;
    background: #eef2ff;
    animation: pourMilk 3s infinite ease-in-out;
  }
  .milk-text {
    position: absolute; top: 15px; left: 0; width: 100%;
    font-size: 14px; font-weight: 900; color: var(--text-main);
    text-align: center; transform: rotate(-15deg);
  }

  /* 2. Battery */
  .battery-body {
    width: 90px; height: 45px;
    border: 5px solid var(--text-main);
    border-radius: 8px;
    position: relative;
    padding: 4px;
  }
  .battery-body::after {
    content: ''; position: absolute; right: -12px; top: 10px;
    width: 7px; height: 16px; background: var(--text-main);
    border-radius: 0 4px 4px 0;
  }
  .battery-level {
    height: 100%; background: var(--accent-green);
    border-radius: 2px;
    animation: charging 2.5s infinite ease-out;
  }

  /* 3. Voice */
  .voice-bars { display: flex; align-items: flex-end; gap: 6px; height: 60px; }
  .v-bar {
    width: 10px; height: 20px;
    background: var(--accent-blue);
    border-radius: 10px;
    animation: voiceWave 1.2s infinite ease-in-out;
  }

  /* --- アニメーション定義 --- */
  @keyframes pourMilk { 0%, 100% { height: 20%; } 50% { height: 85%; } }
  @keyframes charging { 0% { width: 5%; opacity: 0.3; } 100% { width: 95%; opacity: 1; } }
  @keyframes voiceWave { 0%, 100% { height: 15px; } 50% { height: 50px; } }
  
  /* 絵文字アニメーション */
  .ani-coffee { animation: coffeeTilt 3s infinite ease-in-out; transform-origin: bottom center; }
  @keyframes coffeeTilt { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(20deg); } }

  .ani-heart { animation: heartBeat 1.2s infinite var(--ease-out-back); }
  @keyframes heartBeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }

  .ani-bell { animation: bellSwing 2s infinite ease-in-out; transform-origin: top center; }
  @keyframes bellSwing { 
    0%, 100% { transform: rotate(0); }
    10% { transform: rotate(20deg); }
    20% { transform: rotate(-15deg); }
    30% { transform: rotate(10deg); }
    40% { transform: rotate(0); }
  }

  .ani-pop { animation: popIn 2s infinite var(--ease-out-back); }
  @keyframes popIn { 0%, 100% { transform: scale(0.9); } 50% { transform: scale(1.15) rotate(5deg); } }

  .ani-fold { animation: fold 2.5s infinite ease-in-out; perspective: 400px; }
  @keyframes fold { 0%, 100% { transform: rotateX(0); } 50% { transform: rotateX(60deg); } }

  .ani-flip { animation: flip 2s infinite ease-in-out; }
  @keyframes flip { 0% { transform: rotateY(0); } 50%, 100% { transform: rotateY(180deg); } }

  .ani-twinkle { animation: twinkle 1.5s infinite ease-in-out; }
  @keyframes twinkle { 0%, 100% { opacity: 0.5; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }

  .ani-float { animation: float 2s infinite ease-in-out; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

  .ani-check { animation: checkPop 1.5s infinite var(--ease-out-back); }
  @keyframes checkPop { 0% { transform: scale(0); opacity: 0; } 50%, 100% { transform: scale(1); opacity: 1; } }

</style>
</head>
<body>

<h1>Interactions Gallery</h1>

<div class="grid">
  <!-- 1. MILK -->
  <div class="card">
    <div class="icon-wrapper">
      <div class="milk-carton">
        <div class="milk-text">MILK</div>
        <div class="milk-inner"></div>
      </div>
    </div>
    <div class="label">POURING MILK</div>
  </div>

  <!-- 2. Battery -->
  <div class="card">
    <div class="icon-wrapper">
      <div class="battery-body">
        <div class="battery-level"></div>
      </div>
    </div>
    <div class="label">CHARGING</div>
  </div>

  <!-- 3. Voice -->
  <div class="card">
    <div class="icon-wrapper">
      <div class="voice-bars">
        <div class="v-bar" style="animation-delay: 0.1s"></div>
        <div class="v-bar" style="animation-delay: 0.3s"></div>
        <div class="v-bar" style="animation-delay: 0.2s"></div>
        <div class="v-bar" style="animation-delay: 0.4s"></div>
        <div class="v-bar" style="animation-delay: 0.1s"></div>
      </div>
    </div>
    <div class="label">VOICE INPUT</div>
  </div>

  <!-- Emoji based icons -->
  <div class="card">
    <div class="icon-wrapper ani-coffee">☕</div>
    <div class="label">COFFEE BREAK</div>
  </div>

  <div class="card">
    <div class="icon-wrapper ani-heart">❤️</div>
    <div class="label">HEARTBEAT</div>
  </div>

  <div class="card">
    <div class="icon-wrapper ani-bell">🛎️</div>
    <div class="label">NOTIFICATION</div>
  </div>

  <div class="card">
    <div class="icon-wrapper ani-pop">📱</div>
    <div class="label">REVEAL</div>
  </div>

  <div class="card">
    <div class="icon-wrapper ani-fold">📄</div>
    <div class="label">FOLDING</div>
  </div>

  <div class="card">
    <div class="icon-wrapper ani-flip">⬛</div>
    <div class="label">FLIP OVER</div>
  </div>

  <div class="card">
    <div class="icon-wrapper ani-twinkle">⭐</div>
    <div class="label">TWINKLE</div>
  </div>

  <div class="card">
    <div class="icon-wrapper ani-float">✉️</div>
    <div class="label">INCOMING MAIL</div>
  </div>

  <div class="card">
    <div class="icon-wrapper ani-check">✅</div>
    <div class="label">COMPLETED</div>
  </div>
</div>

</body>
</html>
