<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #ebebeb; --card: #f5f5f5; --shape: #888; --light: #bcbcbc;
    --ease: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  body { background: var(--bg); font-family: sans-serif; padding: 40px; color: #555; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
  .card { background: var(--card); aspect-ratio: 1.6/1; border-radius: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .label { position: absolute; bottom: 20px; font-weight: bold; font-size: 14px; }
  .cv { transform: translateY(-10px); display: flex; align-items: center; justify-content: center; width: 100%; height: 60%; position: relative; }

  /* 共通パーツ */
  .b { background: var(--shape); border-radius: 8px; position: relative; }

  /* 牛乳 */
  .m-container { display: flex; align-items: flex-end; gap: 15px; }
  .m-pkg { width: 38px; height: 70px; background: linear-gradient(to right, var(--light), #d1d1d1); border-radius: 2px; position: relative; transform-origin: bottom right; animation: a-pkg-pour 4s infinite var(--ease); }
  .m-pkg::after { content: "MILK"; color: #fff; font-size: 9px; font-weight: 900; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
  .m-cup-hq { width: 48px; height: 48px; border: 4px solid var(--shape); border-top: none; border-radius: 4px 4px 12px 12px; position: relative; overflow: hidden; background: rgba(255,255,255,0.2); }
  .m-liquid-hq { position: absolute; bottom: 0; left: -50%; width: 200%; height: 0%; background: #fff; animation: a-milk-fill-hq 4s infinite var(--ease); }
  .m-liquid-hq::before { 
    content: ""; position: absolute; top: -8px; left: 0; width: 100%; height: 16px; 
    background: radial-gradient(circle at 25% 100%, #fff 30%, transparent 35%), radial-gradient(circle at 75% 100%, #fff 30%, transparent 35%);
    background-size: 50% 100%; animation: a-liquid-wave 1.5s infinite linear;
  }
  @keyframes a-pkg-pour { 0%, 10%, 90%, 100% { transform: rotate(0); } 30%, 70% { transform: rotate(-25deg) translate(-5px, -10px); } }
  @keyframes a-milk-fill-hq { 0%, 25% { height: 0%; } 70%, 100% { height: 85%; } }
  @keyframes a-liquid-wave { from { transform: translateX(0); } to { transform: translateX(50%); } }

  /* 瞬き */
  .eye-hq { width: 70px; height: 40px; background: #fff; border-radius: 50% 50%; border: 3.5px solid var(--shape); position: relative; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); }
  .pupil { width: 22px; height: 22px; background: var(--shape); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: a-pupil-scan 4s infinite; }
  .pupil::after { content: ""; position: absolute; top: 4px; left: 4px; width: 6px; height: 6px; background: #fff; border-radius: 50%; opacity: 0.6; }
  .eyelid-u, .eyelid-d { position: absolute; left: -10%; width: 120%; height: 60%; background: var(--card); z-index: 2; transition: 0.1s; }
  .eyelid-u { top: 0; transform: translateY(-100%); animation: a-lid-u 4s infinite; border-bottom: 2px solid var(--light); }
  .eyelid-d { bottom: 0; transform: translateY(100%); animation: a-lid-d 4s infinite; border-top: 2px solid var(--light); }
  @keyframes a-lid-u { 0%, 42%, 58%, 100% { transform: translateY(-100%); } 50% { transform: translateY(-10%); } }
  @keyframes a-lid-d { 0%, 42%, 58%, 100% { transform: translateY(100%); } 50% { transform: translateY(10%); } }
  @keyframes a-pupil-scan { 0%, 80%, 100% { transform: translate(-50%, -50%); } 20% { transform: translate(-100%, -50%); } 40% { transform: translate(0%, -50%); } }

  /* スライス */
  .slice-container { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; position: relative; }
  .sl-obj { width: 60px; height: 60px; background: var(--shape); border-radius: 12px; position: relative; animation: a-sl-shake 2.5s infinite; }
  .sl-obj::before { 
    content: ""; position: absolute; top: 50%; left: -20%; width: 140%; height: 4px; 
    background: #fff; transform: rotate(-30deg) scaleX(0); transform-origin: left; z-index: 5;
    animation: a-sl-line 2.5s infinite cubic-bezier(0.19, 1, 0.22, 1);
  }
  .sl-part { position: absolute; width: 100%; height: 50%; background: var(--shape); left: 0; transition: var(--ease); }
  .sl-p-u { top: 0; border-radius: 12px 12px 0 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 30%); animation: a-sl-move-u 2.5s infinite var(--ease); }
  .sl-p-d { bottom: 0; border-radius: 0 0 12px 12px; clip-path: polygon(0 30%, 100% 100%, 100% 100%, 0 100%); animation: a-sl-move-d 2.5s infinite var(--ease); }
  @keyframes a-sl-line { 0%, 20% { scale: 0; opacity: 0; } 22% { scale: 1; opacity: 1; } 30%, 100% { scale: 1.2; opacity: 0; } }
  @keyframes a-sl-move-u { 0%, 22% { transform: translate(0,0) rotate(0); } 35%, 80% { transform: translate(-15px, -10px) rotate(-10deg); opacity: 0.8; } }
  @keyframes a-sl-move-d { 0%, 22% { transform: translate(0,0) rotate(0); } 35%, 80% { transform: translate(5px, 5px) rotate(5deg); } }
  @keyframes a-sl-shake { 0%, 20%, 30%, 100% { transform: scale(1); } 22% { transform: scale(0.95); } }

  /* 音声入力 */
  .mic-visualizer { display: flex; align-items: flex-end; gap: 4px; height: 50px; }
  .mic-bar { width: 6px; background: var(--shape); border-radius: 3px; animation: a-mic-wave 1s infinite var(--ease); }
  .mic-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
  .mic-bar:nth-child(2) { height: 70%; animation-delay: 0.3s; }
  .mic-bar:nth-child(3) { height: 50%; animation-delay: 0.2s; }
  .mic-bar:nth-child(4) { height: 90%; animation-delay: 0.4s; }
  .mic-bar:nth-child(5) { height: 60%; animation-delay: 0.15s; }
  @keyframes a-mic-wave { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.5); } }

  /* その他アニメーション */
  .flipper { width: 55px; height: 55px; animation: a-flip 3s infinite var(--ease); }
  @keyframes a-flip { 0%, 100% { transform: scale(1) rotateY(0); background: var(--shape); } 50% { transform: scale(0.8, 1.2) rotateY(180deg); background: var(--light); } }
  
  .jaja { width: 30px; height: 65px; animation: a-jaja 3s infinite var(--ease); }
  .jaja::before, .jaja::after { content: ""; position: absolute; width: 100%; height: 100%; background: var(--light); border-radius: 8px; z-index: -1; transform-origin: bottom center; }
  .jaja::before { animation: a-jl 3s infinite var(--ease); }
  .jaja::after { animation: a-jr 3s infinite var(--ease); }
  @keyframes a-jaja { 0%, 20% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  @keyframes a-jl { 0%, 20% { transform: rotate(0); } 50%, 80% { transform: rotate(-30deg) translateX(-35px); } }
  @keyframes a-jr { 0%, 20% { transform: rotate(0); } 50%, 80% { transform: rotate(30deg) translateX(35px); } }
  
  .fold { width: 80px; height: 45px; background: var(--light); }
  .fold::after { content: ""; position: absolute; right: 0; width: 50%; height: 100%; background: var(--shape); transform-origin: left; animation: a-fold 3s infinite var(--ease); }
  @keyframes a-fold { 0%, 20% { transform: rotateY(0); } 50%, 80% { transform: rotateY(-180deg); } 100% { transform: rotateY(0); } }
  
  .batt { width: 75px; height: 38px; border: 5px solid var(--shape); padding: 3px; box-sizing: border-box; }
  .batt::after { content: ""; position: absolute; right: -13px; top: 7px; width: 8px; height: 14px; background: var(--shape); border-radius: 0 4px 4px 0; }
  .batt-core { height: 100%; background: var(--light); animation: a-chg 3s infinite var(--ease); }
  .batt-line { width: 30px; height: 5px; background: var(--shape); position: absolute; left: -40px; top: 12px; }
  @keyframes a-chg { 0% { width: 0; opacity: 0; } 20% { width: 0; opacity: 1; } 80%, 100% { width: 100%; opacity: 1; } }
  
  .ripple-wrap { width: 100px; height: 100px; position: relative; }
  .ripple-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 4px solid var(--shape); border-radius: 50%; animation: a-ripple 3s infinite; }
  .ripple-circle:nth-child(2) { animation-delay: 1s; }
  .ripple-circle:nth-child(3) { animation-delay: 2s; }
  @keyframes a-ripple { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 100px; height: 100px; opacity: 0; } }
  
  .breath { width: 50px; height: 50px; animation: a-br 3s infinite var(--ease); }
  @keyframes a-br { 0%, 100% { transform: scale(1); border-radius: 12px; } 50% { transform: scale(1.4); border-radius: 50%; opacity: 0.5; } }
  
  .warn { width: 50px; height: 50px; animation: a-warn 0.8s infinite linear; }
  @keyframes a-warn { 0%, 100% { transform: translateX(0); background: var(--shape); } 10%, 30%, 50% { transform: translateX(-5px); } 20%, 40%, 60% { transform: translateX(5px); background: #ffaaaa; } }
  
  .spring { width: 60px; height: 20px; animation: a-spr 1s infinite var(--ease); }
  @keyframes a-spr { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(3); } }
  
  .door { width: 45px; height: 65px; transform-origin: left; animation: a-door 3s infinite var(--ease); }
  @keyframes a-door { 0%, 100% { transform: perspective(200px) rotateY(0); } 50% { transform: perspective(200px) rotateY(-100deg); background: var(--light); } }
</style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<a href="menu.html" style="position: absolute; top: 10px; right: 10px; font-size: 12px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000; border: 1px solid #ddd;">メニューに戻る</a>

<div class="grid">
  <div class="card"><div class="cv"><div class="m-container"><div class="m-cup-hq"><div class="m-liquid-hq"></div></div><div class="m-pkg"></div></div></div><div class="label">牛乳</div></div>
  <div class="card"><div class="cv"><div class="flipper b"></div></div><div class="label">ひっくり返す</div></div>
  <div class="card"><div class="cv"><div class="jaja b"></div></div><div class="label">分身</div></div>
  <div class="card"><div class="cv"><div class="fold b"></div></div><div class="label">本をめくる</div></div>
  <div class="card"><div class="cv"><div class="batt-line"></div><div class="batt b"><div class="batt-core"></div></div></div><div class="label">充電</div></div>
  <div class="card"><div class="cv"><div class="mic-visualizer"><div class="mic-bar"></div><div class="mic-bar"></div><div class="mic-bar"></div><div class="mic-bar"></div><div class="mic-bar"></div></div></div><div class="label">音声入力</div></div>
  <div class="card"><div class="cv"><div class="ripple-wrap"><div class="ripple-circle"></div><div class="ripple-circle"></div><div class="ripple-circle"></div></div></div><div class="label">波紋</div></div>
  <div class="card"><div class="cv"><div class="breath b"></div></div><div class="label">呼吸</div></div>
  <div class="card"><div class="cv"><div class="warn b"></div></div><div class="label">警告</div></div>
  <div class="card"><div class="cv"><div class="eye-hq"><div class="pupil"></div><div class="eyelid-u"></div><div class="eyelid-d"></div></div></div><div class="label">きょろきょろ</div></div>
  <div class="card"><div class="cv"><div class="spring b"></div></div><div class="label">バネ</div></div>
  <div class="card"><div class="cv"><div class="door b"></div></div><div class="label">扉</div></div>
  <div class="card"><div class="cv"><div class="slice-container"><div class="sl-obj"><div class="sl-part sl-p-u"></div><div class="sl-part sl-p-d"></div></div></div></div><div class="label">スライス</div></div>
</div>

<script>
  const extras = [
    { name: "重力", css: "width:40px;height:40px;border-radius:50%;animation:a-grav 2s infinite var(--ease)", key: "@keyframes a-grav { 0% { transform: translateY(-60px); } 50% { transform: translateY(40px) scale(1.3, 0.7); } 100% { transform: translateY(-60px); } }" },
    { name: "潜る", css: "width:40px;height:40px;animation:a-dive 3s infinite var(--ease)", key: "@keyframes a-dive { 0% { transform: translateY(-60px); opacity:1; } 50% { transform: translateY(0); opacity:1; } 100% { transform: translateY(80px); opacity:0; } }" },
    { name: "回転", css: "width:40px;height:40px;border:5px solid var(--light);border-top-color:var(--shape);border-radius:50%;animation:a-spin 1s infinite linear", key: "@keyframes a-spin { to { transform: rotate(360deg); } }" },
    { name: "振り子", css: "width:10px;height:60px;transform-origin:top;animation:a-pen 2s infinite ease-in-out", key: "@keyframes a-pen { 0%,100%{ transform:rotate(45deg); } 50%{ transform:rotate(-45deg); } }" },
    { name: "滴下", css: "width:15px;height:15px;border-radius:50%;animation:a-drop 2s infinite var(--ease)", key: "@keyframes a-drop { 0%{transform:translateY(-50px) scale(0);} 50%{transform:translateY(0) scale(1.2,0.8);} 100%{transform:translateY(60px) scale(0);opacity:0;} }" }
  ];

  const grid = document.querySelector('.grid');
  extras.forEach((ex, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const id = `extra_new_${i}`;
    card.innerHTML = `<style>${ex.key.replace(/a-\w+/g, id)}</style><div class="cv">${ex.html || `<div class="b" style="${ex.css.replace(/a-\w+/g, id)}"></div>`}</div><div class="label">${ex.name}</div>`;
    grid.appendChild(card);
  });
</script>

</body>
</html>
