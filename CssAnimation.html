<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>修正・復元版（12個）</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f8f9fa; padding: 30px; margin: 0; }
  h1 { text-align: center; margin-bottom: 40px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
  }
  .icon {
    width: 140px;
    height: 140px;
    margin: 0 auto 15px;
    position: relative;
  }
  .label { font-size: 15px; color: #333; font-weight: 500; }
</style>
</head>
<body>
<h1>修正・復元版（12個）</h1>
<div class="grid">

  <!-- 1. MILK（サンプル寄り） -->
  <div class="card">
    <div class="icon">
      <div style="position:absolute; left:35px; top:25px; width:70px; height:95px; border:10px solid #333; border-top:none; border-radius:8px;"></div>
      <div id="milkContainer" style="position:absolute; left:35px; top:25px; width:70px; height:95px; overflow:hidden;">
        <div id="milk" style="position:absolute; bottom:0; left:0; width:100%; height:30%; background:#e0f0ff; animation: pourMilk 2.8s infinite cubic-bezier(0.42, 0, 0.58, 1);"></div>
      </div>
      <div style="position:absolute; top:22px; left:48px; font-size:19px; font-weight:bold; color:#444; transform:rotate(-28deg);">MILK</div>
    </div>
    <div class="label">牛乳を注ぐ</div>
  </div>

  <!-- 2. 充電（枠内に収まるよう修正） -->
  <div class="card">
    <div class="icon" id="battery">
      <div style="position:absolute; top:42px; left:20px; width:102px; height:52px; border:9px solid #222; border-radius:10px;"></div>
      <div style="position:absolute; top:52px; right:12px; width:8px; height:28px; background:#222;"></div>
      <div id="chargeBar" style="position:absolute; top:48px; left:27px; height:38px; background:#22c55e; width:20%; animation: charging 3s infinite linear;"></div>
    </div>
    <div class="label">充電</div>
  </div>

  <!-- 3. 音声入力（底辺固定） -->
  <div class="card">
    <div class="icon" id="voice">
      <div class="bar"></div><div class="bar" style="animation-delay:120ms"></div>
      <div class="bar" style="animation-delay:240ms"></div><div class="bar" style="animation-delay:80ms"></div>
      <div class="bar" style="animation-delay:200ms"></div>
    </div>
    <div class="label">音声入力</div>
  </div>

  <!-- 4. コーヒー -->
  <div class="card">
    <div class="icon" id="coffee">☕</div>
    <div class="label">コーヒーを注ぐ</div>
  </div>

  <!-- 5. ハート鼓動 -->
  <div class="card">
    <div class="icon" id="heart">❤️</div>
    <div class="label">ハート鼓動</div>
  </div>

  <!-- 6. 通知ベル -->
  <div class="card">
    <div class="icon" id="bell">🛎️</div>
    <div class="label">通知ベル</div>
  </div>

  <!-- 7. じゃじゃーん -->
  <div class="card">
    <div class="icon" id="reveal">📱</div>
    <div class="label">じゃじゃーん</div>
  </div>

  <!-- 8. 紙を折る -->
  <div class="card">
    <div class="icon" id="paper">📄</div>
    <div class="label">紙を折る</div>
  </div>

  <!-- 9. 四角ひっくり返し -->
  <div class="card">
    <div class="icon" id="flip">⬛</div>
    <div class="label">ひっくり返す</div>
  </div>

  <!-- 10. 星キラキラ -->
  <div class="card">
    <div class="icon" id="stars">⭐</div>
    <div class="label">星キラキラ</div>
  </div>

  <!-- 11. メール受信 -->
  <div class="card">
    <div class="icon" id="mail">✉️</div>
    <div class="label">メール受信</div>
  </div>

  <!-- 12. チェック完了 -->
  <div class="card">
    <div class="icon" id="check">✅</div>
    <div class="label">チェック完了</div>
  </div>

</div>

<style>
@keyframes pourMilk { 0%,100%{height:28%} 50%{height:89%} }
@keyframes charging { 0%{width:18%} 100%{width:88%} }
@keyframes voiceWave { 0%,100%{height:25px} 50%{height:98px} }
.bar { width:13px; background:#3b82f6; border-radius:999px; display:inline-block; height:25px; margin:0 5px; vertical-align:bottom; animation:voiceWave 1.15s infinite ease-in-out; }

#coffee { font-size:115px; animation:coffeePour 2.5s infinite cubic-bezier(0.45,0.05,0.55,0.95); }
@keyframes coffeePour { 0%,100%{transform:rotate(-15deg)} 50%{transform:rotate(30deg)} }

#heart { font-size:115px; animation:heartBeat 1.1s infinite; }
@keyframes heartBeat { 0%,100%{transform:scale(1)} 45%{transform:scale(1.32)} }

#bell { font-size:115px; animation:bellRing 2.4s infinite; }
@keyframes bellRing { 0%,100%{transform:rotate(0)} 10%{transform:rotate(25deg)} 20%{transform:rotate(-20deg)} 30%{transform:rotate(12deg)} }

#reveal { font-size:110px; animation:tada 2.2s infinite; }
@keyframes tada { 0%,100%{transform:scale(1) rotate(0)} 40%{transform:scale(1.25) rotate(12deg)} 60%{transform:scale(1.1) rotate(-8deg)} }

#paper { font-size:110px; animation:foldPaper 3s infinite; }
@keyframes foldPaper { 0%,100%{transform:rotateX(0deg)} 50%{transform:rotateX(68deg)} }

#flip { font-size:90px; animation:flipAnim 2.4s infinite; }
@keyframes flipAnim { 0%,100%{transform:rotateY(0deg)} 50%{transform:rotateY(180deg)} }

#stars { font-size:100px; animation:twinkle 1.6s infinite; }
@keyframes twinkle { 0%,100%{opacity:0.4; transform:scale(0.9)} 50%{opacity:1; transform:scale(1.15)} }

#mail { font-size:100px; animation:mailAnim 2.8s infinite; }
@keyframes mailAnim { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

#check { font-size:100px; animation:checkAnim 2s infinite; }
@keyframes checkAnim { 0%{transform:scale(0.6)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
</style>
</body>
</html>
