<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Creative Block Builder - Mobile</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; font-family: sans-serif; -webkit-user-select: none; user-select: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        #key-info {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px;
            font-size: 13px; line-height: 1.6; z-index: 1000;
        }
        #key-info b { font-size: 14px; display: block; margin-bottom: 5px; }
        
        #ui {
            position: absolute; top: 200px; left: 20px; color: white;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px;
            font-size: 14px; line-height: 1.6; max-width: 250px;
        }
        #ui b { font-size: 16px; }

        #movement-pad {
            position: absolute; bottom: 20px; left: 20px; width: 150px; height: 100px;
            opacity: 0.7; z-index: 100;
        }
        .move-btn {
            position: absolute;
            width: 50px; height: 50px;
            background: rgba(255,255,255,0.3);
            border: 1px solid white;
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 24px; font-weight: bold;
            cursor: pointer;
        }
        .move-btn:active { background: rgba(255,255,255,0.6); }
        #move-w { top: 0; left: 50px; }
        #move-a { top: 50px; left: 0; }
        #move-s { top: 50px; left: 50px; }
        #move-d { top: 50px; left: 100px; }
        #move-jump { position: absolute; bottom: 20px; left: 180px; width: 80px; height: 50px; border-radius: 25px; }

        #spell-bar {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 8px; z-index: 100;
        }
        .spell-btn {
            width: 50px; height: 50px;
            background: rgba(0,0,0,0.4);
            border: 2px solid #888;
            border-radius: 8px;
            font-size: 28px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s;
        }
        .spell-btn.active {
            border-color: white;
            background: rgba(0, 120, 255, 0.7);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1001;">メニューに戻る</a>

    <div id="key-info">
        <b>キーボード魔法</b>
        Shift + 左: 花<br>
        V + 左: 氷<br>
        G + 左: 反重力<br>
        X + 左: ツタ<br>
        L + 左: ライト<br>
        T + 左: テレポート
    </div>

    <div id="crosshair"></div>
    <div id="ui">
        <b>操作方法:</b><br>
        画面のボタンで移動・ジャンプ<br>
        右のボタンで魔法を選択<br>
        左クリック: ブロック/魔法を使用<br>
        右クリック: ブロックを破壊<br>
        <br>
        画面クリックで開始 / ESC: 解放
    </div>

    <!-- 操作用UI -->
    <div id="movement-pad">
        <div id="move-w" class="move-btn">▲</div>
        <div id="move-a" class="move-btn">◀</div>
        <div id="move-s" class="move-btn">▼</div>
        <div id="move-d" class="move-btn">▶</div>
    </div>
    <div id="move-jump" class="move-btn">JUMP</div>

    <div id="spell-bar">
        <div class="spell-btn active" data-spell="normal">🧱</div>
        <div class="spell-btn" data-spell="flower">🌸</div>
        <div class="spell-btn" data-spell="ice">🧊</div>
        <div class="spell-btn" data-spell="gravity">🔮</div>
        <div class="spell-btn" data-spell="vine">🌿</div>
        <div class="spell-btn" data-spell="light">💡</div>
        <div class="spell-btn" data-spell="teleport">🌀</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 10, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- ライティング ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(100, 150, 100);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- 地面 ---
        const planeGeo = new THREE.PlaneGeometry(200, 200);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x55aa55 });
        const floor = new THREE.Mesh(planeGeo, planeMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        const grid = new THREE.GridHelper(200, 100, 0x447744, 0x447744);
        grid.position.y = 0.01;
        scene.add(grid);

        // --- ブロック/魔法の定義 ---
        const objects = [floor];
        const cubeMat = new THREE.MeshStandardMaterial({ map: createBlockTexture() });
        const iceMat = new THREE.MeshStandardMaterial({ color: 0x1e90ff, transparent: true, opacity: 0.6, roughness: 0.1 });
        const gravityMat = new THREE.MeshStandardMaterial({ color: 0x8a2be2, wireframe: true });
        const vineMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
        const lightMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 1 });
        const teleportMatBase = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xff00ff });

        let gravityZones = [];
        let lightSources = new Map();
        let teleportPads = [];
        let activeTeleports = [];

        // --- コントロール ---
        const controls = new PointerLockControls(camera, document.body);
        document.body.addEventListener('click', (event) => {
            if (event.target.closest('.move-btn') || event.target.closest('.spell-btn') || event.target.closest('#key-info')) {
                return;
            }
            controls.lock();
        });

        // --- 状態変数 ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let shiftPressed = false, vPressed = false, gPressed = false, xPressed = false, lPressed = false, tPressed = false;
        let currentSpell = 'normal';
        let teleportCooldown = 0;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        // --- イベントリスナー ---
        document.addEventListener('keydown', (e) => {
            if (!controls.isLocked) return;
            switch (e.code) {
                case 'KeyW': moveForward = true; break; case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break; case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) { velocity.y = 35; canJump = false; } break;
                case 'ShiftLeft': case 'ShiftRight': shiftPressed = true; break;
                case 'KeyV': vPressed = true; break;
                case 'KeyG': gPressed = true; break; case 'KeyX': xPressed = true; break;
                case 'KeyL': lPressed = true; break; case 'KeyT': tPressed = true; break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break; case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break; case 'KeyD': moveRight = false; break;
                case 'KeyV': vPressed = false; break;
                case 'ShiftLeft': case 'ShiftRight': shiftPressed = false; break;
                case 'KeyG': gPressed = false; break; case 'KeyX': xPressed = false; break;
                case 'KeyL': lPressed = false; break; case 'KeyT': tPressed = false; break;
            }
        });
        document.addEventListener('contextmenu', e => e.preventDefault());

        const raycaster = new THREE.Raycaster();
        document.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            if (e.target.closest('.move-btn') || e.target.closest('.spell-btn') || e.target.closest('#key-info')) {
                return;
            }
            
            raycaster.setFromCamera({x:0, y:0}, camera);
            const intersects = raycaster.intersectObjects(objects);
            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (e.button === 0) { // Left Click
                    const pos = getPlacementPos(intersect.point, intersect.face);
                    if (isPlayerColliding(pos)) return;

                    let spellToUse = currentSpell;
                    if (shiftPressed) spellToUse = 'flower';
                    else if (vPressed) spellToUse = 'ice';
                    else if (gPressed) spellToUse = 'gravity';
                    else if (xPressed) spellToUse = 'vine';
                    else if (lPressed) spellToUse = 'light';
                    else if (tPressed) spellToUse = 'teleport';

                    switch(spellToUse) {
                        case 'normal': addBlock(pos); break;
                        case 'flower': createFlower(pos); break;
                        case 'ice': createIceBlock(pos); break;
                        case 'gravity': createGravityBlock(pos); break;
                        case 'vine': growVine(pos, intersect.face.normal); break;
                        case 'light': createLightBlock(pos); break;
                        case 'teleport': createTeleportPad(pos); break;
                        default: addBlock(pos); break;
                    }

                } else if (e.button === 2) { // Right Click
                    destroyBlock(intersect.object);
                }
            }
        });
        
        function destroyBlock(objectToDestroy) {
            if (objectToDestroy !== floor) {
                scene.remove(objectToDestroy);
                objects.splice(objects.indexOf(objectToDestroy), 1);
                
                gravityZones = gravityZones.filter(zone => zone !== objectToDestroy);
                if (lightSources.has(objectToDestroy)) {
                    scene.remove(lightSources.get(objectToDestroy));
                    lightSources.delete(objectToDestroy);
                }
                if (objectToDestroy.isTeleportPad) {
                    activeTeleports = activeTeleports.filter(p => p !== objectToDestroy && p !== objectToDestroy.link);
                    if (objectToDestroy.link) {
                        objectToDestroy.link.link = null;
                        objectToDestroy.link.material.color.set(0xffaa00);
                        teleportPads.push(objectToDestroy.link);
                    }
                    teleportPads = teleportPads.filter(p => p !== objectToDestroy);
                }
            }
        }

        function setupTouchControls() {
            const moveButtons = {
                'move-w': (pressed) => moveForward = pressed,
                'move-s': (pressed) => moveBackward = pressed,
                'move-a': (pressed) => moveLeft = pressed,
                'move-d': (pressed) => moveRight = pressed,
            };

            for (const [id, action] of Object.entries(moveButtons)) {
                const btn = document.getElementById(id);
                btn.addEventListener('mousedown', (e) => { e.stopPropagation(); action(true); });
                btn.addEventListener('mouseup', (e) => { e.stopPropagation(); action(false); });
                btn.addEventListener('mouseleave', (e) => { e.stopPropagation(); action(false); });
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); action(true); }, { passive: false });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); action(false); }, { passive: false });
            }

            const jumpBtn = document.getElementById('move-jump');
            const jumpAction = () => { if (canJump && controls.isLocked) { velocity.y = 35; canJump = false; }};
            jumpBtn.addEventListener('mousedown', (e) => { e.stopPropagation(); jumpAction(); });
            jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); jumpAction(); }, { passive: false });

            const spellBtns = document.querySelectorAll('.spell-btn');
            spellBtns.forEach(btn => {
                const spell = btn.dataset.spell;
                const spellAction = () => {
                    currentSpell = spell;
                    spellBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                btn.addEventListener('mousedown', (e) => { e.stopPropagation(); spellAction(); });
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); spellAction(); }, { passive: false });
            });
        }
        setupTouchControls();


        function getPlacementPos(point, face) {
            const pos = new THREE.Vector3().copy(point).add(face.normal);
            return pos.divideScalar(2).floor().multiplyScalar(2).addScalar(1);
        }

        function isPlayerColliding(position) {
            const playerBox = new THREE.Box3().setFromCenterAndSize(controls.getObject().position, new THREE.Vector3(1.5, 3, 1.5));
            const voxelBox = new THREE.Box3().setFromCenterAndSize(position, new THREE.Vector3(2, 2, 2));
            return playerBox.intersectsBox(voxelBox);
        }

        function addBlock(pos) {
            const voxel = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), cubeMat);
            voxel.position.copy(pos);
            voxel.castShadow = true; voxel.receiveShadow = true;
            scene.add(voxel); objects.push(voxel);
        }
        function createFlower(pos) {
            const stem = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2, 0.4), new THREE.MeshStandardMaterial({ color: 0x008000 }));
            stem.position.copy(pos); stem.castShadow = true; scene.add(stem); objects.push(stem);
            const petalColors = [0xffc0cb, 0xff1493, 0xffff00, 0x1e90ff];
            const petalColor = petalColors[Math.floor(Math.random() * petalColors.length)];
            const petal = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6), new THREE.MeshStandardMaterial({ color: petalColor, emissive: petalColor, emissiveIntensity: 0.3 }));
            petal.position.copy(pos).y += 1.5; petal.castShadow = true; scene.add(petal); objects.push(petal);
        }
        function createIceBlock(pos) {
            const voxel = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), iceMat);
            voxel.position.copy(pos);
            voxel.castShadow = true; scene.add(voxel); objects.push(voxel);
        }
        function createGravityBlock(pos) {
            const voxel = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), gravityMat);
            voxel.position.copy(pos);
            scene.add(voxel); objects.push(voxel); gravityZones.push(voxel);
        }
        function growVine(startPos, direction) {
            let currentPos = new THREE.Vector3().copy(startPos); let length = 0;
            const vineInterval = setInterval(() => {
                if (length >= 10 || isPlayerColliding(currentPos)) { clearInterval(vineInterval); return; }
                const segment = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), vineMat);
                segment.position.copy(currentPos); scene.add(segment); objects.push(segment);
                currentPos.add(direction.multiplyScalar(2)); length++;
            }, 200);
        }
        function createLightBlock(pos) {
            const voxel = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), lightMat);
            voxel.position.copy(pos);
            voxel.castShadow = true; scene.add(voxel); objects.push(voxel);
            const pointLight = new THREE.PointLight(0xffff88, 1, 30, 1.5);
            pointLight.position.copy(pos); scene.add(pointLight);
            lightSources.set(voxel, pointLight);
        }
        function createTeleportPad(pos) {
            const voxel = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 2), teleportMatBase.clone());
            voxel.position.copy(pos);
            voxel.isTeleportPad = true; voxel.link = null;
            scene.add(voxel); objects.push(voxel);
            
            if (teleportPads.length > 0) {
                const partner = teleportPads.pop();
                voxel.link = partner;
                partner.link = voxel;
                voxel.material.color.set(0x00ff00); partner.material.color.set(0x00ff00);
                activeTeleports.push(voxel, partner);
            } else {
                voxel.material.color.set(0xffaa00);
                teleportPads.push(voxel);
            }
        }

        function createBlockTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
            const context = canvas.getContext('2d');
            context.fillStyle = '#8b4513'; context.fillRect(0, 0, 64, 64);
            context.fillStyle = '#3a9d23'; context.fillRect(0, 0, 64, 12);
            context.fillStyle = 'rgba(0,0,0,0.1)'; for(let i=0; i<200; i++) context.fillRect(Math.random()*64, 12, 2, 2);
            context.fillStyle = 'rgba(255,255,255,0.1)'; for(let i=0; i<50; i++) context.fillRect(Math.random()*64, 12, 1, 1);
            const texture = new THREE.CanvasTexture(canvas); texture.colorSpace = THREE.SRGBColorSpace; return texture;
        }

        camera.position.set(10, 5, 20);
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            teleportCooldown = Math.max(0, teleportCooldown - delta);
            const playerPosition = controls.getObject().position;

            if (teleportCooldown === 0) {
                for (const pad of activeTeleports) {
                    if (pad.link && playerPosition.distanceTo(pad.position) < 2) {
                        playerPosition.copy(pad.link.position).y += 2;
                        teleportCooldown = 3;
                        break;
                    }
                }
            }
            
            if (controls.isLocked) {
                let baseGravity = 80.0;
                for (const zone of gravityZones) {
                    if (playerPosition.distanceTo(zone.position) < 15) {
                        baseGravity = 20.0;
                        break;
                    }
                }

                velocity.y -= baseGravity * delta;
                
                let playerOnGround = false;
                const oldY = playerPosition.y;
                playerPosition.y += velocity.y * delta;
                
                const playerBox = new THREE.Box3().setFromCenterAndSize(playerPosition, new THREE.Vector3(1.5, 3, 1.5));
                let collision = false;
                for(const obj of objects) {
                    const objBox = new THREE.Box3().setFromObject(obj);
                    if(playerBox.intersectsBox(objBox)) {
                        collision = true;
                        break;
                    }
                }
                if(collision) {
                    playerPosition.y = oldY;
                    velocity.y = 0;
                    playerOnGround = true;
                    canJump = true;
                }
                
                if (playerPosition.y < -50) {
                    playerPosition.set(10, 5, 20);
                    velocity.y = 0;
                }

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 200.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 200.0 * delta;
                
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
            }
            
            prevTime = time;
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
