<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>秋田県クマ出没マップ（API版）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<link rel="stylesheet" type="text/css" href="Style.css" />
<style>
  #map { 
    height: 100%;
    width: 100%;
  }
  #main-content {
    display: flex;
    height: 70vh;
  }
  #map-container {
    width: 70%;
    height: 100%;
  }
  #info-list-container {
    width: 30%;
    height: 100%;
    overflow-y: auto;
    padding: 0 15px;
    box-sizing: border-box;
  }
  .info-item {
    border-bottom: 1px solid #eee;
    padding: 10px 5px;
    font-size: 0.9rem;
  }
  .info-item:first-child {
    border-top: 1px solid #eee;
  }
  .info-item strong {
    color: white;
  }
  .controls {
    display:flex; flex-wrap:wrap; align-items:center; gap:15px;
  }
  .note { font-size: 0.85rem; color: #ccc; }

  /* ローディングオーバーレイのスタイル */
  #loadingOverlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(26, 26, 46, 0.85);
    display:none; align-items:center; justify-content:center;
    flex-direction:column; z-index:9999;
  }
  .spinner {
    border:6px solid #16213e;
    border-top:6px solid #ffcc00;
    border-radius:50%;
    width:60px; height:60px;
    animation: spin 1s linear infinite;
    margin-bottom:15px;
  }
  @keyframes spin {
    0% { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
  }
  #progressBarContainer {
    width:220px; background: #333; height:10px; border-radius:5px; overflow:hidden;
  }
  #progressBar {
    width:0%; height:100%; background:#ffcc00; transition:width 0.2s;
  }
</style>

<!-- GoatCounter (file:/// 警告回避) -->
<script>
    if (location.protocol !== 'file:') {
        var s = document.createElement('script');
        s.async = true;
        s.dataset.goatcounter = "https://senzaiichiguunochance.goatcounter.com/count";
        s.src = "https://gc.zgo.at/count.js";
        document.head.appendChild(s);
    }
</script>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

<div class="container">
    <header class="header">
        <h1>秋田県クマ出没マップ (API版)</h1>
    </header>

    <div class="box">
        <div id="controls" class="controls">
            <label>開始日: <input type="date" id="startDate"></label>
            <label>終了日: <input type="date" id="endDate"></label>
            <label>件数制限: <input type="number" id="limit" value="99999" min="10" style="width:80px"></label>
            <button id="btnLoad" class="primary">表示</button>
        </div>
        <div class="note">※本日を終了日、100件目（存在すれば）を開始日に自動設定します。</div>
    </div>

    <div id="main-content">
        <div id="map-container">
            <div id="map"></div>
        </div>
        <div id="info-list-container"></div>
    </div>
</div>

<!-- ローディングオーバーレイ -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="progressBarContainer"><div id="progressBar"></div></div>
  <div id="loadingText" style="margin-top:8px; color:white;">データ読込中...</div>
</div>

<script>
const BASE_URL = "https://ckan.pref.akita.lg.jp/api/3/action/datastore_search";
const RESOURCE_ID = "326bfe79-3f64-401b-9862-b37a477c7211";

// 地図初期化
let map = L.map("map").setView([39.7, 140.1], 8);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap contributors"
}).addTo(map);
let layerGroup = L.layerGroup().addTo(map);

let isInitialLoad = true;
const overlay = document.getElementById("loadingOverlay");
const btn = document.getElementById("btnLoad");
const progressBar = document.getElementById("progressBar");
const loadingText = document.getElementById("loadingText");

function showOverlay(msg="処理中...") {
  overlay.style.display = "flex";
  loadingText.textContent = msg;
  progressBar.style.width = "0%";
  btn.disabled = true;
  document.body.style.cursor = "wait";
}

function hideOverlay() {
  overlay.style.display = "none";
  btn.disabled = false;
  document.body.style.cursor = "default";
}

// 複数のプロキシを経由して確実にAPIからデータを得る処理
async function fetchWithFallback(targetUrl) {
  // 試行するプロキシ一覧
  const proxies = [
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
  ];

  // 1. 直リクエストを試行
  try {
    const directRes = await fetch(targetUrl);
    if (directRes.ok) {
      const data = await directRes.json();
      if (data && data.result) return data;
    }
  } catch (e) {}

  // 2. プロキシを順番に試行
  for (const proxyFn of proxies) {
    try {
      const pUrl = proxyFn(targetUrl);
      const res = await fetch(pUrl);
      if (res.ok) {
        const text = await res.text();
        const data = JSON.parse(text);
        if (data && (data.result || Array.isArray(data))) return data;
      }
    } catch (e) {
      continue;
    }
  }

  throw new Error("APIサーバーからの応答を受け取れませんでした（404/通信拒否）");
}

async function loadFromApi() {
  const infoListContainer = document.getElementById("info-list-container");
  try {
    showOverlay("データ読込中...");
    infoListContainer.innerHTML = "";
    const sdInput = document.getElementById("startDate");
    const edInput = document.getElementById("endDate");
    const limit = document.getElementById("limit").value || 99999;

    const url = `${BASE_URL}?resource_id=${RESOURCE_ID}&limit=${limit}`;
    const data = await fetchWithFallback(url);
    
    // CKANレスポンス形式の正規化
    let records = [];
    if (data.result && data.result.records) {
      records = data.result.records;
    } else if (Array.isArray(data)) {
      records = data;
    } else {
      throw new Error("想定と異なるデータ形式が返却されました");
    }

    loadingText.textContent = `取得件数 ${records.length} 件`;

    // 日付順ソート
    records.sort((a, b) => {
      const da = new Date(a["目撃日時"] || a["出没日時"] || a["年月日"] || "");
      const db = new Date(b["目撃日時"] || b["出没日時"] || b["年月日"] || "");
      return db - da;
    });

    if (isInitialLoad && records.length >= 100) {
      const date100 = new Date(records[99]["目撃日時"] || records[99]["出没日時"] || records[99]["年月日"] || "");
      if (isFinite(date100)) {
        const y = date100.getFullYear();
        const m = String(date100.getMonth() + 1).padStart(2, "0");
        const d = String(date100.getDate()).padStart(2, "0");
        sdInput.value = `${y}-${m}-${d}`;
      }
      const now = new Date();
      const y2 = now.getFullYear();
      const m2 = String(now.getMonth() + 1).padStart(2, "0");
      const d2 = String(now.getDate()).padStart(2, "0");
      edInput.value = `${y2}-${m2}-${d2}`;
      isInitialLoad = false;
    }

    const start = sdInput.value ? new Date(sdInput.value) : null;
    const end = edInput.value ? new Date(edInput.value) : null;

    const filtered = records.filter(rec => {
      const d = new Date(rec["目撃日時"] || rec["出没日時"] || rec["年月日"] || "");
      if (!isFinite(d)) return true;
      if (start && d < start) return false;
      if (end && d > end) return false;
      return true;
    });

    loadingText.textContent = `描画中 (${filtered.length}件)...`;
    layerGroup.clearLayers();
    const chunkSize = 100;
    let done = 0;

    for (let i = 0; i < filtered.length; i += chunkSize) {
      const chunk = filtered.slice(i, i + chunkSize);
      let listHtml = '';
      for (const r of chunk) {
        const dateTime = r["目撃日時"] || r["出没日時"] || r["年月日"] || "日時不明";
        const locationName = r["市町村"] || r["市町村名"] || r["場所"] || "情報なし";
        const detail = r["目撃時の状況"] || r["状況"] || "情報なし";

        listHtml += `
            <div class="info-item">
                <strong>場所:</strong> ${locationName}<br>
                <strong>日時:</strong> ${dateTime}<br>
                <strong>状況:</strong> ${detail}
            </div>
        `;

        const lat = parseFloat(r["緯度"] || r["x(緯度)"] || r["latitude"] || r["lat"] || r["Y"] || r["y"]);
        const lng = parseFloat(r["経度"] || r["y(経度)"] || r["longitude"] || r["lng"] || r["X"] || r["x"]);

        if (isFinite(lat) && isFinite(lng)) {
          const popup = `
            <b>${locationName}</b><br>
            ${dateTime}<br>
            ${detail}
          `;
          L.marker([lat, lng]).bindPopup(popup).addTo(layerGroup);
        }
      }
      
      infoListContainer.innerHTML += listHtml;
      done += chunk.length;
      const percent = Math.round((done / filtered.length) * 100);
      progressBar.style.width = percent + "%";
      await new Promise(res => setTimeout(res, 10));
    }

    loadingText.textContent = `完了：${filtered.length}件表示`;
    await new Promise(res => setTimeout(res, 300));
  } catch (err) {
    console.error(err);
    alert("データ取得エラー: " + err.message);
  } finally {
    hideOverlay();
  }
}

btn.addEventListener("click", loadFromApi);
window.onload = loadFromApi;
</script>
</body>
</html>
