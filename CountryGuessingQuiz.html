<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国当てクイズ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #2c3e50;
    margin: 0;
    overflow: hidden;
    height: 100vh;
    color: #ecf0f1;
    text-align: center;
}

#map {
    position: fixed;
    inset: 0;
    background: #1a252f;
    z-index: 0;
}

/* ===========================
   ネオン発光（共通）
   =========================== */
.leaflet-interactive {
    transition: 
        fill 0.4s ease,
        stroke 0.4s ease,
        filter 0.4s ease;
}

/* 正解（青ネオン） */
.neon-correct {
    filter:
        drop-shadow(0 0 6px rgba(80,180,255,0.9))
        drop-shadow(0 0 12px rgba(80,180,255,0.8))
        drop-shadow(0 0 20px rgba(80,180,255,0.6));
}

/* 不正解（赤ネオン） */
.neon-wrong {
    filter:
        drop-shadow(0 0 6px rgba(255,100,100,0.9))
        drop-shadow(0 0 12px rgba(255,100,100,0.8))
        drop-shadow(0 0 20px rgba(255,100,100,0.6));
}

/* UI */
.container {
    position: relative;
    max-width: 480px;
    margin: 15px auto;
    background: rgba(44,62,80,0.9);
    padding: 15px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    z-index: 10;
}

#flag-img {
    width: 120px;
    margin-bottom: 10px;
    border-radius: 4px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.5);
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

button {
    padding: 8px;
    font-size: 13px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #3498db;
    color: #fff;
}

button:hover:not(:disabled) {
    background: #2980b9;
}

#next-btn {
    display: none;
    margin-top: 10px;
    width: 100%;
    background: #2ecc71;
    font-weight: bold;
}

#loading-msg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    z-index: 20;
    font-size: 1.2em;
}
</style>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

<div id="map"></div>
<div id="loading-msg">🌍 地図データを照合中...</div>

<div class="container" id="main-ui" style="display:none;">
    <h2>国当てクイズ</h2>
    <div>第 <span id="q-count">1</span> 問 | 正解率 <span id="accuracy">0</span>%</div>
    <img id="flag-img">
    <div class="options" id="options-container"></div>
    <div id="result" style="margin-top:10px;font-weight:bold;height:24px;"></div>
    <button id="next-btn">次の問題へ</button>
</div>

<script>
let map;
let countriesData = [];
let correctCountry;
let stats = { q: 1, correct: 0, wrong: 0 };
const layerDict = {};

async function init() {
    // 1. worldCopyJumpをtrueにして、世界をループできるように設定
    map = L.map('map', {
        worldCopyJump: true,
        maxBoundsViscosity: 1.0
    }).setView([20, 0], 2);

    // 2. 背景にダーク系のタイルレイヤーを追加（これで「欠ける」見た目を防ぎます）
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    const countryRes = await fetch(
        'https://restcountries.com/v3.1/all?fields=name,cca3,flags,translations'
    );
    countriesData = await countryRes.json();

    const geoRes = await fetch(
        'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json'
    );
    const geoData = await geoRes.json();

    L.geoJson(geoData, {
        style: {
            fillColor: '#1a1a1a', // ここを暗いグレー/黒系に
            fillOpacity: 0.7,     // 透明度を少し上げるとタイルと馴染みます
            color: '#2c3e50',     // 国境線の色
            weight: 1
        },
        onEachFeature: (feature, layer) => {
            const id = (feature.id || '').toUpperCase();
            if (id) layerDict[id] = layer;
        }
    }).addTo(map);

    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('main-ui').style.display = 'block';
    loadQuestion();
}

// 全国のスタイルを初期状態（黒っぽく）に戻す関数
function resetMapStyle() {
    Object.values(layerDict).forEach(layer => {
        layer.setStyle({
            fillColor: '#1a1a1a',
            fillOpacity: 0.7,
            color: '#2c3e50',
            weight: 1
        });
        const el = layer.getElement();
        if (el) {
            el.classList.remove('neon-correct', 'neon-wrong');
        }
    });
}

// loadQuestion の最初に追加
function loadQuestion() {
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('q-count').innerText = stats.q;

    const available = countriesData.filter(c => layerDict[c.cca3]);
    const shuffled = available.sort(() => Math.random() - 0.5);
    const choices = shuffled.slice(0, 4);
    correctCountry = choices[0];

    document.getElementById('flag-img').src = correctCountry.flags.svg;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    choices.sort(() => Math.random() - 0.5).forEach(c => {
        const btn = document.createElement('button');
        btn.textContent = c.translations?.jpn?.common || c.name.common;
        btn.onclick = () => checkAnswer(c, btn);
        container.appendChild(btn);
    });
}

function applyNeon(layer, type) {
    layer.setStyle({
        fillColor: type === 'correct' ? '#3fa9f5' : '#ff5c5c',
        fillOpacity: 0.9,
        color: '#ffffff',
        weight: 3
    });

    const el = layer.getElement();
    if (el) {
        el.classList.remove('neon-correct', 'neon-wrong');
        el.classList.add(type === 'correct' ? 'neon-correct' : 'neon-wrong');
    }

    map.flyTo(layer.getBounds().getCenter(), 3, { duration: 1.2 });
}

function checkAnswer(selected, btn) {
    document.querySelectorAll('.options button').forEach(b => b.disabled = true);

    const layer = layerDict[correctCountry.cca3];

    if (selected.cca3 === correctCountry.cca3) {
        stats.correct++;
        document.getElementById('result').innerHTML =
            "<span style='color:#6ecbff'>正解！</span>";
        applyNeon(layer, 'correct');
    } else {
        stats.wrong++;
        btn.style.background = '#e74c3c';
        document.getElementById('result').innerHTML =
            `正解は ${correctCountry.translations?.jpn?.common}`;
        applyNeon(layer, 'wrong');
    }

    const total = stats.correct + stats.wrong;
    document.getElementById('accuracy').innerText =
        Math.round(stats.correct / total * 100);

    document.getElementById('next-btn').style.display = 'block';
}


document.getElementById('next-btn').onclick = () => {
    stats.q++;
    loadQuestion();
};

init();
</script>
</body>
</html>
