<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国当てクイズ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #1a252f; margin: 0; overflow: hidden; height: 100vh; color: #ecf0f1; text-align: center; }
        #map { position: fixed; inset: 0; background: #1a252f; z-index: 0; }
        .ui-panel { position: relative; max-width: 480px; margin: 15px auto; background: rgba(44,62,80,0.95); padding: 20px; border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 10; }
        #start-menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(26, 37, 47, 0.95); z-index: 1000; }
        .menu-content { background: #34495e; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; }
        label { display: block; text-align: left; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; color: #bdc3c7; }
        select { width: 100%; padding: 12px; margin: 0 0 20px 0; border-radius: 8px; background: #2c3e50; color: white; border: 1px solid #3498db; font-size: 16px; }
        #timer-container { width: 100%; background: #1a252f; height: 8px; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: #2ecc71; transition: width 0.1s linear; }
        #flag-img { width: 120px; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); margin-bottom: 10px; }
        
        /* 追加情報のスタイル */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.8em; margin-bottom: 10px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; }
        .info-item { text-align: left; color: #bdc3c7; }
        .info-item span { color: #fff; font-weight: bold; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 12px; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; background: #3498db; color: #fff; transition: 0.2s; }
        button:hover:not(:disabled) { background: #2980b9; transform: translateY(-2px); }
        button:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.6; }
        .btn-start { background: #2ecc71; width: 100%; font-size: 18px; font-weight: bold; }
        #result-screen { display: none; position: fixed; inset: 0; background: rgba(44, 62, 80, 0.98); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .leaflet-interactive { transition: fill 0.3s, filter 0.3s; stroke-linejoin: round; }
        .neon-correct { filter: drop-shadow(0 0 10px #3fa9f5); }
        .neon-wrong { filter: drop-shadow(0 0 10px #ff5c5c); }
    </style>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

<div id="map"></div>

<div id="start-menu">
    <div class="menu-content">
        <h2 style="margin-top:0;">🌍 クイズ設定</h2>
        <label>1. 難易度を選択:</label>
        <select id="level-select" onchange="updateRegionOptions()">
            <option value="1">Level 1: 有名な大国のみ</option>
            <option value="2">Level 2: 標準</option>
            <option value="3" selected>Level 3: 全ての国</option>
        </select>
        <label>2. 地域を選択:</label>
        <select id="region-select">
            <option value="all">全世界</option>
            <option value="Asia">アジア</option>
            <option value="Europe">ヨーロッパ</option>
            <option value="Africa">アフリカ</option>
            <option value="Americas">南北アメリカ</option>
            <option value="Oceania">オセアニア</option>
        </select>
        <button id="start-btn" class="btn-start" onclick="startGame()" disabled>読み込み中...</button>
    </div>
</div>

<div class="ui-panel" id="main-ui" style="display:none;">
    <div style="font-size: 0.9em; margin-bottom: 5px;">
        <span id="display-mode" style="color:#3498db; font-weight:bold;"></span> 第 <span id="q-count">1</span> / 10 問
    </div>
    <div id="timer-container"><div id="timer-bar"></div></div>
    <img id="flag-img" src="">
    
    <div class="info-grid">
        <div class="info-item">📍 首都: <span id="info-capital">-</span></div>
        <div class="info-item">🗺 地方: <span id="info-subregion">-</span></div>
        <div class="info-item">💰 通貨: <span id="info-currency">-</span></div>
        <div class="info-item">👥 人口: <span id="info-population">-</span></div>
    </div>

    <div id="score-info" style="font-size: 1.1em; margin-bottom: 5px;">
        Score: <span id="current-score">0</span> 
        <span style="font-size: 0.8em; color: #bdc3c7; margin-left: 10px;">(High Score: <span id="high-score">0</span>)</span>
    </div>
    <div class="options" id="options-container"></div>
    <div id="result-text" style="margin-top:10px; font-weight:bold; height:24px;"></div>
    <button id="next-btn" style="display:none; width:100%; background:#2ecc71; margin-top:10px;">次の問題へ</button>
</div>

<div id="result-screen">
    <h1 style="font-size: 2.5em;">結果発表</h1>
    <div id="final-score" style="font-size: 4em; color: #f1c40f;">0</div>
    <div id="new-record-msg" style="color: #2ecc71; font-weight: bold; margin-bottom: 20px; display: none;">✨ NEW RECORD! ✨</div>
    <button onclick="location.reload()" style="padding: 15px 40px; background:#2ecc71;">メニューに戻る</button>
</div>

<script>
let map, countriesData = [], filteredPool = [], correctCountry, layerDict = {};
let stats = { q: 1, score: 0, combo: 0 };
let timeLeft = 10, timerInterval, usedCountryCodes = new Set();
let isOceaniaLevel3 = false;

const FAMOUS_CODES = ['JPN','USA','CHN','FRA','GBR','DEU','ITA','CAN','BRA','IND','AUS','KOR','RUS','ESP','MEX','ARG','EGY','TUR','ZAF','SAU','IDN','VNM','THA','PHL','MYS'];

async function init() {
    try {
        map = L.map('map', { 
            worldCopyJump: true,
            minZoom: 1,
            maxZoom: 10,
            zoomSnap: 0.1,
            renderer: L.svg({ padding: 10.0 })
        }).setView([20, 0], 2);

        // APIから追加フィールドを取得
        const [countryRes, geoRes] = await Promise.all([
            fetch('https://restcountries.com/v3.1/all?fields=name,cca3,flags,translations,region,subregion,capital,currencies,population'),
            fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
        ]);
        
        countriesData = await countryRes.json();
        const geoData = await geoRes.json();

        [-720, -360, 0, 360, 720].forEach(offset => {
            L.geoJson(geoData, {
                coordsToLatLng: coords => L.latLng(coords[1], coords[0] + offset),
                style: { fillColor: '#2c3e50', fillOpacity: 1, color: '#1a252f', weight: 1 },
                onEachFeature: (feature, layer) => {
                    const id = (feature.id || '').toUpperCase();
                    if (id && offset === 0) layerDict[id] = layer;
                }
            }).addTo(map);
        });

        updateHighScoreDisplay();
        updateRegionOptions();

        // 全データの準備が整ったらボタンを有効化
        const startBtn = document.getElementById('start-btn');
        startBtn.disabled = false;
        startBtn.innerText = 'ゲーム開始！';

    } catch (error) {
        console.error("データの読み込み中にエラーが発生しました:", error);
        document.getElementById('start-btn').innerText = '読み込み失敗 (再読み込みしてください)';
    }
}

function updateHighScoreDisplay() {
    const highScore = localStorage.getItem('countryQuiz_highScore') || 0;
    document.getElementById('high-score').innerText = highScore;
}

function updateRegionOptions() {
    const level = document.getElementById('level-select').value;
    const regionSelect = document.getElementById('region-select');
    const options = regionSelect.options;
    for (let i = 0; i < options.length; i++) {
        const regionValue = options[i].value;
        let count = countriesData.filter(c => layerDict[c.cca3]).length;
        if (regionValue !== 'all') count = countriesData.filter(c => layerDict[c.cca3] && c.region === regionValue).length;
        if (level === '1') count = countriesData.filter(c => layerDict[c.cca3] && FAMOUS_CODES.includes(c.cca3) && (regionValue === 'all' || c.region === regionValue)).length;
        
        if (regionValue === 'Oceania' && level === '3') options[i].disabled = false;
        else if (count < 10) options[i].disabled = true;
        else options[i].disabled = false;
    }
}

function startGame() {
    resetMapStyle();
    updateHighScoreDisplay();
    
    const region = document.getElementById('region-select').value;
    const level = document.getElementById('level-select').value;
    isOceaniaLevel3 = (region === 'Oceania' && level === '3');
    filteredPool = countriesData.filter(c => layerDict[c.cca3]);
    if (region !== 'all') filteredPool = filteredPool.filter(c => c.region === region);
    if (level === '1') filteredPool = filteredPool.filter(c => FAMOUS_CODES.includes(c.cca3));
    
    document.getElementById('start-menu').style.display = 'none';
    document.getElementById('main-ui').style.display = 'block';
    loadQuestion();
}

function loadQuestion() {
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('result-text').innerText = '';
    document.getElementById('q-count').innerText = stats.q;
    
    let targetPool = isOceaniaLevel3 ? filteredPool : filteredPool.filter(c => !usedCountryCodes.has(c.cca3));
    if (targetPool.length === 0) targetPool = filteredPool;
    
    // データが空の場合の安全策
    if (targetPool.length === 0) {
        alert("国のリストが読み込まれていません。ページを再読み込みしてください。");
        return;
    }

    const shuffled = [...targetPool].sort(() => Math.random() - 0.5);
    correctCountry = shuffled[0];
    usedCountryCodes.add(correctCountry.cca3);
    
    // 国情報の表示更新
    document.getElementById('flag-img').src = correctCountry.flags.svg;
    document.getElementById('info-capital').innerText = correctCountry.capital?.[0] || '不明';
    document.getElementById('info-subregion').innerText = correctCountry.subregion || '不明';
    document.getElementById('info-currency').innerText = correctCountry.currencies ? Object.values(correctCountry.currencies).map(curr => curr.name).join(', ') : '不明';
    document.getElementById('info-population').innerText = correctCountry.population?.toLocaleString() + ' 人';

    const otherChoices = countriesData.filter(c => c.cca3 !== correctCountry.cca3 && layerDict[c.cca3]).sort(() => Math.random() - 0.5).slice(0, 3);
    const finalChoices = [correctCountry, ...otherChoices].sort(() => Math.random() - 0.5);
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    
    finalChoices.forEach(c => {
        const btn = document.createElement('button');
        btn.textContent = c.translations?.jpn?.common || c.name.common;
        btn.onclick = () => checkAnswer(c, btn);
        container.appendChild(btn);
    });
    
    timeLeft = 10;
    startTimer();
}

function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        document.getElementById('timer-bar').style.width = (timeLeft * 10) + "%";
        if (timeLeft <= 0) { clearInterval(timerInterval); checkAnswer(null, null); }
    }, 100);
}

function checkAnswer(selected, btn) {
    clearInterval(timerInterval);
    document.querySelectorAll('.options button').forEach(b => b.disabled = true);
    const layer = layerDict[correctCountry.cca3];
    
    if (selected && selected.cca3 === correctCountry.cca3) {
        stats.combo++;
        const earned = Math.round(timeLeft * 100 * (1 + stats.combo * 0.1));
        stats.score += earned;
        document.getElementById('result-text').innerHTML = `<span style="color:#6ecbff">正解！ +${earned}pt</span>`;
        applyNeon(layer, 'correct');
        confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
    } else {
        stats.combo = 0;
        if(btn) btn.style.background = '#e74c3c';
        document.getElementById('result-text').innerHTML = `<span style="color:#ff5c5c">正解：${correctCountry.translations?.jpn?.common}</span>`;
        applyNeon(layer, 'wrong');
    }
    
    document.getElementById('current-score').innerText = stats.score;
    const nextBtn = document.getElementById('next-btn');
    nextBtn.style.display = 'block';
    
    if (stats.q >= 10) { 
        nextBtn.innerText = "リザルトを確認"; 
        nextBtn.onclick = showResults; 
    } else { 
        nextBtn.onclick = () => { stats.q++; loadQuestion(); }; 
    }
}

function applyNeon(layer, type) {
    if (!layer) return;
    const center = layer.getBounds().getCenter();
    const currentCenter = map.getCenter();
    let targetLng = center.lng;
    while (targetLng - currentCenter.lng > 180) targetLng -= 360;
    while (targetLng - currentCenter.lng < -180) targetLng += 360;
    
    // UIパネルで隠れないよう、少し南側（緯度を下げる）を注視点にする
    const viewLat = center.lat + 10; 

    map.fire('movestart'); 
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            map.flyTo([viewLat, targetLng], 4, { duration: 1.5, easeLinearity: 0.25, noMoveStart: true });
        });
    });
    
    layer.setStyle({ fillColor: type === 'correct' ? '#3498db' : '#e74c3c', fillOpacity: 1, weight: 2, color: '#fff' });
    const el = layer.getElement();
    if (el) {
        el.classList.remove('neon-correct', 'neon-wrong');
        el.classList.add(type === 'correct' ? 'neon-correct' : 'neon-wrong');
    }
}

function resetMapStyle() {
    Object.values(layerDict).forEach(layer => {
        layer.setStyle({ fillColor: '#2c3e50', fillOpacity: 1, color: '#1a252f', weight: 1 });
        const el = layer.getElement();
        if (el) el.classList.remove('neon-correct', 'neon-wrong');
    });
}

function showResults() {
    document.getElementById('main-ui').style.display = 'none';
    document.getElementById('result-screen').style.display = 'flex';
    document.getElementById('final-score').innerText = stats.score;

    const highScore = parseInt(localStorage.getItem('countryQuiz_highScore') || 0);
    if (stats.score > highScore) {
        localStorage.setItem('countryQuiz_highScore', stats.score);
        document.getElementById('new-record-msg').style.display = 'block';
    }
}

// DOMが読み込まれてから初期化
window.addEventListener('load', init);
</script>
</body>
</html>
