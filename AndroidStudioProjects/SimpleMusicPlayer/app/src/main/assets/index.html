<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超軽量・スマートオーディオプレーヤー</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff7ed, #ffedd5, #fef08a);
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary: #f97316;
      --text: #44403c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
    }


    .container {
      background: var(--card-bg);
      border-radius: 24px;
      border: 2px solid #fed7aa;
      box-shadow: 0 10px 25px rgba(180,150,120,0.15);
      padding: 16px;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .btn-drum {
      background: var(--primary); color: white; border: none; border-radius: 8px;
      padding: 10px; font-size: 12px; font-weight: bold; cursor: pointer;
      box-shadow: 0 3px 0 #c2410c; display: flex; align-items: center; justify-content: center; width: 100%;
      margin-bottom: 6px;
    }
    .btn-drum:active { transform: translateY(2px); box-shadow: 0 1px 0 #c2410c; }

    .status-text { text-align: center; font-size: 11px; font-weight: bold; color: #78716c; margin-bottom: 12px; }

    .display-pad {
      background: #292524; color: #f5f5f4; padding: 14px;
      border-radius: 16px; text-align: center; margin-bottom: 12px;
    }

    .track-title {
      font-size: 0.95rem; font-weight: bold; color: #fde047;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px;
    }

    input[type=range] {
      width: 100%; height: 8px; background: #44403c; border-radius: 999px;
      outline: none; -webkit-appearance: none; touch-action: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px;
      border-radius: 50%; background: #fb923c; cursor: pointer;
    }

    .time-display {
      font-size: 1.25rem; font-weight: bold; color: #fb923c;
      font-family: monospace; margin-top: 6px;
    }

    .controls-main { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .btn-secondary {
      background: white; border: 1px solid #e7e5e4; color: #44403c;
      font-size: 12px; font-weight: bold; padding: 10px; border-radius: 12px;
      cursor: pointer; flex: 1; max-width: 90px; box-shadow: 0 3px 0 #d6d3d1;
    }
    .btn-secondary:active { transform: translateY(2px); box-shadow: 0 1px 0 #d6d3d1; }

    .btn-play {
      background: var(--primary); color: white; border: none; font-size: 14px;
      font-weight: bold; padding: 10px; border-radius: 12px; cursor: pointer;
      flex: 2; max-width: 160px; box-shadow: 0 3px 0 #c2410c;
    }
    .btn-play:active { transform: translateY(2px); box-shadow: 0 1px 0 #c2410c; }

    .box-sub {
      background: rgba(255,247,237,0.7); padding: 10px; border-radius: 12px;
      border: 1px solid #ffedd5; margin-bottom: 12px;
    }
    .box-title { font-size: 11px; font-weight: bold; color: var(--primary); margin-bottom: 6px; }

    .flex-wrap { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; margin-bottom: 4px; }
    .btn-seek {
      background: white; border: 1px solid #e7e5e4; color: #57534e;
      font-size: 11px; font-weight: bold; padding: 6px 0; border-radius: 8px;
      flex: 1; min-width: 55px; cursor: pointer; box-shadow: 0 2px 0 #d6d3d1;
    }
    .btn-seek:active { transform: translateY(2px); box-shadow: 0 0 0; }

    .btn-speed {
      background: white; border: 1px solid #e7e5e4; color: #57534e;
      font-size: 11px; font-weight: bold; padding: 6px 0; border-radius: 8px;
      flex: 1; cursor: pointer; box-shadow: 0 2px 0 #d6d3d1;
    }
    .btn-speed:active { transform: translateY(2px); box-shadow: 0 0 0; }
    .btn-speed.active {
      background: var(--primary); color: white; border-color: #ea580c;
      box-shadow: 0 2px 0 #c2410c;
    }

    .playlist-box { max-height: 140px; overflow-y: auto; }
    .playlist-item {
      padding: 8px; border-radius: 8px; font-size: 11px; font-weight: bold;
      cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      border: 1px solid #e7e5e4; background: white; color: #57534e; margin-bottom: 4px;
    }
    .playlist-item.active { background: var(--primary); color: white; border-color: #ea580c; }
  </style>
  </head>
<body>

<div class="container">
  <h1>オーディオプレーヤー</h1>

  <button id="selectFolderBtn" class="btn-drum">📁 フォルダ変更</button>

  <div id="folderStatus" class="status-text">未選択</div>

  <div class="display-pad">
    <div id="trackTitle" class="track-title">トラックが選択されていません</div>
    <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.1" aria-label="再生位置">
    <div id="timeDisplay" class="time-display">00:00:00 / 00:00:00</div>
  </div>

  <div class="controls-main">
    <button id="prevBtn" class="btn-secondary" aria-label="前の曲へ" title="前の曲">⏮ 前へ</button>
    <button id="playPauseBtn" class="btn-play" aria-label="再生または一時停止" title="再生/一時停止">▶ 再生</button>
    <button id="nextBtn" class="btn-secondary" aria-label="次の曲へ" title="次の曲">次へ ⏭</button>
  </div>

  <div class="box-sub">
    <div class="box-title">★ スキップコントロール</div>
    <div class="flex-wrap">
      <button class="btn-seek" data-seconds="-30">-30秒</button>
      <button class="btn-seek" data-seconds="-15">-15秒</button>
      <button class="btn-seek" data-seconds="-10">-10秒</button>
      <button class="btn-seek" data-seconds="-5">-5秒</button>
    </div>
    <div class="flex-wrap">
      <button class="btn-seek" data-seconds="5">+5秒</button>
      <button class="btn-seek" data-seconds="10">+10秒</button>
      <button class="btn-seek" data-seconds="15">+15秒</button>
      <button class="btn-seek" data-seconds="30">+30秒</button>
    </div>
  </div>

  <div class="box-sub">
    <div class="box-title">★ 再生速度</div>
    <div class="flex-wrap">
      <button class="btn-speed" data-speed="1.0">1.0x</button>
      <button class="btn-speed" data-speed="1.5">1.5x</button>
      <button class="btn-speed" data-speed="2.0">2.0x</button>
      <button class="btn-speed" data-speed="2.5">2.5x</button>
      <button class="btn-speed" data-speed="3.0">3.0x</button>
    </div>
  </div>

  <div class="box-sub">
    <div class="box-title">★ プレイリスト</div>
    <div class="playlist-box">
      <div id="playlist"></div>
    </div>
  </div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
  const STORAGE_PREFIX = 'AudioPlayer_';
  const SAVE_INTERVAL_MS = 5000;

  let fileList = [];
  let currentIndex = -1;
  let currentSpeed = 1.0;
  let isUserSeeking = false;
  let allowSave = false;
  let lastSaveTime = 0;

  const audio = document.getElementById('audioPlayer');
  const selectFolderBtn = document.getElementById('selectFolderBtn');
  const folderStatus = document.getElementById('folderStatus');
  const trackTitle = document.getElementById('trackTitle');
  const timeDisplay = document.getElementById('timeDisplay');
  const seekSlider = document.getElementById('seekSlider');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const playlistEl = document.getElementById('playlist');

  window.addEventListener('DOMContentLoaded', async () => {
    setupMediaSession();

    document.querySelectorAll('.btn-seek').forEach(btn => {
      btn.addEventListener('click', () => seekSeconds(parseFloat(btn.dataset.seconds)));
    });

    document.querySelectorAll('.btn-speed').forEach(btn => {
      btn.addEventListener('click', () => {
        const speed = parseFloat(btn.dataset.speed);
        setPlaybackSpeed(speed);
        localStorage.setItem(STORAGE_PREFIX + 'last_speed', speed);
      });
    });
    setPlaybackSpeed(parseFloat(localStorage.getItem(STORAGE_PREFIX + 'last_speed')) || 1.0);

    await restoreState();
    allowSave = true;
  });

  window.addEventListener('pagehide', () => saveState(true));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveState(true);
  });

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      seekSeconds(-10);
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      seekSeconds(10);
    }
  });

  function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.setActionHandler('play', resume);
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', playPrev);
    navigator.mediaSession.setActionHandler('nexttrack', playNext);
  }

  function setPlaybackSpeed(speed) {
    currentSpeed = speed;
    audio.defaultPlaybackRate = speed;
    audio.playbackRate = speed;
    document.querySelectorAll('.btn-speed').forEach(btn => {
      btn.classList.toggle('active', parseFloat(btn.dataset.speed) === speed);
    });
  }

  function pickFolder() {
    if (window.AndroidBridge) {
      window.AndroidBridge.pickFolder();
    } else {
      folderStatus.textContent = 'Androidアプリ内でのみフォルダを選択できます';
    }
  }

  window.setAndroidFiles = function (jsonString) {
    try {
      const files = JSON.parse(jsonString);
      if (!Array.isArray(files) || files.length === 0) {
        folderStatus.textContent = '音声ファイルが見つかりませんでした';
        return;
      }

      const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
      files.sort((a, b) => collator.compare(a.name, b.name));

      fileList = files.map(({ name, uri }) => ({ name, uri }));
      localStorage.setItem(STORAGE_PREFIX + 'file_list', JSON.stringify(fileList));

      renderPlaylist();
      playTrack(0);
    } catch (e) {
      console.error('setAndroidFiles error:', e);
      folderStatus.textContent = 'ファイルの読み込みに失敗しました';
    }
  };

  async function restoreState() {
    let saved = null;
    try {
      saved = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'file_list'));
    } catch (e) {
      console.error('Restore fileList error:', e);
    }
    if (!Array.isArray(saved) || saved.length === 0) return;

    fileList = saved;
    renderPlaylist();
    updateFolderStatus();

    const index = fileList.findIndex(f => f.name === localStorage.getItem(STORAGE_PREFIX + 'last_file'));
    if (index === -1) return;

    selectTrack(index);
    await waitForMetadata();

    const savedTime = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'last_time')) || 0;
    if (savedTime > 0) audio.currentTime = savedTime;
    updateTimeDisplay();
    if (audio.duration) seekSlider.value = (audio.currentTime / audio.duration) * 100;
  }

  function waitForMetadata() {
    return new Promise(resolve => {
      const done = () => {
        clearTimeout(timer);
        audio.removeEventListener('loadedmetadata', done);
        audio.removeEventListener('error', done);
        resolve();
      };
      const timer = setTimeout(done, 5000);
      audio.addEventListener('loadedmetadata', done);
      audio.addEventListener('error', done);
    });
  }

  function updateFolderStatus() {
    folderStatus.textContent = `選択中: スマホ内ファイル (${fileList.length}曲)`;
  }

  function updateTimeDisplay(time = audio.currentTime) {
    timeDisplay.textContent = `${formatTime(time)} / ${formatTime(audio.duration)}`;
  }

  function renderPlaylist() {
    const fragment = document.createDocumentFragment();
    fileList.forEach((entry, index) => {
      const div = document.createElement('div');
      div.className = 'playlist-item' + (index === currentIndex ? ' active' : '');
      div.textContent = `${index + 1}. ${entry.name}`;
      div.addEventListener('click', () => playTrack(index));
      fragment.appendChild(div);
    });
    playlistEl.replaceChildren(fragment);
    updateFolderStatus();
  }

  function selectTrack(index) {
    currentIndex = index;
    const entry = fileList[index];

    audio.src = entry.uri;
    audio.playbackRate = currentSpeed;
    trackTitle.textContent = entry.name;
    updateFolderStatus();

    Array.from(playlistEl.children).forEach((el, i) => el.classList.toggle('active', i === index));
    playlistEl.children[index]?.scrollIntoView({ block: 'nearest' });
  }

  function playTrack(index) {
    if (index < 0 || index >= fileList.length) return;
    selectTrack(index);
    audio.play().catch(e => console.error('Play error:', e));
  }

  function resume() {
    if (fileList.length === 0) return;
    if (currentIndex < 0) {
      playTrack(0);
      return;
    }
    audio.play().catch(e => console.error('Play error:', e));
  }

  function togglePlay() {
    if (fileList.length === 0) {
      pickFolder();
    } else if (audio.paused) {
      resume();
    } else {
      audio.pause();
    }
  }

  function playPrev() {
    if (fileList.length === 0) return;
    if (currentIndex > 0) {
      playTrack(currentIndex - 1);
    } else {
      audio.currentTime = 0;
      resume();
    }
  }

  function playNext() {
    if (currentIndex >= 0 && currentIndex < fileList.length - 1) {
      playTrack(currentIndex + 1);
    }
  }

  selectFolderBtn.addEventListener('click', pickFolder);
  playPauseBtn.addEventListener('click', togglePlay);
  document.getElementById('prevBtn').addEventListener('click', playPrev);
  document.getElementById('nextBtn').addEventListener('click', playNext);

  audio.addEventListener('play', () => {
    playPauseBtn.textContent = '⏸ 一時停止';
  });

  audio.addEventListener('pause', () => {
    playPauseBtn.textContent = '▶ 再生';
    saveState(true);
  });

  audio.addEventListener('ended', () => {
    if (currentIndex < fileList.length - 1) playNext();
    else playPauseBtn.textContent = '▶ 再生';
  });

  audio.addEventListener('error', () => {
    if (audio.getAttribute('src')) {
      folderStatus.textContent = '再生できないファイルです。フォルダを選び直してください';
    }
  });

  audio.addEventListener('timeupdate', () => {
    if (isUserSeeking || !audio.duration) return;
    seekSlider.value = (audio.currentTime / audio.duration) * 100;
    updateTimeDisplay();
    saveState(false);
  });

  seekSlider.addEventListener('input', () => {
    isUserSeeking = true;
    if (audio.duration) {
      updateTimeDisplay((seekSlider.value / 100) * audio.duration);
    }
  });

  const commitSeek = () => {
    if (!isUserSeeking) return;
    if (audio.duration) {
      audio.currentTime = (seekSlider.value / 100) * audio.duration;
    }
    isUserSeeking = false;
    saveState(true);
  };
  seekSlider.addEventListener('change', commitSeek);
  seekSlider.addEventListener('touchend', commitSeek);
  seekSlider.addEventListener('mouseup', commitSeek);

  function seekSeconds(seconds) {
    if (!Number.isFinite(audio.duration)) return;
    audio.currentTime = Math.max(0, Math.min(audio.currentTime + seconds, audio.duration));
    saveState(true);
  }

  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return '00:00:00';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  function saveState(force = false) {
    if (!allowSave || currentIndex < 0 || !fileList[currentIndex]) return;

    const now = Date.now();
    if (!force && now - lastSaveTime < SAVE_INTERVAL_MS) return;

    localStorage.setItem(STORAGE_PREFIX + 'last_file', fileList[currentIndex].name);
    localStorage.setItem(STORAGE_PREFIX + 'last_time', audio.currentTime);
    localStorage.setItem(STORAGE_PREFIX + 'last_speed', currentSpeed);
    lastSaveTime = now;
  }
</script>

</body>
</html>
