<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ラングトンの蟻（反射移動）🐜💎</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&family=Noto+Sans+JP:wght@700&display=swap');

        :root {
            --bg-color: #f8f0ff; /* 淡いラベンダー */
            --primary-color: #9370db; /* ミディアムパープル */
            --secondary-color: #ffb6c1; /* パステルピンク */
            --font-color: #4a4a4a;
            --canvas-bg: #ffffff;
            --canvas-border: #da70d6; /* オーキッド */
        }

        body {
            font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e6e6fa 2px, transparent 2px);
            background-size: 30px 30px;
            color: var(--font-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.2em;
            font-weight: 700;
            color: var(--primary-color);
            text-shadow: 2px 2px 0px #ffffff;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-align: center;
        }

        #controls {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }

        .step-btn {
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 0.9em;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 0 #6a4fa3;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .step-btn:hover {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #6a4fa3;
        }

        .step-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        canvas {
            border: 5px solid var(--canvas-border);
            background-color: var(--canvas-bg);
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(147, 112, 219, 0.3);
            max-width: 100%;
        }

        .menu-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            color: #ffffff;
            text-decoration: none;
            background: var(--secondary-color);
            padding: 8px 18px;
            border-radius: 20px;
            z-index: 1000;
            font-weight: 700;
            box-shadow: 0 3px 0 #d698a1;
        }

        .menu-btn:hover {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #d698a1;
        }

        @media (max-width: 850px) {
            body {
                padding: 10px;
                padding-top: 70px;
                justify-content: flex-start;
            }
            h1 {
                font-size: 1.6em;
                text-align: center;
            }
            #controls {
                margin-bottom: 15px;
            }
            canvas {
                width: 95vw;
                height: 95vw;
            }
            .menu-btn {
                position: fixed;
                top: 15px;
                right: 15px;
                width: auto;
            }
        }
    </style>
</head>
<body>
    <a href="menu.html" class="menu-btn">メニューに戻る</a>


    <h1>ラングトンの蟻（反射移動）🐜💎</h1>
    <div id="controls">
        <button class="step-btn" data-steps="1">1ステップ進む</button>
        <button class="step-btn" data-steps="10">10ステップ進む</button>
        <button class="step-btn" data-steps="100">100ステップ進む</button>
        <button class="step-btn" data-steps="1000">1000ステップ進む</button>
        <button class="step-btn" data-steps="10000">10000ステップ進む</button>
        <button class="step-btn" data-steps="100000">100000ステップ進む</button>
    </div>
    <canvas id="antCanvas"></canvas>

    <script>
        const canvas = document.getElementById('antCanvas');
        const ctx = canvas.getContext('2d');

        // --- 設定 ---
        const GRID_WIDTH = 201; // グリッドの幅（奇数が中央配置に便利）
        const GRID_HEIGHT = 201; // グリッドの高さ
        const CELL_SIZE = 4;     // 1マスのピクセルサイズ
        const STEPS_PER_CLICK = 1000; // 1000ステップに変更

        const WHITE = 0;
        const BLACK = 1;

        // --- 状態 ---
        let grid;
        let ants = []; // 複数の蟻を保持する配列
        let totalSteps = 0;

        // --- 蟻の向き (0:上, 1:右, 2:下, 3:左) ---
        const UP = 0;
        const RIGHT = 1;
        const DOWN = 2;
        const LEFT = 3;

        // 初期化関数
        function init() {
            canvas.width = GRID_WIDTH * CELL_SIZE;
            canvas.height = GRID_HEIGHT * CELL_SIZE;

            // グリッドを白(0)で初期化
            grid = Array(GRID_HEIGHT).fill(0).map(() => Array(GRID_WIDTH).fill(WHITE));

            // 3匹の蟻をランダムな位置と向きで初期化
            const antColors = ['#FFFFFF', '#FFFFFF', '#FFFFFF']; // 蟻ごとの色を白に統一
            ants = [];
            for (let i = 0; i < 3; i++) {
                ants.push({
                    x: Math.floor(Math.random() * GRID_WIDTH),
                    y: Math.floor(Math.random() * GRID_HEIGHT),
                    dir: Math.floor(Math.random() * 4), // ランダムな初期向き
                    color: antColors[i]
                });
            }
            
            totalSteps = 0;
            draw();
        }

        // 描画関数
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // グリッドを描画
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    if (grid[y][x] === BLACK) {
                        ctx.fillStyle = '#da70d6'; // オーキッド
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }

            // 蟻を描画
            ants.forEach(ant => {
                // 蟻がグリッドの範囲内にいる場合のみ描画
                if (ant.x >= 0 && ant.x < GRID_WIDTH && ant.y >= 0 && ant.y < GRID_HEIGHT) {
                    ctx.fillStyle = '#9370db'; // パープル
                    ctx.fillRect(ant.x * CELL_SIZE, ant.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            });
        }

        // 蟻を1ステップ動かす関数
        function step(ant) {
            // 現在の座標を範囲内に収める
            ant.x = Math.max(0, Math.min(GRID_WIDTH - 1, ant.x));
            ant.y = Math.max(0, Math.min(GRID_HEIGHT - 1, ant.y));

            const currentCellColor = grid[ant.y][ant.x];

            if (currentCellColor === WHITE) {
                // 右に90度回転
                ant.dir = (ant.dir + 1) % 4;
                // マスの色を反転
                grid[ant.y][ant.x] = BLACK;
            } else { // BLACK
                // 左に90度回転
                ant.dir = (ant.dir + 3) % 4; // +3は-1と同じ
                // マスの色を反転
                grid[ant.y][ant.x] = WHITE;
            }

            // 次の移動先を計算
            let nextX = ant.x;
            let nextY = ant.y;
            switch (ant.dir) {
                case UP:    nextY--; break;
                case RIGHT: nextX++; break;
                case DOWN:  nextY++; break;
                case LEFT:  nextX--; break;
            }

            // 画面端の処理：反射させる
            if (nextX < 0) {
                ant.x = 0;
                ant.dir = RIGHT; // 右へ反射
            } else if (nextX >= GRID_WIDTH) {
                ant.x = GRID_WIDTH - 1;
                ant.dir = LEFT; // 左へ反射
            } else if (nextY < 0) {
                ant.y = 0;
                ant.dir = DOWN; // 下へ反射
            } else if (nextY >= GRID_HEIGHT) {
                ant.y = GRID_HEIGHT - 1;
                ant.dir = UP; // 上へ反射
            } else {
                // 範囲内の場合、移動
                ant.x = nextX;
                ant.y = nextY;
            }
        }

        // ボタンのクリックイベント
        document.querySelectorAll('.step-btn').forEach(button => {
            button.addEventListener('click', () => {
                const steps = parseInt(button.getAttribute('data-steps'));
                for (let i = 0; i < steps; i++) {
                    ants.forEach(ant => {
                        step(ant);
                    });
                }
                totalSteps += steps;
                draw();
            });
        });

        // 実行開始
        init();
    </script>

</body>
</html>
