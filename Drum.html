<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ランダム自動演奏！マイ音楽ライブ・ドラムマシン</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center font-sans relative select-none p-4">

    <a href="menu.html" style="position: absolute; top: 10px; right: 10px; font-size: 12px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000; border: 1px solid #ddd;">メニューに戻る</a>

    <div class="text-center p-6 bg-slate-900 rounded-3xl shadow-2xl border-2 border-slate-800 max-w-2xl w-full">
        <h1 class="text-3xl font-black mb-1 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 tracking-wider">
            🎤 LIVE DRUM MACHINE
        </h1>
        <p class="text-xs text-slate-400 mb-5 font-medium">お気に入りのMP3に合わせて、予測不可能な自動セッションを楽しもう！</p>

        <div class="bg-slate-950 p-4 rounded-2xl border border-indigo-500/30 mb-4 text-left shadow-lg shadow-indigo-950/20">
            <span class="text-xs font-bold text-indigo-400 block mb-2">💿 バックBGM（お好きなMP3を選択してね）</span>
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <input type="file" id="mp3-input" accept="audio/mp3" class="hidden" onchange="loadAudioFile(event)">
                <button onclick="document.getElementById('mp3-input').click()" class="bg-indigo-950 hover:bg-indigo-900 text-indigo-300 text-xs font-bold py-2 px-4 rounded-xl border border-indigo-500/40 cursor-pointer transition-colors text-center shrink-0">
                    🎵 MP3ファイルを開く
                </button>
                <div class="flex-1 flex items-center justify-between bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800 min-w-0">
                    <span id="file-name" class="text-xs text-slate-400 truncate pr-2 font-mono">音楽ファイルが選択されていません</span>
                    <audio id="bgm-player" class="hidden" controls onended="onBgmEnded()"></audio>
                    <button onclick="toggleBgm()" id="play-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-1 px-3 rounded-lg cursor-pointer transition-colors hidden shrink-0">
                        ▶️ 再生
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 mb-5 flex flex-col gap-3 text-left">
            <div class="flex items-center justify-between">
                <div>
                    <span class="text-xs font-bold text-cyan-400 block">🎲 曲にあわせてランダム自動演奏（セッション）</span>
                    <span class="text-[10px] text-slate-400">毎回たたく音がランダムに変化する、即興ドラムモード！</span>
                </div>
                <button onclick="toggleAutoPlay()" id="auto-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold py-1.5 px-4 rounded-full shadow-md cursor-pointer transition-colors shrink-0">
                    🎲 ランダム演奏スタート
                </button>
            </div>
            
            <div class="h-px bg-slate-800"></div>

            <div class="flex items-center justify-between">
                <div>
                    <span class="text-xs font-bold text-amber-400 block">🎮 音ゲー風・演奏サポートモード</span>
                    <span id="guide-step-text" class="text-[10px] text-slate-400">自分で叩く特訓をしたい時はこちら！キーが黄色く光るよ！</span>
                </div>
                <button onclick="toggleGuideMode()" id="guide-btn" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold py-1.5 px-4 rounded-full shadow-md cursor-pointer transition-colors shrink-0">
                    ガイドを開始
                </button>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-3 mb-6">
            <button onclick="userPlay(0)" id="pad-0" class="active:scale-95 transition-all bg-slate-950 h-36 rounded-xl flex flex-col items-center justify-between p-2.5 shadow-lg border-2 border-pink-500/30 cursor-pointer">
                <span class="text-[10px] font-black tracking-tighter text-pink-400 truncate w-full">KICK</span>
                <span id="key-badge-0" class="text-2xl font-black text-white bg-pink-600 w-11 h-11 flex items-center justify-center rounded-xl shadow-md border border-pink-400/40 font-mono transition-all">A</span>
                <span class="text-[9px] text-slate-500 font-bold">ドスン</span>
            </button>

            <button onclick="userPlay(1)" id="pad-1" class="active:scale-95 transition-all bg-slate-950 h-36 rounded-xl flex flex-col items-center justify-between p-2.5 shadow-lg border-2 border-purple-500/30 cursor-pointer">
                <span class="text-[10px] font-black tracking-tighter text-purple-400 truncate w-full">SNARE</span>
                <span id="key-badge-1" class="text-2xl font-black text-white bg-purple-600 w-11 h-11 flex items-center justify-center rounded-xl shadow-md border border-purple-400/40 font-mono transition-all">S</span>
                <span class="text-[9px] text-slate-500 font-bold">タンッ</span>
            </button>

            <button onclick="userPlay(2)" id="pad-2" class="active:scale-95 transition-all bg-slate-950 h-36 rounded-xl flex flex-col items-center justify-between p-2.5 shadow-lg border-2 border-cyan-500/30 cursor-pointer">
                <span class="text-[10px] font-black tracking-tighter text-cyan-400 truncate w-full">HAT (Cl)</span>
                <span id="key-badge-2" class="text-2xl font-black text-white bg-cyan-600 w-11 h-11 flex items-center justify-center rounded-xl shadow-md border border-cyan-400/40 font-mono transition-all">D</span>
                <span class="text-[9px] text-slate-500 font-bold">チッ</span>
            </button>

            <button onclick="userPlay(3)" id="pad-3" class="active:scale-95 transition-all bg-slate-950 h-36 rounded-xl flex flex-col items-center justify-between p-2.5 shadow-lg border-2 border-amber-500/30 cursor-pointer">
                <span class="text-[10px] font-black tracking-tighter text-amber-400 truncate w-full">HAT (Op)</span>
                <span id="key-badge-3" class="text-2xl font-black text-white bg-amber-600 w-11 h-11 flex items-center justify-center rounded-xl shadow-md border border-amber-400/40 font-mono transition-all">F</span>
                <span class="text-[9px] text-slate-500 font-bold">シャーン</span>
            </button>
        </div>

        <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800 text-left">
            <span class="text-[10px] font-bold text-slate-500 block mb-1.5 uppercase tracking-wider">🐾 叩いたキーの履歴（最新12個まで表示）</span>
            <div id="history-container" class="flex gap-2 h-9 items-center overflow-hidden px-1 font-mono">
                <span class="text-xs text-slate-600 italic">キーを叩く、または自動演奏がスタートすると履歴が流れるよ…！</span>
            </div>
        </div>
    </div>

    <style>
        @keyframes pulse-yellow {
            0%, 100% { background-color: #eab308; box-shadow: 0 0 15px #eab308; transform: scale(1); }
            50% { background-color: #fef08a; box-shadow: 0 0 25px #fef08a; transform: scale(1.1); }
        }
        .guide-active { animation: pulse-yellow 0.5s infinite; color: #000 !important; }
        @keyframes pop-in { 0% { transform: scale(0) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .history-badge { animation: pop-in 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        // ─── 🎵 MP3プレイヤーの処理 ───
        const bgmPlayer = document.getElementById('bgm-player');
        const fileNameSpan = document.getElementById('file-name');
        const playBtn = document.getElementById('play-btn');

        function loadAudioFile(event) {
            const file = event.target.files[0];
            if (file) {
                fileNameSpan.textContent = file.name;
                const fileURL = URL.createObjectURL(file);
                bgmPlayer.src = fileURL;
                playBtn.classList.remove('hidden');
                playBtn.textContent = "▶️ 再生";
            }
        }

        function toggleBgm() {
            initAudio();
            if (bgmPlayer.paused) {
                bgmPlayer.play();
                playBtn.textContent = "⏸️ 一時停止";
                playBtn.classList.replace('bg-indigo-600', 'bg-slate-700');
            } else {
                bgmPlayer.pause();
                playBtn.textContent = "▶️ 再生";
                playBtn.classList.replace('bg-slate-700', 'bg-indigo-600');
            }
        }

        function onBgmEnded() {
            playBtn.textContent = "▶️ 再生";
            playBtn.classList.replace('bg-slate-700', 'bg-indigo-600');
            if (isAutoPlaying) toggleAutoPlay();
        }


        // ─── 各ドラム音源（Aの周波数をご指定の【250】に完全固定！） ───
        function playKick() {
            initAudio();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(250, audioCtx.currentTime); // ご指定の250Hz！抜群に聞こえやすい！
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function playSnare() {
            initAudio();
            const bufferSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'highpass'; noiseFilter.frequency.value = 1000;
            const noiseGain = audioCtx.createGain(); noiseGain.gain.setValueAtTime(0.7, audioCtx.currentTime); noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(audioCtx.destination);

            const osc = audioCtx.createOscillator(); const oscGain = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(180, audioCtx.currentTime); oscGain.gain.setValueAtTime(0.5, audioCtx.currentTime); oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(oscGain); oscGain.connect(audioCtx.destination);
            noise.start(); osc.start(); noise.stop(audioCtx.currentTime + 0.2); osc.stop(audioCtx.currentTime + 0.2);
        }

        function playHihat() { initAudio(); playHatSource(0.05); }
        function playOpenHihat() { initAudio(); playHatSource(0.3); }

        function playHatSource(duration) {
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const source = audioCtx.createBufferSource(); source.buffer = buffer;
            const filter = originFilter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 10000; 
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.6, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            source.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            source.start(); source.stop(audioCtx.currentTime + duration);
        }


        // ─── 🎮 サポート＆ランダム自動演奏ロジック ───
        const proPattern = [0, 2, 1, 2, 0, 2, 1, 3]; 
        const patternNames = ["KICK (A)", "HAT (D)", "SNARE (S)", "HAT (D)", "KICK (A)", "HAT (D)", "SNARE (S)", "HAT Open (F)"];
        
        let isGuideMode = false;
        let currentGuideStep = 0;
        
        let isAutoPlaying = false;
        let autoPlayIntervalId = null;

        // 🎲 大改造：ランダム即興演奏モード
        function toggleAutoPlay() {
            initAudio();
            isAutoPlaying = !isAutoPlaying;
            const btn = document.getElementById('auto-btn');

            if (isAutoPlaying) {
                if (isGuideMode) toggleGuideMode();
                
                btn.textContent = "⏹️ ランダム演奏を停止";
                btn.classList.replace('bg-cyan-600', 'bg-slate-700');
                
                const bpm = 130; // ちょっとアップテンポにしてセッションを熱く！
                const stepTime = (60 / bpm / 2) * 1000; 

                autoPlayIntervalId = setInterval(() => {
                    // 💡 完全ランダムではなく、音楽的なドラムになりやすい確率でサイコロを振る！
                    const rand = Math.random();
                    let padIndex = 2; // 基本は一番多いハイハット(D)

                    if (rand < 0.25) {
                        padIndex = 0; // 25%の確率でバスドラム(A)
                    } else if (rand < 0.50) {
                        padIndex = 1; // さらに25%の確率でスネア(S)
                    } else if (rand < 0.90) {
                        padIndex = 2; // 40%の確率でクローズドハイハット(D)
                    } else {
                        padIndex = 3; // 残り10%の確率でここぞという時のオープンハイハット(F)
                    }
                    
                    triggerAudioAndHistory(padIndex);
                }, stepTime);
            } else {
                btn.textContent = "🎲 ランダム演奏スタート";
                btn.classList.replace('bg-slate-700', 'bg-cyan-600');
                clearInterval(autoPlayIntervalId);
            }
        }

        // ガイドモード
        function toggleGuideMode() {
            isGuideMode = !isGuideMode;
            const btn = document.getElementById('guide-btn');
            const text = document.getElementById('guide-step-text');
            clearAllGuideHighlights();

            if (isGuideMode) {
                if (isAutoPlaying) toggleAutoPlay();
                
                currentGuideStep = 0;
                btn.textContent = "⏹️ ガイド終了";
                btn.classList.replace('bg-amber-600', 'bg-slate-700');
                showNextGuide();
            } else {
                btn.textContent = "ガイドを開始";
                btn.classList.replace('bg-slate-700', 'bg-amber-600');
                text.textContent = "ガイドを開始すると、次に叩くキーが黄色く光るよ！";
            }
        }

        function showNextGuide() {
            if (!isGuideMode) return;
            clearAllGuideHighlights();
            const targetPadIndex = proPattern[currentGuideStep];
            const badge = document.getElementById(`key-badge-${targetPadIndex}`);
            const text = document.getElementById('guide-step-text');
            if (badge) badge.classList.add('guide-active');
            text.innerHTML = `曲に合わせて叩いてね 🎵 [${currentGuideStep + 1}/8]: <span class="text-amber-400 font-bold font-mono text-xs">${patternNames[currentGuideStep]}</span>`;
        }

        function clearAllGuideHighlights() {
            for (let i = 0; i < 4; i++) {
                const badge = document.getElementById(`key-badge-${i}`);
                if (badge) badge.classList.remove('guide-active');
            }
        }

        // ─── 🐾 キー履歴の追加ロジック ───
        const historyContainer = document.getElementById('history-container');
        let isFirstKey = true;

        function addKeyToHistory(keyChar, colorClass) {
            if (isFirstKey) {
                historyContainer.innerHTML = '';
                isFirstKey = false;
            }
            const badge = document.createElement('span');
            badge.className = `history-badge text-xs font-black px-2.5 py-1 rounded-md text-white shadow ${colorClass} shrink-0`;
            badge.textContent = keyChar.toUpperCase();
            historyContainer.appendChild(badge);

            if (historyContainer.children.length > 12) {
                historyContainer.removeChild(historyContainer.firstChild);
            }
        }

        function triggerAudioAndHistory(padIndex) {
            let keyChar = ''; let colorClass = '';
            if (padIndex === 0) { playKick(); keyChar = 'A'; colorClass = 'bg-pink-600'; }
            if (padIndex === 1) { playSnare(); keyChar = 'S'; colorClass = 'bg-purple-600'; }
            if (padIndex === 2) { playHihat(); keyChar = 'D'; colorClass = 'bg-cyan-600'; }
            if (padIndex === 3) { playOpenHihat(); keyChar = 'F'; colorClass = 'bg-amber-600'; }

            addKeyToHistory(keyChar, colorClass);

            const borderColors = ['border-pink-400', 'border-purple-400', 'border-cyan-400', 'border-amber-400'];
            const bgColors = ['bg-pink-500/20', 'bg-purple-500/20', 'bg-cyan-500/20', 'bg-amber-500/20'];
            triggerVisualFeedback(padIndex, bgColors[padIndex], borderColors[padIndex]);
        }

        function userPlay(padIndex) {
            triggerAudioAndHistory(padIndex);

            if (isGuideMode) {
                const expectedPadIndex = proPattern[currentGuideStep];
                if (padIndex === expectedPadIndex) {
                    currentGuideStep = (currentGuideStep + 1) % proPattern.length;
                    showNextGuide();
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            switch(e.key.toLowerCase()) {
                case 'a': userPlay(0); break;
                case 's': userPlay(1); break;
                case 'd': userPlay(2); break;
                case 'f': userPlay(3); break;
            }
        });

        function triggerVisualFeedback(index, bgColor, borderColor) {
            const pad = document.getElementById(`pad-${index}`);
            if (pad) {
                pad.classList.add('scale-95', bgColor, borderColor);
                pad.classList.remove('border-pink-500/30', 'border-purple-500/30', 'border-cyan-500/30', 'border-amber-500/30');
                setTimeout(() => {
                    pad.classList.remove('scale-95', bgColor, borderColor);
                    const originalBorders = ['border-pink-500/30', 'border-purple-500/30', 'border-cyan-500/30', 'border-amber-500/30'];
                    pad.classList.add(originalBorders[index]);
                }, 80);
            }
        }
    </script>
</body>
</html>
