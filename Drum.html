<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易ドラム演奏シミュレーター</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Noto+Serif+JP:wght@500;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .font-elegant { font-family: 'Cormorant Garamond', 'Noto Serif JP', serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-zinc-50 via-stone-100 to-zinc-100 text-stone-700 min-h-screen flex flex-col items-center justify-center relative select-none p-4">

    <a href="menu.html" style="position: absolute; top: 10px; right: 10px; font-size: 11px; color: #71716a; text-decoration: none; background: rgba(255,255,255,0.9); padding: 5px 12px; border-radius: 9999px; z-index: 1000; border: 1px solid #e4e4e7; font-weight: 500; letter-spacing: 0.05em; shadow: 0 2px 4px rgba(0,0,0,0.02);">メニューに戻る</a>

    <div class="text-center p-8 bg-white/90 backdrop-blur-md rounded-3xl shadow-[0_20px_40px_rgba(165,165,150,0.15)] border border-stone-200/60 max-w-2xl w-full">
        <h1 class="text-3xl font-elegant font-black mb-1 text-transparent bg-clip-text bg-gradient-to-r from-rose-400 via-purple-400 to-amber-500 tracking-widest">
            簡易ドラム演奏シミュレーター
        </h1>
        <p class="text-[11px] text-stone-400 mb-6 tracking-wide font-medium">明るい光に満ちたテラスで、あなただけの美しいリズムを。</p>

        <div class="bg-rose-50/30 p-4 rounded-2xl border border-rose-200/40 mb-5 text-left shadow-inner">
            <span class="text-[11px] font-bold text-rose-400/90 block mb-2 tracking-wider">💿 Background BGM</span>
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <input type="file" id="mp3-input" accept="audio/mp3" class="hidden" onchange="loadAudioFile(event)">
                <button onclick="document.getElementById('mp3-input').click()" class="bg-white hover:bg-stone-50 text-rose-400 text-xs font-semibold py-2 px-4 rounded-xl border border-rose-200 cursor-pointer transition-all duration-300 text-center shrink-0 tracking-wide shadow-sm">
                    音楽ファイルを選択
                </button>
                <div class="flex-1 flex items-center justify-between bg-stone-100/60 px-3 py-1.5 rounded-xl border border-stone-200 min-w-0">
                    <span id="file-name" class="text-xs text-stone-400 truncate pr-2 font-mono">Select your favorite track...</span>
                    <audio id="bgm-player" class="hidden" controls onended="onBgmEnded()"></audio>
                    <button onclick="toggleBgm()" id="play-btn" class="bg-rose-400 hover:bg-rose-500 text-white text-xs font-bold py-1 px-4 rounded-lg cursor-pointer transition-colors duration-300 hidden shrink-0 shadow-sm">
                        Play
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-stone-50/60 p-4 rounded-2xl border border-stone-200/60 mb-5 flex flex-col gap-3 text-left">
            <div class="flex items-center justify-between">
                <div>
                    <span class="text-xs font-bold text-amber-600/90 block tracking-wide">✨ 即興ランダムセッション</span>
                    <span class="text-[10px] text-stone-400">心地よい気まぐれなリズムを自動で紡ぎます</span>
                </div>
                <button onclick="toggleAutoPlay()" id="auto-btn" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold py-1.5 px-4 rounded-full shadow-sm cursor-pointer transition-all duration-300 shrink-0 tracking-wide border border-amber-300/30">
                    Session Start
                </button>
            </div>
            
            <div class="h-px bg-stone-200/60"></div>

            <div class="flex items-center justify-between">
                <div>
                    <span class="text-xs font-bold text-purple-600/80 block tracking-wide">🎮 ナビゲーション・エスコート</span>
                    <span id="guide-step-text" class="text-[10px] text-stone-400">次にエスコートするキーが、優しくルビー色に瞬きます</span>
                </div>
                <button onclick="toggleGuideMode()" id="guide-btn" class="bg-purple-400 hover:bg-purple-500 text-white text-xs font-semibold py-1.5 px-4 rounded-full shadow-sm cursor-pointer transition-all duration-300 shrink-0 tracking-wide border border-purple-300/30">
                    Guide Start
                </button>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-3 mb-6">
            <!-- バスドラム：シマーローズ -->
            <button onclick="userPlay(0)" id="pad-0" class="active:scale-95 transition-all duration-200 bg-white h-36 rounded-xl flex flex-col items-center justify-between p-2.5 shadow-[0_4px_12px_rgba(0,0,0,0.03)] border border-rose-200/60 cursor-pointer">
                <span class="text-[9px] font-bold tracking-widest text-rose-400">KICK</span>
                <span id="key-badge-0" class="text-xl font-bold text-white bg-rose-400 w-11 h-11 flex items-center justify-center rounded-xl shadow-[0_4px_10px_rgba(244,63,94,0.2)] font-mono transition-all duration-300">A</span>
                <span class="text-[9px] text-stone-400 font-medium tracking-wider">Deep</span>
            </button>

            <!-- スネア：クラシックラベンダー -->
            <button onclick="userPlay(1)" id="pad-1" class="active:scale-95 transition-all duration-200 bg-white h-36 rounded-xl flex flex-col items-center justify-between p-2.5 shadow-[0_4px_12px_rgba(0,0,0,0.03)] border border-purple-200/60 cursor-pointer">
                <span class="text-[9px] font-bold tracking-widest text-purple-400">SNARE</span>
                <span id="key-badge-1" class="text-xl font-bold text-white bg-purple-400 w-11 h-11 flex items-center justify-center rounded-xl shadow-[0_4px_10px_rgba(192,132,252,0.2)] font-mono transition-all duration-300">S</span>
                <span class="text-[9px] text-stone-400 font-medium tracking-wider">Light</span>
            </button>

            <!-- クローズド・ハイハット：ニュアンスリネン -->
            <button onclick="userPlay(2)" id="pad-2" class="active:scale-95 transition-all duration-200 bg-white h-36 rounded-xl flex flex-col items-center justify-between p-2.5 shadow-[0_4px_12px_rgba(0,0,0,0.03)] border border-stone-200 cursor-pointer">
                <span class="text-[9px] font-bold tracking-widest text-stone-400">HI-HAT</span>
                <span id="key-badge-2" class="text-xl font-bold text-white bg-stone-400 w-11 h-11 flex items-center justify-center rounded-xl shadow-[0_4px_10px_rgba(120,113,108,0.2)] font-mono transition-all duration-300">D</span>
                <span class="text-[9px] text-stone-400 font-medium tracking-wider">Crisp</span>
            </button>

            <!-- オープン・ハイハット：シャンパンハニー -->
            <button onclick="userPlay(3)" id="pad-3" class="active:scale-95 transition-all duration-200 bg-white h-36 rounded-xl flex flex-col items-center justify-between p-2.5 shadow-[0_4px_12px_rgba(0,0,0,0.03)] border border-amber-200 cursor-pointer">
                <span class="text-[9px] font-bold tracking-widest text-amber-500">OPEN</span>
                <span id="key-badge-3" class="text-xl font-bold text-white bg-amber-400 w-11 h-11 flex items-center justify-center rounded-xl shadow-[0_4px_10px_rgba(251,191,36,0.2)] font-mono transition-all duration-300">F</span>
                <span class="text-[9px] text-stone-400 font-medium tracking-wider">Gloss</span>
            </button>
        </div>

        <div class="bg-stone-50 p-3 rounded-2xl border border-stone-200/80 text-left shadow-inner">
            <span class="text-[9px] font-bold text-stone-400 block mb-1.5 uppercase tracking-widest">🐾 Rhythm Log</span>
            <div id="history-container" class="flex gap-2 h-9 items-center overflow-hidden px-1 font-mono">
                <span class="text-xs text-stone-400 italic tracking-wide font-sans">音を奏でると、ここに美しい足跡が残ります…</span>
            </div>
        </div>
    </div>

    <style>
        @keyframes pulse-ruby {
            0%, 100% { background-color: #be123c; box-shadow: 0 0 15px rgba(225, 29, 72, 0.4); color: #fff; transform: scale(1); }
            50% { background-color: #f43f5e; box-shadow: 0 0 25px rgba(244, 63, 94, 0.6); color: #fff; transform: scale(1.08); }
        }
        .guide-active { animation: pulse-ruby 0.6s infinite; }
        @keyframes pop-in { 0% { transform: scale(0.6) translateY(5px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .history-badge { animation: pop-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; letter-spacing: normal; }
    </style>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

        // ─── 🎵 MP3プレイヤーの処理 ───
        const bgmPlayer = document.getElementById('bgm-player');
        const fileNameSpan = document.getElementById('file-name');
        const playBtn = document.getElementById('play-btn');

        function loadAudioFile(event) {
            const file = event.target.files[0];
            if (file) {
                fileNameSpan.textContent = file.name;
                const fileURL = URL.createObjectURL(file);
                bgmPlayer.src = fileURL;
                playBtn.classList.remove('hidden');
                playBtn.textContent = "Play";
            }
        }

        function toggleBgm() {
            initAudio();
            if (bgmPlayer.paused) {
                bgmPlayer.play();
                playBtn.textContent = "Pause";
                playBtn.classList.replace('bg-rose-400', 'bg-stone-400');
            } else {
                bgmPlayer.pause();
                playBtn.textContent = "Play";
                playBtn.classList.replace('bg-stone-400', 'bg-rose-400');
            }
        }

        function onBgmEnded() {
            playBtn.textContent = "Play";
            playBtn.classList.replace('bg-stone-400', 'bg-rose-400');
            if (isAutoPlaying) toggleAutoPlay();
        }


        // ─── 各ドラム音源（Aの周波数はご指定の【250】にしっかり固定！） ───
        function playKick() {
            initAudio();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(250, audioCtx.currentTime); // クリアで抜けの良い250Hz
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function playSnare() {
            initAudio();
            const bufferSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'highpass'; noiseFilter.frequency.value = 1200;
            const noiseGain = audioCtx.createGain(); noiseGain.gain.setValueAtTime(0.6, audioCtx.currentTime); noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(audioCtx.destination);

            const osc = audioCtx.createOscillator(); const oscGain = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(180, audioCtx.currentTime); oscGain.gain.setValueAtTime(0.4, audioCtx.currentTime); oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(oscGain); oscGain.connect(audioCtx.destination);
            noise.start(); osc.start(); noise.stop(audioCtx.currentTime + 0.2); osc.stop(audioCtx.currentTime + 0.2);
        }

        function playHihat() { initAudio(); playHatSource(0.04); }
        function playOpenHihat() { initAudio(); playHatSource(0.25); }

        function playHatSource(duration) {
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const source = audioCtx.createBufferSource(); source.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 11000; 
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            source.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            source.start(); source.stop(audioCtx.currentTime + duration);
        }


        // ─── 🎮 サポート＆ランダム演奏ロジック ───
        const proPattern = [0, 2, 1, 2, 0, 2, 1, 3]; 
        const patternNames = ["KICK (A)", "HAT (D)", "SNARE (S)", "HAT (D)", "KICK (A)", "HAT (D)", "SNARE (S)", "HAT Open (F)"];
        
        let isGuideMode = false;
        let currentGuideStep = 0;
        
        let isAutoPlaying = false;
        let autoPlayIntervalId = null;

        // 🎲 気まぐれランダムセッション
        function toggleAutoPlay() {
            initAudio();
            isAutoPlaying = !isAutoPlaying;
            const btn = document.getElementById('auto-btn');

            if (isAutoPlaying) {
                if (isGuideMode) toggleGuideMode();
                
                btn.textContent = "Stop Session";
                btn.classList.replace('bg-amber-500', 'bg-stone-400');
                
                const bpm = 126; 
                const stepTime = (60 / bpm / 2) * 1000; 

                autoPlayIntervalId = setInterval(() => {
                    const rand = Math.random();
                    let padIndex = 2;

                    if (rand < 0.23) {
                        padIndex = 0; 
                    } else if (rand < 0.46) {
                        padIndex = 1; 
                    } else if (rand < 0.88) {
                        padIndex = 2; 
                    } else {
                        padIndex = 3; 
                    }
                    
                    triggerAudioAndHistory(padIndex);
                }, stepTime);
            } else {
                btn.textContent = "Session Start";
                btn.classList.replace('bg-stone-400', 'bg-amber-500');
                clearInterval(autoPlayIntervalId);
            }
        }

        // ガイドモード
        function toggleGuideMode() {
            isGuideMode = !isGuideMode;
            const btn = document.getElementById('guide-btn');
            const text = document.getElementById('guide-step-text');
            clearAllGuideHighlights();

            if (isGuideMode) {
                if (isAutoPlaying) toggleAutoPlay();
                
                currentGuideStep = 0;
                btn.textContent = "Stop Guide";
                btn.classList.replace('bg-purple-400', 'bg-stone-400');
                showNextGuide();
            } else {
                btn.textContent = "Guide Start";
                btn.classList.replace('bg-stone-400', 'bg-purple-400');
                text.textContent = "次にエスコートするキーが、優しくルビー色に瞬きます";
            }
        }

        function showNextGuide() {
            if (!isGuideMode) return;
            clearAllGuideHighlights();
            const targetPadIndex = proPattern[currentGuideStep];
            const badge = document.getElementById(`key-badge-${targetPadIndex}`);
            const text = document.getElementById('guide-step-text');
            if (badge) badge.classList.add('guide-active');
            text.innerHTML = `Let's play ✨ [${currentGuideStep + 1}/8]: <span class="text-rose-400 font-bold font-mono text-xs">${patternNames[currentGuideStep]}</span>`;
        }

        function clearAllGuideHighlights() {
            for (let i = 0; i < 4; i++) {
                const badge = document.getElementById(`key-badge-${i}`);
                if (badge) badge.classList.remove('guide-active');
            }
        }

        // ─── 🐾 キー履歴の追加 ───
        const historyContainer = document.getElementById('history-container');
        let isFirstKey = true;

        function addKeyToHistory(keyChar, colorClass) {
            if (isFirstKey) {
                historyContainer.innerHTML = '';
                isFirstKey = false;
            }
            const badge = document.createElement('span');
            badge.className = `history-badge text-[10px] font-bold px-2.5 py-0.5 rounded-full text-white shadow-sm ${colorClass} shrink-0 border border-white/20`;
            badge.textContent = keyChar.toUpperCase();
            historyContainer.appendChild(badge);

            if (historyContainer.children.length > 12) {
                historyContainer.removeChild(historyContainer.firstChild);
            }
        }

        function triggerAudioAndHistory(padIndex) {
            let keyChar = ''; let colorClass = '';
            if (padIndex === 0) { playKick(); keyChar = 'A'; colorClass = 'bg-rose-400'; }
            if (padIndex === 1) { playSnare(); keyChar = 'S'; colorClass = 'bg-purple-400'; }
            if (padIndex === 2) { playHihat(); keyChar = 'D'; colorClass = 'bg-stone-400'; }
            if (padIndex === 3) { playOpenHihat(); keyChar = 'F'; colorClass = 'bg-amber-400'; }

            addKeyToHistory(keyChar, colorClass);

            const borderColors = ['border-rose-400', 'border-purple-400', 'border-stone-400', 'border-amber-400'];
            const bgColors = ['bg-rose-50', 'bg-purple-50', 'bg-stone-50', 'bg-amber-50'];
            triggerVisualFeedback(padIndex, bgColors[padIndex], borderColors[padIndex]);
        }

        function userPlay(padIndex) {
            triggerAudioAndHistory(padIndex);

            if (isGuideMode) {
                const expectedPadIndex = proPattern[currentGuideStep];
                if (padIndex === expectedPadIndex) {
                    currentGuideStep = (currentGuideStep + 1) % proPattern.length;
                    showNextGuide();
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            switch(e.key.toLowerCase()) {
                case 'a': userPlay(0); break;
                case 's': userPlay(1); break;
                case 'd': userPlay(2); break;
                case 'f': userPlay(3); break;
            }
        });

        function triggerVisualFeedback(index, bgColor, borderColor) {
            const pad = document.getElementById(`pad-${index}`);
            if (pad) {
                pad.classList.add('scale-95', bgColor, borderColor);
                pad.classList.remove('border-rose-200/60', 'border-purple-200/60', 'border-stone-200', 'border-amber-200');
                setTimeout(() => {
                    pad.classList.remove('scale-95', bgColor, borderColor);
                    const originalBorders = ['border-rose-200/60', 'border-purple-200/60', 'border-stone-200', 'border-amber-200'];
                    pad.classList.add(originalBorders[index]);
                }, 100);
            }
        }
    </script>
</body>
</html>
