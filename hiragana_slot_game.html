<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>50音スロット単語合わせゲーム</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --success: #10b981;
    --danger: #ef4444;
    --bg-dark: #1e1b4b;
    --panel-bg: #ffffff;
    --reel-bg: #f8fafc;
    --gold: #f59e0b;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    background: radial-gradient(circle at center, #2e1065 0%, #0f172a 100%);
    color: #334155;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
  }

  .container {
    width: 100%;
    max-width: 650px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(245, 158, 11, 0.2);
    overflow: hidden;
    border: 4px solid #312e81;
  }

  .header {
    background: linear-gradient(135deg, #312e81 0%, #4338ca 100%);
    color: #ffffff;
    padding: 20px;
    text-align: center;
    border-bottom: 3px solid #f59e0b;
  }

  .header h1 {
    font-size: 24px;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    margin-bottom: 4px;
  }

  .header p {
    font-size: 13px;
    color: #c7d2fe;
  }

  .main-box {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }

  /* コントロール（設定部分） */
  .controls {
    display: flex;
    gap: 15px;
    align-items: center;
    justify-content: center;
    width: 100%;
    background: #f1f5f9;
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid #cbd5e1;
    flex-wrap: wrap;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: bold;
    color: #1e293b;
  }

  .control-group select {
    font-size: 15px;
    padding: 6px 12px;
    border-radius: 8px;
    border: 2px solid #6366f1;
    background: white;
    font-weight: bold;
    color: #1e293b;
    cursor: pointer;
    outline: none;
  }

  /* スロットマシン本体の装飾 */
  .slot-machine-casing {
    width: 100%;
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    padding: 25px 15px;
    border-radius: 16px;
    border: 4px solid #475569;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 8px 16px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* 位置ズレ防止用：リールエリアの高さを固定 */
  .reel-container {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 126px; /* 固定高さで縦ブレを防止 */
  }

  .reel-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .reel-window {
    width: 70px;
    height: 80px;
    background: var(--reel-bg);
    border: 3px solid #f59e0b;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 4px 6px rgba(0,0,0,0.3);
  }

  .reel-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  .reel-char {
    height: 80px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 42px;
    font-weight: bold;
    color: #0f172a;
  }

  .stop-btn {
    width: 70px;
    height: 38px;
    background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #991b1b, 0 5px 8px rgba(0,0,0,0.3);
    transition: all 0.1s;
  }

  .stop-btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #991b1b;
  }

  .stop-btn:disabled {
    background: #64748b;
    box-shadow: 0 4px 0 #334155;
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* 位置ズレ防止用：操作ボタンエリアの高さ固定 */
  .action-area {
    display: flex;
    gap: 15px;
    width: 100%;
    justify-content: center;
    height: 50px;
  }

  .start-lever-btn {
    flex: 1;
    max-width: 200px;
    height: 50px;
    background: linear-gradient(180deg, #10b981 0%, #059669 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 0 #047857, 0 6px 10px rgba(0,0,0,0.3);
    transition: all 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .start-lever-btn:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #047857;
  }

  .start-lever-btn:disabled {
    background: #64748b;
    box-shadow: 0 5px 0 #334155;
    cursor: not-allowed;
    opacity: 0.6;
  }

  .all-stop-btn {
    flex: 1;
    max-width: 150px;
    height: 50px;
    background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 0 #b45309, 0 6px 10px rgba(0,0,0,0.3);
    transition: all 0.1s;
  }

  .all-stop-btn:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #b45309;
  }

  .all-stop-btn:disabled {
    background: #64748b;
    box-shadow: 0 5px 0 #334155;
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* 位置ズレ防止用：結果表示表示エリアの高さ固定 */
  .result-display {
    width: 100%;
    height: 140px; /* 固定高さによりテキスト変更時のボタン位置ズレを完全に防止 */
    background: #f8fafc;
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    align-items: center;
  }

  .result-word {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #1e293b;
    height: 48px;
    line-height: 48px;
  }

  .status-message {
    font-size: 15px;
    font-weight: bold;
    color: #64748b;
    height: 24px;
    line-height: 24px;
  }

  .status-message.success {
    color: #059669;
  }

  .status-message.fail {
    color: #dc2626;
  }

  .link-container {
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dict-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 16px;
    background: #e0e7ff;
    color: #3730a3;
    text-decoration: none;
    font-weight: bold;
    font-size: 13px;
    border-radius: 20px;
    transition: background 0.2s;
  }

  .dict-link:hover {
    background: #c7d2fe;
  }

  /* ログ表示エリア */
  .log-section {
    width: 100%;
    background: #f8fafc;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #cbd5e1;
    padding-bottom: 8px;
  }

  .log-header h2 {
    font-size: 16px;
    color: #1e293b;
  }

  .clear-log-btn {
    font-size: 12px;
    padding: 4px 8px;
    background: #e2e8f0;
    color: #475569;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }

  .clear-log-btn:hover {
    background: #cbd5e1;
  }

  /* 位置ズレ防止用：ログ件数が0〜4件でも最初から固定の高さを確保 */
  .log-table-wrapper {
    height: 180px; /* 最初から約4行分の高さを固定確保し、ログ追加時の位置ズレを防止 */
    overflow-y: auto;
    user-select: text;
  }

  .log-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    text-align: left;
  }

  .log-table th, .log-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #e2e8f0;
  }

  .log-table th {
    background: #f1f5f9;
    color: #475569;
    font-weight: bold;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  .badge-success {
    color: #059669;
    font-weight: bold;
  }

  .badge-fail {
    color: #dc2626;
    font-weight: bold;
  }

  .table-link {
    color: #4f46e5;
    text-decoration: underline;
  }

  /* 演出アニメーション */
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .success-anim {
    animation: pulse 0.5s ease-in-out 2;
  }
</style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

<a href="menu.html" style="position: absolute; top: 15px; right: 20px; font-size: 12px; color: #333; text-decoration: none; background: rgba(255,255,255,0.9); padding: 6px 12px; border-radius: 6px; z-index: 1000; border: 1px solid #ccc; font-weight: bold;">メニューに戻る</a>

  <!-- 右上メニューに戻るボタン -->
  <a href="menu.html" class="back-link">メニューに戻る</a>

<div class="container">
  <div class="header">
    <h1>🎰 50音スロット言葉合わせ</h1>
    <p>揃った言葉が日本語（Wiktionary）にあるか判定！</p>
  </div>

  <div class="main-box">
    <!-- 設定 -->
    <div class="controls">
      <div class="control-group">
        <label for="charCount">文字数:</label>
        <select id="charCount">
          <option value="2">2文字</option>
          <option value="3">3文字</option>
          <option value="4">4文字</option>
          <option value="5">5文字</option>
        </select>
      </div>

      <div class="control-group">
        <label for="spinSpeed">スピード:</label>
        <select id="spinSpeed">
          <option value="4">低速</option>
          <option value="8" selected>中速</option>
          <option value="16">高速</option>
        </select>
      </div>
    </div>

    <!-- スロット筐体 -->
    <div class="slot-machine-casing">
      <!-- リール表示部 -->
      <div class="reel-container" id="reelContainer"></div>

      <!-- 操作ボタン部 -->
      <div class="action-area">
        <button id="startBtn" class="start-lever-btn">
          <span>🎰 スタート</span>
        </button>
        <button id="allStopBtn" class="all-stop-btn" disabled>一括 STOP</button>
      </div>
    </div>

    <!-- 結果表示エリア -->
    <div class="result-display">
      <div class="result-word" id="resultWord">--</div>
      <div class="status-message" id="statusMessage">「スタート」を押してね！</div>
      <div class="link-container" id="linkContainer"></div>
    </div>

    <!-- 判定ログ表示エリア（位置ズレ防止のため高さをあらかじめ確保） -->
    <div class="log-section">
      <div class="log-header">
        <h2>📋 判定ログ一覧</h2>
        <button id="clearLogBtn" class="clear-log-btn">ログ消去</button>
      </div>
      <div class="log-table-wrapper">
        <table class="log-table">
          <thead>
            <tr>
              <th style="width: 30%;">文字</th>
              <th style="width: 30%;">判定</th>
              <th style="width: 40%;">Wiktionary URL</th>
            </tr>
          </thead>
          <tbody id="logTbody">
            <!-- JavaScriptでここにログ行が挿入されます -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// 基本の50音リスト（あいうえお順）
const HIRAGANA_LIST = [
  'あ','い','う','え','お',
  'か','き','く','け','こ',
  'さ','し','す','せ','そ',
  'た','ち','つ','て','と',
  'な','に','ぬ','ね','の',
  'は','ひ','ふ','へ','ほ',
  'ま','み','む','め','も',
  'や','ゆ','よ',
  'ら','り','る','れ','ろ',
  'わ','を','ん'
];

const ITEM_HEIGHT = 80; // 各文字の高さ80px

// DOM要素
const charCountSelect = document.getElementById('charCount');
const spinSpeedSelect = document.getElementById('spinSpeed');
const reelContainer = document.getElementById('reelContainer');
const startBtn = document.getElementById('startBtn');
const allStopBtn = document.getElementById('allStopBtn');
const resultWordEl = document.getElementById('resultWord');
const statusMessageEl = document.getElementById('statusMessage');
const linkContainerEl = document.getElementById('linkContainer');
const logTbody = document.getElementById('logTbody');
const clearLogBtn = document.getElementById('clearLogBtn');

// アプリの状態
let numReels = 2;
let currentSpeed = 8;
let reels = [];

// LocalStorage キー
const STORAGE_CHAR_KEY = 'slot_game_char_count';
const STORAGE_SPEED_KEY = 'slot_game_spin_speed';

// Web Audio API（効果音）
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'start') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'stop') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(220, now + 0.05);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'win') {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const noteOsc = audioCtx.createOscillator();
        const noteGain = audioCtx.createGain();
        noteOsc.connect(noteGain);
        noteGain.connect(audioCtx.destination);
        noteOsc.type = 'sine';
        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
        noteGain.gain.setValueAtTime(0.2, now + idx * 0.1);
        noteGain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
        noteOsc.start(now + idx * 0.1);
        noteOsc.stop(now + idx * 0.1 + 0.2);
      });
    }
  } catch(e) {}
}

// 設定の読み込みと保存
function loadSavedSettings() {
  const savedChar = localStorage.getItem(STORAGE_CHAR_KEY);
  if (savedChar && ['2','3','4','5'].includes(savedChar)) {
    charCountSelect.value = savedChar;
  }

  const savedSpeed = localStorage.getItem(STORAGE_SPEED_KEY);
  if (savedSpeed && ['4','8','16'].includes(savedSpeed)) {
    spinSpeedSelect.value = savedSpeed;
  }

  numReels = parseInt(charCountSelect.value, 10);
  currentSpeed = parseInt(spinSpeedSelect.value, 10);
}

function saveSettings() {
  localStorage.setItem(STORAGE_CHAR_KEY, charCountSelect.value);
  localStorage.setItem(STORAGE_SPEED_KEY, spinSpeedSelect.value);
}

// リールの初期化・構築
function createReels() {
  numReels = parseInt(charCountSelect.value, 10);
  currentSpeed = parseInt(spinSpeedSelect.value, 10);
  saveSettings();

  reelContainer.innerHTML = '';
  reels = [];

  for (let i = 0; i < numReels; i++) {
    const col = document.createElement('div');
    col.className = 'reel-column';

    const windowEl = document.createElement('div');
    windowEl.className = 'reel-window';

    const innerEl = document.createElement('div');
    innerEl.className = 'reel-inner';

    const list = [...HIRAGANA_LIST, ...HIRAGANA_LIST];
    list.forEach(char => {
      const charEl = document.createElement('div');
      charEl.className = 'reel-char';
      charEl.textContent = char;
      innerEl.appendChild(charEl);
    });

    windowEl.appendChild(innerEl);

    const stopBtn = document.createElement('button');
    stopBtn.className = 'stop-btn';
    stopBtn.textContent = 'STOP';
    stopBtn.disabled = true;
    stopBtn.addEventListener('click', () => stopReel(i));

    col.appendChild(windowEl);
    col.appendChild(stopBtn);
    reelContainer.appendChild(col);

    reels.push({
      innerEl,
      stopBtn,
      position: 0,
      isSpinning: false,
      stoppedChar: 'あ',
      timer: null
    });
  }

  updateWordDisplay();
}

// リールアニメーション
function spinReel(index) {
  const reel = reels[index];
  if (!reel.isSpinning) return;

  reel.position += currentSpeed;
  const maxPos = HIRAGANA_LIST.length * ITEM_HEIGHT;
  if (reel.position >= maxPos) {
    reel.position %= maxPos;
  }

  reel.innerEl.style.transform = `translateY(-${reel.position}px)`;
  reel.timer = requestAnimationFrame(() => spinReel(index));
}

// スロットスタート
function startSlot() {
  initAudio();
  playSound('start');

  startBtn.disabled = true;
  charCountSelect.disabled = true;
  spinSpeedSelect.disabled = true;
  allStopBtn.disabled = false;
  
  resultWordEl.classList.remove('success-anim');
  statusMessageEl.className = 'status-message';
  statusMessageEl.textContent = 'STOPボタンを押してね！';
  linkContainerEl.innerHTML = '';

  reels.forEach((reel, i) => {
    reel.position = Math.floor(Math.random() * HIRAGANA_LIST.length) * ITEM_HEIGHT;
    reel.isSpinning = true;
    reel.stopBtn.disabled = false;
    spinReel(i);
  });

  updateWordDisplay();
}

// 特定のリールをストップ
function stopReel(index) {
  const reel = reels[index];
  if (!reel.isSpinning) return;

  playSound('stop');
  reel.isSpinning = false;
  reel.stopBtn.disabled = true;
  if (reel.timer) cancelAnimationFrame(reel.timer);

  const charIndex = Math.round(reel.position / ITEM_HEIGHT) % HIRAGANA_LIST.length;
  reel.position = charIndex * ITEM_HEIGHT;
  reel.innerEl.style.transform = `translateY(-${reel.position}px)`;
  reel.stoppedChar = HIRAGANA_LIST[charIndex];

  updateWordDisplay();

  const allStopped = reels.every(r => !r.isSpinning);
  if (allStopped) {
    onAllStopped();
  }
}

// 一括ストップ
function stopAllReels() {
  reels.forEach((reel, i) => {
    if (reel.isSpinning) {
      stopReel(i);
    }
  });
}

// 画面中央の表示更新
function updateWordDisplay() {
  const currentWord = reels.map(r => r.stoppedChar).join('');
  resultWordEl.textContent = currentWord;
}

// 全リール停止後の処理
async function onAllStopped() {
  allStopBtn.disabled = true;
  startBtn.disabled = false;
  charCountSelect.disabled = false;
  spinSpeedSelect.disabled = false;

  const finalWord = reels.map(r => r.stoppedChar).join('');
  resultWordEl.textContent = finalWord;

  statusMessageEl.textContent = 'Wiktionaryで判定中...';

  const isValid = await checkWordWithWiktionary(finalWord);
  const dictUrl = `https://ja.wiktionary.org/wiki/${encodeURIComponent(finalWord)}`;

  if (isValid) {
    playSound('win');
    statusMessageEl.className = 'status-message success';
    statusMessageEl.textContent = '🎉 「' + finalWord + '」は実在する言葉です！';
    resultWordEl.classList.add('success-anim');
  } else {
    statusMessageEl.className = 'status-message fail';
    statusMessageEl.textContent = '❌ 「' + finalWord + '」は辞書に見つかりませんでした';
  }

  // リンク表示
  linkContainerEl.innerHTML = `
    <a href="${dictUrl}" target="_blank" rel="noopener noreferrer" class="dict-link">
      📖 Wiktionaryで「${finalWord}」を確認する ↗
    </a>
  `;

  // ログ追加（最新が上）
  addLogEntry(finalWord, isValid, dictUrl);
}

// Wiktionary API 判定
async function checkWordWithWiktionary(word) {
  const url = `https://ja.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&format=json&origin=*`;

  try {
    const response = await fetch(url);
    const data = await response.json();
    const pages = data.query.pages;
    const pageId = Object.keys(pages)[0];

    return pageId !== "-1";
  } catch (error) {
    console.error("APIエラー:", error);
    return false;
  }
}

// ログに結果を追加
function addLogEntry(word, isValid, url) {
  const tr = document.createElement('tr');
  
  const tdWord = document.createElement('td');
  tdWord.style.fontWeight = 'bold';
  tdWord.textContent = word;

  const tdStatus = document.createElement('td');
  if (isValid) {
    tdStatus.className = 'badge-success';
    tdStatus.textContent = '⭕ 存在する';
  } else {
    tdStatus.className = 'badge-fail';
    tdStatus.textContent = '❌ なし';
  }

  const tdUrl = document.createElement('td');
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.className = 'table-link';
  a.textContent = 'リンク';
  tdUrl.appendChild(a);

  tr.appendChild(tdWord);
  tr.appendChild(tdStatus);
  tr.appendChild(tdUrl);

  logTbody.insertBefore(tr, logTbody.firstChild);
}

// イベントリスナー
startBtn.addEventListener('click', startSlot);
allStopBtn.addEventListener('click', stopAllReels);
charCountSelect.addEventListener('change', createReels);
spinSpeedSelect.addEventListener('change', () => {
  currentSpeed = parseInt(spinSpeedSelect.value, 10);
  saveSettings();
});

clearLogBtn.addEventListener('click', () => {
  logTbody.innerHTML = '';
});

// 初期化実行
loadSavedSettings();
createReels();
</script>
</body>
</html>
