<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>都道府県クイズ - ハイスコア記録版</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #0b0e11; margin: 0; overflow: hidden; height: 100vh; color: #ecf0f1; text-align: center; }
        #map { position: fixed; inset: 0; background: #0b0e11; z-index: 0; }
        .ui-panel { position: relative; max-width: 480px; margin: 15px auto; background: rgba(30,39,46,0.92); padding: 20px; border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.7); z-index: 10; pointer-events: auto; }
        #start-menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(11, 14, 17, 0.98); z-index: 1000; }
        .menu-content { background: #1e272e; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; border: 1px solid #34495e; }
        label { display: block; text-align: left; margin: 10px 0 5px; font-weight: bold; font-size: 0.85em; color: #8e9aaf; text-transform: uppercase; letter-spacing: 1px; }
        select { width: 100%; padding: 12px; border-radius: 8px; background: #0b0e11; color: white; border: 1px solid #3498db; font-size: 16px; margin-bottom: 10px; outline: none; }
        #highscore-display { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-top: 5px; border-left: 4px solid #f1c40f; text-align: left; }
        .hs-val { color: #f1c40f; font-weight: bold; font-size: 1.2em; }
        #timer-container { width: 100%; background: #000; height: 8px; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: #2ecc71; transition: width 0.1s linear; }
        #shape-preview { height: 180px; background: rgba(0,0,0,0.6); margin-bottom: 15px; border-radius: 8px; display: none; align-items: center; justify-content: center; border: 1px solid #3498db; }
        #shape-svg { height: 160px; width: 160px; fill: #3498db; filter: drop-shadow(0 0 8px rgba(52, 152, 219, 0.6)); }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 12px; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; background: #3498db; color: #fff; transition: 0.2s; font-weight: bold; }
        button:hover:not(:disabled) { background: #2980b9; transform: translateY(-2px); }
        .btn-start { background: #2ecc71; width: 100%; font-size: 18px; font-weight: bold; padding: 15px; margin-top: 20px; }
        .btn-start:disabled { background: #34495e; cursor: not-allowed; }
        #result-screen { display: none; position: fixed; inset: 0; background: rgba(11, 14, 17, 0.98); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

<div id="map"></div>

<div id="start-menu">
    <div class="menu-content">
        <h2 style="margin:0 0 10px 0;">🗾 都道府県クイズ</h2>
        <p id="loading-msg" style="color:#f1c40f; font-size: 0.9em;">地図データ読み込み中...</p>
        
        <label>1. モード選択</label>
        <select id="mode-select" onchange="updateHighScoreDisplay()">
            <option value="1">地図指し（場所 → 名前）</option>
            <option value="2">形状（形 → 名前）</option>
            <option value="3">県庁所在地（所在 → 名前）</option>
            <option value="4">地図クリック（名前 → 場所）</option>
        </select>

        <div id="highscore-display">
            <span style="font-size: 0.8em; opacity: 0.7;">このモードのハイスコア</span><br>
            <span id="best-score" class="hs-val">0</span> <span style="font-size:0.8em">pts</span>
        </div>

        <label style="margin-top:15px;">2. 地域選択</label>
        <select id="region-select">
            <option value="all">全国 (47都道府県)</option>
            <option value="北海道,青森県,岩手県,宮城県,秋田県,山形県,福島県">北海道・東北</option>
            <option value="茨城県,栃木県,群馬県,埼玉県,千葉県,東京都,神奈川県">関東</option>
            <option value="新潟県,富山県,石川県,福井県,山梨県,長野県,岐阜県,静岡県,愛知県">中部</option>
            <option value="三重県,滋賀県,京都府,大阪府,兵庫県,奈良県,和歌山県">近畿</option>
            <option value="鳥取県,島根県,岡山県,広島県,山口県,徳島県,香川県,愛媛県,高知県">中国・四国</option>
            <option value="福岡県,佐賀県,長崎県,熊本県,大分県,宮崎県,鹿児島県,沖縄県">九州・沖縄</option>
        </select>

        <button id="start-btn" class="btn-start" onclick="startGame()" disabled>読み込み中</button>
    </div>
</div>

<div class="ui-panel" id="main-ui" style="display:none;">
    <div style="font-size: 0.9em; opacity: 0.8;">Question <span id="q-count">1</span> / <span id="q-total">--</span></div>
    <div id="timer-container"><div id="timer-bar"></div></div>
    <div id="shape-preview"><svg id="shape-svg" viewBox="0 0 100 100"></svg></div>
    <h3 id="question-text" style="margin: 10px 0; min-height: 1.5em;">...</h3>
    <div class="options" id="options-container"></div>
    <div id="result-text" style="height:30px; margin-top:10px; font-weight:bold;"></div>
    <button id="next-btn" style="display:none; width:100%; background:#2ecc71; margin-top:10px;">次の問題へ</button>
</div>

<div id="result-screen">
    <h1 style="margin-bottom: 0;">FINISH!</h1>
    <div id="final-score" style="font-size: 6em; color: #f1c40f; font-weight: bold; line-height: 1;">0</div>
    <p id="completion-text" style="margin-bottom: 30px; opacity: 0.7;"></p>
    <div id="new-record" style="color: #2ecc71; font-weight: bold; margin-bottom: 20px; display: none;">🏆 NEW RECORD!</div>
    <button onclick="location.reload()" style="padding:15px 50px; background:#3498db; color:white; border:none; border-radius:30px; font-size:1.2em; cursor:pointer; font-weight:bold;">タイトルへ戻る</button>
</div>

<script>
let map, layerDict = {}, stats = { q: 1, currentIdx: 0, score: 0, total: 0 };
let timeLeft = 10, timerInterval, currentCorrectPref, gameMode, quizPool, prefList;
let solvedPrefs = new Set(), wrongPrefs = new Set();

const capitals = {"北海道":"札幌市","青森県":"青森市","岩手県":"盛岡市","宮城県":"仙台市","秋田県":"秋田市","山形県":"山形市","福島県":"福島市","茨城県":"水戸市","栃木県":"宇都宮市","群馬県":"前橋市","埼玉県":"さいたま市","千葉県":"千葉市","東京都":"新宿区","神奈川県":"横浜市","新潟県":"新潟市","富山県":"富山市","石川県":"金沢市","福井県":"福井市","山梨県":"甲府市","長野県":"長野市","岐阜県":"岐阜市","静岡県":"静岡市","愛知県":"名古屋市","三重県":"津市","滋賀県":"大津市","京都府":"京都市","大阪府":"大阪市","兵庫県":"神戸市","奈良県":"奈良市","和歌山県":"和歌山市","鳥取県":"鳥取市","島根県":"松江市","岡山県":"岡山市","広島県":"広島市","山口県":"山口市","徳島県":"徳島市","香川県":"高松市","愛媛県":"松山市","高知県":"高知市","福岡県":"福岡市","佐賀県":"佐賀市","長崎県":"長崎市","熊本県":"熊本市","大分県":"大分市","宮崎県":"宮崎市","鹿児島県":"鹿児島市","沖縄県":"那覇市"};

async function init() {
    map = L.map('map', { zoomSnap: 0.1, attributionControl: false }).setView([38, 138], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { keepBuffer: 8 }).addTo(map);

    try {
        const response = await fetch('https://raw.githubusercontent.com/amay077/JapanPrefGeoJson/master/japan.geojson');
        const geoData = await response.json();
        L.geoJson(geoData, {
            style: { fillColor: '#111', fillOpacity: 0.9, color: '#222', weight: 1 },
            onEachFeature: (f, l) => {
                const name = f.properties.prefecture || f.properties.name || f.properties.nam_ja;
                if (name) {
                    layerDict[name] = l;
                    l.on('click', () => { if(gameMode === "4") checkAnswer(name); });
                }
            }
        }).addTo(map);
        document.getElementById('loading-msg').innerText = "✅ 地理データ読み込み完了";
        document.getElementById('start-btn').disabled = false;
        document.getElementById('start-btn').innerText = "ゲーム開始";
        updateHighScoreDisplay(); // 初回表示
    } catch (e) {
        document.getElementById('loading-msg').innerText = "❌ データの取得に失敗しました。";
    }
}

// ハイスコア表示の更新
function updateHighScoreDisplay() {
    const mode = document.getElementById('mode-select').value;
    const best = localStorage.getItem(`best_mode_${mode}`) || 0;
    document.getElementById('best-score').innerText = Number(best).toLocaleString();
}

function startGame() {
    gameMode = document.getElementById('mode-select').value;
    const regionVal = document.getElementById('region-select').value;
    prefList = Object.keys(layerDict);
    if(regionVal !== 'all') {
        const targetPrefs = regionVal.split(',');
        prefList = prefList.filter(p => targetPrefs.includes(p));
    }
    quizPool = [...prefList].sort(() => Math.random() - 0.5);
    stats.total = quizPool.length;
    stats.q = 1; stats.currentIdx = 0; stats.score = 0;
    solvedPrefs.clear(); wrongPrefs.clear();

    document.getElementById('q-total').innerText = stats.total;
    document.getElementById('start-menu').style.display = 'none';
    document.getElementById('main-ui').style.display = 'block';
    loadQuestion();
}

function loadQuestion() {
    resetStyles();
    currentCorrectPref = quizPool[stats.currentIdx];
    document.getElementById('q-count').innerText = stats.q;
    const qText = document.getElementById('question-text');
    const shapePrev = document.getElementById('shape-preview');
    shapePrev.style.display = 'none';

    if(gameMode === "1") {
        qText.innerText = "この都道府県はどこ？";
        focusPref(currentCorrectPref);
    } else if(gameMode === "2") {
        qText.innerText = "この形の都道府県は？";
        shapePrev.style.display = 'flex';
        showShapeSVG(currentCorrectPref);
        map.setZoom(5);
    } else if(gameMode === "3") {
        qText.innerText = `県庁所在地が「${capitals[currentCorrectPref]}」なのは？`;
        map.setZoom(5);
    } else if(gameMode === "4") {
        qText.innerText = `「${currentCorrectPref}」をクリック！`;
        map.setZoom(5);
    }
    setupOptions();
    startTimer();
}

function setupOptions() {
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    if(gameMode === "4") return;
    let allKeys = Object.keys(layerDict);
    let choices = [currentCorrectPref, ...allKeys.filter(p=>p!==currentCorrectPref).sort(()=>0.5-Math.random()).slice(0,3)].sort(()=>0.5-Math.random());
    choices.forEach(name => {
        const btn = document.createElement('button');
        btn.textContent = name;
        btn.onclick = () => checkAnswer(name, btn);
        container.appendChild(btn);
    });
}

function showShapeSVG(name) {
    const layer = layerDict[name];
    const bounds = layer.getBounds();
    const latR = bounds.getNorth() - bounds.getSouth(), lngR = bounds.getEast() - bounds.getWest();
    const maxR = Math.max(latR, lngR);
    const geo = layer.toGeoJSON();
    let coordsArray = geo.geometry.type === 'MultiPolygon' ? 
        geo.geometry.coordinates.reduce((p, c) => c[0].length > p.length ? c[0] : p, geo.geometry.coordinates[0][0]) : 
        geo.geometry.coordinates[0];
    const points = coordsArray.map((p, i) => {
        const x = ((p[0] - bounds.getWest()) / maxR) * 80 + 10;
        const y = 90 - ((p[1] - bounds.getSouth()) / maxR) * 80;
        return `${i===0?'M':'L'} ${x},${y}`;
    }).join(" ");
    document.getElementById('shape-svg').innerHTML = `<path d="${points} Z" />`;
}

function focusPref(name) {
    const l = layerDict[name];
    map.flyToBounds(l.getBounds(), { padding: [300, 300], duration: 1.5 });
    l.setStyle({ fillColor: '#f1c40f', fillOpacity: 0.9, color: '#fff', weight: 2 });
}

function checkAnswer(selected, btn) {
    clearInterval(timerInterval);
    const isCorrect = (selected === currentCorrectPref);
    const layer = layerDict[currentCorrectPref];
    document.querySelectorAll('.options button').forEach(b => b.disabled = true);

    if(isCorrect) {
        stats.score += Math.round(timeLeft * 100);
        document.getElementById('result-text').innerHTML = "<span style='color:#2ecc71'>正解！</span>";
        layer.setStyle({ fillColor: '#3498db', fillOpacity: 1, color: '#fff', weight: 2 });
        solvedPrefs.add(currentCorrectPref);
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    } else {
        document.getElementById('result-text').innerHTML = `<span style='color:#e74c3c'>正解は「${currentCorrectPref}」</span>`;
        if(btn) btn.style.background = '#e74c3c';
        layer.setStyle({ fillColor: '#e74c3c', fillOpacity: 1, color: '#fff', weight: 2 });
        wrongPrefs.add(currentCorrectPref);
    }

    map.flyToBounds(layer.getBounds(), { padding: [350, 350], duration: 1.2 });
    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('next-btn').onclick = () => {
        stats.currentIdx++;
        if(stats.currentIdx < stats.total) { stats.q++; loadQuestion(); }
        else showResults();
    };
}

function startTimer() {
    timeLeft = 10;
    document.getElementById('timer-bar').style.width = "100%";
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        document.getElementById('timer-bar').style.width = (timeLeft * 10) + "%";
        if(timeLeft <= 0) checkAnswer(null);
    }, 100);
}

function resetStyles() {
    Object.keys(layerDict).forEach(name => {
        const l = layerDict[name];
        if (solvedPrefs.has(name)) {
            l.setStyle({ fillColor: '#3498db', fillOpacity: 1, color: '#fff', weight: 1.5 });
        } else if (wrongPrefs.has(name)) {
            l.setStyle({ fillColor: '#e74c3c', fillOpacity: 1, color: '#fff', weight: 1.5 });
        } else {
            l.setStyle({ fillColor: '#111', fillOpacity: 0.9, color: '#222', weight: 1 });
        }
    });
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('result-text').innerText = '';
    document.querySelectorAll('.options button').forEach(b => { b.disabled = false; b.style.background = '#3498db'; });
}

function showResults() {
    document.getElementById('main-ui').style.display = 'none';
    document.getElementById('result-screen').style.display = 'flex';
    document.getElementById('final-score').innerText = stats.score.toLocaleString();
    document.getElementById('completion-text').innerText = `${stats.total}問中 ${solvedPrefs.size}問正解`;

    // ハイスコアのチェックと保存
    const bestKey = `best_mode_${gameMode}`;
    const oldBest = Number(localStorage.getItem(bestKey)) || 0;
    if (stats.score > oldBest) {
        localStorage.setItem(bestKey, stats.score);
        document.getElementById('new-record').style.display = 'block';
    }
}

window.onload = init;
</script>
</body>
</html>
