    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">

            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

    <main class="container my-5">
        <div class="text-center mb-5">
            <h1>会社概要</h1>
            <p class="lead">当社の基本情報とアクセスマップです。</p>

        <section id="company-info">
            <div class="row">
                <div class="col-lg-8 mx-auto">

                    <h3 class="mt-5 mb-3">アクセスマップ</h3>
                    <div class="card">
                        <div class="card-body p-0">
                            <div class="ratio ratio-16x9">

                                src="https://www.google.com/maps?q=34.7538727965577,137.7478492014736&z=15&output=embed"

                                height="450"
                                style="border:0;"

                                referrerpolicy="no-referrer-when-downgrade">

                            </div>
                        </div>
                    </div>
                    <h3 class="mt-5 mb-3">アクセスマップQRコード</h3>
                    <div>
                        <img src="images/QR_map.png" class="img-fluid" alt="アクセスマップQRコード">

                </div>

            <div class="row">
                <img src="images/info.png" class="img-fluid" alt="会社連絡先">
