<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプル テキスト差分チェッカー</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        /* 差分表示エリアのスタイル */
        .result-view {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fff;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap; /* 改行やスペースを維持 */
            word-break: break-all;
        }
        /* WinMerge風の背景色 */
        del {
            background-color: #f8d7da; /* 薄い赤 */
            color: #721c24;
            text-decoration: none;
        }
        ins {
            background-color: #d4edda; /* 薄い緑 */
            color: #155724;
            text-decoration: none;
        }
        .btn-container {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 30px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>シンプル テキスト差分チェッカー</h2>

    <div class="container">
        <div class="pane">
            <label for="text-left">比較元 (左)</label>
            <textarea id="text-left" placeholder="古いテキストを入力してください..."></textarea>
        </div>
        <div class="pane">
            <label for="text-right">比較先 (右)</label>
            <textarea id="text-right" placeholder="新しいテキストを入力してください..."></textarea>
        </div>
    </div>

    <div class="btn-container">
        <button onclick="compareText()">差分を比較する</button>
    </div>

    <hr>

    <div class="container">
        <div class="pane">
            <label>削除された部分（左基準）</label>
            <div id="result-left" class="result-view"></div>
        </div>
        <div class="pane">
            <label>追加された部分（右基準）</label>
            <div id="result-right" class="result-view"></div>
        </div>
    </div>

    <script>
        function compareText() {
            const text1 = document.getElementById('text-left').value;
            const text2 = document.getElementById('text-right').value;

            const dmp = new diff_match_patch();
            // 差分データを取得
            const diffs = dmp.diff_main(text1, text2);
            // 視認性を良くするため、必要に応じてクリーンアップ
            dmp.diff_cleanupSemantic(diffs);

            let htmlLeft = '';
            let htmlRight = '';

            // 差分結果をループ処理してHTMLを生成
            // diff[0] -> 0: 変更なし, -1: 削除(左のみ), 1: 追加(右のみ)
            // diff[1] -> 対象の文字列
            diffs.forEach((diff) => {
                const operation = diff[0];
                const text = escapeHtml(diff[1]);

                if (operation === 0) {
                    // 共通部分
                    htmlLeft += text;
                    htmlRight += text;
                } else if (operation === -1) {
                    // 削除された部分（左側のみ赤背景）
                    htmlLeft += `<del>${text}</del>`;
                } else if (operation === 1) {
                    // 追加された部分（右側のみ緑背景）
                    htmlRight += `<ins>${text}</ins>`;
                }
            });

            document.getElementById('result-left').innerHTML = htmlLeft;
            document.getElementById('result-right').innerHTML = htmlRight;
        }

        // HTMLタグのサニタイズ（XSS・表示崩れ防止）
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>

</body>
</html>
