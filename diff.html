<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプル テキスト差分チェッカー</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        textarea {
            width: 100%;
            height: 250px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        .result-view {
            width: 100%;
            min-height: 250px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fff;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        /* 行単位で綺麗に色を載せるスタイル */
        .del-line {
            background-color: #f8d7da; /* 薄い赤 */
            color: #721c24;
            display: block;
            width: 100%;
        }
        .ins-line {
            background-color: #d4edda; /* 薄い緑 */
            color: #155724;
            display: block;
            width: 100%;
        }
        .normal-line {
            display: block;
            width: 100%;
            color: #333;
        }
        .btn-container {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 30px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

    <h2>シンプル テキスト差分チェッカー</h2>

    <div class="container">
        <div class="pane">
            <label for="text-left">比較元 (左)</label>
            <textarea id="text-left" placeholder="古いテキストを入力してください..."></textarea>
        </div>
        <div class="pane">
            <label for="text-right">比較先 (右)</label>
            <textarea id="text-right" placeholder="新しいテキストを入力してください..."></textarea>
        </div>
    </div>

    <div class="btn-container">
        <button onclick="compareText()">差分を比較する</button>
    </div>

    <hr>

    <div class="container">
        <div class="pane">
            <label>削除された部分（左基準）</label>
            <div id="result-left" class="result-view"></div>
        </div>
        <div class="pane">
            <label>追加された部分（右基準）</label>
            <div id="result-right" class="result-view"></div>
        </div>
    </div>

    <script>
        function compareText() {
            const text1 = document.getElementById('text-left').value;
            const text2 = document.getElementById('text-right').value;

            const dmp = new diff_match_patch();
            
            // 【重要】行単位の比較を行うための前処理
            const a = dmp.diff_linesToChars_(text1, text2);
            const lineText1 = a.chars1;
            const lineText2 = a.chars2;
            const lineArray = a.lineArray;

            // 行単位に置き換えたデータで差分を計算
            const diffs = dmp.diff_main(lineText1, lineText2, false);
            
            // 文字から元の行データに復元
            dmp.diff_charsToLines_(diffs, lineArray);

            let htmlLeft = '';
            let htmlRight = '';

            diffs.forEach((diff) => {
                const operation = diff[0];
                const lines = diff[1].split('\n');
                
                // 末尾の空行を処理するための調整
                if (lines[lines.length - 1] === '') {
                    lines.pop();
                }

                lines.forEach((line) => {
                    const escapedLine = escapeHtml(line);
                    
                    if (operation === 0) {
                        // 共通の行
                        htmlLeft += `<span class="normal-line">${escapedLine}</span>\n`;
                        htmlRight += `<span class="normal-line">${escapedLine}</span>\n`;
                    } else if (operation === -1) {
                        // 削除された行（左側のみ表示）
                        htmlLeft += `<span class="del-line">${escapedLine}</span>\n`;
                    } else if (operation === 1) {
                        // 追加された行（右側のみ表示）
                        htmlRight += `<span class="ins-line">${escapedLine}</span>\n`;
                    }
                });
            });

            document.getElementById('result-left').innerHTML = htmlLeft;
            document.getElementById('result-right').innerHTML = htmlRight;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>

</body>
</html>
