<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テキスト読み上げ2</title>
  <style>
    /* === 共通カラー変数・基本設定（base.html） === */
    :root {
      --bg-gradient: linear-gradient(135deg, #fff7ed, #ffedd5, #fef08a);
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: #fed7aa;
      --primary: #f97316;
      --primary-dark: #c2410c;
      --primary-border: #ea580c;
      --sub-bg: rgba(255, 247, 237, 0.7);
      --sub-border: #ffedd5;
      --text: #44403c;
      --text-muted: #78716c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    .menu-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 11px;
      color: #71716a;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1.5px solid #e4e4e7;
      font-weight: bold;
      z-index: 1000;
    }

    .container {
      background: var(--card-bg);
      border-radius: 24px;
      border: 2px solid var(--card-border);
      box-shadow: 0 10px 25px rgba(180, 150, 120, 0.15);
      padding: 16px;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--primary-dark);
      width: 100%;
    }
    .btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--primary-dark); }

    .btn-secondary {
      background: white;
      border: 1px solid #e7e5e4;
      color: var(--text);
      font-size: 12px;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 0 #d6d3d1;
    }
    .btn-secondary:active { transform: translateY(2px); box-shadow: 0 0 0 #d6d3d1; }

    .box-sub {
      background: var(--sub-bg);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--sub-border);
      margin-bottom: 12px;
    }
    .box-title {
      font-size: 11px;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 6px;
    }

    /* === このアプリ用 === */
    .hint { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .field-label { font-size: 12px; font-weight: bold; color: var(--text); margin-bottom: 4px; display: block; }

    textarea, select, input[type=number] {
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 8px;
      font-size: 13px;
      font-family: inherit;
      background: white;
      color: var(--text);
      user-select: text;
      -webkit-user-select: text;
    }
    textarea { width: 100%; min-height: 120px; resize: vertical; font-size: 14px; }
    select { width: 100%; }
    textarea:focus, select:focus, input[type=number]:focus { outline: 2px solid var(--primary); outline-offset: 0; }

    .slider-row { margin: 8px 0; font-size: 12px; font-weight: bold; }
    .slider-row span { color: var(--primary-dark); }
    input[type=range] { width: 100%; accent-color: var(--primary); }

    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .row .btn-primary { flex: 1; width: auto; }
    .row .btn-secondary { flex: 1; }

    .log-box {
      background: var(--text);
      color: #fed7aa;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      height: 120px;
      overflow: auto;
      margin-top: 10px;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }
  </style>
  <script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <a href="menu.html" class="menu-btn">メニューに戻る</a>

  <div class="container">
    <h1>テキスト読み上げ2</h1>

    <!-- テキスト入力 -->
    <div class="box-sub">
      <div class="box-title">★ 読み上げたいテキスト</div>
      <div class="hint">Enterで読み上げ、Shift+Enterで改行</div>
      <textarea id="textInput" placeholder="ここにテキストを入力"></textarea>

      <div class="row">
        <button id="speakBtn" class="btn-primary">▶ 読み上げ</button>
        <button id="pauseBtn" class="btn-secondary">⏸ 一時停止</button>
        <button id="resumeBtn" class="btn-secondary">▶ 再開</button>
        <button id="stopBtn" class="btn-secondary">■ 停止</button>
      </div>
    </div>

    <!-- 声の設定 -->
    <div class="box-sub">
      <div class="box-title">★ 声の設定</div>

      <label class="field-label" for="voiceSelect">声の種類（voice）</label>
      <select id="voiceSelect"></select>

      <div class="slider-row">
        ピッチ: <span id="pitchVal">1.0</span>
        <input type="range" id="pitchSlider" min="0.5" max="2.0" step="0.1" value="1.0">
      </div>
      <div class="slider-row">
        スピード: <span id="rateVal">1.0</span>
        <input type="range" id="rateSlider" min="0.5" max="2.0" step="0.1" value="1.0">
      </div>
      <div class="slider-row">
        音量: <span id="volumeVal">1.0</span>
        <input type="range" id="volumeSlider" min="0.0" max="1.0" step="0.1" value="1.0">
      </div>

      <div class="row">
        <button class="btn-secondary" id="monoBtn">モノトーンモード</button>
        <button class="btn-secondary" id="slowStartBtn">聞き取りやすいモード</button>
      </div>
      <div class="row">
        <button class="btn-secondary" id="savePresetBtn">設定を保存</button>
        <button class="btn-secondary" id="loadPresetBtn">保存を読み込む</button>
        <button class="btn-secondary" id="clearPresetBtn">保存を削除</button>
      </div>

      <div style="margin-top:12px;">
        <label class="field-label" for="repeatCount">リピート回数</label>
        <input type="number" id="repeatCount" value="1" min="1" style="width:80px;">
      </div>
    </div>

    <!-- 履歴 -->
    <div class="box-sub">
      <div class="box-title">★ 履歴（ダブルクリックで入力欄に戻す）</div>
      <select id="historyList" size="3"></select>
    </div>

    <!-- ログ -->
    <div class="box-sub">
      <div class="box-title">★ ログ</div>
      <div class="log-box" id="logBox"></div>
    </div>
  </div>

  <script>
    const synth = window.speechSynthesis;
    let voices = [];
    let history = [];
    let isSlowMode = false;

    function log(msg){
      const box = document.getElementById('logBox');
      box.textContent += msg + "\n";
      box.scrollTop = box.scrollHeight;
    }

    function populateVoices(){
      voices = synth.getVoices() || [];
      const sel = document.getElementById('voiceSelect');
      sel.innerHTML="";
      voices.forEach((v,i)=>{
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${v.name} (${v.lang})`;
        sel.appendChild(opt);
      });
    }
    populateVoices();
    if('onvoiceschanged' in synth){ synth.onvoiceschanged = populateVoices; }

    // スライダー値
    let pitch = 1.0;
    let rate = 1.0;
    let volume = 1.0;

    const pitchSlider = document.getElementById('pitchSlider');
    const rateSlider = document.getElementById('rateSlider');
    const volumeSlider = document.getElementById('volumeSlider');

    pitchSlider.oninput = ()=>{
      pitch = parseFloat(pitchSlider.value);
      document.getElementById('pitchVal').innerText = pitch.toFixed(1);
    };
    rateSlider.oninput = ()=>{
      rate = parseFloat(rateSlider.value);
      document.getElementById('rateVal').innerText = rate.toFixed(1);
    };
    volumeSlider.oninput = ()=>{
      volume = parseFloat(volumeSlider.value);
      document.getElementById('volumeVal').innerText = volume.toFixed(1);
    };

    function speakOnce(text, voiceIndex, rptLeft){
      const utter = new SpeechSynthesisUtterance(text);
      utter.voice = voices[voiceIndex] || null;

      // slow-start mode
      if(isSlowMode){
        const parts = text.split(/([。！？\n])/);
        const first = (parts[0]||text).trim();
        utter.text = first;
        utter.rate = 0.8;
        log("slow-start: first sentence");
        utter.onend = ()=>{
          // 続きを通常速度で読む
          const rest = text.replace(first,"");
          if(rest.trim()){
            const u2 = new SpeechSynthesisUtterance(rest);
            u2.voice = voices[voiceIndex]||null;
            u2.pitch = pitch;
            u2.rate = rate;
            u2.volume = volume;
            u2.onend = ()=>{
              if(rptLeft>1) speak(text, voiceIndex, rptLeft-1);
            };
            synth.speak(u2);
          } else {
            if(rptLeft>1) speak(text, voiceIndex, rptLeft-1);
          }
        };
      } else {
        utter.pitch = pitch;
        utter.rate = rate;
        utter.volume = volume;
        utter.onend = ()=>{
          log("end");
          if(rptLeft>1) speak(text, voiceIndex, rptLeft-1);
        };
      }

      log(`speak: pitch=${pitch}, rate=${rate}, volume=${volume}`);
      synth.speak(utter);
    }

    function speak(text, voiceIndex, repeat){
      synth.cancel();
      speakOnce(text,voiceIndex,repeat);
    }

    // モードボタン
    document.getElementById('monoBtn').onclick = ()=>{
      pitch = 1.0; rate=0.9; volume=0.9;
      pitchSlider.value=pitch; rateSlider.value=rate; volumeSlider.value=volume;
      document.getElementById('pitchVal').innerText=pitch;
      document.getElementById('rateVal').innerText=rate;
      document.getElementById('volumeVal').innerText=volume;
      isSlowMode = false;
      log("モノトーンモード適用");
    };

    document.getElementById('slowStartBtn').onclick = ()=>{
      isSlowMode = true;
      log("聞き取りやすいモード ON");
    };

    // 設定保存/読込
    document.getElementById('savePresetBtn').onclick = ()=>{
      const data = {
        pitch, rate, volume,
        voiceIndex: document.getElementById('voiceSelect').value
      };
      localStorage.setItem('ttsPreset', JSON.stringify(data));
      log("設定保存済み");
    };

    document.getElementById('loadPresetBtn').onclick = ()=>{
      const d = localStorage.getItem('ttsPreset');
      if(!d){ log("保存なし"); return; }
      const p = JSON.parse(d);
      pitch = p.pitch; rate=p.rate; volume=p.volume;
      pitchSlider.value=pitch; rateSlider.value=rate; volumeSlider.value=volume;
      document.getElementById('voiceSelect').value = p.voiceIndex;
      document.getElementById('pitchVal').innerText=pitch;
      document.getElementById('rateVal').innerText=rate;
      document.getElementById('volumeVal').innerText=volume;
      log("設定読込完了");
    };

    document.getElementById('clearPresetBtn').onclick = ()=>{
      localStorage.removeItem('ttsPreset');
      log("保存削除");
    };

    // 履歴
    function addHistory(txt){
      if(!txt.trim()) return;
      history.unshift(txt);
      if(history.length>10) history.pop();
      const h = document.getElementById('historyList');
      h.innerHTML="";
      history.forEach(t=>{
        const o=document.createElement('option'); o.textContent=t;
        h.appendChild(o);
      });
    }

    document.getElementById('historyList').ondblclick = (e)=>{
      const v = e.target.value;
      document.getElementById('textInput').value = v;
    };

    // 読み上げボタン
    document.getElementById('speakBtn').onclick = ()=>{
      const text = document.getElementById('textInput').value;
      if(!text.trim()) return alert("テキストを入力してください");
      addHistory(text);
      const voiceIndex = document.getElementById('voiceSelect').value;
      const repeat = parseInt(document.getElementById('repeatCount').value)||1;
      speak(text, voiceIndex, repeat);
    };

    document.getElementById('pauseBtn').onclick = ()=> synth.pause();
    document.getElementById('resumeBtn').onclick = ()=> synth.resume();
    document.getElementById('stopBtn').onclick = ()=> synth.cancel();

    // Enterで読み上げ
    document.getElementById('textInput').addEventListener('keydown', (e)=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); document.getElementById('speakBtn').click(); }
    });
  </script>
</body>
</html>
