<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リアルパタパタ案内表示機（完全同期版）</title>
    <style>
        body {
            background: linear-gradient(160deg, #ffe3ef 0%, #e6e6ff 45%, #dff5ff 100%);
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 10px;
            user-select: none;
            box-sizing: border-box;
        }

        .page-wrap {
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(6px);
            border-radius: 28px;
            padding: 28px 30px 24px;
            box-shadow: 0 15px 35px rgba(120,110,160,0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 640px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0 0 20px;
            color: #7a6d9e;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
        }

        h1 .deco {
            filter: saturate(1.3);
        }

        .board {
            background-color: #111;
            padding: 30px 50px;
            border: 4px solid #333;
            border-radius: 12px;
            display: flex;
            gap: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .segment {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .flap-container {
            position: relative;
            width: 200px;
            height: 100px;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            perspective: 600px;
            white-space: nowrap;
            letter-spacing: -2px;
        }

        .flap-up {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: #0a0a0a;
            border-bottom: 1px solid #000;
            border-radius: 6px 6px 0 0;
            overflow: hidden;
            line-height: 100px;
        }

        .flap-down {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: #0a0a0a;
            border-top: 1px solid #000;
            border-radius: 0 0 6px 6px;
            overflow: hidden;
            line-height: 0px;
        }

        .flap-hinge {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            transform-origin: bottom;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            z-index: 5;
        }

        .hinge-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            border-bottom: 1px solid #000;
            border-radius: 6px 6px 0 0;
            overflow: hidden;
            line-height: 100px;
            backface-visibility: hidden;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.6); 
        }

        .hinge-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            border-top: 1px solid #000;
            border-radius: 0 0 6px 6px;
            overflow: hidden;
            line-height: 0px;
            transform: rotateX(180deg);
            backface-visibility: hidden;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.6); 
        }

        .type-rapid { color: #ff4500; }
        .type-special { color: #ff8c00; }
        .type-commuter { color: #ff00ff; }
        .type-local { color: #ffffff; }
        .dest-color { color: #ffffff; }

        .play-flap {
            animation: flip-down-anim var(--anim-duration) ease-in forwards;
        }

        @keyframes flip-down-anim {
            0% { 
                transform: rotateX(0deg); 
                filter: brightness(1);
            }
            50% {
                filter: brightness(0.8);
            }
            100% { 
                transform: rotateX(-180deg); 
                filter: brightness(1);
            }
        }

        /* ボタン */
        button {
            margin-top: 40px;
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #ff4500;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        button:hover { background-color: #e03e00; }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* ===== ここからかわいいアレンジ用 ===== */

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .log-panel {
            margin-top: 18px;
            width: 100%;
            max-width: 360px;
            background: #fbfbff;
            border-radius: 16px;
            box-shadow: inset 0 0 0 1px #ece8fb;
            padding: 10px 14px;
            box-sizing: border-box;
        }

        .log-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: #9188b5;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        #logList {
            list-style: none;
            margin: 0;
            padding: 0;
            height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 4px;
        }

        #logList li {
            font-size: 0.7rem;
            color: #6b6480;
            background: #f3f1fc;
            border-radius: 8px;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            gap: 6px;
            flex-shrink: 0;
            animation: fade-in 0.3s ease;
        }

        #logList li .log-time {
            color: #b3aecb;
            font-variant-numeric: tabular-nums;
        }

        #logList .log-empty {
            color: #c9c5db;
            font-size: 0.7rem;
            padding: 4px 8px;
        }

        #logList::-webkit-scrollbar {
            width: 5px;
        }
        #logList::-webkit-scrollbar-thumb {
            background: #dcd7ee;
            border-radius: 4px;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

        let currentIndex = 0;
        let landedDest = null;
        let landedType = null;

        function addLogEntry(type, dest) {
            const list = document.getElementById('logList');

            // 初回だけ表示している空プレースホルダーを消す
            const empty = list.querySelector('.log-empty');
            if (empty) empty.remove();

            const li = document.createElement('li');
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            li.innerHTML = `<span class="log-time">${timeStr}</span><span>🚃 ${type} ${dest}行き</span>`;
            list.appendChild(li);

            // ログは直近8件だけ残す（かわいく小さく保つ）
            while (list.children.length > 8) {
                list.removeChild(list.firstChild);
            }
        }

        function startSequence() {
            const btn = document.getElementById('btn');
            btn.disabled = true;

            const totalDuration = Math.floor(Math.random() * 3000) + 2000;
            const startTime = Date.now();

            function nextTick() {
                const now = Date.now();
                const elapsed = now - startTime;
                const remaining = totalDuration - elapsed;

                let currentInterval = 90;

                if (remaining < 1500) {
                    const progress = (1500 - remaining) / 1500;
                    currentInterval = 90 + (360 * progress);
                }

                const currentFlap = masterData[currentIndex];
                currentIndex = (currentIndex + 1) % masterData.length;
                const nextFlap = masterData[currentIndex];

                flip('board-type', currentFlap.type, nextFlap.type, currentFlap.class, nextFlap.class, currentInterval);
                flip('board-dest', currentFlap.dest, nextFlap.dest, 'dest-color', 'dest-color', currentInterval);

                landedDest = nextFlap.dest;
                landedType = nextFlap.type;

                if (elapsed < totalDuration) {
                    setTimeout(nextTick, currentInterval);
                } else {
                    btn.disabled = false;
                    addLogEntry(landedType, landedDest);
                }
            }

            nextTick();
        }

        function flip(containerId, curText, nextText, curClass, nextClass, durationMs) {
            const container = document.getElementById(containerId);
            
            let curFontSize = "2.5rem";
            let nextFontSize = "2.5rem";

            if (curText.length > 4) {
                curFontSize = Math.max(1.1, 2.5 - (curText.length - 4) * 0.3) + "rem";
            }
            if (nextText.length > 4) {
                nextFontSize = Math.max(1.1, 2.5 - (nextText.length - 4) * 0.3) + "rem";
            }

            const speedStr = (durationMs / 1000) + "s";

            container.innerHTML = `
                <div class="flap-up ${nextClass}" style="font-size: ${nextFontSize};">${nextText}</div>
                <div class="flap-down ${curClass}" style="font-size: ${curFontSize};">${curText}</div>
                <div class="flap-hinge play-flap" style="--anim-duration: ${speedStr};">
                    <div class="hinge-front ${curClass}" style="font-size: ${curFontSize};">${curText}</div>
                    <div class="hinge-back ${nextClass}" style="font-size: ${nextFontSize};">${nextText}</div>
                </div>
            `;

            setTimeout(() => {
                const downFlap = container.querySelector('.flap-down');
                if(downFlap) {
                    downFlap.textContent = nextText;
                    downFlap.className = `flap-down ${nextClass}`;
                    downFlap.style.fontSize = nextFontSize;
                }
            }, durationMs - 15);
        }
    </script>
