<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パタパタ案内表示機</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #aaa;
        }

        /* 掲示板のベース */
        .board {
            background-color: #111;
            padding: 30px 50px;
            border: 4px solid #333;
            border-radius: 12px;
            display: flex;
            gap: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .segment {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        /* フラップ（板）の3D構造 */
        .flap-container {
            position: relative;
            width: 200px;
            height: 100px;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            perspective: 400px;
            
            /* 👇 ここから追加の2行 👇 */
            white-space: nowrap;      /* 文字を絶対に折り返さない */
            letter-spacing: -2px;     /* 文字同士の間隔を少し詰める（お好みで） */
        }

        /* 上半分の固定板 */
        .flap-up {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: #0a0a0a;
            border-bottom: 1px solid #000;
            border-radius: 6px 6px 0 0;
            overflow: hidden;
            line-height: 100px;
        }

        /* 下半分の固定板 */
        .flap-down {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: #0a0a0a;
            border-top: 1px solid #000;
            border-radius: 0 0 6px 6px;
            overflow: hidden;
            line-height: 0px;
        }

        /* 手前にパタンと倒れてくる動く板 */
        .flap-hinge {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            transform-origin: bottom;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            z-index: 5;
        }

        /* 動く板の表面（現在の文字の上半分） */
        .hinge-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            border-bottom: 1px solid #000;
            border-radius: 6px 6px 0 0;
            overflow: hidden;
            line-height: 100px;
            backface-visibility: hidden;
        }

        /* 動く板の裏面（次の文字の下半分） */
        .hinge-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            border-top: 1px solid #000;
            border-radius: 0 0 6px 6px;
            overflow: hidden;
            line-height: 0px;
            transform: rotateX(180deg);
            backface-visibility: hidden;
        }

        /* JR中央線風の色分け */
        .type-rapid { color: #ff4500; }
        .type-special { color: #ff8c00; }
        .type-commuter { color: #ff00ff; }
        .type-local { color: #ffffff; }
        .dest-color { color: #ffffff; }

        /* 高速パタパタ用アニメーション（0.08秒で1回転） */
        .play-flap {
            animation: flip-down-anim 0.08s linear forwards;
        }

        @keyframes flip-down-anim {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-180deg); }
        }

        /* ボタン */
        button {
            margin-top: 40px;
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #ff4500;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        button:hover { background-color: #e03e00; }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

            { type: "つくばエクスプレス 区間快速", class: "type-rapid", dest: "守谷" },
            { type: "北総線 特急", class: "type-special", dest: "印旛日本医大" },
            { type: "東京モノレール 区間快速", class: "type-rapid", dest: "羽田空港第2ﾀｰﾐﾅﾙ" },
            { type: "りんかい線 快速", class: "type-rapid", dest: "川越" },
            { type: "多摩モノレール", class: "type-local", dest: "上北台" },
            { type: "湘南モノレール", class: "type-local", dest: "湘南江の島" },
            { type: "金沢シーサイドライン", class: "type-local", dest: "八景島" }

        // 現在表示しているコマのインデックス
        let currentIndex = 0;

        // シークエンス（連続回転）の開始
        function startSequence() {
            const btn = document.getElementById('btn');
            btn.disabled = true; // 回転中はボタンを押せなくする

            // 2秒〜5秒の間でランダムに停止時間を決める
            const totalDuration = Math.floor(Math.random() * (1000)) + 1000;
            const startTime = Date.now();

            // 高速パタパタのループ関数
            function nextTick() {
                const now = Date.now();
                const elapsed = now - startTime;

                // 現在のコマ（めくる前）
                const currentFlap = masterData[currentIndex];
                
                // 次のコマ（めくった後）
                currentIndex = (currentIndex + 1) % masterData.length;
                const nextFlap = masterData[currentIndex];

                // 画面を1枚めくる
                flip('board-type', currentFlap.type, nextFlap.type, currentFlap.class, nextFlap.class);
                flip('board-dest', currentFlap.dest, nextFlap.dest, 'dest-color', 'dest-color');

                // 設定したランダム時間が経過していなければ、0.08秒後に次のコマへ
                if (elapsed < totalDuration) {
                    setTimeout(nextTick, 80);
                } else {
                    // 時間が来たら終了、ボタンを元に戻す
                    btn.disabled = false;
                }
            }

            nextTick();
        }

        // 1枚パタンと実写さながらにめくる関数（文字数自動縮小版）
        function flip(containerId, curText, nextText, curClass, nextClass) {
            const container = document.getElementById(containerId);
            
            // --- 【ここから追加】文字数に応じてフォントサイズを計算する ---
            // 標準は 2.5rem。文字数が4文字を超えたら、1文字増えるごと段階的に小さくする
            let curFontSize = "2.5rem";
            let nextFontSize = "2.5rem";

            if (curText.length > 4) {
                // 例: 5文字なら2.0rem、6文字なら1.7rem... 最低1.1remまで縮小
                curFontSize = Math.max(1.1, 2.5 - (curText.length - 4) * 0.3) + "rem";
            }
            if (nextText.length > 4) {
                nextFontSize = Math.max(1.1, 2.5 - (nextText.length - 4) * 0.3) + "rem";
            }
            // --- 【ここまで追加】 ---

            // style属性で、計算したフォントサイズ（font-size）をそれぞれの板に直接流し込む
            container.innerHTML = `
                <div class="flap-up ${nextClass}" style="font-size: ${nextFontSize};">${nextText}</div>
                <div class="flap-down ${curClass}" style="font-size: ${curFontSize};">${curText}</div>
                <div class="flap-hinge play-flap">
                    <div class="hinge-front ${curClass}" style="font-size: ${curFontSize};">${curText}</div>
                    <div class="hinge-back ${nextClass}" style="font-size: ${nextFontSize};">${nextText}</div>
                </div>
            `;

            // アニメーションが完了する直前（0.07秒後）に、下の固定板の文字とサイズを追いつかせる
            setTimeout(() => {
                const downFlap = container.querySelector('.flap-down');
                if(downFlap) {
                    downFlap.textContent = nextText;
                    downFlap.className = `flap-down ${nextClass}`;
                    downFlap.style.fontSize = nextFontSize; // サイズも合わせて更新
                }
            }, 70);
        }
    </script>
