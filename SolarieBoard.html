<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リアルパタパタ案内表示機（完全同期版）</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #aaa;
        }

        /* 掲示板のベース */
        .board {
            background-color: #111;
            padding: 30px 50px;
            border: 4px solid #333;
            border-radius: 12px;
            display: flex;
            gap: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .segment {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        /* フラップ（板）の3D構造 */
        .flap-container {
            position: relative;
            width: 200px;
            height: 100px;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            perspective: 600px; /* 奥行きを深くして、手前に倒れる立体感を強調 */
            white-space: nowrap;
            letter-spacing: -2px;
        }

        /* 上半分の固定板 */
        .flap-up {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: #0a0a0a;
            border-bottom: 1px solid #000;
            border-radius: 6px 6px 0 0;
            overflow: hidden;
            line-height: 100px;
        }

        /* 下半分の固定板 */
        .flap-down {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: #0a0a0a;
            border-top: 1px solid #000;
            border-radius: 0 0 6px 6px;
            overflow: hidden;
            line-height: 0px;
        }

        /* 手前にパタンと倒れてくる動く板 */
        .flap-hinge {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            transform-origin: bottom; /* 中央の線を軸に回転 */
            transform-style: preserve-3d;
            backface-visibility: hidden;
            z-index: 5;
        }

        /* 動く板の表面（倒れる前の上半分） */
        .hinge-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            border-bottom: 1px solid #000;
            border-radius: 6px 6px 0 0;
            overflow: hidden;
            line-height: 100px;
            backface-visibility: hidden;
            /* 倒れるとき、板の裏側に影を落とす効果 */
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.6); 
        }

        /* 動く板の裏面（倒れた後の下半分） */
        .hinge-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            border-top: 1px solid #000;
            border-radius: 0 0 6px 6px;
            overflow: hidden;
            line-height: 0px;
            transform: rotateX(180deg);
            backface-visibility: hidden;
            /* パタンと倒れた瞬間の衝撃の影 */
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.6); 
        }

        /* 色分け（JR中央線風） */
        .type-rapid { color: #ff4500; }
        .type-special { color: #ff8c00; }
        .type-commuter { color: #ff00ff; }
        .type-local { color: #ffffff; }
        .dest-color { color: #ffffff; }

        /* パタパタアニメーションの設定 */
        .play-flap {
            /* JavaScriptから渡されるミリ秒（--anim-duration）で1コマ確実に倒し切る */
            animation: flip-down-anim var(--anim-duration) ease-in forwards;
        }

        @keyframes flip-down-anim {
            0% { 
                transform: rotateX(0deg); 
                filter: brightness(1);
            }
            50% {
                filter: brightness(0.8); /* 傾いたときに少し暗くして立体感を出す */
            }
            100% { 
                transform: rotateX(-180deg); 
                filter: brightness(1);
            }
        }

        /* ボタン */
        button {
            margin-top: 40px;
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #ff4500;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        button:hover { background-color: #e03e00; }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

            { type: "湘南モノレール", class: "type-local", dest: "湘南江の島" },
            { type: "金沢シーサイドライン", class: "type-local", dest: "八景島" }

        let currentIndex = 0;

        function startSequence() {
            const btn = document.getElementById('btn');
            btn.disabled = true;

            // 2〜5秒の間でランダムに合計変転時間を決定
            const totalDuration = Math.floor(Math.random() * 3000) + 2000;
            const startTime = Date.now();

            // 完全に同期してめくるためのループ関数
            function nextTick() {
                const now = Date.now();
                const elapsed = now - startTime;
                const remaining = totalDuration - elapsed;

                // 基本のめくり速度（1コマ倒し切る時間）
                let currentInterval = 90; // 0.09秒でパタンと倒す

                // 残り1.5秒を切ったらブレーキ（徐々にゆっくりにする）
                if (remaining < 1500) {
                    const progress = (1500 - remaining) / 1500; // 0.0 〜 1.0
                    currentInterval = 90 + (360 * progress); // 最低0.45秒かけてゆっくり倒れる
                }

                const currentFlap = masterData[currentIndex];
                currentIndex = (currentIndex + 1) % masterData.length;
                const nextFlap = masterData[currentIndex];

                // 板をめくる（現在のスピードを渡す）
                flip('board-type', currentFlap.type, nextFlap.type, currentFlap.class, nextFlap.class, currentInterval);
                flip('board-dest', currentFlap.dest, nextFlap.dest, 'dest-color', 'dest-color', currentInterval);

                if (elapsed < totalDuration) {
                    // ★超重要：現在の板が「完全に倒れ切った（currentInterval分経過した）後」に次のコマの計算を始める
                    setTimeout(nextTick, currentInterval);
                } else {
                    btn.disabled = false;
                }
            }

            nextTick();
        }

        function flip(containerId, curText, nextText, curClass, nextClass, durationMs) {
            const container = document.getElementById(containerId);
            
            let curFontSize = "2.5rem";
            let nextFontSize = "2.5rem";

            if (curText.length > 4) {
                curFontSize = Math.max(1.1, 2.5 - (curText.length - 4) * 0.3) + "rem";
            }
            if (nextText.length > 4) {
                nextFontSize = Math.max(1.1, 2.5 - (nextText.length - 4) * 0.3) + "rem";
            }

            // ミリ秒を秒（s）の文字列に変換
            const speedStr = (durationMs / 1000) + "s";

            // HTMLをセットして、CSS変数（--anim-duration）に正確な時間を渡す
            container.innerHTML = `
                <div class="flap-up ${nextClass}" style="font-size: ${nextFontSize};">${nextText}</div>
                <div class="flap-down ${curClass}" style="font-size: ${curFontSize};">${curText}</div>
                <div class="flap-hinge play-flap" style="--anim-duration: ${speedStr};">
                    <div class="hinge-front ${curClass}" style="font-size: ${curFontSize};">${curText}</div>
                    <div class="hinge-back ${nextClass}" style="font-size: ${nextFontSize};">${nextText}</div>
                </div>
            `;

            // 板が下にバタンと衝突して重なる「直前」に、背後の固定下板も次の文字に同期させる
            setTimeout(() => {
                const downFlap = container.querySelector('.flap-down');
                if(downFlap) {
                    downFlap.textContent = nextText;
                    downFlap.className = `flap-down ${nextClass}`;
                    downFlap.style.fontSize = nextFontSize;
                }
            }, durationMs - 15);
        }
