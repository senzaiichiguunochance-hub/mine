<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ラングトンの蟻（ランダム移動）🐜✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&family=Noto+Sans+JP:wght@700&display=swap');

        :root {
            --bg-color: #fff0f5; /* ラベンダーピンク */
            --primary-color: #ff69b4; /* ホットピンク */
            --secondary-color: #87cefa; /* スカイブルー */
            --font-color: #5d5d5d;
            --canvas-bg: #ffffff;
            --canvas-border: #ffb6c1;
        }

        body {
            font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffe4e1 2px, transparent 2px);
            background-size: 30px 30px;
            color: var(--font-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.2em;
            font-weight: 700;
            color: var(--primary-color);
            text-shadow: 2px 2px 0px #ffffff;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-align: center;
        }

        #controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }

        .step-btn {
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 0.9em;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 0 #d14081;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .step-btn:hover {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #d14081;
        }

        .step-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .step-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .reset-btn {
            background: var(--secondary-color);
            box-shadow: 0 3px 0 #5fa9d6;
        }

        .reset-btn:hover {
            box-shadow: 0 2px 0 #5fa9d6;
        }

        #stepCounter {
            font-weight: 700;
            color: var(--font-color);
            margin-bottom: 15px;
            font-size: 1.1em;
            background: #ffffff;
            padding: 6px 18px;
            border-radius: 15px;
            box-shadow: 0 3px 0 #ffe0ea;
        }

        #legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            display: inline-block;
            border: 1px solid #00000022;
        }

        canvas {
            border: 5px solid var(--canvas-border);
            background-color: var(--canvas-bg);
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(255, 182, 193, 0.4);
            max-width: 100%;
        }

        .menu-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            color: #ffffff;
            text-decoration: none;
            background: var(--secondary-color);
            padding: 8px 18px;
            border-radius: 20px;
            z-index: 1000;
            font-weight: 700;
            box-shadow: 0 3px 0 #5fa9d6;
        }

        .menu-btn:hover {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #5fa9d6;
        }

        @media (max-width: 850px) {
            body {
                justify-content: flex-start;
                padding: 10px;
                padding-top: 60px;
            }
            h1 {
                font-size: 1.6em;
            }
            .menu-btn {
                position: fixed;
                top: 15px;
                right: 15px;
                width: auto;
            }
        }
    </style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
    <a href="menu.html" class="menu-btn">メニューに戻る</a>

    <h1>ラングトンの蟻（複数匹バージョン）🐜✨</h1>

    <div id="controls">
        <button type="button" class="step-btn" data-steps="1">1ステップ進む</button>
        <button type="button" class="step-btn" data-steps="10">10ステップ進む</button>
        <button type="button" class="step-btn" data-steps="100">100ステップ進む</button>
        <button type="button" class="step-btn" data-steps="1000">1000ステップ進む</button>
        <button type="button" class="step-btn" data-steps="10000">10000ステップ進む</button>
        <button type="button" class="step-btn" data-steps="100000">100000ステップ進む</button>
        <button type="button" id="resetBtn" class="step-btn reset-btn">🔄 リセット</button>
    </div>

    <div id="stepCounter">総ステップ数: 0</div>

    <div id="legend"></div>

    <canvas id="antCanvas"></canvas>

    <script>
        const canvas = document.getElementById('antCanvas');
        const ctx = canvas.getContext('2d');
        const stepCounterEl = document.getElementById('stepCounter');
        const legendEl = document.getElementById('legend');
        const resetBtn = document.getElementById('resetBtn');
        const stepButtons = document.querySelectorAll('.step-btn[data-steps]');

        // --- 設定 ---
        const GRID_WIDTH = 201; // グリッドの幅（奇数が中央配置に便利）
        const GRID_HEIGHT = 201; // グリッドの高さ
        let CELL_SIZE = 4;     // 1マスのピクセルサイズ (動的に変更)
        const CHUNK_SIZE = 2000; // 1フレームあたりに処理するステップ数

        const WHITE = 0;
        const BLACK = 1;

        // --- 状態 ---
        let grid;
        let ants = []; // 複数の蟻を保持する配列
        let totalSteps = 0;
        let isRunning = false; // 実行中フラグ（連打防止）

        // --- 蟻の向き (0:上, 1:右, 2:下, 3:左) ---
        const UP = 0;
        const RIGHT = 1;
        const DOWN = 2;
        const LEFT = 3;

        // 蟻ごとの色（見分けがつくように）
        const ANT_COLORS = ['#ff1493', '#1e90ff', '#32cd32'];

        // 初期化関数
        function init() {
            resizeCanvas();

            // グリッドを白(0)で初期化
            grid = Array(GRID_HEIGHT).fill(0).map(() => Array(GRID_WIDTH).fill(WHITE));

            // 3匹の蟻をランダムな位置と向きで初期化
            ants = [];
            for (let i = 0; i < 3; i++) {
                ants.push({
                    x: Math.floor(Math.random() * GRID_WIDTH),
                    y: Math.floor(Math.random() * GRID_HEIGHT),
                    dir: Math.floor(Math.random() * 4), // ランダムな初期向き
                    color: ANT_COLORS[i]
                });
            }

            totalSteps = 0;
            updateCounter();
            updateLegend();
            draw();
        }

        // キャンバスサイズを計算・設定
        function resizeCanvas() {
            const containerWidth = window.innerWidth * 0.95;
            const size = Math.floor(Math.min(containerWidth, 804)); // 最大804px
            canvas.width = size;
            canvas.height = size;
            CELL_SIZE = size / GRID_WIDTH;
        }

        // ステップ数表示を更新
        function updateCounter() {
            stepCounterEl.textContent = `総ステップ数: ${totalSteps.toLocaleString()}`;
        }

        // 蟻の色の凡例を表示
        function updateLegend() {
            legendEl.innerHTML = ants.map((ant, i) => `
                <span class="legend-item">
                    <span class="legend-dot" style="background:${ant.color}"></span>
                    蟻${i + 1}
                </span>
            `).join('');
        }

        // 描画関数
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // グリッドを描画
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    if (grid[y][x] === BLACK) {
                        ctx.fillStyle = '#ffb6c1'; // パステルピンク
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }

            // 蟻を描画（それぞれの色で）
            ants.forEach(ant => {
                if (ant.x >= 0 && ant.x < GRID_WIDTH && ant.y >= 0 && ant.y < GRID_HEIGHT) {
                    ctx.fillStyle = ant.color;
                    ctx.fillRect(ant.x * CELL_SIZE, ant.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            });
        }

        // 蟻を1ステップ動かす関数
        function step(ant) {
            // 現在の座標を範囲内に収める（念のため）
            ant.x = (ant.x + GRID_WIDTH) % GRID_WIDTH;
            ant.y = (ant.y + GRID_HEIGHT) % GRID_HEIGHT;

            const currentCellColor = grid[ant.y][ant.x];

            if (currentCellColor === WHITE) {
                // 右に90度回転
                ant.dir = (ant.dir + 1) % 4;
                // マスの色を反転
                grid[ant.y][ant.x] = BLACK;
            } else { // BLACK
                // 左に90度回転
                ant.dir = (ant.dir + 3) % 4; // +3は-1と同じ
                // マスの色を反転
                grid[ant.y][ant.x] = WHITE;
            }

            // 次の移動先を計算
            switch (ant.dir) {
                case UP:    ant.y--; break;
                case RIGHT: ant.x++; break;
                case DOWN:  ant.y++; break;
                case LEFT:  ant.x--; break;
            }

            // 画面端の処理：反対側から出てくる（トーラス構造）
            ant.x = (ant.x + GRID_WIDTH) % GRID_WIDTH;
            ant.y = (ant.y + GRID_HEIGHT) % GRID_HEIGHT;
        }

        // ボタンの有効/無効を切り替え
        function setButtonsEnabled(enabled) {
            stepButtons.forEach(btn => btn.disabled = !enabled);
            resetBtn.disabled = !enabled;
        }

        // 指定ステップ数を、フリーズしないようにチャンクに分けて実行
        function runSteps(totalToRun) {
            if (isRunning) return;
            isRunning = true;
            setButtonsEnabled(false);

            let remaining = totalToRun;

            function frame() {
                const thisChunk = Math.min(CHUNK_SIZE, remaining);
                for (let i = 0; i < thisChunk; i++) {
                    ants.forEach(step);
                }
                remaining -= thisChunk;
                totalSteps += thisChunk;

                draw();
                updateCounter();

                if (remaining > 0) {
                    requestAnimationFrame(frame);
                } else {
                    isRunning = false;
                    setButtonsEnabled(true);
                }
            }

            requestAnimationFrame(frame);
        }

        // ボタンのクリックイベント
        stepButtons.forEach(button => {
            button.addEventListener('click', () => {
                const steps = parseInt(button.getAttribute('data-steps'));
                runSteps(steps);
            });
        });

        // リセットボタン
        resetBtn.addEventListener('click', () => {
            if (isRunning) return;
            init();
        });

        // ウィンドウリサイズに対応
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (isRunning) return; // 実行中はリサイズ処理をスキップ
                resizeCanvas();
                draw();
            }, 150);
        });

        // 実行開始
        init();
    </script>

</body>
</html>
