<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>クマ出没タイムライン - レイアウト調整版</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
    body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: #1a1a2e; color: white; overflow: hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    
    /* 操作パネル */
    #ui-panel {
        position: absolute; top: 20px; left: 20px; z-index: 1000;
        background: rgba(26, 26, 46, 0.95); padding: 20px;
        border-radius: 12px; border: 1px solid #4ecca3;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        width: 250px;
    }
    .input-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.75rem; color: #4ecca3; margin-bottom: 3px; }
    input[type="date"] {
        width: 100%; padding: 8px; border-radius: 4px; border: none;
        background: #16213e; color: white; box-sizing: border-box;
    }
    button {
        width: 100%; padding: 12px; border-radius: 4px; border: none;
        background: #4ecca3; color: #1a1a2e; font-weight: bold;
        cursor: pointer; transition: 0.3s;
    }
    button:hover { background: #45b293; }
    button:disabled { background: #555; cursor: not-allowed; }

    /* 【変更点】現在の日付表示：画面中央上部よりやや下（青森付近） */
    #current-date-display {
        position: absolute; 
        top: 15%; /* 上から15%の位置（青森県あたりにかかる高さ） */
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: rgba(0, 0, 0, 0.7); 
        padding: 12px 30px;
        border-radius: 50px; 
        border: 2px solid #4ecca3;
        font-size: 2.2rem; 
        font-weight: bold; 
        font-family: 'Courier New', monospace;
        text-shadow: 0 0 10px #4ecca3;
        display: none;
        pointer-events: none; /* 地図操作の邪魔にならないように */
    }

    .bear-icon {
        font-size: 45px; text-align: center;
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        animation: bear-pop 1s ease-out forwards;
    }
    @keyframes bear-pop {
        0% { transform: scale(0); opacity: 0; }
        20% { transform: scale(1.4); opacity: 1; }
        100% { transform: scale(1); opacity: 0; }
    }
</style>
</head>
<body>

<div id="ui-panel">
    <h3 style="margin:0 0 15px 0; font-size: 1.1rem;">秋田クマ・シミュレーター</h3>
    <div class="input-group">
        <label>開始日</label>
        <input type="date" id="startDate">
    </div>
    <div class="input-group">
        <label>終了日</label>
        <input type="date" id="endDate">
    </div>
    <button id="btnStart">再生開始</button>
    <div id="status" style="font-size: 0.75rem; margin-top: 10px; color: #aaa;">データ読込中...</div>
</div>

<div id="current-date-display"></div>
<div id="map"></div>

<script>
const BASE_URL = "https://ckan.pref.akita.lg.jp/api/3/action/datastore_search";
const RESOURCE_ID = "326bfe79-3f64-401b-9862-b37a477c7211";

// 地図初期化（少し北寄り、青森が見える位置に調整）
const map = L.map("map", { zoomControl: false }).setView([40.0, 140.5], 8);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: "© OpenStreetMap"
}).addTo(map);

let sightingsData = [];
let timer = null;

function setInitialDates() {
    const end = new Date();
    const start = new Date();
    start.setMonth(start.getMonth() - 3);
    document.getElementById('endDate').value = end.toISOString().split('T')[0];
    document.getElementById('startDate').value = start.toISOString().split('T')[0];
}

async function fetchData() {
    try {
        const url = `${BASE_URL}?resource_id=${RESOURCE_ID}&limit=99999`;
        const response = await fetch(url);
        const data = await response.json();
        sightingsData = data.result.records;
        document.getElementById('status').innerText = "✅ データ準備完了";
    } catch (e) {
        document.getElementById('status').innerText = "❌ データ取得失敗";
    }
}

function startSimulation() {
    if (timer) clearInterval(timer);
    
    const startVal = document.getElementById('startDate').value;
    const endVal = document.getElementById('endDate').value;
    const dateDisplay = document.getElementById('current-date-display');
    const btn = document.getElementById('btnStart');
    
    if (!startVal || !endVal) return alert("日付を選択してください");

    const startLimit = new Date(startVal);
    const endLimit = new Date(endVal);

    // 期間フィルタリング
    let dailyBears = {};
    sightingsData.forEach(r => {
        const dStr = (r["目撃日時"] || r["出没日時"] || "").split(' ')[0];
        const d = new Date(dStr);
        if (d >= startLimit && d <= endLimit) {
            if (!dailyBears[dStr]) dailyBears[dStr] = [];
            dailyBears[dStr].push({ lat: parseFloat(r["x(緯度)"]), lng: parseFloat(r["y(経度)"]) });
        }
    });

    const sortedDates = Object.keys(dailyBears).sort((a, b) => new Date(a) - new Date(b));
    
    if (sortedDates.length === 0) {
        return alert("指定期間にデータがありません。");
    }

    // 再生開始
    dateDisplay.style.display = 'block';
    btn.disabled = true;
    btn.innerText = "再生中...";
    let index = 0;

    timer = setInterval(() => {
        const currentDate = sortedDates[index];
        dateDisplay.innerText = currentDate.replace(/-/g, '/');

        dailyBears[currentDate].forEach(bear => {
            if (isFinite(bear.lat) && isFinite(bear.lng)) {
                showBearMarker(bear.lat, bear.lng);
            }
        });

        index++;
        if (index >= sortedDates.length) {
            clearInterval(timer);
            dateDisplay.innerText += " (終了)";
            btn.disabled = false;
            btn.innerText = "再開する";
        }
    }, 1000);
}

function showBearMarker(lat, lng) {
    const bearIcon = L.divIcon({
        html: '<div class="bear-icon">🐻</div>',
        className: 'custom-div-icon',
        iconSize: [50, 50],
        iconAnchor: [25, 25]
    });
    const marker = L.marker([lat, lng], { icon: bearIcon }).addTo(map);
    setTimeout(() => map.removeLayer(marker), 1000);
}

window.onload = () => {
    setInitialDates();
    fetchData();
    document.getElementById('btnStart').onclick = startSimulation;
};
</script>
</body>
</html>
