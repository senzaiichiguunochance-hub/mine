<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>日本地震タイムライン</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    body { margin: 0; font-family: sans-serif; background: #000; color: white; overflow: hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; position: absolute; top: 0; left: 0; }
    #fx-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

    #ui-panel {
        position: absolute; top: 20px; left: 20px; z-index: 1000;
        background: rgba(0, 0, 0, 0.85); padding: 15px;
        border-radius: 12px; border: 1px solid #ff4500; width: 240px;
    }
    .input-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.75rem; color: #ff4500; margin-bottom: 3px; }
    input[type="date"], select { width: 100%; padding: 8px; border-radius: 4px; border: none; background: #222; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; border-radius: 4px; border: none; background: #ff4500; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #444; }

    #current-date-display {
        position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
        z-index: 1000; background: rgba(0, 0, 0, 0.7); padding: 10px 30px; border-radius: 50px; 
        border: 2px solid #ff4500; font-size: 1.8rem; font-weight: bold; text-shadow: 0 0 10px #ff4500; display: none;
    }

    /* 震度バッジの基本設定 */
    .shindo-badge {
        background: rgba(255, 255, 255, 0.9); color: #000;
        border-radius: 50%; text-align: center; font-weight: bold;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid #ff4500; box-shadow: 0 0 4px #ff4500;
        white-space: nowrap;
    }
</style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>


<div id="ui-panel">
    <h3 style="margin:0 0 10px 0; font-size: 1rem; color:#ff4500;">地震発生シミュレーター</h3>
    <div class="input-group"><label>開始日</label><input type="date" id="startDate"></div>
    <div class="input-group"><label>終了日</label><input type="date" id="endDate"></div>
    <div class="input-group">
        <label>表示する最小震度</label>
        <select id="minScale">
            <option value="10">震度1以上</option>
            <option value="20">震度2以上</option>
            <option value="30" selected>震度3以上</option>
            <option value="40">震度4以上</option>
            <option value="45">震度5弱以上</option>
            <option value="50">震度5強以上</option>
            <option value="60">震度6以上</option>
        </select>
    </div>
    <button id="btnStart">シミュレーション開始</button>
    <div id="status" style="font-size: 0.7rem; margin-top: 8px; color: #aaa;">API通信中...</div>
</div>

<div id="current-date-display"></div>
<canvas id="fx-canvas"></canvas>
<div id="map"></div>

<script>
const P2P_API_URL = "https://api.p2pquake.net/v2/history?codes=551&limit=100";
const map = L.map("map", { zoomControl: false }).setView([36.5, 138.0], 5);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png").addTo(map);

const canvas = document.getElementById('fx-canvas');
const ctx = canvas.getContext('2d');
let particles = [], earthquakeData = [], timer = null;

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

class Particle {
    constructor(x, y, hue, scale) {
        this.x = x; this.y = y;
        const intensity = scale / 10; 
        this.vx = (Math.random() - 0.5) * (intensity * 2.5);
        this.vy = (Math.random() - 0.5) * (intensity * 2.5);
        this.size = (Math.random() * 1.5 + 0.5) * (intensity * 0.5);
        this.hue = hue; this.alpha = 1;
    }
    update() { this.x += this.vx; this.y += this.vy; this.alpha -= 0.015; }
    draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.alpha})`; ctx.fill();
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(); particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
    }
    requestAnimationFrame(animate);
}
animate();

function getScaleText(scale) {
    if (scale >= 60) return "6"; if (scale >= 50) return "5";
    return Math.floor(scale / 10).toString();
}

async function fetchData() {
    try {
        const res = await fetch(P2P_API_URL);
        const data = await res.json();
        earthquakeData = data.filter(r => r.earthquake?.hypocenter?.latitude !== -200);
        document.getElementById('status').innerText = "✅ 準備完了";
    } catch (e) { document.getElementById('status').innerText = "❌ API取得エラー"; }
}

function startSimulation() {
    if (timer) clearInterval(timer);
    const startLimit = new Date(document.getElementById('startDate').value);
    const endLimit = new Date(document.getElementById('endDate').value);
    const minScale = parseInt(document.getElementById('minScale').value);
    const dateDisplay = document.getElementById('current-date-display');
    
    let dailyEvents = {};
    earthquakeData.forEach(r => {
        const d = new Date(r.time), scale = r.earthquake.maxScale || 0;
        if (d >= startLimit && d <= endLimit && scale >= minScale) {
            const dStr = r.time.split(' ')[0].replace(/\//g, '-');
            if (!dailyEvents[dStr]) dailyEvents[dStr] = [];
            dailyEvents[dStr].push({ lat: r.earthquake.hypocenter.latitude, lng: r.earthquake.hypocenter.longitude, scale: scale });
        }
    });

    const sortedDates = Object.keys(dailyEvents).sort((a, b) => new Date(a) - new Date(b));
    if (sortedDates.length === 0) return alert("データなし");

    dateDisplay.style.display = 'block';
    document.getElementById('btnStart').disabled = true;
    let index = 0;

    timer = setInterval(() => {
        const currentDate = sortedDates[index];
        dateDisplay.innerText = currentDate.replace(/-/g, '/');
        dailyEvents[currentDate].forEach(q => triggerVisual(q.lat, q.lng, q.scale));
        index++;
        if (index >= sortedDates.length) { clearInterval(timer); document.getElementById('btnStart').disabled = false; }
    }, 1000);
}

function triggerVisual(lat, lng, scale) {
    const pt = map.latLngToContainerPoint([lat, lng]);
    let hue = scale >= 50 ? 0 : (scale >= 30 ? 45 : 200);
    for (let i = 0; i < (scale / 10) * 20; i++) particles.push(new Particle(pt.x, pt.y, hue, scale));

    // 震度1を12pxとして、震度が1上がるごとに1.2倍にする計算
    const rawScale = scale / 10;
    const size = 12 * Math.pow(1.2, rawScale - 1);
    const fontSize = size * 0.6; // 文字も円に合わせて調整

    const icon = L.divIcon({
        html: `<div class="shindo-badge" style="width:${size}px; height:${size}px; font-size:${fontSize}px;">${getScaleText(scale)}</div>`,
        className: 'custom-div-icon', 
        iconSize: [size, size], 
        iconAnchor: [size/2, size/2]
    });
    const marker = L.marker([lat, lng], { icon: icon }).addTo(map);
    setTimeout(() => map.removeLayer(marker), 1000);
}

window.onload = () => {
    const end = new Date(), start = new Date();
    start.setMonth(start.getMonth() - 3);
    document.getElementById('endDate').value = end.toISOString().split('T')[0];
    document.getElementById('startDate').value = start.toISOString().split('T')[0];
    fetchData();
    document.getElementById('btnStart').onclick = startSimulation;
};
</script>
</body>
</html>
