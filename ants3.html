<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ラングトンの蟻（自動移動）🐜🍭</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&family=Noto+Sans+JP:wght@700&display=swap');

        :root {
            --bg-color: #fffaf0; /* フローラルホワイト */
            --panel-bg: #ffffff;
            --sidebar-bg: #fff0f5;
            --primary-accent: #ff69b4; /* ホットピンク */
            --secondary-accent: #3cb371; /* ミディアムシーグリーン（ミント風） */
            --text-main: #5d5d5d;
            --text-dim: #999;
            --border-color: #ffb6c1;
            --font-ui: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
        }

        body {
            font-family: var(--font-ui);
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        #main-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffe4e1 2px, transparent 2px);
            background-size: 40px 40px;
        }

        canvas {
            border: 5px solid var(--primary-accent);
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.2);
        }

        #control-panel {
            width: 320px;
            padding: 30px;
            background-color: var(--sidebar-bg);
            border-left: 4px solid var(--primary-accent);
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
        }

        h1, h2 {
            text-align: center;
            margin: 0 0 15px 0;
            padding-bottom: 15px;
        }

        h1 {
            color: var(--primary-accent);
            font-size: 1.6em;
            border-bottom: 3px dashed var(--primary-accent);
        }

        h2 {
            color: var(--secondary-accent);
            font-size: 1.2em;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
        }

        .control-group {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            border: 2px solid #ffebf0;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            font-family: var(--font-ui);
            font-weight: 700;
            cursor: pointer;
            border: none;
            border-radius: 25px;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 10px;
        }

        #startStopButton {
            background-color: var(--primary-accent);
            color: #ffffff;
            box-shadow: 0 4px 0 #d14081;
        }
        #startStopButton:hover {
            opacity: 0.9;
        }
        #startStopButton:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #d14081;
        }

        #resetButton {
            background-color: #ffffff;
            color: var(--primary-accent);
            border: 2px solid var(--primary-accent);
        }
        #resetButton:hover {
            background-color: var(--primary-accent);
            color: #ffffff;
        }

        #stats {
            font-size: 1em;
            line-height: 1.8;
        }

        #stats p {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        #stats span {
            font-weight: 700;
            color: var(--primary-accent);
        }

        .menu-btn {
            position: fixed;
            top: 20px;
            right: 340px; /* Sidebar width + 20px */
            font-size: 14px;
            color: #ffffff;
            text-decoration: none;
            background: #87cefa; /* スカイブルー */
            padding: 8px 18px;
            border-radius: 20px;
            z-index: 1000;
            font-weight: 700;
            box-shadow: 0 3px 0 #5fa9d6;
        }

        @media (max-width: 768px) {
            body {
                overflow: auto;
                padding-top: 60px;
            }
            #main-container {
                flex-direction: column;
                height: auto;
            }
            #canvas-container {
                height: 60vh;
                padding: 10px;
            }
            #control-panel {
                width: 100%;
                border-left: none;
                border-top: 4px solid var(--primary-accent);
                padding: 20px;
            }
            .menu-btn {
                right: 20px;
            }
        }

    </style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
    <a href="menu.html" class="menu-btn">メニューに戻る</a>


    <div id="main-container">
        <div id="canvas-container">
            <canvas id="antCanvas"></canvas>
        </div>
        <div id="control-panel">
            <h1>ラングトンの蟻（自動移動）</h1>
            <div class="control-group">
                <h2>SIMULATION</h2>
                <button id="startStopButton">開始</button>
                <button id="resetButton">リセット</button>
            </div>
            <div class="control-group">
                <h2>INFORMATION</h2>
                <div id="stats">
                    <p>ステップ数: <span id="step-count">0</span></p>
                    <p>蟻の数: <span id="ant-count">0</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('antCanvas');
        const ctx = canvas.getContext('2d');
        const startStopButton = document.getElementById('startStopButton');
        const resetButton = document.getElementById('resetButton');
        const stepCountSpan = document.getElementById('step-count');
        const antCountSpan = document.getElementById('ant-count');

        const CELL_SIZE = 5;
        let GRID_WIDTH, GRID_HEIGHT;
        let grid; // グリッドの構造を変更
        let ants = [];
        let totalSteps = 0;
        let animationFrameId;
        let isRunning = false;

        // 利用可能なルールセット
        const baseRules = ['RL', 'RRL', 'LLR', 'LRRL', 'RRLL', 'LLRR'];
        // 動的に生成される蟻のルール（色を含む）
        let antRules = [];

        function generateKawaiiColor(index, total) {
            // 色相を均等に分散させて重複を避ける
            const hue = (index * 137.5) % 360; // 黄金角を使用して分散
            return `hsl(${hue}, 70%, 75%)`; // 彩度高め、輝度高めのパステルカラー
        }

        function init() {
            const container = document.getElementById('canvas-container');
            GRID_WIDTH = Math.floor(container.clientWidth / CELL_SIZE);
            GRID_HEIGHT = Math.floor(container.clientHeight / CELL_SIZE);
            canvas.width = GRID_WIDTH * CELL_SIZE;
            canvas.height = GRID_HEIGHT * CELL_SIZE;

            // グリッドを [状態, 蟻の種類] で初期化
            grid = Array.from({ length: GRID_HEIGHT }, () => Array(GRID_WIDTH).fill(null).map(() => [0, -1]));
            ants = [];
            antRules = []; // ルールもリセット
            totalSteps = 0;
            
            for (let i = 0; i < 10; i++) {
                addAnt();
            }

            updateStats();
            draw();
        }

        function addAnt() {
            const color = generateKawaiiColor(antRules.length);
            const ruleString = baseRules[Math.floor(Math.random() * baseRules.length)];
            
            const newRule = { color: color, rule: ruleString };
            const ruleIndex = antRules.length;
            antRules.push(newRule);

            ants.push({
                x: Math.floor(Math.random() * GRID_WIDTH),
                y: Math.floor(Math.random() * GRID_HEIGHT),
                dir: Math.floor(Math.random() * 4),
                ruleIndex: ruleIndex,
                ...newRule
            });
        }

        function draw() {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // グリッド（軌跡）を描画
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    const [state, antRuleIndex] = grid[y][x];
                    if (state > 0 && antRuleIndex !== -1) {
                        ctx.fillStyle = antRules[antRuleIndex].color;
                        ctx.globalAlpha = 0.3; // 軌跡は薄めに
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        ctx.globalAlpha = 1.0;
                    }
                }
            }

            // 蟻本体を描画
            ants.forEach(ant => {
                ctx.fillStyle = ant.color;
                ctx.fillRect(ant.x * CELL_SIZE, ant.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                // 蟻の縁取り
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(ant.x * CELL_SIZE, ant.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            });
        }

        function step() {
            ants.forEach(ant => {
                if (ant.x < 0 || ant.x >= GRID_WIDTH || ant.y < 0 || ant.y >= GRID_HEIGHT) {
                    ant.x = Math.floor(GRID_WIDTH / 2);
                    ant.y = Math.floor(GRID_HEIGHT / 2);
                    return;
                }

                const [state, _] = grid[ant.y][ant.x];
                
                // 壁チェック（stateが-1なら壁）
                if (state === -1) {
                    ant.dir = (ant.dir + 2) % 4; // 壁に当たったら180度反転
                    return;
                }

                const turn = ant.rule[state % ant.rule.length];

                if (turn === 'R') ant.dir = (ant.dir + 1) % 4;
                else if (turn === 'L') ant.dir = (ant.dir + 3) % 4;

                // グリッドの状態と、どの蟻が通ったかを記録
                grid[ant.y][ant.x] = [state + 1, ant.ruleIndex];

                switch (ant.dir) {
                    case 0: ant.y--; break; // Up
                    case 1: ant.x++; break; // Right
                    case 2: ant.y++; break; // Down
                    case 3: ant.x--; break; // Left
                }
            });
            totalSteps++;
        }

        function gameLoop() {
            for (let i = 0; i < 5; i++) {
                step();
            }
            draw();
            updateStats();
            if (isRunning) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function updateStats() {
            stepCountSpan.textContent = totalSteps.toLocaleString();
            antCountSpan.textContent = ants.length;
        }

        startStopButton.addEventListener('click', () => {
            isRunning = !isRunning;
            if (isRunning) {
                startStopButton.textContent = '停止';
                gameLoop();
            } else {
                startStopButton.textContent = '開始';
                cancelAnimationFrame(animationFrameId);
            }
        });

        resetButton.addEventListener('click', () => {
            isRunning = false;
            startStopButton.textContent = '開始';
            cancelAnimationFrame(animationFrameId);
            init();
        });
        
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / CELL_SIZE);
            const y = Math.floor((e.clientY - rect.top) / CELL_SIZE);

            if (e.shiftKey) { // Shift+Clickで壁を設置
                 grid[y][x] = [-1, -1]; // 壁を特別な値でマーク
            } else { // 通常のクリックで蟻を追加
                addAnt();
                ants[ants.length-1].x = x;
                ants[ants.length-1].y = y;
            }
            draw();
            updateStats();
        });

        init();
    </script>
</body>
</html>
