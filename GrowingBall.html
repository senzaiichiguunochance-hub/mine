<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成長するボール</title>
    <style>
        /* スワイプ時のブラウザ標準挙動（更新など）を禁止 */
        body { 
            margin: 0; overflow: hidden; background: #020617; 
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; 
            color: white; display: flex; 
            touch-action: none; /* 画面全体のスクロールを無効化 */
        }
        
        #config-panel {
            width: 280px; height: 100vh; background: rgba(15, 23, 42, 0.95); border-right: 1px solid #334155;
            padding: 20px; box-sizing: border-box; z-index: 1000; display: flex; flex-direction: column; gap: 18px;
            overflow-y: auto; transition: transform 0.3s ease;
            touch-action: pan-y; /* パネル内だけは上下スクロールを許可 */
        }

        #menu-toggle {
            position: absolute; top: 15px; left: 15px; z-index: 1100;
            background: #38bdf8; border: none; color: white; padding: 8px 12px;
            border-radius: 4px; cursor: pointer; font-weight: bold; display: none;
        }
        
        @media screen and (max-width: 840px) {
            #config-panel { position: absolute; left: 0; transform: translateX(-100%); }
            #config-panel.open { transform: translateX(0); }
            #menu-toggle { display: block; }
        }

        h2 { font-size: 18px; margin: 0 0 10px 0; color: #38bdf8; border-bottom: 2px solid #38bdf8; padding-bottom: 5px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .label-row { display: flex; justify-content: space-between; align-items: center; }
        label { font-size: 14px; font-weight: bold; color: #f1f5f9; }
        .val-display { color: #38bdf8; font-family: monospace; font-weight: bold; }
        input[type="range"] { cursor: pointer; accent-color: #38bdf8; margin-top: 4px; }
        
        #game-container { flex-grow: 1; position: relative; overflow: hidden; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-overlay { position: absolute; top: 20px; right: 20px; pointer-events: none; text-align: right; }
        .score-val { font-size: 36px; font-weight: bold; color: #38bdf8; }
        #msg { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 50px; font-weight: bold; opacity: 0; color: #fbbf24; pointer-events: none; transition: opacity 0.3s; z-index: 500; }
        
        .nav-btn { position: absolute; top: 20px; right: 20px; font-size: 14px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000; }
    </style>
</head>
<body>
    <button id="menu-toggle">設定 ☰</button>
    <a href="menu.html" class="nav-btn">メニューに戻る</a>

    <div id="config-panel">
        <h2>ゲーム設定</h2>
        <div class="control-group">
            <div class="label-row"><label>最大ボール数</label><span class="val-display" id="val-maxBalls">100</span></div>
            <input type="range" id="input-maxBalls" min="1" max="100" value="100">
        </div>
        <div class="control-group">
            <div class="label-row"><label>現在表示数</label><span class="val-display" id="val-currentBalls">0</span></div>
        </div>
        <div class="control-group">
            <div class="label-row"><label>基本サイズ</label><span class="val-display" id="val-baseSize">20</span></div>
            <input type="range" id="input-baseSize" min="5" max="50" value="20">
        </div>
        <div class="control-group">
            <div class="label-row"><label>クリアサイズ</label><span class="val-display" id="val-clearSize">3.0</span></div>
            <input type="range" id="input-clearSize" min="2.0" max="10.0" step="0.5" value="3.0">
        </div>
        <div class="control-group">
            <div class="label-row"><label>障害物の数</label><span class="val-display" id="val-gimmickCount">30</span></div>
            <input type="range" id="input-gimmickCount" min="0" max="100" value="30">
        </div>
        <div class="control-group">
            <div class="label-row"><label>合体許容誤差</label><span class="val-display" id="val-tolerance">1.0</span></div>
            <input type="range" id="input-tolerance" min="0.1" max="2.0" step="0.1" value="1.0">
        </div>
    </div>

    <div id="game-container">
        <div id="ui-overlay">
            <div style="font-size: 14px; color: #94a3b8;">SCORE</div>
            <div class="score-val" id="score">0</div>
        </div>
        <div id="msg">EXCELLENT!</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const currentBallsEl = document.getElementById('val-currentBalls');
        const msgEl = document.getElementById('msg');
        const panel = document.getElementById('config-panel');
        const toggleBtn = document.getElementById('menu-toggle');

        const settings = { maxBalls: 100, baseSize: 20, clearSize: 3.0, gimmickCount: 30, tolerance: 1.0 };

        toggleBtn.addEventListener('click', () => {
            panel.classList.toggle('open');
            setTimeout(resize, 300);
        });

        document.querySelectorAll('input[type="range"]').forEach(input => {
            input.addEventListener('input', (e) => {
                const key = e.target.id.replace('input-', '');
                const val = parseFloat(e.target.value);
                settings[key] = val;
                document.getElementById('val-' + key).innerText = (key === 'tolerance' || key === 'clearSize') ? val.toFixed(1) : val;
                if (key === 'gimmickCount' || key === 'baseSize') createStage();
            });
        });

        let width, height, score = 0, time = 0;
        let paddle = { x: 0, y: 0, w: 160, h: 15, color: '#38bdf8' };
        let balls = [], gimmicks = [], guides = [], particles = [];

        window.addEventListener('resize', resize);
        function resize() {
            const isMobile = window.innerWidth <= 840;
            width = canvas.width = window.innerWidth - (isMobile ? 0 : 280);
            height = canvas.height = window.innerHeight;
            paddle.y = height - 60;
            createStage();
        }

        // スマホのスワイプとマウス移動の両方を処理
        const handleMove = (e) => {
            // タッチイベントかマウスイベントかを判定してX座標を取得
            const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
            // 設定パネルが表示されているPCモードの場合は座標をオフセット
            const isMobile = window.innerWidth <= 840;
            const offsetX = isMobile ? 0 : 280;
            
            paddle.x = (clientX - offsetX) - paddle.w / 2;
        };

        // イベントリスナーの登録（preventDefaultでブラウザのスクロールを止める）
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('touchstart', handleMove, {passive: false});
        canvas.addEventListener('touchmove', (e) => {
            handleMove(e);
            e.preventDefault(); // これによりスワイプ中の画面ガタつきを防止
        }, {passive: false});

        function createStage() {
            gimmicks = []; guides = [];
            guides.push({ x1: 0, y1: height * 0.7, x2: width * 0.35, y2: height - 60 });
            guides.push({ x1: width, y1: height * 0.7, x2: width * 0.65, y2: height - 60 });
            for (let i = 0; i < settings.gimmickCount; i++) {
                const g = {
                    x: Math.random() * width, y: 100 + Math.random() * (height - 400),
                    w: 60, h: 12, type: Math.random() < 0.5 ? 'rotator' : 'mover',
                    angle: 0, speed: 0.03 + Math.random() * 0.04, originX: 0,
                    phase: Math.random() * Math.PI * 2, color: `rgba(100, 116, 139, 0.6)`
                };
                g.originX = g.x;
                gimmicks.push(g);
            }
        }

        function createFirework(x, y, color) {
            for (let i = 0; i < 50; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 8;
                particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: 2 + Math.random() * 3, life: 1.0, decay: 0.015 + Math.random() * 0.02, color });
            }
        }

        function spawnBalls() {
            const gap = settings.maxBalls - balls.length;
            if (gap > 0) {
                for (let i = 0; i < Math.min(gap, 5); i++) {
                    if (Math.random() < 0.5) { 
                        balls.push({ x: Math.random() * width, y: -settings.baseSize, vx: (Math.random()-0.5)*4, vy: 0, size: 1.0, r: settings.baseSize / 2, color: 'hsl(210, 80%, 60%)', toDelete: false });
                    }
                }
            }
        }

        function resolveBallCollision(b1, b2) {
            const dx = b2.x - b1.x, dy = b2.y - b1.y, dist = Math.hypot(dx, dy);
            const minDist = b1.r + b2.r;
            if (dist < minDist && dist > 0) {
                if (Math.abs(b1.size - b2.size) <= settings.tolerance && !b1.toDelete && !b2.toDelete) {
                    const newB = b1.size >= b2.size ? b1 : b2;
                    const delB = b1.size >= b2.size ? b2 : b1;
                    delB.toDelete = true;
                    newB.size *= 1.1;
                    newB.r = (settings.baseSize / 2) * newB.size;
                    score += Math.round(newB.size * 10);
                    if (newB.size >= settings.clearSize) { 
                        newB.toDelete = true; score += Math.round(settings.clearSize * 200); 
                        createFirework(newB.x, newB.y, newB.color);
                        msgEl.style.opacity = 1; setTimeout(() => msgEl.style.opacity = 0, 500);
                    }
                    return;
                }
                const overlap = minDist - dist, nx = dx / dist, ny = dy / dist;
                b1.x -= nx * overlap / 2; b1.y -= ny * overlap / 2;
                b2.x += nx * overlap / 2; b2.y += ny * overlap / 2;
                const relVX = b1.vx - b2.vx, relVY = b1.vy - b2.vy;
                const velNormal = relVX * nx + relVY * ny;
                if (velNormal < 0) return;
                const impulse = -1.2 * velNormal / (1/b1.size + 1/b2.size);
                b1.vx += (impulse / b1.size) * nx; b1.vy += (impulse / b1.size) * ny;
                b2.vx -= (impulse / b2.size) * nx; b2.vy -= (impulse / b2.size) * ny;
            }
        }

        function update() {
            time++; spawnBalls();
            currentBallsEl.innerText = balls.length;
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) resolveBallCollision(balls[i], balls[j]);
            }
            gimmicks.forEach(g => {
                if (g.type === 'rotator') g.angle += g.speed;
                else g.x = g.originX + Math.sin(time * 0.05 + g.phase) * 60;
            });
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                if (b.toDelete) { balls.splice(i, 1); continue; }
                b.vy += 0.22; b.x += b.vx; b.y += b.vy;
                guides.forEach(w => {
                    const l2 = (w.x2-w.x1)**2 + (w.y2-w.y1)**2;
                    let t = Math.max(0, Math.min(1, ((b.x-w.x1)*(w.x2-w.x1) + (b.y-w.y1)*(w.y2-w.y1)) / l2));
                    const px = w.x1 + t * (w.x2-w.x1), py = w.y1 + t * (w.y2-w.y1);
                    const dist = Math.hypot(b.x - px, b.y - py);
                    if (dist < b.r) {
                        const nx = (b.x - px) / dist, ny = (b.y - py) / dist;
                        const dot = b.vx * nx + b.vy * ny;
                        b.vx -= 1.8 * dot * nx; b.vy -= 1.8 * dot * ny;
                        b.x = px + nx * b.r; b.y = py + ny * b.r;
                    }
                });
                gimmicks.forEach(g => {
                    let dx = b.x - g.x, dy = b.y - g.y, cos = Math.cos(-g.angle), sin = Math.sin(-g.angle);
                    let rx = dx * cos - dy * sin, ry = dx * sin + dy * cos;
                    if (Math.abs(rx) < g.w / 2 + b.r && Math.abs(ry) < g.h / 2 + b.r) {
                        let nx = 0, ny = 0;
                        if (Math.abs(rx) / g.w > Math.abs(ry) / g.h) nx = rx > 0 ? 1 : -1; else ny = ry > 0 ? 1 : -1;
                        let wnx = nx * Math.cos(g.angle) - ny * Math.sin(g.angle), wny = nx * Math.sin(g.angle) + ny * Math.cos(g.angle);
                        let dot = b.vx * wnx + b.vy * wny;
                        if (dot < 0) { b.vx -= 1.6 * dot * wnx; b.vy -= 1.6 * dot * wny; }
                        b.x += wnx * 2; b.y += wny * 2;
                    }
                });
                if (b.y + b.r > paddle.y && b.y - b.r < paddle.y + paddle.h && b.x > paddle.x && b.x < paddle.x + paddle.w) {
                    b.vy = -Math.abs(b.vy) * 0.8 - 3; b.y = paddle.y - b.r;
                }
                if (b.y > height) { score -= Math.round(b.size * 15); balls.splice(i, 1); }
                if (b.x < 0 || b.x > width) b.vx *= -0.8;
                const range = (settings.clearSize - 1) || 1;
                b.color = `hsl(${Math.max(0, 220 - (b.size - 1) * (180 / range))}, 80%, 60%)`;
            }
            scoreEl.innerText = score;
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 15; ctx.lineCap = "round";
            guides.forEach(w => { ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke(); });
            gimmicks.forEach(g => {
                ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.angle);
                ctx.fillStyle = g.color; ctx.fillRect(-g.w/2, -g.h/2, g.w, g.h); ctx.restore();
            });
            particles.forEach(p => {
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0; ctx.fillStyle = paddle.color; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
            balls.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fillStyle = b.color; ctx.fill();
                ctx.strokeStyle = "white"; ctx.lineWidth = 1; ctx.stroke();
                ctx.fillStyle = "white"; ctx.font = `bold ${Math.max(8, b.r * 0.6)}px Arial`;
                ctx.textAlign = "center"; ctx.fillText(b.size.toFixed(1), b.x, b.y + b.r * 0.3);
            });
        }

        function animate() { update(); draw(); requestAnimationFrame(animate); }
        resize();
        animate();
    </script>
</body>
</html>
