<!DOCTYPE html>
<html lang="ja" data-theme="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可変サイズ ナンプレ</title>
  <style>
    /* --- カラーテーマ定義 --- */
    :root[data-theme="classic"] {
      --bg-color: #f4f6f9;
      --panel-bg: #ffffff;
      --text-color: #333333;
      --border-color: #cccccc;
      --thick-border: #333333;
      --cell-fixed: #e9ecef;
      --primary-color: #1e88e5;
      --primary-hover: #1565c0;
      --primary-text: #ffffff;
      --accent-border: #ff9800;
    }
    :root[data-theme="dark"] {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --border-color: #444444;
      --thick-border: #ffffff;
      --cell-fixed: #2d2d2d;
      --primary-color: #90caf9;
      --primary-hover: #64b5f6;
      --primary-text: #121212;
      --accent-border: #ffd54f;
    }
    :root[data-theme="pastel"] {
      --bg-color: #fef6f6;
      --panel-bg: #ffffff;
      --text-color: #4a4a4a;
      --border-color: #f3d1d1;
      --thick-border: #e5989b;
      --cell-fixed: #fbefff;
      --primary-color: #b5e2fa;
      --primary-hover: #9cd5f4;
      --primary-text: #333333;
      --accent-border: #ffb703;
    }
    :root[data-theme="retro"] {
      --bg-color: #f4ebd9;
      --panel-bg: #fdf8ec;
      --text-color: #463f3a;
      --border-color: #bcb8b1;
      --thick-border: #8a5a44;
      --cell-fixed: #e0d8c3;
      --primary-color: #b07d62;
      --primary-hover: #8a5a44;
      --primary-text: #ffffff;
      --accent-border: #d4a373;
    }

    * { box-sizing: border-box; font-family: sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0; padding: 10px;
      display: flex; flex-direction: column; align-items: center;
      transition: background-color 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    h1 { margin: 5px 0 10px 0; font-size: 1.4rem; }

    .back-link {
      align-self: flex-end; margin: 0 0 4px 0;
      font-size: 16px; color: #333; text-decoration: none;
      background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px;
    }

    /* 設定エリア */
    .controls-panel {
      background: var(--panel-bg);
      padding: 10px; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; align-items: center;
      max-width: 500px; width: 100%; margin-bottom: 10px;
    }
    .control-group {
      display: flex; align-items: center; gap: 4px; font-size: 0.8rem;
    }
    select {
      padding: 4px 6px; border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--panel-bg); color: var(--text-color);
    }

    button {
      background: var(--primary-color);
      color: var(--primary-text); border: none; padding: 6px 10px;
      border-radius: 4px; cursor: pointer; font-weight: bold;
      transition: background 0.2s; font-size: 0.85rem;
    }
    button.secondary { background: #78909c; color: #fff; }
    /* ホバーはマウス環境のみ(タッチ端末で押した後に色が残るのを防止) */
    @media (hover: hover) {
      button:hover { background: var(--primary-hover); }
      button.secondary:hover { background: #546e7a; }
      .num-btn:hover, .tab-btn:hover { background: var(--cell-fixed); }
      .tab-btn.active:hover { background: var(--primary-hover); }
      .btn-share:hover { background: var(--primary-color); color: var(--primary-text); }
    }

    /* タイマー＆情報エリア */
    .status-bar {
      display: flex; gap: 15px; align-items: center; justify-content: space-between;
      width: 100%; max-width: 450px; margin-bottom: 8px; font-size: 0.85rem;
    }
    .timer-container { font-weight: bold; }
    .best-time { color: #888; font-size: 0.75rem; }

    /* 初心者ガイド表示 */
    .usage-guide {
      background: rgba(30, 136, 229, 0.1);
      color: var(--text-color);
      border-left: 4px solid var(--primary-color);
      padding: 6px 10px; border-radius: 4px;
      font-size: 0.78rem; font-weight: bold;
      width: 100%; max-width: 450px; margin-bottom: 10px;
      text-align: center; line-height: 1.4;
    }

    /* 盤面コンテナ */
    .board-container {
      width: 100%; max-width: 450px;
      display: flex; justify-content: center;
      margin-bottom: 10px; position: relative;
    }
    #sudoku-board {
      display: grid;
      border: 2px solid var(--thick-border);
      background: var(--thick-border);
      gap: 1px; width: 100%; max-width: 450px;
      position: relative;
    }

    /* マス目スタイル（崩れ防止対策追加） */
    .cell {
      background: var(--panel-bg);
      display: flex; justify-content: center; align-items: center;
      font-weight: bold; cursor: pointer; user-select: none;
      width: 100%; aspect-ratio: 1 / 1;
      position: relative; transition: border 0.1s;
      overflow: hidden; /* ハミ出し防止 */
      line-height: 1;
      white-space: nowrap;
    }
    .cell.fixed {
      background: var(--cell-fixed);
      cursor: default;
    }
    .cell.selected {
      outline: 3px solid var(--accent-border) !important;
      outline-offset: -3px;
      z-index: 10;
    }
    .cell.invalid { color: #d32f2f !important; }

    /* メモのグリッド表示 */
    .memo-grid {
      display: grid; width: 100%; height: 100%;
      padding: 1px; box-sizing: border-box;
      pointer-events: none;
    }
    .memo-num {
      display: flex; align-items: center; justify-content: center;
      line-height: 1; color: inherit; opacity: 0.8; font-weight: normal;
    }

    /* 太線強調 */
    .border-right-thick { border-right: 2px solid var(--thick-border) !important; }
    .border-bottom-thick { border-bottom: 2px solid var(--thick-border) !important; }

    /* 一時停止マスク */
    .pause-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); color: white;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.2rem; font-weight: bold; z-index: 20; border-radius: 4px;
    }

    /* モード切替タブ・アクションボタン */
    .action-bar {
      display: flex; gap: 6px; justify-content: center;
      width: 100%; max-width: 450px; margin-bottom: 8px;
    }
    .tab-btn {
      flex: 1; padding: 6px; border: 1px solid var(--border-color);
      background: var(--panel-bg); color: var(--text-color);
      border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold;
    }
    .tab-btn.active {
      background: var(--primary-color); color: var(--primary-text); border-color: var(--primary-color);
    }

    /* パレットエリア */
    .num-pad, .color-pad {
      display: flex; flex-wrap: wrap; gap: 5px;
      justify-content: center; max-width: 450px; margin-bottom: 10px; width: 100%;
    }
    .num-btn {
      width: 36px; height: 36px; font-size: 0.95rem;
      border: 1px solid var(--border-color);
      background: var(--panel-bg); color: var(--text-color);
      border-radius: 4px; cursor: pointer;
      display: flex; justify-content: center; align-items: center; font-weight: bold;
    }
    .color-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid #ccc; cursor: pointer;
      transition: transform 0.1s;
    }
    .color-btn:hover { transform: scale(1.1); }

    /* 中央クリアモーダル */
    .clear-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: flex; justify-content: center; align-items: center;
      z-index: 100; opacity: 0; visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .clear-modal-overlay.show { opacity: 1; visibility: visible; }
    .clear-modal-card {
      background: var(--panel-bg); color: var(--text-color);
      padding: 30px 25px; border-radius: 16px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); transform: scale(0.7);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 320px; width: 85%;
    }
    .clear-modal-overlay.show .clear-modal-card { transform: scale(1); }
    .clear-title { font-size: 2rem; font-weight: 900; color: #ff9800; margin-bottom: 10px; }
    .clear-time { font-size: 1.2rem; margin: 10px 0 15px 0; font-weight: bold; }

    /* シェアボタンのスタイル */
    .share-row {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .btn-share {
      flex: 1;
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--primary-color);
      padding: 8px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    #confetti-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 99;
    }
  </style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <a href="menu.html" class="back-link">メニューに戻る</a>

  <h1>可変サイズ ナンプレ</h1>

  <div class="controls-panel">
    <div class="control-group">
      <label for="size-select">サイズ:</label>
      <select id="size-select"></select>
    </div>

    <div class="control-group">
      <label for="font-size">文字(px):</label>
      <select id="font-size"></select>
    </div>

    <div class="control-group">
      <label for="diff-select">難易度:</label>
      <select id="diff-select">
        <option value="easy">簡単</option>
        <option value="normal">普通</option>
        <option value="hard" selected>難しい</option>
      </select>
    </div>

    <div class="control-group">
      <label for="theme-select">テーマ:</label>
      <select id="theme-select">
        <option value="classic">クラシック</option>
        <option value="dark">ダーク</option>
        <option value="pastel">パステル</option>
        <option value="retro">レトロ</option>
      </select>
    </div>

    <button id="new-game-btn">新規作成</button>
  </div>

  <div class="status-bar">
    <div class="timer-container">
      ⏱️ <span id="timer">00:00</span>
      <button id="pause-btn" class="secondary" style="padding: 2px 6px; font-size: 0.75rem;">一時停止</button>
    </div>
    <div class="best-time" id="best-time">自己ベスト: --:--</div>
  </div>

  <div class="usage-guide">
    💡 <b>操作方法:</b> ①マスを選択 ➔ ②画面下の数字/カラーまたはキーボード入力<br>
    ⌨️ <b>キー入力:</b> [1-9]=1-9, [0]=10, [Q-P]=11-20, [Delete/BS]=消去
  </div>

  <div class="board-container">
    <div id="sudoku-board"></div>
    <div id="pause-overlay" class="pause-overlay" style="display: none;">一時停止中 (クリックで再開)</div>
  </div>

  <div class="action-bar">
    <button id="tab-num" class="tab-btn active">数字入力</button>
    <button id="tab-memo" class="tab-btn">メモ (OFF)</button>
    <button id="tab-color" class="tab-btn">カラー着色</button>
    <button id="undo-btn" class="secondary" style="flex: 0.5;">↩ 戻す</button>
    <button id="hint-btn" class="secondary" style="flex: 0.5;">💡 ヒント</button>
  </div>

  <div class="num-pad" id="num-pad"></div>
  <div class="color-pad" id="color-pad" style="display: none;"></div>

  <canvas id="confetti-canvas"></canvas>

  <div id="clear-modal" class="clear-modal-overlay">
    <div class="clear-modal-card">
      <div class="clear-title">🎉 CLEAR!</div>
      <div>見事に盤面を完成させました！</div>
      <div class="clear-time" id="clear-final-time">⏱️ 00:00</div>
      
      <div class="share-row">
        <button class="btn-share" id="share-x-btn" type="button">Xでシェア</button>
        <button class="btn-share" id="share-line-btn" type="button">LINEでシェア</button>
      </div>

      <button id="modal-restart-btn" style="padding: 10px 20px; font-size: 1rem; width: 100%;">もう一度遊ぶ</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'sudoku_app_state_v6';

    const PASTEL_COLORS = [
      { name: 'なし(白)', code: '' },
      { name: '赤', code: '#ffcdd2' },
      { name: '青', code: '#bbdefb' },
      { name: '黄', code: '#fff9c4' },
      { name: '緑', code: '#c8e6c9' },
      { name: '紫', code: '#e1bee7' },
      { name: '橙', code: '#ffe0b2' },
      { name: '桃', code: '#f8bbd0' }
    ];

    const KEY_MAP = {
      '0': 10, 'q': 11, 'w': 12, 'e': 13, 'r': 14, 't': 15,
      'y': 16, 'u': 17, 'i': 18, 'o': 19, 'p': 20
    };

    const DIFF_LABELS = {
      easy: '簡単',
      normal: '普通',
      hard: '難しい'
    };

    let N = 6;
    let boxRows = 2, boxCols = 3;
    let fontSize = 18;
    let difficulty = 'hard';
    let theme = 'classic';

    let solutionBoard = [];
    let initialBoard = [];
    let currentBoard = [];
    let memoBoard = [];
    let colorBoard = [];
    let selectedCell = null;

    let isMemoMode = false;
    let activeTab = 'num';
    let historyStack = [];

    let timerSeconds = 0;
    let timerInterval = null;
    let isPaused = false;
    let isCompleted = false;   // クリア済み(タイマー停止・入力ロック)
    let confettiFrame = null;
    let gameEndedDate = null;

    window.addEventListener('DOMContentLoaded', () => {
      initSelectOptions();
      loadSettingsAndState();
      setupEventListeners();
      startTimer();
    });

    // 盤面サイズに応じて安全な文字サイズの上限を計算
    function getMaxFontSizeForSize(n) {
      // 盤面全体の最大幅450pxに対するマスの近似サイズ
      const maxBoardWidth = Math.min(window.innerWidth - 30, 450);
      const cellSize = maxBoardWidth / n;
      
      // 2桁表示（10〜20）を考慮してマスの約55%〜60%を文字サイズ上限にする
      const maxFont = Math.floor(cellSize * 0.58);
      return Math.max(8, Math.min(36, maxFont));
    }

    // プルダウンに実在する最大の文字サイズ(8から2刻み)
    function getMaxFontOption(n) {
      return 8 + Math.floor((getMaxFontSizeForSize(n) - 8) / 2) * 2;
    }

    // 任意の値を「プルダウンに存在する値」に丸める(奇数や範囲外だと選択欄が空白になるため)
    function snapFontSize(v, n = N) {
      let f = parseInt(v, 10);
      if (!Number.isFinite(f)) f = 8;
      f = 8 + Math.round((f - 8) / 2) * 2;
      return Math.min(getMaxFontOption(n), Math.max(8, f));
    }

    function updateFontSizeOptions() {
      const fontSelect = document.getElementById('font-size');
      const maxOpt = getMaxFontOption(N);
      const currentVal = parseInt(fontSelect.value) || fontSize;

      fontSelect.innerHTML = '';
      for (let i = 8; i <= maxOpt; i += 2) {
        const opt = document.createElement('option');
        opt.value = i; opt.textContent = i;
        fontSelect.appendChild(opt);
      }

      // 現在の値が新しい上限を超えていたら自動補正(選択肢に存在する値へ丸める)
      fontSize = snapFontSize(currentVal);
      fontSelect.value = fontSize;
    }

    function initSelectOptions() {
      const sizeSelect = document.getElementById('size-select');
      sizeSelect.innerHTML = '';
      for (let i = 2; i <= 20; i++) {
        const opt = document.createElement('option');
        opt.value = i; opt.textContent = i;
        sizeSelect.appendChild(opt);
      }
      updateFontSizeOptions();
    }

    function getBlockDimensions(n) {
      for (let r = Math.floor(Math.sqrt(n)); r >= 1; r--) {
        if (n % r === 0) return [r, n / r];
      }
      return [1, n];
    }

    function getRecommendedFontSize(n) {
      const maxFont = getMaxFontSizeForSize(n);
      let base = 10;
      if (n <= 4) base = 24;
      else if (n <= 6) base = 18;
      else if (n <= 9) base = 14;
      else if (n <= 12) base = 12;
      return snapFontSize(Math.min(base, maxFont), n);
    }

    function setupEventListeners() {
      document.getElementById('size-select').addEventListener('change', (e) => {
        N = parseInt(e.target.value);
        updateFontSizeOptions();
        fontSize = getRecommendedFontSize(N);
        document.getElementById('font-size').value = fontSize;
        if (isPaused) resumeGame();
        startNewGame();
      });

      document.getElementById('font-size').addEventListener('change', (e) => {
        fontSize = parseInt(e.target.value);
        applyStyles(); saveState();
      });

      document.getElementById('diff-select').addEventListener('change', (e) => {
        difficulty = e.target.value;
        if (isPaused) resumeGame();
        startNewGame();
      });

      document.getElementById('theme-select').addEventListener('change', (e) => {
        theme = e.target.value;
        document.documentElement.setAttribute('data-theme', theme);
        saveState();
      });

      document.getElementById('new-game-btn').addEventListener('click', () => {
        if (isPaused) resumeGame();
        startNewGame();
      });

      document.getElementById('pause-btn').addEventListener('click', togglePause);
      document.getElementById('pause-overlay').addEventListener('click', resumeGame);

      document.getElementById('tab-num').addEventListener('click', () => setTab('num'));
      document.getElementById('tab-memo').addEventListener('click', toggleMemoMode);
      document.getElementById('tab-color').addEventListener('click', () => setTab('color'));

      document.getElementById('undo-btn').addEventListener('click', undoAction);
      document.getElementById('hint-btn').addEventListener('click', giveHint);

      document.getElementById('modal-restart-btn').addEventListener('click', () => {
        hideClearModal();
        startNewGame();
      });

      document.getElementById('share-x-btn').addEventListener('click', shareToX);
      document.getElementById('share-line-btn').addEventListener('click', shareToLine);

      document.addEventListener('keydown', (e) => {
        if (isPaused || isCompleted || !selectedCell) return;
        // Ctrl+R などブラウザのショートカットを数字入力として誤処理しない
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        // プルダウン操作中のキー入力は盤面に反映しない
        const tag = e.target && e.target.tagName;
        if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;

        const { r, c } = selectedCell;
        if (initialBoard[r] && initialBoard[r][c] !== 0) return;

        const key = e.key.toLowerCase();
        let val = null;

        if (/^[1-9]$/.test(key)) {
          val = parseInt(key, 10);
        } else if (KEY_MAP[key] !== undefined) {
          val = KEY_MAP[key];
        }

        if (val !== null && val <= N) {
          if (e.repeat) return; // 押しっぱなしでメモのON/OFFが連打されないように
          if (isMemoMode) toggleMemoValue(r, c, val);
          else setCellValue(r, c, val);
        } else if (e.key === 'Backspace' || e.key === 'Delete') {
          setCellValue(r, c, 0);
        }
      });

      window.addEventListener('resize', () => {
        updateFontSizeOptions();
        applyStyles();
      });

      // タブを閉じる/切り替える時に経過時間も含めて保存
      window.addEventListener('pagehide', saveState);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') saveState();
      });
    }

    function setTab(tab) {
      activeTab = tab;
      document.getElementById('tab-num').classList.toggle('active', tab === 'num');
      document.getElementById('tab-color').classList.toggle('active', tab === 'color');
      document.getElementById('num-pad').style.display = tab === 'num' ? 'flex' : 'none';
      document.getElementById('color-pad').style.display = tab === 'color' ? 'flex' : 'none';
    }

    function toggleMemoMode() {
      isMemoMode = !isMemoMode;
      const btn = document.getElementById('tab-memo');
      btn.textContent = `メモ (${isMemoMode ? 'ON' : 'OFF'})`;
      btn.style.background = isMemoMode ? '#ff9800' : '';
      btn.style.color = isMemoMode ? '#fff' : '';
      if (isMemoMode) setTab('num');
    }

    function startNewGame() {
      if (isPaused) resumeGame();
      cancelConfetti();
      [boxRows, boxCols] = getBlockDimensions(N);
      solutionBoard = generateCompleteBoard(N, boxRows, boxCols);
      initialBoard = createPuzzle(solutionBoard, N, difficulty);
      currentBoard = initialBoard.map(row => [...row]);
      
      memoBoard = Array.from({ length: N }, () => Array.from({ length: N }, () => new Set()));
      colorBoard = Array.from({ length: N }, () => Array(N).fill(''));
      
      selectedCell = null;
      historyStack = [];
      timerSeconds = 0;
      isCompleted = false;
      gameEndedDate = null;
      hideClearModal();

      renderBoard();
      renderNumPad();
      renderColorPad();
      updateTimerDisplay();
      updateBestTimeDisplay();
      saveState();
    }

    // 偏りのない Fisher-Yates シャッフル
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateCompleteBoard(n, bRows, bCols) {
      // 1) ランダム順のバックトラック法(探索回数に上限を設け、行き詰まったらやり直す)
      for (let attempt = 0; attempt < 3; attempt++) {
        const board = tryGenerateByBacktracking(n, bRows, bCols, 20000);
        if (board) return board;
      }
      // 2) 大きいサイズで探索が長引く場合のフォールバック(フリーズ防止)
      return generateByPattern(n, bRows, bCols);
    }

    function tryGenerateByBacktracking(n, bRows, bCols, limit) {
      const board = Array.from({ length: n }, () => Array(n).fill(0));
      const rowUsed = Array(n).fill(0);
      const colUsed = Array(n).fill(0);
      const boxUsed = Array(n).fill(0);
      const boxesPerRow = n / bCols;
      const total = n * n;
      let steps = 0;

      function fill(pos) {
        if (pos === total) return true;
        if (++steps > limit) return false;
        const r = Math.floor(pos / n), c = pos % n;
        const b = Math.floor(r / bRows) * boxesPerRow + Math.floor(c / bCols);
        const used = rowUsed[r] | colUsed[c] | boxUsed[b];

        const cands = [];
        for (let v = 0; v < n; v++) if (!(used & (1 << v))) cands.push(v);

        for (const v of shuffle(cands)) {
          const bit = 1 << v;
          board[r][c] = v + 1;
          rowUsed[r] |= bit; colUsed[c] |= bit; boxUsed[b] |= bit;
          if (fill(pos + 1)) return true;
          board[r][c] = 0;
          rowUsed[r] &= ~bit; colUsed[c] &= ~bit; boxUsed[b] &= ~bit;
          if (steps > limit) return false;
        }
        return false;
      }
      return fill(0) ? board : null;
    }

    // 基本パターンを「バンド/スタック内外の行列入れ替え + 数字の入れ替え」でシャッフルして完成盤面を作る
    function generateByPattern(n, bRows, bCols) {
      const idx = k => Array.from({ length: k }, (_, i) => i);
      const rowOrder = [];
      for (const band of shuffle(idx(n / bRows))) {
        for (const i of shuffle(idx(bRows))) rowOrder.push(band * bRows + i);
      }
      const colOrder = [];
      for (const stack of shuffle(idx(n / bCols))) {
        for (const j of shuffle(idx(bCols))) colOrder.push(stack * bCols + j);
      }
      const symbols = shuffle(idx(n).map(i => i + 1));

      return rowOrder.map(rr => colOrder.map(cc =>
        symbols[(bCols * (rr % bRows) + Math.floor(rr / bRows) + cc) % n]
      ));
    }

    function createPuzzle(sol, n, diff) {
      const puzzle = sol.map(row => [...row]);
      const total = n * n;
      let fillRatio = 0.45;
      if (diff === 'normal') fillRatio = 0.30;
      if (diff === 'hard') fillRatio = 0.20;

      let targetVisible = Math.max(n, Math.floor(total * fillRatio));
      let cellsToRemove = total - targetVisible;

      const coords = [];
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) coords.push([r, c]);
      }
      const shuffled = shuffle(coords);

      for (let i = 0; i < cellsToRemove; i++) {
        const [r, c] = shuffled[i];
        puzzle[r][c] = 0;
      }
      return puzzle;
    }

    function renderBoard() {
      const boardEl = document.getElementById('sudoku-board');
      boardEl.innerHTML = '';
      // minmax(0,1fr): 中身(2桁数字など)の幅で列が押し広げられて盤面が崩れるのを防止
      boardEl.style.gridTemplateColumns = `repeat(${N}, minmax(0, 1fr))`;

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r; cell.dataset.c = c;

          if ((c + 1) % boxCols === 0 && c < N - 1) cell.classList.add('border-right-thick');
          if ((r + 1) % boxRows === 0 && r < N - 1) cell.classList.add('border-bottom-thick');

          if (initialBoard[r][c] !== 0) cell.classList.add('fixed');
          if (selectedCell && selectedCell.r === r && selectedCell.c === c) cell.classList.add('selected');
          applyCellColor(cell, r, c);

          updateCellContent(cell, r, c);
          cell.addEventListener('click', () => selectCell(r, c));
          boardEl.appendChild(cell);
        }
      }
      applyStyles();
      checkErrors();
    }

    // セルの着色を反映(着色セルは背景が明るいため、ダークテーマでも読めるよう文字色を固定)
    function applyCellColor(cell, r, c) {
      const col = colorBoard[r][c];
      cell.style.backgroundColor = col || '';
      cell.style.color = col ? '#333333' : '';
    }

    function getMemoFontSize() {
      return Math.max(6, fontSize * 0.4);
    }

    function updateCellContent(cell, r, c) {
      const val = currentBoard[r][c];
      cell.innerHTML = '';
      cell.style.letterSpacing = 'normal';

      if (val !== 0) {
        cell.textContent = val;
        // 2桁表示の際の縮小調整
        if (val >= 10) cell.style.letterSpacing = '-1px';
      } else if (memoBoard[r][c] && memoBoard[r][c].size > 0) {
        const memoGrid = document.createElement('div');
        memoGrid.className = 'memo-grid';
        const side = Math.ceil(Math.sqrt(N));
        memoGrid.style.gridTemplateColumns = `repeat(${side}, 1fr)`;

        for (let i = 1; i <= side * side; i++) {
          const item = document.createElement('div');
          item.className = 'memo-num';
          item.style.fontSize = `${getMemoFontSize()}px`;
          if (i <= N && memoBoard[r][c].has(i)) item.textContent = i;
          memoGrid.appendChild(item);
        }
        cell.appendChild(memoGrid);
      }
    }

    function renderNumPad() {
      const padEl = document.getElementById('num-pad');
      padEl.innerHTML = '';

      for (let i = 1; i <= N; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.textContent = i;
        btn.addEventListener('click', () => {
          if (!selectedCell) return;
          const { r, c } = selectedCell;
          if (isMemoMode) toggleMemoValue(r, c, i);
          else setCellValue(r, c, i);
        });
        padEl.appendChild(btn);
      }

      const delBtn = document.createElement('button');
      delBtn.className = 'num-btn';
      delBtn.textContent = '✕';
      delBtn.style.color = '#d32f2f';
      delBtn.addEventListener('click', () => {
        if (selectedCell) setCellValue(selectedCell.r, selectedCell.c, 0);
      });
      padEl.appendChild(delBtn);
    }

    function renderColorPad() {
      const padEl = document.getElementById('color-pad');
      padEl.innerHTML = '';

      PASTEL_COLORS.forEach(col => {
        const btn = document.createElement('button');
        btn.className = 'color-btn';
        btn.title = col.name;
        btn.style.backgroundColor = col.code || '#ffffff';
        
        btn.addEventListener('click', () => {
          if (!selectedCell) return;
          setCellColor(selectedCell.r, selectedCell.c, col.code);
        });
        padEl.appendChild(btn);
      });
    }

    function applyStyles() {
      document.querySelectorAll('.cell').forEach(cell => {
        cell.style.fontSize = `${fontSize}px`;
      });
      // メモ数字も文字サイズ変更に追従させる
      document.querySelectorAll('.memo-num').forEach(el => {
        el.style.fontSize = `${getMemoFontSize()}px`;
      });
    }

    function selectCell(r, c) {
      document.querySelectorAll('.cell').forEach(el => el.classList.remove('selected'));
      selectedCell = { r, c };

      const target = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      if (target) target.classList.add('selected');
    }

    function saveHistory() {
      historyStack.push({
        currentBoard: currentBoard.map(r => [...r]),
        memoBoard: memoBoard.map(r => r.map(set => new Set(set))),
        colorBoard: colorBoard.map(r => [...r])
      });
      if (historyStack.length > 30) historyStack.shift();
    }

    function undoAction() {
      if (isPaused || isCompleted || historyStack.length === 0) return;
      const last = historyStack.pop();
      currentBoard = last.currentBoard;
      memoBoard = last.memoBoard;
      colorBoard = last.colorBoard;
      renderBoard();
      saveState();
    }

    function setCellValue(r, c, val) {
      if (isPaused || isCompleted) return;
      if (initialBoard[r][c] !== 0) return;
      // 変化がない操作は「戻す」履歴に積まない
      if (currentBoard[r][c] === val && (val !== 0 || memoBoard[r][c].size === 0)) return;
      saveHistory();

      currentBoard[r][c] = val;
      memoBoard[r][c].clear();

      const target = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      if (target) updateCellContent(target, r, c);

      checkErrors();
      saveState();
      checkWinCondition();
    }

    function toggleMemoValue(r, c, val) {
      if (isPaused || isCompleted) return;
      if (initialBoard[r][c] !== 0 || currentBoard[r][c] !== 0) return;
      saveHistory();

      if (memoBoard[r][c].has(val)) memoBoard[r][c].delete(val);
      else memoBoard[r][c].add(val);

      const target = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      if (target) updateCellContent(target, r, c);
      saveState();
    }

    function setCellColor(r, c, colorCode) {
      if (isPaused || isCompleted) return;
      if (colorBoard[r][c] === colorCode) return;
      saveHistory();
      colorBoard[r][c] = colorCode;
      const target = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      if (target) applyCellColor(target, r, c);
      saveState();
    }

    function giveHint() {
      if (isPaused || isCompleted || !selectedCell) return;
      const { r, c } = selectedCell;
      if (initialBoard[r][c] !== 0 || currentBoard[r][c] === solutionBoard[r][c]) return;

      setCellValue(r, c, solutionBoard[r][c]);
    }

    // (r,c) の値が同じ行・列・ブロックの他のマスと重複しているか
    function hasConflict(r, c) {
      const val = currentBoard[r][c];
      if (val === 0) return false;

      for (let i = 0; i < N; i++) {
        if (i !== c && currentBoard[r][i] === val) return true;
        if (i !== r && currentBoard[i][c] === val) return true;
      }
      const startR = Math.floor(r / boxRows) * boxRows;
      const startC = Math.floor(c / boxCols) * boxCols;
      for (let i = 0; i < boxRows; i++) {
        for (let j = 0; j < boxCols; j++) {
          const nr = startR + i, nc = startC + j;
          if ((nr !== r || nc !== c) && currentBoard[nr][nc] === val) return true;
        }
      }
      return false;
    }

    function checkErrors() {
      document.querySelectorAll('.cell.invalid').forEach(el => el.classList.remove('invalid'));

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (hasConflict(r, c)) {
            const el = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
            if (el) el.classList.add('invalid');
          }
        }
      }
    }

    // 全マスが埋まり、行・列・ブロックに重複がなければ完成
    // (出題は唯一解とは限らないため、生成時の解答との一致ではなくルールで判定する)
    function isBoardSolved() {
      if (!currentBoard.length) return false;
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (currentBoard[r][c] === 0 || hasConflict(r, c)) return false;
        }
      }
      return true;
    }

    function checkWinCondition() {
      if (isCompleted || !isBoardSolved()) return;
      isCompleted = true; // タイマー停止・入力ロック
      gameEndedDate = new Date(); // クリア日時を記録
      saveBestTime();
      showClearModal();
      triggerConfetti();
    }

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const date = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${year}/${month}/${date} ${hours}:${minutes}`;
    }

    function buildShareText() {
      const diffLabel = DIFF_LABELS[difficulty] || difficulty;
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      const timeStr = `${m}:${s}`;
      const dateStr = gameEndedDate ? formatDate(gameEndedDate) : formatDate(new Date());

      return `可変サイズ ナンプレ(${N}x${N})をクリアしました！\nクリアタイム: ${timeStr} (難易度: ${diffLabel} / 日時: ${dateStr})\n#ナンプレ #可変サイズナンプレ\n`;
    }

    function shareToX() {
      const text = buildShareText();
      const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`;
      window.open(url, '_blank', 'noopener');
    }

    function shareToLine() {
      const text = buildShareText() + window.location.href;
      const url = `https://social-plugins.line.me/lineit/share?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank', 'noopener');
    }

    function showClearModal() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('clear-final-time').textContent = `⏱️ クリアタイム: ${m}:${s}`;
      document.getElementById('clear-modal').classList.add('show');
    }

    function hideClearModal() {
      document.getElementById('clear-modal').classList.remove('show');
    }

    function cancelConfetti() {
      if (confettiFrame) {
        cancelAnimationFrame(confettiFrame);
        confettiFrame = null;
      }
      const canvas = document.getElementById('confetti-canvas');
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }

    function triggerConfetti() {
      cancelConfetti();
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a', '#cddc39', '#ffeb3b', '#ffc107', '#ff9800'];

      for (let i = 0; i < 100; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedY: Math.random() * 3 + 2,
          speedX: Math.random() * 2 - 1,
          rotation: Math.random() * 360,
          rotSpeed: Math.random() * 10 - 5
        });
      }

      let duration = 0;

      function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.rotation += p.rotSpeed;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        duration++;
        if (duration < 200) {
          confettiFrame = requestAnimationFrame(update);
        } else {
          confettiFrame = null;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      update();
    }

    // 1秒ごとに加算(一時停止中・クリア後は加算しない)
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isPaused && !isCompleted) {
          timerSeconds++;
          updateTimerDisplay();
        }
      }, 1000);
    }

    function togglePause() {
      if (isPaused) resumeGame();
      else {
        isPaused = true;
        document.getElementById('pause-overlay').style.display = 'flex';
        document.getElementById('pause-btn').textContent = '再開';
      }
    }

    function resumeGame() {
      isPaused = false;
      document.getElementById('pause-overlay').style.display = 'none';
      document.getElementById('pause-btn').textContent = '一時停止';
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${m}:${s}`;
    }

    // localStorage が使えない環境(プライベートモード等)でもゲームが止まらないようにする
    function storageGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function storageSet(key, value) {
      try { localStorage.setItem(key, value); } catch (e) { /* 保存不可でも続行 */ }
    }

    function saveBestTime() {
      const key = `best_time_${N}_${difficulty}`;
      const best = parseInt(storageGet(key), 10);
      if (!Number.isFinite(best) || timerSeconds < best) {
        storageSet(key, timerSeconds);
        updateBestTimeDisplay();
      }
    }

    function updateBestTimeDisplay() {
      const key = `best_time_${N}_${difficulty}`;
      const best = parseInt(storageGet(key), 10);
      const el = document.getElementById('best-time');
      if (Number.isFinite(best)) {
        const m = String(Math.floor(best / 60)).padStart(2, '0');
        const s = String(best % 60).padStart(2, '0');
        el.textContent = `自己ベスト: ${m}:${s}`;
      } else {
        el.textContent = `自己ベスト: --:--`;
      }
    }

    function saveState() {
      if (!currentBoard.length) return;
      const state = {
        N, fontSize, difficulty, theme, timerSeconds,
        solutionBoard, initialBoard, currentBoard,
        colorBoard,
        memoBoard: memoBoard.map(row => row.map(set => Array.from(set)))
      };
      storageSet(STORAGE_KEY, JSON.stringify(state));
    }

    // n×n の二次元配列で、全要素が pred を満たすか
    function isGrid(g, n, pred) {
      return Array.isArray(g) && g.length === n &&
        g.every(row => Array.isArray(row) && row.length === n && row.every(pred));
    }

    // 画面上のプルダウンを現在の設定値に合わせる
    function syncControls() {
      document.getElementById('size-select').value = N;
      document.getElementById('font-size').value = fontSize;
      document.getElementById('diff-select').value = difficulty;
      document.getElementById('theme-select').value = theme;
      document.documentElement.setAttribute('data-theme', theme);
    }

    function loadSettingsAndState() {
      const data = storageGet(STORAGE_KEY);
      if (data) {
        try {
          const state = JSON.parse(data);

          // 保存データが壊れていても新規ゲームで起動できるよう、反映前に検証する
          const n = parseInt(state.N, 10);
          if (!(n >= 2 && n <= 20)) throw new Error('invalid N');
          const isCell = v => Number.isInteger(v) && v >= 0 && v <= n;
          if (!isGrid(state.solutionBoard, n, isCell) ||
              !isGrid(state.initialBoard, n, isCell) ||
              !isGrid(state.currentBoard, n, isCell)) throw new Error('invalid board');

          N = n;
          difficulty = ['easy', 'normal', 'hard'].includes(state.difficulty) ? state.difficulty : 'hard';
          theme = ['classic', 'dark', 'pastel', 'retro'].includes(state.theme) ? state.theme : 'classic';
          timerSeconds = parseInt(state.timerSeconds, 10) || 0;

          updateFontSizeOptions();
          fontSize = snapFontSize(state.fontSize || getRecommendedFontSize(N));

          solutionBoard = state.solutionBoard;
          initialBoard = state.initialBoard;
          currentBoard = state.currentBoard;
          colorBoard = isGrid(state.colorBoard, N, v => typeof v === 'string')
            ? state.colorBoard
            : Array.from({ length: N }, () => Array(N).fill(''));
          memoBoard = isGrid(state.memoBoard, N, a => Array.isArray(a) && a.every(v => Number.isInteger(v) && v >= 1 && v <= N))
            ? state.memoBoard.map(row => row.map(arr => new Set(arr)))
            : Array.from({ length: N }, () => Array.from({ length: N }, () => new Set()));

          [boxRows, boxCols] = getBlockDimensions(N);
          selectedCell = null;
          historyStack = [];
          isCompleted = isBoardSolved(); // 完成済みの盤面を復元した場合はタイマーを動かさない

          syncControls();
          renderBoard();
          renderNumPad();
          renderColorPad();
          updateTimerDisplay();
          updateBestTimeDisplay();
          return;
        } catch (e) {
          console.error("データ復元エラー:", e);
        }
      }

      updateFontSizeOptions();
      fontSize = getRecommendedFontSize(N);
      syncControls();
      startNewGame();
    }
  </script>
