<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>秋田県クマ出没マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; }
  #map { height: 85vh; }
  #controls {
    padding: 10px;
    background: #f9f9f9;
    border-bottom: 1px solid #ccc;
  }
  label { margin-right: 8px; }
  input[type="text"] { width: 600px; }
  .note { color: #666; font-size: 13px; margin-top:6px; }
</style>
</head>
<body>
  <div id="controls">
    <label>CSVファイルURL:
      <input type="text" id="csvUrl"
        value="https://ckan.pref.akita.lg.jp/dataset/f801a10f-f076-47e4-b5a6-0bb5569639e0/resource/326bfe79-3f64-401b-9862-b37a477c7211/download/050008_kumadas.csv">
    </label>
    <button id="btnLoad">CSV読込</button>
    <button id="btnRedraw">再描画</button>
    <br>
    <label>開始日: <input type="date" id="startDate"></label>
    <label>終了日: <input type="date" id="endDate"></label>
    <div class="note">※CSV読込後に、先頭1件目を終了日、100件目（存在すれば）を開始日に自動設定します。データ取得できない場合は開始日・終了日ともに本日。</div>
  </div>

  <div id="map"></div>

<script>
/**
 * 不可視文字や全角スペース、改行、BOMなどを除去してトリムする
 * @param {string} s - 処理対象の文字列
 * @returns {string} クリーンアップされた文字列
 */
function cleanString(s) {
  if (s == null) return "";
  return String(s).replace(/^\uFEFF/, "").replace(/[\u3000\r\n\t]+/g, " ").trim();
}

/**
 * 日本語形式の日付文字列をDateオブジェクトにパースする
 * @param {string} str - 日付文字列 (例: "YYYY/MM/DD HH:MM")
 * @returns {Date|null} パースされたDateオブジェクト、またはパース失敗時はnull
 */
function parseJapaneseDate(str) {
  if (!str) return null;
  const clean = cleanString(str);
  const m = clean.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:\s+(\d{1,2}):(\d{1,2}))?/);
  if (!m) {
    return null;
  }
  const year = parseInt(m[1], 10);
  const month = parseInt(m[2], 10);
  const day = parseInt(m[3], 10);
  const hour = m[4] ? parseInt(m[4], 10) : 0;
  const minute = m[5] ? parseInt(m[5], 10) : 0;
  const d = new Date(year, month - 1, day, hour, minute);
  if (isNaN(d.getTime())) {
    return null;
  }
  return d;
}

/**
 * Dateオブジェクトをローカルの日付形式 (YYYY-MM-DD) にフォーマットする
 * @param {Date} date - フォーマットするDateオブジェクト
 * @returns {string} フォーマットされた日付文字列
 */
function formatDateLocal(date) {
  if (!date) return "";
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

/**
 * 開始日と終了日入力フィールドに今日の日付を設定する
 */
function setTodayAsDefaults() {
  const now = new Date();
  const s = formatDateLocal(now);
  document.getElementById("startDate").value = s;
  document.getElementById("endDate").value = s;
}

let map = null;
let markersLayer = null;

/**
 * Leafletマップを初期化する
 */
function initMap() {
  if (map) return;
  map = L.map("map").setView([39.7, 140.1], 8);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

let rawResults = null;
let normalizedRows = [];

/**
 * CSVの列名から、日付、緯度、経度のキーを検出する
 * @param {string[]} sampleKeys - CSVのヘッダーキーの配列
 * @returns {{dateKey: string|null, latKey: string|null, lngKey: string|null}} 検出されたキーのオブジェクト
 */
function detectColumnKeys(sampleKeys) {
  const keySet = sampleKeys.map(k => cleanString(k));
  const findKey = candidates => {
    for (const c of candidates) {
      const idx = keySet.findIndex(k => k === c);
      if (idx >= 0) return sampleKeys[idx];
    }
    for (const c of candidates) {
      const idx = keySet.findIndex(k => k.indexOf(c) >= 0);
      if (idx >= 0) return sampleKeys[idx];
    }
    return null;
  };

  return {
    dateKey: findKey(["目撃日時", "出没日時", "発生日時", "日時"]),
    latKey: findKey(["x(緯度)", "緯度", "lat"]),
    lngKey: findKey(["y(経度)", "経度", "lon", "lng", "longitude"])
  };
}

/**
 * PapaParseの結果を正規化し、日付と緯度経度をパースする
 * @param {object} results - PapaParseの結果オブジェクト
 */
function normalizeData(results) {
  rawResults = results;
  normalizedRows = [];

  if (!results || !results.data || results.data.length === 0) {
    return;
  }

  const sampleKeys = results.meta && results.meta.fields && results.meta.fields.length ? results.meta.fields : Object.keys(results.data[0] || {});
  for (let i = 0; i < sampleKeys.length; i++) {
    sampleKeys[i] = cleanString(sampleKeys[i]);
  }

  const keysDetected = detectColumnKeys(sampleKeys);

  for (let i = 0; i < results.data.length; i++) {
    const row = results.data[i];
    const cleanRow = {};
    for (const k in row) {
      cleanRow[cleanString(k)] = row[k] == null ? "" : String(row[k]).trim();
    }

    const dateStr = keysDetected.dateKey ? cleanRow[cleanString(keysDetected.dateKey)] || cleanRow[keysDetected.dateKey] || "" : "";
    const latStr = keysDetected.latKey ? cleanRow[cleanString(keysDetected.latKey)] || cleanRow[keysDetected.latKey] || "" : "";
    const lngStr = keysDetected.lngKey ? cleanRow[cleanString(keysDetected.lngKey)] || cleanRow[keysDetected.lngKey] || "" : "";

    const dateObj = parseJapaneseDate(dateStr);
    const lat = latStr ? parseFloat(latStr) : NaN;
    const lng = lngStr ? parseFloat(lngStr) : NaN;

    normalizedRows.push({
      __orig: row,
      dateStr: dateStr,
      date: dateObj,
      lat: isFinite(lat) ? lat : null,
      lng: isFinite(lng) ? lng : null,
      dateKey: keysDetected.dateKey,
      latKey: keysDetected.latKey,
      lngKey: keysDetected.lngKey
    });
  }
}

/**
 * 正規化されたデータから、日付範囲を自動決定し、入力フィールドに設定する
 * 先頭の有効行を終了日、100件目の有効行（存在すれば）を開始日とする
 * 有効な行がない場合は本日を設定する
 * @returns {{start: Date|null, end: Date|null, reason: string, validCount?: number}} 決定された日付範囲の情報
 */
function determineDateRange() {
  const validRows = normalizedRows.filter(r => r.date && (r.lat !== null) && (r.lng !== null));

  if (validRows.length === 0) {
    setTodayAsDefaults();
    return { start: null, end: null, reason: "no valid rows" };
  }

  const endRow = validRows[0];
  const indexForStart = Math.min(99, validRows.length - 1);
  const startRow = validRows[indexForStart];

  if (!endRow.date || !startRow.date) {
    setTodayAsDefaults();
    return { start: null, end: null, reason: "date parse fail" };
  }

  document.getElementById("startDate").value = formatDateLocal(startRow.date);
  document.getElementById("endDate").value = formatDateLocal(endRow.date);

  return { start: startRow.date, end: endRow.date, reason: "ok", validCount: validRows.length };
}

/**
 * マップ上にクマの出没情報を描画する
 * 日付範囲でフィルタリングし、マーカーを追加する
 */
function updateMap() {
  if (!normalizedRows || normalizedRows.length === 0) {
    alert("CSVデータが読み込まれていません。");
    return;
  }

  const sd = document.getElementById("startDate").value;
  const ed = document.getElementById("endDate").value;
  if (!sd || !ed) {
    alert("開始日または終了日が設定されていません。");
    return;
  }

  const startDate = new Date(sd);
  const endDate = new Date(ed);
  endDate.setHours(23,59,59,999);

  markersLayer.clearLayers();

  const filtered = normalizedRows.filter(r => {
    if (!r.date) return false;
    if (r.lat === null || r.lng === null) return false;
    return r.date >= startDate && r.date <= endDate;
  });

  let count = 0;
  filtered.forEach(r => {
    const popup = `
      <b>${cleanString(r.__orig["獣種"] || r.__orig["species"] || "") || "不明"}</b><br>
      ${cleanString(r.__orig["市町村"] || "")}<br>
      ${cleanString(r.dateStr || "")}<br>
      ${cleanString(r.__orig["目撃時の状況"] || "")}
    `;
    L.marker([r.lat, r.lng]).bindPopup(popup).addTo(markersLayer);
    count++;
  });

  alert("表示件数: " + count);
}

/**
 * 指定されたURLからCSVファイルを読み込み、データを処理してマップを更新する
 */
function loadCsv() {
  const url = document.getElementById("csvUrl").value.trim();
  if (!url) {
    alert("CSVファイルのURLを入力してください。");
    return;
  }

  Papa.parse(url, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      normalizeData(results);
      determineDateRange();
      initMap();
      updateMap();
    },
    error: function(err) {
      alert("CSVの読み込みに失敗しました。");
      setTodayAsDefaults();
    }
  });
}

// イベントリスナーの設定
document.getElementById("btnLoad").addEventListener("click", loadCsv);
document.getElementById("btnRedraw").addEventListener("click", updateMap);

// ページロード時の初期処理
window.onload = function() {
  initMap();
  setTodayAsDefaults(); // 最初に今日の日付をセット
  loadCsv(); // 自動でCSVを読み込む
};

</script>
</body>
</html>
