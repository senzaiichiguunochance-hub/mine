<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>秋田県クマ出没マップ（CSV版）</title>
<link rel="stylesheet" type="text/css" href="Style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  
  #map { height: 85vh; }
  #controls {
    padding: 10px;
    
    border-bottom: 1px solid #ccc;
  }
  label { margin-right: 8px; }
  input[type="text"] { width: 600px; }
  .note { color: #666; font-size: 13px; margin-top:6px; }

  /* ローディング中に表示されるオーバーレイ */
  #loadingOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 9999;
  }
  .spinner {
    border: 6px solid #f3f3f3;
    border-top: 6px solid #0078ff;
    border-radius: 50%;
    width: 60px; height: 60px;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: white; text-decoration: none;">メニューに戻る</a>

<div id="controls">
  <label>CSVファイルURL:
    <input type="text" id="csvUrl" value="https://ckan.pref.akita.lg.jp/dataset/f801a10f-f076-47e4-b5a6-0bb5569639e0/resource/326bfe79-3f64-401b-9862-b37a477c7211/download/050008_kumadas.csv">
  </label>
  <button id="btnLoad">CSV読込</button>
  <button id="btnRedraw">再描画</button>
  <br>
  <label>開始日: <input type="date" id="startDate"></label>
  <label>終了日: <input type="date" id="endDate"></label>
  <div class="note">※先頭1件目を終了日、100件目（存在すれば）を開始日に自動設定します。</div>
</div>

<div id="map"></div>

<!-- ローディングオーバーレイ -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">読み込み中...</div>
</div>

<script>
function cleanString(s) {
  if (s == null) return "";
  return String(s).replace(/^\uFEFF/, "").replace(/[\u3000\r\n\t]+/g, " ").trim();
}

function parseJapaneseDate(str) {
  if (!str) return null;
  const clean = cleanString(str);
  const m = clean.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:\s+(\d{1,2}):(\d{1,2}))?/);
  if (!m) return null;
  const d = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]), m[4] ? parseInt(m[4]) : 0, m[5] ? parseInt(m[5]) : 0);
  return isNaN(d.getTime()) ? null : d;
}

function formatDateLocal(date) {
  if (!date) return "";
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function setTodayAsDefaults() {
  const now = new Date();
  const s = formatDateLocal(now);
  document.getElementById("startDate").value = s;
  document.getElementById("endDate").value = s;
}

let map = null;
let markersLayer = null;
let rawResults = null;
let normalizedRows = [];

function initMap() {
  if (map) return;
  map = L.map("map").setView([39.7, 140.1], 8);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

function detectColumnKeys(sampleKeys) {
  const keySet = sampleKeys.map(k => cleanString(k));
  const findKey = candidates => {
    for (const c of candidates) {
      const idx = keySet.findIndex(k => k === c);
      if (idx >= 0) return sampleKeys[idx];
    }
    for (const c of candidates) {
      const idx = keySet.findIndex(k => k.indexOf(c) >= 0);
      if (idx >= 0) return sampleKeys[idx];
    }
    return null;
  };
  return {
    dateKey: findKey(["目撃日時", "出没日時", "発生日時", "日時"]),
    latKey: findKey(["x(緯度)", "緯度", "lat"]),
    lngKey: findKey(["y(経度)", "経度", "lon", "lng", "longitude"])
  };
}

function normalizeData(results) {
  rawResults = results;
  normalizedRows = [];
  if (!results || !results.data || results.data.length === 0) return;
  const sampleKeys = results.meta && results.meta.fields && results.meta.fields.length ? results.meta.fields : Object.keys(results.data[0] || {});
  for (let i = 0; i < sampleKeys.length; i++) sampleKeys[i] = cleanString(sampleKeys[i]);
  const keysDetected = detectColumnKeys(sampleKeys);

  for (const row of results.data) {
    const cleanRow = {};
    for (const k in row) cleanRow[cleanString(k)] = row[k] == null ? "" : String(row[k]).trim();

    const dateStr = keysDetected.dateKey ? cleanRow[keysDetected.dateKey] || "" : "";
    const latStr = keysDetected.latKey ? cleanRow[keysDetected.latKey] || "" : "";
    const lngStr = keysDetected.lngKey ? cleanRow[keysDetected.lngKey] || "" : "";

    const dateObj = parseJapaneseDate(dateStr);
    const lat = latStr ? parseFloat(latStr) : NaN;
    const lng = lngStr ? parseFloat(lngStr) : NaN;

    normalizedRows.push({
      __orig: row,
      dateStr: dateStr,
      date: dateObj,
      lat: isFinite(lat) ? lat : null,
      lng: isFinite(lng) ? lng : null
    });
  }
}

function determineDateRange() {
  const validRows = normalizedRows.filter(r => r.date && (r.lat !== null) && (r.lng !== null));
  if (validRows.length === 0) {
    setTodayAsDefaults();
    return;
  }
  const endRow = validRows[0];
  const startRow = validRows[Math.min(99, validRows.length - 1)];
  if (!endRow.date || !startRow.date) {
    setTodayAsDefaults();
    return;
  }
  document.getElementById("startDate").value = formatDateLocal(startRow.date);
  document.getElementById("endDate").value = formatDateLocal(endRow.date);
}

function updateMap() {
  if (!normalizedRows || normalizedRows.length === 0) {
    alert("CSVデータが読み込まれていません。");
    return;
  }

  const overlay = document.getElementById("loadingOverlay");
  const text = document.getElementById("loadingText");
  overlay.style.display = "flex";
  text.textContent = "再描画中...";

  setTimeout(() => {
    const sd = document.getElementById("startDate").value;
    const ed = document.getElementById("endDate").value;
    if (!sd || !ed) {
      alert("開始日または終了日が設定されていません。");
      overlay.style.display = "none";
      return;
    }

    const startDate = new Date(sd);
    const endDate = new Date(ed);
    endDate.setHours(23, 59, 59, 999);
    markersLayer.clearLayers();

    const filtered = normalizedRows.filter(r => r.date && r.lat !== null && r.lng !== null && r.date >= startDate && r.date <= endDate);
    filtered.forEach(r => {
      const popup = `<b>${cleanString(r.__orig["獣種"] || "不明")}</b><br>${cleanString(r.__orig["市町村"] || "")}<br>${cleanString(r.dateStr || "")}<br>${cleanString(r.__orig["目撃時の状況"] || "")}`;
      L.marker([r.lat, r.lng]).bindPopup(popup).addTo(markersLayer);
    });

    overlay.style.display = "none";
  }, 10);
}

function loadCsv() {
  const url = document.getElementById("csvUrl").value.trim();
  if (!url) {
    alert("CSVファイルのURLを入力してください。");
    return;
  }
  const overlay = document.getElementById("loadingOverlay");
  const text = document.getElementById("loadingText");
  overlay.style.display = "flex";
  text.textContent = "データ読み込み中...";

  Papa.parse(url, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      normalizeData(results);
      determineDateRange();
      initMap();
      updateMap();
      overlay.style.display = "none";
    },
    error: function() {
      alert("CSVの読み込みに失敗しました。");
      setTodayAsDefaults();
      overlay.style.display = "none";
    }
  });
}

document.getElementById("btnLoad").addEventListener("click", loadCsv);
document.getElementById("btnRedraw").addEventListener("click", updateMap);

window.onload = function() {
  initMap();
  setTodayAsDefaults();
  loadCsv();
};
</script>
</body>
</html>
