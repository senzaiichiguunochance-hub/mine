<body class="bg-gradient-to-br from-zinc-50 via-stone-100 to-zinc-100 text-stone-700 min-h-screen flex flex-col items-center justify-center relative p-4 sm:p-8">

<a href="menu.html" style="position: absolute; top: 10px; right: 10px; font-size: 11px; color: #71716a; text-decoration: none; background: rgba(255,255,255,0.9); padding: 5px 12px; border-radius: 9999px; z-index: 1000; border: 1px solid #e4e4e7; font-weight: 500; letter-spacing: 0.05em;">メニューに戻る</a>

<div class="p-6 sm:p-8 bg-white/90 backdrop-blur-md rounded-3xl shadow-[0_20px_40px_rgba(165,165,150,0.15)] border border-stone-200/60 max-w-4xl w-full mt-8 mb-8">

  <!-- STEP 1: キーボードで文字を入力するエリア -->

  <!-- STEP 2: マウスやタップで選択・調整するエリア -->
  <div class="bg-stone-50/50 p-5 rounded-2xl border border-stone-200/60 mb-6">
    <div class="mb-4">
      <span class="text-[10px] font-bold px-2 py-0.5 rounded-full text-white bg-purple-400 shadow-sm inline-block tracking-wider">🖱️ STEP 2</span>
      <span class="text-xs font-bold text-stone-600 ml-1.5">マウス・タップでデザインを調整する</span>
    </div>

    <!-- 4つの調整パッド（ドラムのパッド風デザイン） -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      
      <!-- パッド1: 画像ファイルの選択 -->
      <div class="bg-white p-3 rounded-xl border border-stone-200 flex flex-col justify-between shadow-sm min-h-28">
        <span class="text-[9px] font-bold tracking-widest text-purple-400 font-mono">IMAGE SELECT</span>
        <div class="my-2 relative">
          <input type="file" id="logoInput" accept="image/*" class="hidden">
          <button onclick="document.getElementById('logoInput').click()" class="w-full bg-stone-50 hover:bg-stone-100 text-stone-600 text-[11px] font-bold py-2 px-2 rounded-lg border border-stone-200 cursor-pointer transition-colors text-center truncate">
            ファイルを選択
          </button>
        </div>
        <span class="text-[9px] text-stone-400 tracking-wider">重ねる画像を選ぶ</span>
      </div>

      <!-- パッド2: 重ね方のモード切り替え -->
      <div class="bg-white p-3 rounded-xl border border-stone-200 flex flex-col justify-between shadow-sm min-h-28">
        <span class="text-[9px] font-bold tracking-widest text-rose-400 font-mono">LAYOUT MODE</span>
        <div class="my-2 flex flex-col gap-1">
          <label class="flex items-center gap-1.5 text-[11px] font-bold text-stone-600 cursor-pointer select-none">
            <input type="radio" id="modeTransparent" name="imageMode" value="transparent" checked class="accent-rose-400"> 透過（背景風）
          </label>
          <label class="flex items-center gap-1.5 text-[11px] font-bold text-stone-600 cursor-pointer select-none">
            <input type="radio" id="modeCentralFinder" name="imageMode" value="centralFinder" class="accent-rose-400"> 中央（ロゴ風）
          </label>
        </div>
        <span class="text-[9px] text-stone-400 tracking-wider">画像の配置スタイル</span>
      </div>

      <!-- パッド3: 全体サイズ -->
      <div class="bg-white p-3 rounded-xl border border-stone-200 flex flex-col justify-between shadow-sm min-h-28">
        <span class="text-[9px] font-bold tracking-widest text-stone-400 font-mono">QR SIZE</span>
        <div class="my-2">
          <select id="qrSize" class="w-full text-xs p-1.5 bg-stone-50/60 border border-stone-200 rounded-lg cursor-pointer focus:outline-none font-mono">
            <option value="10">10 x 10</option><option value="20">20 x 20</option><option value="30">30 x 30</option><option value="40">40 x 40</option><option value="50">50 x 50</option><option value="60">60 x 60</option><option value="70">70 x 70</option><option value="80">80 x 80</option><option value="90">90 x 90</option><option value="100">100 x 100</option><option value="110">110 x 110</option><option value="120">120 x 120</option><option value="130">130 x 130</option><option value="140">140 x 140</option><option value="150">150 x 150</option><option value="160">160 x 160</option><option value="170">170 x 170</option><option value="180">180 x 180</option><option value="190">190 x 190</option><option value="200" selected>200 x 200</option><option value="210">210 x 210</option><option value="220">220 x 220</option><option value="230">230 x 230</option><option value="240">240 x 240</option><option value="250">250 x 250</option><option value="260">260 x 260</option><option value="270">270 x 270</option><option value="280">280 x 280</option><option value="290">290 x 290</option><option value="300">300 x 300</option><option value="310">310 x 310</option><option value="320">320 x 320</option><option value="330">330 x 330</option><option value="340">340 x 340</option><option value="350">350 x 350</option><option value="360">360 x 360</option><option value="370">370 x 370</option><option value="380">380 x 380</option><option value="390">390 x 390</option><option value="400">400 x 400</option><option value="410">410 x 410</option><option value="420">420 x 420</option><option value="430">430 x 430</option><option value="440">440 x 440</option><option value="450">450 x 450</option><option value="460">460 x 460</option><option value="470">470 x 470</option><option value="480">480 x 480</option><option value="490">490 x 490</option><option value="500">500 x 500</option><option value="510">510 x 510</option><option value="520">520 x 520</option><option value="530">530 x 530</option><option value="540">540 x 540</option><option value="550">550 x 550</option><option value="560">560 x 560</option><option value="570">570 x 570</option><option value="580">580 x 580</option><option value="590">590 x 590</option><option value="600">600 x 600</option>
          </select>
        </div>
        <span class="text-[9px] text-stone-400 tracking-wider">全体のピクセル数</span>
      </div>

      <!-- パッド4: 画像透過率 -->
      <div class="bg-white p-3 rounded-xl border border-stone-200 flex flex-col justify-between shadow-sm min-h-28">
        <span class="text-[9px] font-bold tracking-widest text-amber-500 font-mono">OPACITY</span>
        <div class="my-2">
          <select id="opacity" class="w-full text-xs p-1.5 bg-stone-50/60 border border-stone-200 rounded-lg cursor-pointer focus:outline-none disabled:opacity-30 disabled:cursor-not-allowed">
            <option value="0.0">0.0</option><option value="0.1">0.1</option><option value="0.2">0.2</option><option value="0.3">0.3</option><option value="0.4">0.4</option><option value="0.5">0.5</option><option value="0.6" selected>0.6</option><option value="0.7">0.7</option><option value="0.8">0.8</option><option value="0.9">0.9</option><option value="1.0">1.0</option>
          </select>
        </div>
        <span class="text-[9px] text-stone-400 tracking-wider">透過の濃さ（中央時は無効）</span>
      </div>

    </div>

    <!-- 画像サイズ用横長フェーダー（スライダー） -->
    <div id="logoSizeControl" class="bg-white p-3 rounded-xl border border-stone-200 shadow-sm">
      <div class="flex justify-between items-center mb-1">
        <span class="text-[10px] font-bold tracking-widest text-stone-400 font-mono uppercase">Image Scale</span>
        <span class="text-xs font-mono font-bold text-rose-400"><span id="logoSizeValue">25</span>%</span>
      </div>
      <input type="range" id="logoSizeRatio" min="0" max="1" step="0.01" value="0.25" class="w-full accent-rose-400 cursor-pointer">
    </div>
  </div>

  <!-- プレビュー＆出力結果 -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- 選択中の画像確認 -->
    <div class="bg-stone-50/40 p-4 rounded-2xl border border-stone-200/60 flex flex-col items-center min-h-[180px]">
      <span class="text-[10px] font-mono font-bold text-stone-400 block mb-3 uppercase tracking-widest">🐾 Selected Image</span>
      <div class="flex-1 flex items-center justify-center max-w-full">
        <img id="logoPreview" alt="画像未選択" class="max-w-full max-h-32 object-contain rounded-xl bg-white/50 p-1">
      </div>
    </div>

    <!-- 生成されたQRコード -->
    <div class="bg-stone-50/40 p-4 rounded-2xl border border-stone-200/60 flex flex-col items-center text-center min-h-[180px]">
      <span class="text-[10px] font-mono font-bold text-stone-400 block mb-1 uppercase tracking-widest">✨ Live Output</span>
      <h4 class="text-[9px] text-stone-400 mb-2 font-medium">右クリックで保存やコピーができます</h4>
      
      <div class="flex-1 flex items-center justify-center bg-white p-3 rounded-xl border border-stone-200/60 shadow-sm max-w-full overflow-auto">
        <canvas id="qrcanvas" width="240" height="240" class="max-w-full h-auto border border-stone-100 rounded-lg"></canvas>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script>
const urlInput = document.getElementById('urlInput');
const mapInput = document.getElementById('mapInput');
const emailInput = document.getElementById('emailInput');
const telInput = document.getElementById('telInput');
const wifiSsid = document.getElementById('wifiSsid');
const wifiPass = document.getElementById('wifiPass');
const logoInput = document.getElementById('logoInput');
const logoPreview = document.getElementById('logoPreview');
const qrcanvas = document.getElementById('qrcanvas');
const ctx = qrcanvas.getContext('2d');
const qrSizeSelect = document.getElementById('qrSize');
const opacitySelect = document.getElementById('opacity');
const modeTransparent = document.getElementById('modeTransparent');
const modeCentralFinder = document.getElementById('modeCentralFinder');
const logoSizeRatio = document.getElementById('logoSizeRatio');
const logoSizeValue = document.getElementById('logoSizeValue');

let logoImage = null;

logoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) {
    logoImage = null;
    logoPreview.src = '';
    generateQrCode();
    return;
  }
  const reader = new FileReader();
  reader.onload = function(event) {
    logoPreview.src = event.target.result;
    logoImage = new Image();
    logoImage.onload = () => generateQrCode();
    logoImage.src = event.target.result;
  }
  reader.readAsDataURL(file);
});

function generateQrCode() {
  const url = urlInput.value.trim();
  if (!url) {
    ctx.clearRect(0, 0, qrcanvas.width, qrcanvas.height);
    return;
  }
  const size = parseInt(qrSizeSelect.value);
  const opacity = parseFloat(opacitySelect.value);
  const currentMode = document.querySelector('input[name="imageMode"]:checked').value;

  qrcanvas.width = size;
  qrcanvas.height = size;

  const tempCanvas = document.createElement('canvas');
  const tempCtx = tempCanvas.getContext('2d');
  tempCanvas.width = size;
  tempCanvas.height = size;

  const qr = new QRious({ element: tempCanvas, value: url, size: size, level: 'H' });

  ctx.clearRect(0, 0, size, size);
  ctx.drawImage(tempCanvas, 0, 0);

  if (logoImage && logoImage.complete) {
    let logoDrawWidth, logoDrawHeight;
    const aspectRatio = logoImage.width / logoImage.height;
    const ratio = parseFloat(logoSizeRatio.value);
    const maxLogoSize = size * ratio;

    if (currentMode === 'transparent') {
      if (aspectRatio > 1) {
        logoDrawWidth = maxLogoSize;
        logoDrawHeight = maxLogoSize / aspectRatio;
      } else {
        logoDrawHeight = maxLogoSize;
        logoDrawWidth = maxLogoSize * aspectRatio;
      }
      ctx.globalAlpha = opacity;
    } else {
      if (aspectRatio > 1) {
        logoDrawWidth = maxLogoSize;
        logoDrawHeight = maxLogoSize / aspectRatio;
      } else {
        logoDrawHeight = maxLogoSize;
        logoDrawWidth = maxLogoSize * aspectRatio;
      }
      ctx.globalAlpha = 1.0;
    }
    const logoX = (size - logoDrawWidth) / 2;
    const logoY = (size - logoDrawHeight) / 2;
    ctx.drawImage(logoImage, logoX, logoY, logoDrawWidth, logoDrawHeight);
    ctx.globalAlpha = 1.0;
  }
}

mapInput.addEventListener('input', () => {
    emailInput.value = ''; telInput.value = ''; wifiSsid.value = ''; wifiPass.value = '';
    const latlong = mapInput.value.replace(/\s/g, '');
    if (latlong) { urlInput.value = `https://www.google.com/maps?q=${latlong}`; generateQrCode(); }
});

emailInput.addEventListener('input', () => {
    mapInput.value = ''; telInput.value = ''; wifiSsid.value = ''; wifiPass.value = '';
    if (emailInput.value) { urlInput.value = `mailto:${emailInput.value}`; generateQrCode(); }
});

telInput.addEventListener('input', () => {
    mapInput.value = ''; emailInput.value = ''; wifiSsid.value = ''; wifiPass.value = '';
    const tel = telInput.value.replace(/-/g, '');
    if (tel) { urlInput.value = `tel:${tel}`; generateQrCode(); }
});

function handleWifiInput() {
    mapInput.value = ''; emailInput.value = ''; telInput.value = '';
    const ssid = wifiSsid.value; const pass = wifiPass.value;
    if (ssid) { urlInput.value = `WIFI:T:WPA;S:${ssid};P:${pass};;`; generateQrCode(); }
}
wifiSsid.addEventListener('input', handleWifiInput);
wifiPass.addEventListener('input', handleWifiInput);

urlInput.addEventListener('input', (e) => {
    if(document.activeElement === urlInput) {
        mapInput.value = ''; emailInput.value = ''; telInput.value = ''; wifiSsid.value = ''; wifiPass.value = '';
    }
    generateQrCode();
});

window.addEventListener('load', () => { generateQrCode(); toggleOpacityControl(); });
qrSizeSelect.addEventListener('change', generateQrCode);
opacitySelect.addEventListener('change', generateQrCode);

const handleModeChange = () => { toggleOpacityControl(); generateQrCode(); };
modeTransparent.addEventListener('change', handleModeChange);
modeCentralFinder.addEventListener('change', handleModeChange);

logoSizeRatio.addEventListener('input', () => {
    logoSizeValue.textContent = Math.round(logoSizeRatio.value * 100);
    generateQrCode();
});

const togglePassword = document.getElementById('togglePassword');
if (togglePassword) {
    togglePassword.addEventListener('click', function() {
        const passwordInput = document.getElementById('wifiPass');
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.textContent = type === 'password' ? '👁️' : '🙈';
    });
}

function toggleOpacityControl() {
  const currentMode = document.querySelector('input[name="imageMode"]:checked').value;
  opacitySelect.disabled = (currentMode === 'centralFinder');
}
</script>
</body>
