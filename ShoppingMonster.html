<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無限バカ買い＆全キャンセル・ストレス発散サイト DX MAX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Kaisei+Decol:wght@700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* no page-level scroll, no horizontal scroll anywhere */
        font-family: 'Yusei Magic', 'Helvetica Neue', Arial, sans-serif;
        color: #fff;
        background: linear-gradient(-45deg, #1a1a2e, #3d1a4a, #1a2e4a, #2a1a4a);
        background-size: 400% 400%;
        animation: bgShift 14s ease infinite;
    }
    @keyframes bgShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* ---------- app shell: header (fixed) / main (scrolls) / footer (fixed) ---------- */
    .app-shell {
        height: 100vh;
        max-width: 860px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* ---------- header ---------- */
    .app-header { flex: 0 0 auto; }
    .ticker-wrap {
        background: #ff2e63;
        border-bottom: 2px dashed #ffe66d;
        padding: 3px 0;
        overflow: hidden;
        white-space: nowrap;
    }
    .ticker {
        display: inline-block;
        padding-left: 100%;
        font-family: 'Kaisei Decol', serif;
        font-weight: 700;
        font-size: 11px;
        color: #fff059;
        animation: ticker 18s linear infinite;
    }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

    .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 10px 0 10px;
    }
    .title-text { min-width: 0; }
    h1 {
        font-family: 'Kaisei Decol', serif;
        font-size: 16px;
        line-height: 1.2;
        margin: 0;
        background: linear-gradient(90deg, #ff4757, #ffa502, #ffe66d, #2ed573, #3742fa, #ff4757);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: rainbow 5s linear infinite;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    @keyframes rainbow { to { background-position: 300% 0; } }
    .subtitle { color: #ffd9e0; font-size: 9px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu-link {
        flex: 0 0 auto;
        font-size: 11px;
        color: #1a1a2e;
        text-decoration: none;
        background: #ffe66d;
        padding: 4px 8px;
        border-radius: 12px;
        border: 2px solid #1a1a2e;
        white-space: nowrap;
    }

    .rank-row { display: flex; justify-content: center; padding: 4px 10px 0 10px; }
    .rank-banner {
        font-size: 12px;
        font-weight: bold;
        color: #1a1a2e;
        background: #ffe66d;
        padding: 2px 12px;
        border-radius: 20px;
        border: 2px solid #1a1a2e;
        box-shadow: 2px 2px 0 rgba(0,0,0,0.4);
        white-space: nowrap;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .danger-face { font-size: 14px; vertical-align: middle; margin-right: 4px; }

    .dashboard {
        display: flex;
        justify-content: space-around;
        text-align: center;
        flex-wrap: wrap;
        gap: 4px 10px;
        padding: 6px 10px;
        margin: 4px 10px 0 10px;
        background: #16213e;
        border-radius: 10px;
        border: 2px solid #3742fa;
    }
    .stat-box { min-width: 56px; }
    .stat-box h2 { font-size: 9px; color: #a4b0be; margin: 0; font-weight: normal; }
    .stat-box p { font-size: 14px; color: #2ed573; margin: 0; font-weight: bold; }

    .rage-wrap {
        padding: 5px 10px;
        margin: 4px 10px 6px 10px;
        background: #16213e;
        border-radius: 10px;
        border: 2px solid #ff4757;
    }
    .rage-label { display: flex; justify-content: space-between; font-size: 9px; color: #a4b0be; margin-bottom: 3px; }
    .rage-bar-bg { background: #0f3460; border-radius: 10px; height: 8px; overflow: hidden; border: 1px solid #000; }
    .rage-bar-fill {
        height: 100%; width: 0%; border-radius: 10px;
        background: linear-gradient(90deg, #2ed573, #ffd32a, #ff4757);
        transition: width 0.4s ease;
    }

    /* ---------- main: the only scrollable region ---------- */
    .app-main {
        flex: 1 1 auto;
        min-height: 0;         /* required so flex child can actually scroll */
        overflow-y: auto;
        overflow-x: hidden;    /* never allow sideways scroll */
        padding: 8px 10px 14px 10px;
    }

    .toolbar { text-align: center; margin-bottom: 8px; }
    .toolbar button {
        background: #3742fa; border: 2px solid #1a1a2e; color: #fff;
        border-radius: 20px; padding: 4px 12px; font-weight: bold; cursor: pointer; font-size: 11px;
    }
    .badge-wrap { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 12px; min-height: 18px; }
    .badge {
        background: #0f3460; border: 2px solid #ffd32a; border-radius: 20px;
        padding: 3px 9px; font-size: 11px; opacity: 0.25; filter: grayscale(1); transition: 0.3s;
        max-width: 100%;
    }
    .badge.unlocked { opacity: 1; filter: none; transform: scale(1.05); }

    .shop-section {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
    }
    .item-card {
        background: #0f3460; padding: 13px; border-radius: 14px; text-align: center;
        transition: transform 0.15s; position: relative; border: 3px solid #222b52;
        max-width: 100%;
    }
    .item-card:nth-child(odd) { transform: rotate(-1deg); }
    .item-card:nth-child(even) { transform: rotate(1deg); }
    .item-card:hover { transform: translateY(-3px) scale(1.03) rotate(0deg); border-color: #ffd32a; }
    .item-card h3 { font-size: 13px; margin: 0 0 4px 0; }
    .item-emoji { font-size: 28px; }
    .item-card .desc { font-size: 10px; color: #7bed9f; margin-bottom: 6px; min-height: 13px; }
    .item-card p.price { color: #ffa502; font-weight: bold; margin-bottom: 8px; font-size: 13px; }

    button {
        background: #ff4757; color: white; border: 2px solid #1a1a2e; padding: 7px 14px;
        border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.15s;
        box-shadow: 3px 3px 0 rgba(0,0,0,0.4); font-size: 12px;
    }
    button:hover { background: #ff6b81; transform: translate(-1px, -1px); box-shadow: 4px 4px 0 rgba(0,0,0,0.4); }
    button:active { transform: translate(2px, 2px); box-shadow: 0 0 0 rgba(0,0,0,0.4); }

    /* ---------- footer ---------- */
    .app-footer {
        flex: 0 0 auto;
        background: #16213e;
        border-top: 3px solid #2ed573;
        padding: 6px 10px;
    }
    .footer-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: nowrap;
        margin-bottom: 4px;
    }
    .footer-actions button { font-size: 11px; padding: 6px 10px; white-space: nowrap; }
    .cancel-btn {
        background: #2f3542; color: #ff4757; border: 2px solid #ff4757;
        font-size: 13px; padding: 8px 16px; border-radius: 20px; flex: 1 1 auto; max-width: 260px;
    }
    .cancel-btn:hover { background: #ff4757; color: white; }
    .account-btn { background: #3742fa; }

    .log-area {
        background: #0f3460;
        border-radius: 8px;
        border: 2px solid #222b52;
        height: 54px;
        overflow-y: auto;
        overflow-x: hidden;
        font-family: monospace;
        font-size: 10px;
        color: #7bed9f;
        padding: 5px 8px;
    }

    /* ---------- effects (unchanged) ---------- */
    @keyframes shake {
        0%, 100% { transform: translate(0, 0) rotate(0); }
        20% { transform: translate(-6px, 3px) rotate(-1deg); }
        40% { transform: translate(6px, -3px) rotate(1deg); }
        60% { transform: translate(-5px, -2px) rotate(-1deg); }
        80% { transform: translate(5px, 2px) rotate(1deg); }
    }
    .shake { animation: shake 0.5s; }
    .confetti-piece { position: fixed; top: -10px; width: 10px; height: 10px; opacity: 0.9; z-index: 999; pointer-events: none; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0.2; } }
    .money-piece { position: fixed; top: -40px; font-size: 24px; z-index: 998; pointer-events: none; animation: moneyfall linear forwards; }
    @keyframes moneyfall { to { transform: translateY(110vh) rotate(360deg); } }
    .burst {
        position: fixed; z-index: 1000; font-family: 'Kaisei Decol', serif; font-weight: 700;
        font-size: 30px; color: #ffe66d; -webkit-text-stroke: 2px #1a1a2e;
        pointer-events: none; animation: burstPop 0.7s ease-out forwards;
    }
    @keyframes burstPop {
        0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
        30% { transform: scale(1.3) rotate(4deg); opacity: 1; }
        100% { transform: scale(1) rotate(0deg) translateY(-40px); opacity: 0; }
    }
    .flash-overlay { position: fixed; inset: 0; background: #ff4757; opacity: 0; pointer-events: none; z-index: 900; transition: opacity 0.15s; }
    .flash-overlay.on { opacity: 0.35; }

    /* small screens: keep everything compact, never widen past viewport */
    @media (max-width: 420px) {
        h1 { font-size: 14px; }
        .stat-box { min-width: 48px; }
        .stat-box p { font-size: 12px; }
    }
</style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="flash-overlay" id="flash"></div>

<div class="app-shell" id="container">

    <header class="app-header">
        <div class="ticker-wrap"><div class="ticker" id="ticker">📢 速報：本日も世界のどこかで無意味な散財が発生している模様……</div></div>

        <div class="title-row">
            <div class="title-text">
                <h1>🛒 無限バカ買い＆全キャンセル・シミュレーター DX MAX</h1>
                <p class="subtitle">現実の被害額0円！思う存分カートに突っ込んで全キャンセルしよう！</p>
            </div>
            <a href="menu.html" class="menu-link">メニュー</a>
        </div>

        <div class="rank-row">
            <div class="rank-banner" id="rank-banner"><span class="danger-face" id="danger-face">😐</span>称号：まだ何も買っていない一般人</div>
        </div>

        <div class="dashboard">
            <div class="stat-box"><h2>アカウント</h2><p id="account-count">1</p></div>
            <div class="stat-box"><h2>注文総額</h2><p id="total-amount">0 円</p></div>
            <div class="stat-box"><h2>投入回数</h2><p id="order-count">0</p></div>
            <div class="stat-box"><h2>コンボ</h2><p id="combo-count">0</p></div>
            <div class="stat-box"><h2>全キャンセル</h2><p id="cancel-count">0</p></div>
        </div>

        <div class="rage-wrap">
            <div class="rage-label"><span>店長の血圧メーター</span><span id="rage-percent">0%</span></div>
            <div class="rage-bar-bg"><div class="rage-bar-fill" id="rage-bar"></div></div>
        </div>
    </header>

    <main class="app-main">
        <div class="toolbar">
            <button onclick="toggleSound()" id="sound-toggle">🔊 効果音：ON</button>
        </div>

        <div class="badge-wrap" id="badge-wrap"></div>

        <div class="shop-section" id="shop-section"></div>
    </main>

    <footer class="app-footer">
        <div class="footer-actions">
            <button class="account-btn" onclick="addAccount()">👤 アカウント量産 (+10)</button>
            <button class="cancel-btn" onclick="cancelAll()">💥 全キャンセル発動</button>
        </div>
        <div class="log-area" id="log">
            [システム起動完了] ストレス発散の準備ができました。アイテムをカートに入れてください。<br>
        </div>
    </footer>

</div>

<script>
    let totalAmount = 0;
    let accounts = 1;
    let orderCount = 0;
    let cancelCount = 0;
    let combo = 0;
    let comboTimer = null;
    let soundOn = true;
    let audioCtx = null;

    const items = [
        { name: '激レア・全巻フィギュアセット', price: 150000, emoji: '🎎', desc: '棚に入りきらない自信あり' },
        { name: '特大アクリルスタンド（推し）', price: 8500, emoji: '🖼️', desc: '玄関を塞ぐサイズ' },
        { name: '謎の限定コラボグッズ100個', price: 1200000, emoji: '📦', desc: '中身は誰も知らない' },
        { name: '島まるごと買い取り権利', price: 4300000000, emoji: '🏝️', desc: '住所は"太平洋のどこか"' },
        { name: '推しが使ってそうな椅子', price: 980000, emoji: '🪑', desc: '座り心地は未確認' },
        { name: '謝罪用の高級たい焼き1000匹', price: 250000, emoji: '🐟', desc: '誰にも謝る予定はない' },
        { name: '宇宙から見えるサイズの看板', price: 8800000000, emoji: '🛰️', desc: 'NASAから苦情の可能性' },
        { name: '一生分のタピオカ引換券', price: 3600000, emoji: '🧋', desc: '歯にストローが刺さる呪い付き' },
        { name: '実物大ティラノサウルス骨格', price: 620000000, emoji: '🦖', desc: 'リビングに置いても余裕(嘘)' },
        { name: '限定版・月の土地権利書', price: 99000000000, emoji: '🌕', desc: '所有権は誰にも証明できない' }
    ];

    const orderComments = [
        'が「勢い」だけで発注しました。',
        'が深夜テンションで決済しました。',
        'が「明日の自分に任せた」と発注しました。',
        'が謎の使命感で購入しました。',
        'が「もう後戻りできない」と発注しました。',
        'が特に理由もなく発注しました。',
        'が推し活の名の下に爆買いしました。'
    ];

    const cancelComments = [
        'すべてを無かったことにしました！スッキリ！！！',
        '記憶ごと消し去りました！最高の気分！！！',
        '「そんな注文知りません」を貫き通しました！',
        '無かったことにして、心も軽くなりました！',
        '店長の胃薬が2錠追加されました…が、こちらはスッキリ！'
    ];

    const burstWords = ['ドカーン!!', 'ポチッと!!', 'ぎゃふん!!', 'バカ買い!!', 'ドン!!', '大放出!!'];

    const badgeDefs = [
        { id: 'first', label: '🔰 はじめての散財', check: s => s.orderCount >= 1 },
        { id: 'combo5', label: '🔥 5連コンボ達成', check: s => s.maxCombo >= 5 },
        { id: 'oku', label: '💰 累計1億円突破', check: s => s.maxTotal >= 100000000 },
        { id: 'oku100', label: '🌋 累計100億円突破', check: s => s.maxTotal >= 10000000000 },
        { id: 'cancel3', label: '🌀 全キャンセル3回', check: s => s.cancelCount >= 3 },
        { id: 'account50', label: '👥 アカウント50体生成', check: s => s.accounts >= 50 },
        { id: 'moon', label: '🌕 月を買った者', check: s => s.boughtMoon }
    ];
    const stats = { orderCount: 0, maxCombo: 0, maxTotal: 0, cancelCount: 0, accounts: 1, boughtMoon: false };
    const unlocked = new Set();

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function formatNumber(num) { return num.toLocaleString() + ' 円'; }

    function addLog(text) {
        const logArea = document.getElementById('log');
        logArea.innerHTML += text + '<br>';
        logArea.scrollTop = logArea.scrollHeight;
    }

    function renderShop() {
        const section = document.getElementById('shop-section');
        section.innerHTML = items.map((item, i) => `
            <div class="item-card">
                <div class="item-emoji">${item.emoji}</div>
                <h3>${item.name}</h3>
                <div class="desc">${item.desc}</div>
                <p class="price">${formatNumber(item.price)}</p>
                <button onclick="addItem(${i}, event)">カートにぶち込む</button>
            </div>
        `).join('');
    }

    function renderBadges() {
        const wrap = document.getElementById('badge-wrap');
        wrap.innerHTML = badgeDefs.map(b => `<div class="badge ${unlocked.has(b.id) ? 'unlocked' : ''}" id="badge-${b.id}">${b.label}</div>`).join('');
    }

    function checkBadges() {
        badgeDefs.forEach(b => {
            if (!unlocked.has(b.id) && b.check(stats)) {
                unlocked.add(b.id);
                const el = document.getElementById('badge-' + b.id);
                if (el) el.classList.add('unlocked');
                addLog(`<span style="color:#ffd32a; font-weight:bold;">[実績解除] ${b.label}</span>`);
            }
        });
    }

    function updateRank() {
        const banner = document.getElementById('rank-banner');
        let title, emoji;
        if (totalAmount === 0) { title = '称号：まだ何も買っていない一般人'; emoji = '😐'; }
        else if (totalAmount < 100000) { title = '称号：見習いバカ買い師'; emoji = '🙂'; }
        else if (totalAmount < 2000000) { title = '称号：カート焼き討ち隊員'; emoji = '😅'; }
        else if (totalAmount < 100000000) { title = '称号：散財マイスター'; emoji = '😬'; }
        else if (totalAmount < 5000000000) { title = '称号：経済圏を揺るがす者'; emoji = '🤯'; }
        else { title = '称号：もはや通貨の概念を破壊した者'; emoji = '👹'; }
        banner.innerHTML = `<span class="danger-face">${emoji}</span>${title}`;
    }

    function updateTicker() {
        const t = document.getElementById('ticker');
        const headlines = [
            '📢 速報：カート内の散財額、地方自治体の年間予算に迫る勢い',
            '📢 速報：謎のアカウント群、深夜も休まず発注を継続中',
            '📢 速報：店長の胃、ついに悲鳴を上げ始める',
            '📢 速報：全キャンセルボタン、摩耗のため交換検討へ',
            '📢 速報：架空の経済圏、静かに崩壊と再生を繰り返す'
        ];
        if (totalAmount > 0) t.textContent = pick(headlines);
    }

    function updateRage() {
        const pct = Math.min(100, Math.round(Math.log10(totalAmount + 1) / Math.log10(100000000000) * 100));
        document.getElementById('rage-bar').style.width = pct + '%';
        document.getElementById('rage-percent').textContent = pct + '%';
        if (pct >= 100) {
            addLog('<span style="color:#ff4757; font-weight:bold;">[警告] 店長の血圧メーターが振り切れました！！</span>');
            shakeScreen();
            flashRed();
            startMoneyRain();
        }
    }

    function shakeScreen() {
        const el = document.getElementById('container');
        el.classList.remove('shake');
        void el.offsetWidth;
        el.classList.add('shake');
    }

    function flashRed() {
        const f = document.getElementById('flash');
        f.classList.add('on');
        setTimeout(() => f.classList.remove('on'), 200);
    }

    function ensureAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleSound() {
        soundOn = !soundOn;
        document.getElementById('sound-toggle').textContent = soundOn ? '🔊 効果音：ON' : '🔇 効果音：OFF';
    }

    function beep(freq, duration, type) {
        if (!soundOn) return;
        try {
            ensureAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'square';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) { /* audio not available, ignore */ }
    }

    function cashSound() { beep(880, 0.08, 'square'); setTimeout(() => beep(1320, 0.08, 'square'), 80); }
    function cancelSound() { beep(200, 0.3, 'sawtooth'); setTimeout(() => beep(120, 0.35, 'sawtooth'), 100); }

    function launchConfetti() {
        const colors = ['#ff4757', '#ffa502', '#2ed573', '#3742fa', '#ffd32a', '#7bed9f'];
        for (let i = 0; i < 60; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + 'vw';
            piece.style.background = pick(colors);
            piece.style.width = piece.style.height = (6 + Math.random() * 8) + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            const duration = 1.5 + Math.random() * 1.5;
            piece.style.animation = `fall ${duration}s ease-in forwards`;
            document.body.appendChild(piece);
            setTimeout(() => piece.remove(), duration * 1000 + 100);
        }
    }

    function startMoneyRain() {
        for (let i = 0; i < 25; i++) {
            setTimeout(() => {
                const p = document.createElement('div');
                p.className = 'money-piece';
                p.textContent = pick(['💴', '💸', '🪙']);
                p.style.left = Math.random() * 100 + 'vw';
                const duration = 2 + Math.random() * 1.5;
                p.style.animationDuration = duration + 's';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), duration * 1000 + 100);
            }, i * 60);
        }
    }

    function showBurst(x, y) {
        const el = document.createElement('div');
        el.className = 'burst';
        el.textContent = pick(burstWords);
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 700);
    }

    function addItem(index, evt) {
        const item = items[index];
        totalAmount += item.price;
        orderCount += 1;
        stats.orderCount = orderCount;
        stats.maxTotal = Math.max(stats.maxTotal, totalAmount);
        if (item.name.includes('月')) stats.boughtMoon = true;

        combo += 1;
        stats.maxCombo = Math.max(stats.maxCombo, combo);
        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => { combo = 0; document.getElementById('combo-count').innerText = combo; }, 2000);

        document.getElementById('total-amount').innerText = formatNumber(totalAmount);
        document.getElementById('order-count').innerText = orderCount;
        document.getElementById('combo-count').innerText = combo;

        addLog(`[注文] アカウント${Math.floor(Math.random() * accounts) + 1}番${pick(orderComments).replace('発注', `「${item.name}」を発注`)}${combo >= 3 ? ` <b style="color:#ffd32a;">${combo}連続コンボ！</b>` : ''}`);

        if (evt && evt.clientX) showBurst(evt.clientX - 30, evt.clientY - 20);
        cashSound();
        updateRank();
        updateRage();
        updateTicker();
        checkBadges();
    }

    function addAccount() {
        accounts += 10;
        stats.accounts = accounts;
        document.getElementById('account-count').innerText = accounts;
        addLog(`[アカウント] 自動生成により、総アカウント数が ${accounts} 個になりました。（電話番号は聞かれていません）`);
        checkBadges();
    }

    function cancelAll() {
        if (totalAmount === 0) {
            addLog('[警告] カートが空です。まずは景気よく買い物をしてください！');
            return;
        }
        cancelCount += 1;
        stats.cancelCount = cancelCount;
        document.getElementById('cancel-count').innerText = cancelCount;
        addLog(`<span style="color:#ff4757; font-weight:bold;">[全キャンセル成功] ${formatNumber(totalAmount)}分の注文を${pick(cancelComments)}</span>`);
        totalAmount = 0;
        orderCount = 0;
        combo = 0;
        document.getElementById('total-amount').innerText = formatNumber(totalAmount);
        document.getElementById('order-count').innerText = orderCount;
        document.getElementById('combo-count').innerText = combo;
        updateRank();
        updateRage();
        launchConfetti();
        shakeScreen();
        cancelSound();
        checkBadges();
    }

    renderShop();
    renderBadges();
</script>

</body>
</html>
