<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Matrix - Ultimate Edition</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI Emoji', 'Segoe UI Symbol', 'Apple Color Emoji', 'Arial Unicode MS', 'MS Gothic', Consolas, sans-serif;
            font-weight: bold;
        }

        #header {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            border-bottom: 1px solid #1a1a1a;
            flex-shrink: 0;
            z-index: 2000;
        }

        #reset-btn {
            padding: 10px 28px;
            background: #0a1a0a; 
            color: #00ff00; 
            border: 1px solid #004400; 
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
            transition: all 0.5s ease;
            animation: factoryLight 6s infinite ease-in-out;
        }

        #reset-btn:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }

        @keyframes factoryLight {
            0%, 100% { box-shadow: 0 0 5px #004400; color: #008800; opacity: 0.7; }
            40% { box-shadow: 0 0 15px #008800; color: #00ff00; opacity: 1; }
            50% { box-shadow: 0 0 20px #00ff00; color: #adffad; opacity: 1; }
        }

        #grid {
            flex-grow: 1;
            display: grid;
            justify-content: center;
            align-content: center;
            overflow: hidden;
            background-color: black;
            gap: 2px;
        }

        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            user-select: none;
            white-space: nowrap;
        }

        .menu-link {
            position: absolute; top: 15px; right: 20px; font-size: 14px; color: #ccc; 
            text-decoration: none; background: rgba(255,255,255,0.1); padding: 6px 12px; 
            border-radius: 4px; z-index: 1000; border: 1px solid #333;
        }
    </style>
<script data-goatcounter="https://senzaiichiguunochance.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div id="header">
    <button id="reset-btn">マトリックスを切り替え</button>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>
</div>
<div id="grid"></div>

<script>
    const grid = document.getElementById('grid');
    const btn = document.getElementById('reset-btn');
    
    const charSets = {
        // --- 既存の文字 ---
        alphabet: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'.split(''),
        numbers: '0123456789'.split(''),
        hiragana: 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'.split(''),
        katakana: 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン'.split(''),
        symbols: '★☆△▲○●□■◈◇◆▷▶◁◀⚙⚡⚓'.split(''),
        
        // --- 絵文字 (Emoji - 1文字) ---
        emoji_faces: ['😊','😂','🤣','😍','🤔','🙄','😎','🥳','😱','😭','😡','🤮','🤡','👻'],
        emoji_misc: ['🔥','💎','✨','🌟','🍀','🎈','🎁','🚀','🛸','🌀','👾','🤖','💻','💾'],
        
        // --- 顔文字 (Kaomoji - 複数文字) ---
        kaomoji_happy: ['(❁´◡`❁)', '(*^_^*)', '(≧▽≦)', '(´∀｀*)', '(^_-)-☆', '٩(ˊᗜˋ*)و', '(o゜▽゜)o', '(〃▽〃)', 'o(〃＾▽＾〃)o', '(★ ω ★)'],
        kaomoji_action: ['(｡･ω･｡)ﾉ♡', '（づ￣3￣）づ', '¯\\_(ツ)_/¯', '(╯°□°）╯︵ ┻━┻', 'ヘ( ^o^)ノ', '┌(・。・)┘♪', 'm(_ _)m'],
        kaomoji_surprised: ['( ﾟдﾟ)', 'Σ(･ω･ﾉ)ﾉ', '（◎0◎）', '(⊙_⊙;)', '(((ﾟдﾟ)))', 'w(ﾟДﾟ)w', '(꒪⌓꒪)']
    };

    let categoryKeys = Object.keys(charSets);
    let usedCategories = [];
    let intervals = [];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initGrid() {
        intervals.forEach(id => clearInterval(id));
        intervals = [];
        grid.innerHTML = '';

        if (usedCategories.length === 0) {
            usedCategories = shuffle([...categoryKeys]);
        }
        const currentCategoryKey = usedCategories.pop();
        const currentChars = charSets[currentCategoryKey];

        // カテゴリに応じてセルの幅を動的に変える
        let isKaomoji = currentCategoryKey.startsWith('kaomoji');
        let isEmoji = currentCategoryKey.startsWith('emoji');
        
        const cellWidth = isKaomoji ? 100 : (isEmoji ? 35 : 24);
        const cellHeight = 32;
        const cols = Math.floor(window.innerWidth / cellWidth);
        const rows = Math.floor((window.innerHeight - 60) / cellHeight);
        const totalCells = cols * rows;

        grid.style.gridTemplateColumns = `repeat(${cols}, ${cellWidth}px)`;
        grid.style.gridTemplateRows = `repeat(${rows}, ${cellHeight}px)`;

        const hue = Math.floor(Math.random() * 360);
        const brightColor = `hsl(${hue}, 100%, 65%)`;
        const dimColor = `hsl(${hue}, 80%, 30%)`;
        const glow = `0 0 10px hsl(${hue}, 100%, 50%)`;

        const fragment = document.createDocumentFragment();
        for (let i = 0; i < totalCells; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            
            // 絵文字カテゴリ以外には色と光彩をつける
            if (!isEmoji) {
                const isBright = Math.random() > 0.5;
                cell.style.color = isBright ? brightColor : dimColor;
                if (isBright) cell.style.textShadow = glow;
            }

            const speed = Math.floor(Math.random() * 3000) + 500;
            let currentIndex = Math.floor(Math.random() * currentChars.length);
            
            cell.textContent = currentChars[currentIndex];
            let isBlankStep = false; 

            const intervalId = setInterval(() => {
                if (isBlankStep) {
                    cell.textContent = '';
                    isBlankStep = false;
                } else {
                    currentIndex = (currentIndex + 1) % currentChars.length;
                    cell.textContent = currentChars[currentIndex];
                    if (currentIndex === currentChars.length - 1) isBlankStep = true;
                }
            }, speed);
            
            intervals.push(intervalId);
            fragment.appendChild(cell);
        }
        grid.appendChild(fragment);
    }

    btn.addEventListener('click', initGrid);
    window.addEventListener('resize', initGrid);
    initGrid();
</script>

</body>
</html>
