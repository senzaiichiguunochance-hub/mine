<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Matrix - Blink Mode</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: Consolas, 'Courier New', 'Segoe UI Symbol', 'Apple Color Emoji', 'Arial Unicode MS', 'MS Gothic', sans-serif;
            font-weight: bold;
        }

        #header {
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        #reset-btn {
            padding: 8px 24px;
            background: #222;
            color: #eee;
            border: 1px solid #444;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 2px;
            transition: 0.2s;
        }
        #reset-btn:hover { background: #333; border-color: #00ff00; color: #00ff00; }

        #grid {
            flex-grow: 1;
            display: grid;
            justify-content: center;
            align-content: center;
            overflow: hidden;
        }

        .cell {
            width: 22px;
            height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            user-select: none;
        }
    </style>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

<div id="header">
    <button id="reset-btn">Next Category Set</button>
</div>
<div id="grid"></div>

<script>
    const grid = document.getElementById('grid');
    const btn = document.getElementById('reset-btn');
    
    const charSets = {
        alphabet: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'.split(''),
        numbers: '0123456789'.split(''),
        hiragana: 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'.split(''),
        katakana: 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン'.split(''),
        cyrillic: 'БГДЁЖЗИЙКЛМНПФЦЧШЩЪЫЬЭЮЯ'.split(''),
        greek: 'αβγδεζηθικλμνξοπρστυφχψω'.split(''),
        symbols: '★☆△▲○●□■◈◇◆▷▶◁◀⚙⚡⚓'.split(''),
        emoji: ['👾','🤖','💻','📱','💾','📡','🛰','🚀','🛸','🌀']
    };

    let categoryKeys = Object.keys(charSets);
    let usedCategories = [];
    let intervals = [];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initGrid() {
        intervals.forEach(id => clearInterval(id));
        intervals = [];
        grid.innerHTML = '';

        if (usedCategories.length === 0) {
            usedCategories = shuffle([...categoryKeys]);
        }
        const currentCategoryKey = usedCategories.pop();
        const currentChars = charSets[currentCategoryKey];

        const cellWidth = 22;
        const cellHeight = 26;
        const cols = Math.floor(window.innerWidth / cellWidth);
        const rows = Math.floor((window.innerHeight - 50) / cellHeight);
        const totalCells = cols * rows;

        grid.style.gridTemplateColumns = `repeat(${cols}, ${cellWidth}px)`;
        grid.style.gridTemplateRows = `repeat(${rows}, ${cellHeight}px)`;

        const hue = Math.floor(Math.random() * 360);
        const brightColor = `hsl(${hue}, 100%, 65%)`;
        const dimColor = `hsl(${hue}, 80%, 30%)`;
        const glow = `0 0 10px hsl(${hue}, 100%, 50%)`;

        const fragment = document.createDocumentFragment();
        for (let i = 0; i < totalCells; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            
            const isBright = Math.random() > 0.5;
            cell.style.color = isBright ? brightColor : dimColor;
            if (isBright) cell.style.textShadow = glow;

            const speed = Math.floor(Math.random() * 2990) + 10;
            let currentIndex = Math.floor(Math.random() * currentChars.length);
            
            // 初回表示
            cell.textContent = currentChars[currentIndex];
            let isBlankStep = false; 

            const intervalId = setInterval(() => {
                if (isBlankStep) {
                    // 空白を表示するステップ
                    cell.textContent = '';
                    isBlankStep = false;
                } else {
                    // 文字を更新するステップ
                    currentIndex = (currentIndex + 1) % currentChars.length;
                    cell.textContent = currentChars[currentIndex];
                    
                    // 文字セットの最後に到達したら、次は空白フラグを立てる
                    if (currentIndex === currentChars.length - 1) {
                        isBlankStep = true;
                    }
                }
            }, speed);
            
            intervals.push(intervalId);
            fragment.appendChild(cell);
        }
        grid.appendChild(fragment);
    }

    btn.addEventListener('click', initGrid);
    window.addEventListener('resize', initGrid);
    initGrid();
</script>

</body>
</html>
