<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Matrix</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: Consolas, 'Courier New', 'Segoe UI Symbol', 'Apple Color Emoji', 'Arial Unicode MS', 'MS Gothic', sans-serif;
            font-weight: bold;
        }

        #header {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            border-bottom: 1px solid #1a1a1a;
            flex-shrink: 0;
        }

        /* 常にぼんやり点滅するボタンの設定 */
        #reset-btn {
            padding: 10px 28px;
            background: #0a1a0a; 
            color: #00ff00; 
            border: 1px solid #004400; 
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
            position: relative;
            transition: all 0.5s ease;
            
            /* 工場の明かりのような不規則な点滅アニメーション */
            animation: factoryLight 6s infinite ease-in-out;
        }

        /* ホバー時は少しだけ反応を強くする */
        #reset-btn:hover {
            background: #00ff00;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 20px #00ff00;
            animation-play-state: paused; /* ホバー中は点滅を止める（お好みで） */
        }

        /* 点滅アニメーションの定義 */
        @keyframes factoryLight {
            0%, 100% {
                box-shadow: 0 0 5px #004400;
                border-color: #004400;
                color: #008800;
                opacity: 0.7;
            }
            40% {
                box-shadow: 0 0 15px #008800;
                border-color: #00aa00;
                color: #00ff00;
                opacity: 1;
            }
            45% {
                /* 瞬間的に少し暗くして電圧の不安定さを演出 */
                box-shadow: 0 0 2px #002200;
                opacity: 0.5;
            }
            50% {
                box-shadow: 0 0 20px #00ff00;
                border-color: #00ff00;
                color: #adffad;
                opacity: 1;
            }
            80% {
                box-shadow: 0 0 8px #006600;
                border-color: #006600;
                color: #00cc00;
                opacity: 0.8;
            }
        }

        #grid {
            flex-grow: 1;
            display: grid;
            justify-content: center;
            align-content: center;
            overflow: hidden;
            background-color: black;
        }

        .cell {
            width: 22px;
            height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            user-select: none;
        }

        .menu-link {
            position: absolute; 
            top: 20px; 
            right: 20px; 
            font-size: 12px; 
            color: #444; 
            text-decoration: none; 
            background: rgba(255,255,255,0.05); 
            padding: 5px 10px; 
            border-radius: 2px; 
            z-index: 1000;
            border: 1px solid #222;
        }
        .menu-link:hover {
            color: #ccc;
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
<a href="menu.html" style="position: absolute; top: 20px; right: 20px; font-size: 16px; color: #333; text-decoration: none; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; z-index: 1000;">メニューに戻る</a>

<div id="header">
    <button id="reset-btn">ここをClickして文字を切り替えます</button>
</div>
<div id="grid"></div>

<script>
    const grid = document.getElementById('grid');
    const btn = document.getElementById('reset-btn');
    
    const charSets = {
        alphabet: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'.split(''),
        numbers: '0123456789'.split(''),
        hiragana: 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'.split(''),
        katakana: 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン'.split(''),
        cyrillic: 'БГДЁЖЗИЙКЛМНПФЦЧШЩЪЫЬЭЮЯ'.split(''),
        greek: 'αβγδεζηθικλμνξοπρστυφχψω'.split(''),
        symbols: '★☆△▲○●□■◈◇◆▷▶◁◀⚙⚡⚓'.split(''),
        emoji: ['👾','🤖','💻','📱','💾','📡','🛰','🚀','🛸','🌀']
    };

    let categoryKeys = Object.keys(charSets);
    let usedCategories = [];
    let intervals = [];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initGrid() {
        intervals.forEach(id => clearInterval(id));
        intervals = [];
        grid.innerHTML = '';

        if (usedCategories.length === 0) {
            usedCategories = shuffle([...categoryKeys]);
        }
        const currentCategoryKey = usedCategories.pop();
        const currentChars = charSets[currentCategoryKey];

        const cellWidth = 22;
        const cellHeight = 26;
        const cols = Math.floor(window.innerWidth / cellWidth);
        const rows = Math.floor((window.innerHeight - 60) / cellHeight);
        const totalCells = cols * rows;

        grid.style.gridTemplateColumns = `repeat(${cols}, ${cellWidth}px)`;
        grid.style.gridTemplateRows = `repeat(${rows}, ${cellHeight}px)`;

        const hue = Math.floor(Math.random() * 360);
        const brightColor = `hsl(${hue}, 100%, 65%)`;
        const dimColor = `hsl(${hue}, 80%, 30%)`;
        const glow = `0 0 10px hsl(${hue}, 100%, 50%)`;

        const fragment = document.createDocumentFragment();
        for (let i = 0; i < totalCells; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            
            const isBright = Math.random() > 0.5;
            cell.style.color = isBright ? brightColor : dimColor;
            if (isBright) cell.style.textShadow = glow;

            const speed = Math.floor(Math.random() * 2990) + 10;
            let currentIndex = Math.floor(Math.random() * currentChars.length);
            
            cell.textContent = currentChars[currentIndex];
            let isBlankStep = false; 

            const intervalId = setInterval(() => {
                if (isBlankStep) {
                    cell.textContent = '';
                    isBlankStep = false;
                } else {
                    currentIndex = (currentIndex + 1) % currentChars.length;
                    cell.textContent = currentChars[currentIndex];
                    
                    if (currentIndex === currentChars.length - 1) {
                        isBlankStep = true;
                    }
                }
            }, speed);
            
            intervals.push(intervalId);
            fragment.appendChild(cell);
        }
        grid.appendChild(fragment);
    }

    btn.addEventListener('click', initGrid);
    window.addEventListener('resize', initGrid);
    initGrid();
</script>

</body>
</html>
